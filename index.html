<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>হাজিরা - Auto Dynamic Pad</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Hind Siliguri',sans-serif;margin:0;padding:0}
body{background:#082a1e;display:flex;justify-content:center;min-height:100vh;padding:10px}
.wrap{width:100%;max-width:420px}
.banner{width:100%;border:4px solid #ffcc00;border-radius:28px;overflow:hidden}
.banner img{width:100%;display:block}
.green-box{margin-top:12px;background:#16a34a;border-radius:22px;padding:10px}
.black-pill{background:#000;color:#fff;text-align:center;padding:12px;border-radius:40px;font-size:19px;font-weight:700}
.white-btn{margin-top:12px;background:#fff;border-radius:18px;padding:15px 18px;display:flex;justify-content:space-between;align-items:center;color:#0d5bff;font-weight:700;cursor:pointer}
.hidden{display:none!important}
.card{background:#fff;margin-top:10px;border-radius:20px;padding:14px}
input,select{width:100%;padding:11px;border-radius:12px;border:1.5px solid #ccc;margin:5px 0}
.btn{width:100%;padding:12px;border:none;border-radius:14px;font-weight:700;cursor:pointer;margin-top:6px}
label{font-size:12px;font-weight:700;color:#1e40af;margin-top:6px;display:block}
.pad-white{background:#fff;border-radius:22px;padding:12px 14px;box-shadow:0 4px 15px rgba(0,0,0,.3)}
.pad-top{display:flex;gap:12px;align-items:center}
.pad-logo{width:62px;height:62px;border-radius:50%;border:3px solid #ffcc00;object-fit:cover}
.pad-bn{font-size:18px;font-weight:700;color:#1e293b}
.pad-en{font-size:13px;color:#c41d1d;font-weight:700}
.class-line{background:#0a2e1c;color:#fff;text-align:center;padding:14px;border-radius:18px;margin-top:12px;font-size:17px;font-weight:700;line-height:1.6;white-space:pre-line}
</style>
</head>
<body>
<div id="firstPage" class="wrap">
  <div class="banner"><img src="IMG-20261005-WA0019(3).jpg" onerror="this.src='banner_crop.png'"></div>
  <div class="green-box"><div class="black-pill">প্রাথমিক বিদ্যালয় হাজিরা</div></div>

  <div class="white-btn" onclick="toggle('f1')">🏫 প্রতিষ্ঠান ফরম <span>▼</span></div>
  <div id="f1" class="card hidden">
    <input id="bnName" placeholder="প্রতিষ্ঠান নাম"><div style="display:flex;gap:6px"><input id="eiin" placeholder="EIIN"><input id="code" placeholder="Code"></div><input id="enName" placeholder="English Name (ঐচ্ছিক)"><input type="file" id="logoInput" accept="image/*" onchange="previewLogo(this)"><input id="pass" type="password" placeholder="পাসওয়ার্ড"><button class="btn" style="background:#0a7a42;color:#fff" onclick="saveInst()">সেভ ✅</button>
  </div>

  <div class="white-btn" onclick="toggle('f2')">🔑 প্রতিষ্ঠান লগইন <span>▼</span></div>
  <div id="f2" class="card hidden">
    <select id="instSel"></select>
    <label>শ্রেণী / টেকনোলজি</label>
    <select id="cls">
      <option value="">-- শ্রেণী নির্বাচন --</option>
      <option>প্রাক-প্রাথমিক</option><option>প্রথম শ্রেণী</option><option>দ্বিতীয় শ্রেণী</option><option>তৃতীয় শ্রেণী</option><option>চতুর্থ শ্রেণী</option><option>পঞ্চম শ্রেণী</option>
      <option>কম্পিউটার টেকনোলজি</option><option>ইলেকট্রিক্যাল টেকনোলজি</option><option>সিভিল টেকনোলজি</option>
    </select>
    <label>শাখা</label><select id="sec"><option value="">-- শাখা নাই --</option><option>ক</option><option>খ</option><option>গ</option></select>
    <label>শিফট</label><select id="shift"><option value="">-- শিফট নাই --</option><option>প্রভাতি</option><option>দিবা</option><option>১ম শিফট</option><option>২য় শিফট</option></select>
    <label>সেশন (কলেজের জন্য)</label><select id="session"><option value="">-- সেশন নাই --</option><option>2025-26</option><option>2024-25</option><option>2026-27</option></select>
    <label>সেমিস্টার (কলেজের জন্য)</label><select id="semester"><option value="">-- সেমিস্টার নাই --</option><option>০১</option><option>০২</option><option>০৩</option><option>০৪</option><option>০৫</option><option>০৬</option><option>০৭</option><option>০৮</option></select>
    <input id="loginPass" type="password" placeholder="পাসওয়ার্ড"><button class="btn" style="background:#0d5bff;color:#fff" onclick="doLogin()">প্রবেশ 🔒</button><p id="msg" style="color:red;text-align:center"></p>
  </div>

  <div class="white-btn" onclick="toggle('f3')">🔒 তালিকা <span>▼</span></div>
  <div id="f3" class="card hidden"><button class="btn" style="background:#d61f1f;color:#fff" onclick="openList()">তালিকা খুলুন</button><div id="list"></div></div>
</div>

<div id="secondPage" class="wrap hidden">
  <div class="pad-white">
    <div class="pad-top">
      <img id="padLogo" class="pad-logo" src="IMG-20261005-WA0019(3).jpg">
      <div><div id="padBn" class="pad-bn">প্রতিষ্ঠান নাম</div><div id="padEn" class="pad-en"></div><div style="font-size:13px;font-weight:700">EIIN: <b id="padEiin"></b> Code: <b id="padCode"></b></div></div>
    </div>
  </div>
  <div id="classLine" class="class-line">শ্রেণী লোড হচ্ছে...</div>
  <button class="btn" style="background:#fff;margin-top:12px" onclick="showFirst()">⬅️ প্রথম পাতা</button>
</div>

<script>
function toggle(id){document.getElementById(id).classList.toggle('hidden');}
let insts=JSON.parse(localStorage.getItem('takrim_primary_insts')||'[]');
let tempLogo='';
function refresh(){document.getElementById('instSel').innerHTML='<option value="">প্রতিষ্ঠান নির্বাচন</option>'+insts.map((x,i)=>`<option value="${i}">${x.bnName}</option>`).join('');}
refresh();
function previewLogo(inp){if(inp.files[0]){let r=new FileReader();r.onload=e=>tempLogo=e.target.result;r.readAsDataURL(inp.files[0]);}}
function saveInst(){
  let o={bnName:bnName.value.trim(),enName:enName.value.trim(),eiin:eiin.value.trim(),schoolCode:code.value.trim(),pass:pass.value,logo:tempLogo||'IMG-20261005-WA0019(3).jpg'};
  if(!o.bnName||!o.pass) return alert('নাম পাসওয়ার্ড দিন');insts.push(o);localStorage.setItem('takrim_primary_insts',JSON.stringify(insts));refresh();alert('সেভ');f1.classList.add('hidden');
}
function doLogin(){
  let idx=instSel.value;if(idx==="") return msg.textContent='প্রতিষ্ঠান নির্বাচন করুন';
  if(loginPass.value!==insts[idx].pass) return msg.textContent='পাসওয়ার্ড ভুল';
  let ins=insts[idx];
  // প্যাডে বসাও
  padBn.textContent=ins.bnName; padEn.textContent=ins.enName||''; padEiin.textContent=ins.eiin||''; padCode.textContent=ins.schoolCode||''; padLogo.src=ins.logo;

  // === মেইন লজিক - যা সিলেক্ট করবে ওইটাই আসবে ===
  let parts=[];
  if(cls.value) parts.push(`শ্রেণী: ${cls.value}`);
  if(sec.value) parts.push(`শাখা: ${sec.value}`);
  if(shift.value) parts.push(`শিফট: ${shift.value}`);
  if(session.value) parts.push(`সেশন ${session.value}`);
  if(semester.value) parts.push(`সেমিস্টার ${semester.value}`);

  // যদি কিছুই না সিলেক্ট করে, তাহলে ডিফল্ট
  let lineText = parts.length>0? parts.join(' | ') : 'তথ্য নির্বাচন করা হয়নি';

  // ২ লাইনে ভাগ করার জন্য - যদি ৩টার বেশি হয় ২য় লাইনে যাবে
  if(parts.length>2){
    let firstLine = parts.slice(0,2).join(' | ');
    let secondLine = parts.slice(2).join(' | ');
    lineText = firstLine + '\n' + secondLine;
  }
  document.getElementById('classLine').textContent=lineText;

  firstPage.classList.add('hidden'); secondPage.classList.remove('hidden');
}
function showFirst(){secondPage.classList.add('hidden');firstPage.classList.remove('hidden');}
function openList(){
  if(prompt('Admin:')!=='malek'||prompt('Pass:')!=='takrim2022') return alert('ভুল');
  list.innerHTML=insts.map(s=>`<div style="font-size:12px;padding:6px;border-bottom:1px solid #eee">${s.bnName} - ${s.eiin}</div>`).join('');
}
</script>
</body>
</html>
