<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MALEK - 1 কোড 2 পাতা</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box;font-family:'Hind Siliguri',sans-serif}body{margin:0;background:#082a1e;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:10px}
.main-banner{width:380px;max-width:95%;border:4px solid #ffcc00;border-radius:22px;overflow:hidden;margin-top:10px;background:#000;line-height:0}.main-banner img{width:100%;display:block}
.green-box{width:380px;max-width:95%;background:#16a34a;border-radius:16px;padding:12px;margin-top:25px;text-align:center}.green-box span{background:#000;color:#fff;padding:8px 22px;border-radius:30px;font-weight:700;font-size:18px}
.card{background:#fff;margin-top:12px;border-radius:24px;padding:16px;width:100%;max-width:430px}.menu{width:100%;max-width:430px;background:#fff;border:none;border-radius:16px;padding:16px;font-size:17px;font-weight:700;color:#0d5bff;margin-top:12px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}.hidden{display:none!important}.btn{width:100%;padding:14px;border:none;border-radius:14px;font-size:17px;font-weight:700;cursor:pointer;margin-top:8px}.green{background:#0a7a42;color:#fff}.blue{background:#0d5bff;color:#fff}.red{background:#d61f1f;color:#fff}input,select{width:100%;padding:12px;border-radius:12px;border:1.8px solid #d1d5db;margin:5px 0}
.pad{background:#fff;border:2px solid #ffcc00;border-radius:16px;padding:12px;display:flex;gap:10px;align-items:center;margin-bottom:8px;width:100%;max-width:430px}.acc{margin-bottom:8px;border-radius:12px;overflow:hidden;background:#fff;width:100%;max-width:430px}.acc-h-normal{background:#1976d2;color:#fff;padding:12px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-weight:700;border-radius:12px}.acc-b-normal{display:none;padding:8px;background:#fafafa}.acc-b-normal.on{display:block}.acc-h{background:#0d47a1;padding:6px;display:flex}.acc-b{display:none;padding:8px;background:#fafafa}.acc-b.show{display:block}.btn2{padding:8px 10px;border:none;border-radius:20px;color:#fff;cursor:pointer;margin:3px;font-weight:bold;font-size:11px}.header3{display:flex;gap:4px;width:100%}.hbox{flex:1;padding:12px 2px;border-radius:14px;text-align:center;font-weight:bold;font-size:12px;cursor:pointer;border:3px solid transparent}.hbox.active{border-color:yellow}.boxPresent{background:#2e7d32;color:#fff}.boxAbsent{background:#c62828;color:#fff}.boxNotice{background:#ef6c00;color:#fff}.cbox{border-radius:14px;overflow:hidden;background:#fff;border:2px solid #ddd;margin-bottom:8px}.cbox-head{color:#fff;padding:8px;text-align:center;font-weight:bold}.cbox-body{padding:10px;min-height:40px;font-size:13px;background:#fff}.paP{background:#e8f5e9;color:#2e7d32;font-weight:bold}.paA{background:#ffebee;color:#c62828;font-weight:bold}
</style></head><body>

<!-- ========== প্রথম পাতা ========== -->
<div id="firstPage" style="width:100%;display:flex;flex-direction:column;align-items:center">
<div class="main-banner"><img id="mainBannerImg" src="IMG-20261005-WA0019(3).jpg" onerror="this.src='https://via.placeholder.com/400x220?text=MALEK'"></div>
<div class="green-box"><span>প্রাথমিক বিদ্যালয় হাজিরা</span></div>
<button class="menu" onclick="document.getElementById('formBox').classList.toggle('hidden')">🏫 প্রতিষ্ঠান ফরম <span>▼</span></button>
<div id="formBox" class="card hidden"><div style="text-align:center"><img id="logoPreview" src="IMG-20261005-WA0019(3).jpg" style="width:84px;height:84px;border-radius:50%;border:3px solid #ffcc00;object-fit:cover"><br><button onclick="logoInput.click()" style="background:#ffcc00;border:none;padding:8px 14px;border-radius:10px;font-weight:700;margin:8px 0">🖼️ লোগো চেঞ্জ</button><input type="file" id="logoInput" accept="image/*" style="display:none"></div><input id="bnName" placeholder="প্রতিষ্ঠানের নাম"><input id="address" placeholder="ঠিকানা"><div style="display:flex;gap:6px"><input id="eiin" placeholder="EIIN"><input id="schoolCode" placeholder="Code"></div><div style="display:flex;gap:6px"><input id="mobile" placeholder="মোবাইল"><input id="email" placeholder="Email"></div><input id="pass1" type="password" placeholder="পাসওয়ার্ড"><button class="btn green" onclick="savePrimary()">সেভ করুন ✅</button></div>
<button class="menu" onclick="document.getElementById('loginBox').classList.toggle('hidden')">🔐 লগইন <span>▼</span></button>
<div id="loginBox" class="card hidden"><select id="loginInst"></select><div style="display:flex;gap:6px"><select id="shift"><option>🌅 প্রভাতি</option><option>দিবা</option></select><select id="cls"><option>১ম শ্রেণি</option><option>২য় শ্রেণি</option><option>৩য় শ্রেণি</option><option>৪র্থ শ্রেণি</option><option>৫ম শ্রেণি</option></select><select id="section"><option>ক</option><option>খ</option></select></div><input id="loginPass" type="password" placeholder="পাসওয়ার্ড"><button class="btn blue" onclick="primaryLogin()">🔒 প্রবেশ করুন</button><p id="loginMsg" style="color:red;text-align:center"></p></div>
<button class="menu" onclick="document.getElementById('listBox').classList.toggle('hidden')">🔒 তালিকা <span>▼</span></button>
<div id="listBox" class="card hidden"><button class="btn red" onclick="openListSecure()">🔓 তালিকা খুলুন</button><div id="instList" style="margin-top:10px"></div></div>
</div>

<!-- ========== দ্বিতীয় পাতা ========== -->
<div id="secondPage" class="hidden" style="width:100%;display:flex;flex-direction:column;align-items:center">
<div class="pad" id="institutePad"><img id="padLogo" src="" style="width:64px;height:64px;border-radius:50%;border:3px solid #ffcc00;object-fit:cover"><div style="flex:1"><h1 id="instName" style="color:#0d47a1;font-size:16px"></h1><p id="instAddress" style="font-size:12px"></p><p style="font-size:11px;font-weight:bold">EIIN: <span id="padEiin">-</span> | <span id="classLine"></span></p><button onclick="logout()" style="background:#d61f1f;color:#fff;border:none;padding:8px 18px;border-radius:20px;margin-top:6px;font-weight:bold">🚪 লগআউট</button></div></div>
<div id="acc" style="width:100%;max-width:430px"></div>
</div>

<script>
// প্রথম পাতা লজিক
let insts=JSON.parse(localStorage.getItem('takrim_primary_insts')||'[]');let tempLogo=localStorage.getItem('takrim_temp_logo')||'';
function refreshInstSelect(){document.getElementById('loginInst').innerHTML='<option value="">প্রতিষ্ঠান নির্বাচন</option>'+insts.map((x,i)=>`<option value="${i}">${x.bnName}</option>`).join('')}refreshInstSelect();
document.getElementById('logoInput').addEventListener('change',function(){if(this.files&&this.files[0]){let r=new FileReader();r.onload=e=>{tempLogo=e.target.result;document.getElementById('logoPreview').src=tempLogo;document.getElementById('mainBannerImg').src=tempLogo;localStorage.setItem('takrim_temp_logo',tempLogo)};r.readAsDataURL(this.files[0])}});
function savePrimary(){let obj={bnName:document.getElementById('bnName').value.trim(),addr:document.getElementById('address').value.trim(),eiin:document.getElementById('eiin').value.trim(),schoolCode:document.getElementById('schoolCode').value.trim(),mobile:document.getElementById('mobile').value.trim(),email:document.getElementById('email').value.trim(),pass:document.getElementById('pass1').value,logo:tempLogo||'IMG-20261005-WA0019(3).jpg'};if(!obj.bnName||!obj.pass) return alert('নাম ও পাস দিন');insts.push(obj);localStorage.setItem('takrim_primary_insts',JSON.stringify(insts));localStorage.removeItem('takrim_temp_logo');alert('✅ সেভ');location.reload();}
function primaryLogin(){let idx=document.getElementById('loginInst').value;if(idx==="")return document.getElementById('loginMsg').textContent='প্রতিষ্ঠান নির্বাচন';let ins=insts[idx];if(document.getElementById('loginPass').value!==ins.pass)return document.getElementById('loginMsg').textContent='❌ ভুল';localStorage.setItem('takrim_session',JSON.stringify({inst:ins,cls:document.getElementById('cls').value,shift:document.getElementById('shift').value,section:document.getElementById('section').value}));location.reload();}
function openListSecure(){let a=prompt('এডমিন নাম');let p=prompt('পাস');if(a!=='malek'||p!=='takrim2022')return alert('ভুল');document.getElementById('instList').innerHTML=insts.map((s,i)=>`<div style="display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #eee"><div><img src="${s.logo}" style="width:28px;height:28px;border-radius:50%"> <b>${s.bnName}</b></div><button onclick="insts.splice(${i},1);localStorage.setItem('takrim_primary_insts',JSON.stringify(insts));refreshInstSelect();openListSecure()" style="background:#fee2e2;border:none;padding:6px;border-radius:6px">🗑️</button></div>`).join('')}
function logout(){localStorage.removeItem('takrim_session');location.reload();}

// পেজ রাউটিং - এক কোডে দুই পাতা আলাদা
let sess=JSON.parse(localStorage.getItem('takrim_session')||'null');
if(sess&&sess.inst){
document.getElementById('firstPage').classList.add('hidden');
document.getElementById('secondPage').classList.remove('hidden');
document.getElementById('instName').innerText=sess.inst.bnName;
document.getElementById('instAddress').innerText=sess.inst.addr||'';
document.getElementById('padLogo').src=sess.inst.logo||'';
document.getElementById('padEiin').innerText=sess.inst.eiin||'-';
document.getElementById('classLine').innerText=(sess.cls||'')+' | '+(sess.section||'')+' | '+(sess.shift||'');
}else{
document.getElementById('firstPage').classList.remove('hidden');
document.getElementById('secondPage').classList.add('hidden');
}

// দ্বিতীয় পাতার লজিক (হুবহু + বাগ ফিক্স)
let students=JSON.parse(localStorage.getItem('students_v2')||'[]');let saved=JSON.parse(localStorage.getItem('fullResultSheet')||'null');let locked=localStorage.getItem('fullResultSheetLocked')=='true';let activeTab='';
function buildAcc(){let html=`<div class="acc"><div class="acc-h-normal" onclick="togN(1)"><span>1️⃣ শিক্ষার্থী যোগ</span><span id="ar1">▼</span></div><div class="acc-b-normal" id="ab1"><div style="background:#fff;padding:8px;border-radius:14px"><input id="sn" placeholder="নাম" style="width:100%;padding:12px;border-radius:12px;border:1px solid #ccc;margin:4px 0"><input id="sr" placeholder="রোল"><input id="sm" placeholder="মোবাইল"><button class="btn2" style="background:#2e7d32;width:100%;padding:10px" onclick="addStu()">+ যোগ</button></div></div></div><div class="acc"><div class="acc-h-normal" onclick="togN(2)"><span>2️⃣ তালিকা</span><span id="ar2">▼</span></div><div class="acc-b-normal" id="ab2"><div id="sList"></div></div></div><div class="acc" style="border:3px solid #0d47a1"><div class="acc-h"><div class="header3"><div id="hb_present" class="hbox boxPresent" onclick="setTab('present')">✅ উপস্থিত<br><span id="hc_present">0</span></div><div id="hb_absent" class="hbox boxAbsent" onclick="setTab('absent')">❌ অনুপস্থিত<br><span id="hc_absent">0</span></div><div id="hb_notice" class="hbox boxNotice" onclick="setTab('notice')">📢 নোটিশ</div></div></div><div class="acc-b" id="ab3"><div id="tabContent"></div></div></div><div class="acc"><div class="acc-h-normal" onclick="togN(4)"><span>4️⃣ মাসিক হাজিরা (১-৩১)</span><span id="ar4">▼</span></div><div class="acc-b-normal" id="ab4"><div style="background:#fff;padding:6px;border-radius:14px"><div style="display:flex;justify-content:space-between"><div><input type="month" id="mp" value="${new Date().toISOString().slice(0,7)}" onchange="renderMonth()" style="width:130px"><button class="btn2" style="background:#ff9800" onclick="goToday()">📅 আজ</button></div><div><button class="btn2" style="background:#1565c0" onclick="window.print()">🖨️</button><button class="btn2" style="background:#c62828" onclick="delMonth()">🗑️</button></div></div><div id="monthTbl" style="margin-top:8px;overflow:auto"></div></div></div></div>`;document.getElementById('acc').innerHTML=html;}buildAcc();
function togN(i){let b=document.getElementById('ab'+i);let ar=document.getElementById('ar'+i);if(!b)return;let o=b.classList.contains('on');if(o){b.classList.remove('on');ar.innerText='▼';}else{b.classList.add('on');ar.innerText='▲';if(i==2)showStu();if(i==4)renderMonth();}}
function setTab(t){if(activeTab===t){activeTab='';document.querySelectorAll('.hbox').forEach(x=>x.classList.remove('active'));document.getElementById('ab3').classList.remove('show');document.getElementById('tabContent').innerHTML='';return;}activeTab=t;document.querySelectorAll('.hbox').forEach(x=>x.classList.remove('active'));document.getElementById('hb_'+t).classList.add('active');document.getElementById('ab3').classList.add('show');renderTab();}
function renderHeaderCounts(){let p=students.filter(s=>s.present).length;let a=students.filter(s=>!s.present).length;if(document.getElementById('hc_present'))document.getElementById('hc_present').innerText=p;if(document.getElementById('hc_absent'))document.getElementById('hc_absent').innerText=a;}
function renderTab(){let pList=students.filter(s=>s.present);let aList=students.filter(s=>!s.present);let el=document.getElementById('tabContent');if(!el)return;if(activeTab==='present'){el.innerHTML=`<div class="cbox"><div class="cbox-head" style="background:#2e7d32">✅ উপস্থিত - ${pList.length} জন</div><div class="cbox-body">${pList.map(s=>`✅ ${s.name} (${s.roll})`).join('<br>')||'কেউ নেই'}</div></div>`;}else if(activeTab==='absent'){el.innerHTML=`<div class="cbox"><div class="cbox-head" style="background:#c62828">❌ অনুপস্থিত - ${aList.length} জন</div><div class="cbox-body">${aList.map(s=>`❌ ${s.name} (${s.roll})`).join('<br>')||'সবাই উপস্থিত'}</div></div>`;}else{let notice=localStorage.getItem('notice')||'';el.innerHTML=`<div class="cbox"><div class="cbox-head" style="background:#ef6c00">📢 নোটিশ</div><div class="cbox-body"><textarea id="notice" rows="4" style="width:100%;border-radius:12px;padding:8px;border:1px solid #ccc">${notice}</textarea><button class="btn2" style="background:#ef6c00;width:100%;margin-top:6px;padding:10px" onclick="saveNotice()">💾 সেভ</button></div></div>`;}}
function addStu(){let n=document.getElementById('sn').value.trim(),r=document.getElementById('sr').value.trim(),m=document.getElementById('sm').value.trim();if(!n||!r||!m)return alert('দিন');students.push({name:n,roll:r,mobile:m,present:true});localStorage.setItem('students_v2',JSON.stringify(students));location.reload();}
function showStu(){let h='';students.forEach((s,i)=>{h+=`<div style="display:flex;justify-content:space-between;background:#fff;padding:8px;border-radius:20px;margin:4px 0;border:1px solid #ddd;font-size:12px"><span>${i+1}. ${s.name} (${s.roll})</span><span><button onclick="tp(${i})" style="border-radius:50%;border:none;padding:4px 8px;background:#e8f5e9">${s.present?'✅':'❌'}</button> <button onclick="ds(${i})" style="border-radius:50%;border:none">🗑️</button></span></div>`});if(document.getElementById('sList'))document.getElementById('sList').innerHTML=h;}
function tp(i){students[i].present=!students[i].present;localStorage.setItem('students_v2',JSON.stringify(students));let today=new Date();let tMonth=today.toISOString().slice(0,7);let tDay=today.getDate();let month=document.getElementById('mp')?.value||tMonth;if(month==tMonth){let mdata=JSON.parse(localStorage.getItem('monthly31Data')||'{}');mdata[`${month}_${i}_${tDay}`]=students[i].present;localStorage.setItem('monthly31Data',JSON.stringify(mdata));}showStu();renderHeaderCounts();renderTab();if(document.getElementById('ab4')?.classList.contains('on')) renderMonth();}
function ds(i){if(confirm('ডিলিট?')){students.splice(i,1);localStorage.setItem('students_v2',JSON.stringify(students));location.reload();}}
function saveNotice(){let v=document.getElementById('notice').value;localStorage.setItem('notice',v);alert('সেভ');}
function renderMonth(){let month=document.getElementById('mp')?.value||new Date().toISOString().slice(0,7);let data=JSON.parse(localStorage.getItem('monthly31Data')||'{}');let today=new Date();let tDay=today.getDate();let tMonth=today.toISOString().slice(0,7);let html=`<table border=1 style="width:100%;border-collapse:collapse;text-align:center;font-size:10px;min-width:900px"><tr style="background:#1976d2;color:#fff"><th>ক্রম</th><th>নাম</th><th>রোল</th>`;for(let i=1;i<=31;i++){html+=`<th>${i}</th>`;}html+=`<th>P</th><th>A</th></tr>`;students.forEach((s,idx)=>{html+=`<tr><td>${idx+1}</td><td style="text-align:left">${s.name}</td><td>${s.roll}</td>`;for(let d=1;d<=31;d++){let k=`${month}_${idx}_${d}`;let savedVal=data[k];let isPast=(month<tMonth)||(month==tMonth&&d<tDay);let isToday=(month==tMonth&&d==tDay);let isFuture=(month>tMonth)||(month==tMonth&&d>tDay);let displayVal=savedVal!==undefined?savedVal:(isToday?s.present:undefined);let txt=displayVal===true?'P':displayVal===false?'A':'';let bg=displayVal===true?' paP':displayVal===false?' paA':'';let style='cursor:pointer;min-width:22px;';let click=`onclick="togglePA(${idx},${d})"`;if(isPast){style+='background:#e5e7eb!important;cursor:not-allowed;';click='';if(txt=='')txt='-';}else if(isFuture){style+='opacity:0.4;cursor:not-allowed;';click='';}else if(isToday){style+='background:#fef9c3!important;border:2px solid #f59e0b;';}html+=`<td class="${bg.trim()}" ${click} style="${style}">${txt}</td>`;}html+=`<td id="p_${idx}" style="background:#e8f5e9">0</td><td id="a_${idx}" style="background:#ffebee">0</td></tr>`;});html+=`</table>`;document.getElementById('monthTbl').innerHTML=html;students.forEach((_,i)=>calc31(i));}
function togglePA(idx,d){let month=document.getElementById('mp').value;let today=new Date();let tDay=today.getDate();let tMonth=today.toISOString().slice(0,7);let isPast=(month<tMonth)||(month==tMonth&&d<tDay);let isFuture=(month>tMonth)||(month==tMonth&&d>tDay);if(isPast){alert('🔒 '+d+' তারিখ লক!');return;}if(isFuture){alert('⏳ ভবিষ্যৎ');return;}let data=JSON.parse(localStorage.getItem('monthly31Data')||'{}');let k=`${month}_${idx}_${d}`;let cur=data[k];if(cur===undefined && month==tMonth && d==tDay) cur=students[idx].present;data[k]=!(cur===true);localStorage.setItem('monthly31Data',JSON.stringify(data));if(month==tMonth && d==tDay){students[idx].present=data[k];localStorage.setItem('students_v2',JSON.stringify(students));showStu();renderHeaderCounts();renderTab();}renderMonth();}
function calc31(idx){let month=document.getElementById('mp')?.value||new Date().toISOString().slice(0,7);let data=JSON.parse(localStorage.getItem('monthly31Data')||'{}');let c=0,tot=0;for(let d=1;d<=31;d++){let k=`${month}_${idx}_${d}`;if(data[k]===true)c++;if(data[k]===true||data[k]===false)tot++;}if(document.getElementById(`p_${idx}`))document.getElementById(`p_${idx}`).innerText=c;if(document.getElementById(`a_${idx}`))document.getElementById(`a_${idx}`).innerText=tot-c;}
function goToday(){let m=new Date().toISOString().slice(0,7);document.getElementById('mp').value=m;renderMonth();}
function delMonth(){let month=document.getElementById('mp').value;let today=new Date();let tMonth=today.toISOString().slice(0,7);if(month<tMonth){alert('🔒 লক');return;}if(confirm('মুছবেন?')){let data=JSON.parse(localStorage.getItem('monthly31Data')||'{}');let tDay=today.getDate();students.forEach((_,idx)=>{for(let d=tDay;d<=31;d++)delete data[`${month}_${idx}_${d}`];});localStorage.setItem('monthly31Data',JSON.stringify(data));renderMonth();}}
showStu();renderHeaderCounts();
let logoSaved=localStorage.getItem('takrim_temp_logo');if(logoSaved){if(document.getElementById('logoPreview'))document.getElementById('logoPreview').src=logoSaved;if(document.getElementById('mainBannerImg'))document.getElementById('mainBannerImg').src=logoSaved;}
</script></body></html>
