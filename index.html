<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>10th Class - Final Fixed - No Yellow Tot</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;font-family:'Hind Siliguri',sans-serif;margin:0}
body{background:#0a2e1f;padding:10px}
.card{max-width:500px;margin:auto;background:#fff;border-radius:24px;padding:14px}
.mBox{border:2px solid #8b5cf6;border-radius:18px;padding:10px;margin-top:12px}
.inp{width:60px;padding:5px;border-radius:12px;border:1px solid #ddd;text-align:center;font-weight:700}
.inp:disabled{background:#f3f4f6;border:1px solid #eee;color:#000}
</style>
</head>
<body>
<div class="card">
<!-- তোমার উপরের অংশ আগের মতোই থাকবে -->
<div class="mBox" id="rCard">
<table><thead><tr id="hRow"></tr></thead><tbody id="bRow"></tbody></table>
<!-- হলুদ tot বার এখানে ছিল, এখন বাদ -->
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">
<button style="background:#16a34a;color:#fff;padding:11px;border:none;border-radius:10px;font-weight:700" onclick="saveData()">💾 সেভ</button>
<button style="background:#6b7280;color:#fff;padding:11px;border:none;border-radius:10px;font-weight:700" onclick="toggleEdit()" id="eBtn">✏️ এডিট</button>
</div>
</div>
</div>

<script>
let isEdit=false;
let subs=JSON.parse(localStorage.getItem('s_final2')||'["বাংলা","ইংরেজি","গণিত","বিজ্ঞান","সমাজ","ধর্ম","কৃষি"]');
let full=JSON.parse(localStorage.getItem('f_final2')||'[100,100,100,100,100,100,100]');
let studs=JSON.parse(localStorage.getItem('st_final2')||'[{"name":"কালাম","roll":"202","m":[70,80,75,60,80,90,83]},{"name":"কমল","roll":"203","m":[82,75,80,70,85,88,58]}]');

function render(){
document.getElementById('hRow').innerHTML=`<th>ক্রম</th><th>নাম</th><th>রোল</th>`+subs.map(s=>`<th>${s}</th>`).join('')+`<th>মোট</th><th>%</th><th>গ্রেড</th>`;
let b=document.getElementById('bRow');b.innerHTML='';
b.innerHTML+=`<tr><td></td><td>পূর্ণমান</td><td></td>`+full.map((v,i)=>`<td><input class="inp" value="${v}" ${!isEdit?'disabled':''} onchange="full[${i}]=+this.value;render()"></td>`).join('')+`<td>${full.reduce((a,b)=>a+b,0)}</td><td>-</td><td>-</td></tr>`;
studs.forEach((st,i)=>{
let tot=st.m.reduce((a,b)=>a+b,0);
b.innerHTML+=`<tr><td>${i+1}</td><td>${st.name}</td><td>${st.roll}</td>`+st.m.map((mm,j)=>`<td><input class="inp" value="${mm}" ${!isEdit?'disabled':''} onchange="studs[${i}].m[${j}]=+this.value;render()"></td>`).join('')+`<td>${tot}</td><td>${(tot/full.reduce((a,b)=>a+b,0)*100).toFixed(1)}</td><td>A</td></tr>`;
});
}
render();
function toggleEdit(){isEdit=!isEdit;document.getElementById('eBtn').innerText=isEdit?'🔒 লক':'✏️ এডিট';render();}
function saveData(){localStorage.setItem('s_final2',JSON.stringify(subs));localStorage.setItem('f_final2',JSON.stringify(full));localStorage.setItem('st_final2',JSON.stringify(studs));isEdit=false;document.getElementById('eBtn').innerText='✏️ এডিট';render();alert('সেভ হয়েছে - এখন লক');}
</script>
</body>
</html>
