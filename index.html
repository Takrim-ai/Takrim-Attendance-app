<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>শিক্ষার্থীর তালিকা</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;font-family:'Hind Siliguri',sans-serif;margin:0}
body{background:#0a2e1e;min-height:100vh;padding:10px}
.top{text-align:center;color:#fff;padding:8px 0}
.top p{color:#ffcc00;font-size:14px;font-weight:700;margin-top:6px}
.btn-dash{background:#fff;border:none;border-radius:20px;padding:6px 18px;font-weight:700;margin-top:10px}
.main{background:#fff;border-radius:26px;padding:12px;margin-top:8px}
.add-btn{width:100%;border:2.5px dashed #16a34a;background:#e8f5e9;border-radius:16px;padding:16px;font-size:16px;font-weight:700}
.stats{display:flex;gap:8px;margin-top:12px}
.stats div{flex:1;border-radius:14px;padding:12px 2px;text-align:center;font-weight:700;cursor:pointer}
.s-yellow{background:#ffcc00}.s-green{background:#16a34a;color:#fff}.s-red{background:#ef4444;color:#fff}
.s-purple-full{background:#7c3aed;color:#fff;width:100%;border-radius:14px;padding:13px;text-align:center;font-weight:700;margin-top:8px;cursor:pointer}
.controls{background:#f3e8ff;border:2px solid #8b5cf6;border-radius:18px;padding:10px;margin-top:12px}
.c-row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;align-items:center}
.c-btn{border:none;border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer}
.purple{background:#7c3aed;color:#fff}.blue{background:#0ea5e9;color:#fff}.green2{background:#16a34a;color:#fff}.gray{background:#6b7280;color:#fff}.red{background:#ef4444;color:#fff}
.input-sm{border:2px solid #ddd;border-radius:12px;padding:10px;width:75px;text-align:center;font-weight:700}
.table-wrap{overflow:auto;margin-top:8px;border:2px solid #ddd;border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:700px}
th,td{border:1px solid #ddd;padding:7px;text-align:center;font-size:13px}
.mark-input{width:55px;border:2px solid #ddd;border-radius:8px;padding:6px;text-align:center;font-weight:700}
.full-input{background:#fef9c3}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;justify-content:center;align-items:center;z-index:99}
.modal-box{background:#fff;border-radius:20px;padding:18px;width:360px;max-width:92%}
.modal-box input{width:100%;padding:13px;border-radius:12px;border:1.8px solid #ddd;margin:7px 0}
.hidden{display:none!important}
@media print{.no-print{display:none!important}}
</style>
</head>
<body>

<div class="top no-print">
<p id="classInfo">শ্রেণী: ১ম শ্রেণি | সেশন 2025-26 | সেমিস্টার ক</p>
<button class="btn-dash" onclick="location.href='second-page.html'">ড্যাশবোর্ড</button>
</div>

<div class="main">
<button class="add-btn no-print" onclick="openModal()">শিক্ষার্থী যোগ করুন (+)</button>

<!-- নতুন সিরিয়াল: 1.সবাই 2.উপস্থিত 3.অনুপস্থিত -->
<div class="stats no-print">
<div class="s-yellow" onclick="filterAll()">সবাই<br><span id="cAll">0</span></div>
<div class="s-green" onclick="filterPresent()">উপস্থিত<br><span id="cPresent">0</span></div>
<div class="s-red" onclick="filterAbsent()">অনুপস্থিত<br><span id="cAbsent">0</span></div>
</div>
<!-- নিচে ফলাফল - ৪ নম্বর জায়গায় -->
<div class="s-purple-full no-print" onclick="toggleResult()">ফলাফল - 👁️ <span id="resultEye">দেখুন</span></div>

<div class="controls no-print">
<div class="c-row">
<button class="c-btn purple" onclick="renameSubs()">নাম বদলান</button>
<span style="font-weight:700">বিষয়:</span><input id="subCount" class="input-sm" type="number" value="5">
<span style="font-weight:700">পূর্ণমান:</span><input id="fullMark" class="input-sm" type="number" value="100">
</div>
<div class="c-row">
<button class="c-btn blue" onclick="applyCounts()">পূর্ণমান সেট</button>
<button class="c-btn green2" onclick="downloadExcel()">এক্সেল</button>
<button class="c-btn gray" onclick="window.print()">📄 PDF / প্রিন্ট</button>
<button class="c-btn red" onclick="deleteAll()">সব ডিলিট</button>
</div>
</div>

<div class="table-wrap">
<table><thead id="tHead"></thead><tbody id="tBody"></tbody></table>
</div>
</div>

<div id="addModal" class="modal hidden no-print">
<div class="modal-box">
<h2 style="text-align:center">নতুন শিক্ষার্থী</h2>
<input id="sName" placeholder="নাম লিখুন (যেমন Kalam)">
<input id="sRoll" placeholder="রোল (যেমন 201)" type="number">
<input id="sMobile" placeholder="মোবাইল নাম্বার">
<div style="display:flex;gap:8px;margin-top:12px">
<button class="c-btn blue" style="flex:1;padding:14px" onclick="saveStudent()">সেভ</button>
<button class="c-btn red" style="flex:1;padding:14px" onclick="closeModal()">বাতিল</button>
</div>
</div>
</div>

<script>
let session=JSON.parse(localStorage.getItem('takrim_session')||'null');
let allStudents=JSON.parse(localStorage.getItem('takrim_students')||'[]');
let subjects=JSON.parse(localStorage.getItem('takrim_subjects')||'["বাংলা","ইংরেজি"]');
let fullMarks=JSON.parse(localStorage.getItem('takrim_fullmarks')||'[100,100]');
let showResult=false; // ডিফল্টে ফলাফল বন্ধ = সবাই থাকবে
let filter='all';

if(session)document.getElementById('classInfo').textContent=`শ্রেণী: ${session.cls} | সেশন 2025-26 | সেমিস্টার ${session.section}`;
function save(){localStorage.setItem('takrim_students',JSON.stringify(allStudents));localStorage.setItem('takrim_subjects',JSON.stringify(subjects));localStorage.setItem('takrim_fullmarks',JSON.stringify(fullMarks));}
function getList(){let base=allStudents.filter(s=>!session||(s.cls===session.cls && s.section===session.section)); if(filter==='present')return base.filter(s=>s.present!==false); if(filter==='absent')return base.filter(s=>s.present===false); return base;}

function render(){
let base=allStudents.filter(s=>!session||(s.cls===session.cls && s.section===session.section));
document.getElementById('cAll').textContent=base.length;
document.getElementById('cPresent').textContent=base.filter(s=>s.present!==false).length;
document.getElementById('cAbsent').textContent=base.filter(s=>s.present===false).length;
document.getElementById('resultEye').textContent=showResult?'লুকান':'দেখুন';

let students=getList();
let head=`<tr><th>ক্রম</th><th>নাম</th><th>রোল</th><th>মোবাইল</th>`;
subjects.forEach(s=>head+=`<th>${s}</th>`);
if(showResult)head+=`<th>প্রাপ্ত</th><th>%</th><th>গ্রেড</th><th>জিপিএ</th>`;
head+=`<th class="no-print">ডিলিট</th></tr><tr><td></td><td></td><td>পূর্ণমান</td><td></td>`;
fullMarks.forEach((fm,i)=>head+=`<td><input class="mark-input full-input" value="${fm}" onchange="editFull(${i},this.value)"></td>`);
if(showResult)head+=`<td colspan="4"></td><td class="no-print"></td>`;
head+='</tr>';
document.getElementById('tHead').innerHTML=head;

let body='';
students.forEach((st)=>{
let gi=allStudents.indexOf(st);
let marks=st.marks||Array(subjects.length).fill('');
let total=marks.reduce((a,b)=>a+(parseFloat(b)||0),0);
let fullTotal=fullMarks.reduce((a,b)=>a+(parseFloat(b)||0),0);
let perc=fullTotal?((total/fullTotal)*100).toFixed(1):0;
let grade=perc>=80?'A+':perc>=70?'A':perc>=60?'A-':perc>=50?'B':'F';
let gpa=perc>=80?'5.00':perc>=70?'4.00':perc>=60?'3.50':'0.00';
body+=`<tr><td>${gi+1}</td><td style="text-align:left">${st.name}</td><td>${st.roll}</td><td>${st.mobile||''}</td>`;
marks.forEach((m,i)=>body+=`<td><input class="mark-input" type="number" value="${m}" onchange="editMark(${gi},${i},this.value)"></td>`);
if(showResult)body+=`<td><b>${total}</b></td><td>${perc}</td><td>${grade}</td><td>${gpa}</td>`;
body+=`<td class="no-print"><button onclick="deleteOne(${gi})" style="border:none;background:#fee2e2;padding:6px 8px;border-radius:8px">🗑️</button></td></tr>`;
});
document.getElementById('tBody').innerHTML=body||`<tr><td colspan="20">কোনো শিক্ষার্থী নেই - সবাই দেখা যাচ্ছে</td></tr>`;
}
function filterAll(){filter='all';render();}
function filterPresent(){filter=filter==='present'?'all':'present';render();}
function filterAbsent(){filter=filter==='absent'?'all':'absent';render();} // চাপলে অনুপস্থিত, আবার চাপলে সবাই
function toggleResult(){showResult=!showResult;render();} // চাপলে সব ফলাফল আসবে
function editFull(i,v){fullMarks[i]=parseInt(v)||0;save();render();}
function editMark(gi,si,v){if(!allStudents[gi].marks)allStudents[gi].marks=[];allStudents[gi].marks[si]=v;save();render();}
function openModal(){document.getElementById('addModal').classList.remove('hidden')}function closeModal(){document.getElementById('addModal').classList.add('hidden')}
function saveStudent(){
let name=sName.value.trim(),roll=sRoll.value.trim(),mobile=sMobile.value.trim();
if(!name||!roll)return alert('নাম রোল দিন');
allStudents.push({name,roll,mobile,cls:session?.cls||'১ম শ্রেণি',section:session?.section||'ক',marks:Array(subjects.length).fill(''),present:true});
save();closeModal();sName.value='';sRoll.value='';sMobile.value='';render();
}
function deleteOne(i){if(confirm('ডিলিট?')){allStudents.splice(i,1);save();render();}}
function deleteAll(){if(confirm('সব ডিলিট?')){let ids=getList().map(s=>allStudents.indexOf(s)).sort((a,b)=>b-a);ids.forEach(i=>allStudents.splice(i,1));save();render();}}
function applyCounts(){let n=parseInt(subCount.value)||2;if(n>13)n=13;let fm=parseInt(fullMark.value)||100;subjects=Array.from({length:n},(_,i)=>subjects[i]||`বিষয় ${i+1}`);fullMarks=Array.from({length:n},()=>fm);save();render();}
function renameSubs(){let nm=prompt('বিষয় নাম কমা দিয়ে',subjects.join(','));if(!nm)return;subjects=nm.split(',').map(s=>s.trim());save();render();}
function downloadExcel(){
let students=getList();let header=['ক্রম','নাম','রোল','মোবাইল',...subjects,'প্রাপ্ত','%','গ্রেড','জিপিএ'];
let rows=students.map((st,i)=>{let m=st.marks||Array(subjects.length).fill('');let t=m.reduce((a,b)=>a+(parseFloat(b)||0),0);let ft=fullMarks.reduce((a,b)=>a+(parseFloat(b)||0),0);let p=ft?((t/ft)*100).toFixed(1):0;return [i+1,st.name,st.roll,st.mobile||'',...m,t,p,'',''];});
let ws=XLSX.utils.aoa_to_sheet([header,['','','','পূর্ণমান',...fullMarks],...rows]);let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Result');XLSX.writeFile(wb,`result.xlsx`);
}
render();
</script>
</body>
</html>
