<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MALEK ATTENDANCE SYSTEM PRIMARY - FINAL</title>
<style>
*{box-sizing:border-box;font-family:SolaimanLipi,Noto Sans Bengali,sans-serif}
body{margin:0;background:#0a281f;display:flex;justify-content:center}
.main{width:390px;max-width:100vw;padding:8px}
.page{display:none}.page.active{display:block}
.gold{border:4px solid #facc15;border-radius:22px;overflow:hidden;background:#000}
.gold img{width:100%;display:block}
.greenCard{background:#16a34a;border-radius:18px;padding:10px;margin-top:12px}
.blackPill{background:#000;color:#fff;text-align:center;padding:14px;border-radius:30px;font-weight:800;font-size:19px}
.whiteBtn{width:100%;background:#fff;border:none;border-radius:16px;padding:16px;display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:18px;color:#1d4ed8;margin-top:12px;cursor:pointer;box-shadow:0 2px 0 #ccc}
.cardInner{background:#fff;border-radius:0 0 16px 16px;padding:12px;margin-top:-8px;border-top:1px solid #eee}
input,select,textarea{width:100%;padding:12px;border:2px solid #ddd;border-radius:12px;margin-top:8px;font-size:15px}
.topbar{background:#0a2e1f;border:3px solid #facc15;color:#facc15;padding:12px;border-radius:16px}
.hidden{display:none}
.bigBtn{width:100%;padding:18px;border-radius:18px;border:none;font-size:18px;font-weight:800;cursor:pointer;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.2);margin-top:10px}
.whiteBox{background:#fff;border-radius:18px;padding:12px;margin-top:10px;display:flex;flex-direction:column}
.pill{background:#fff;border:2px solid #aaa;padding:6px 14px;border-radius:20px;font-weight:700;cursor:pointer;display:inline-block}
.pill-y{background:#fef9c3;border:2px solid #bbb;padding:8px 14px;border-radius:14px;font-weight:800;display:inline-block;min-width:60px}
.pill-w{background:#fff;border:2px solid #bbb;padding:8px 14px;border-radius:14px;font-weight:700;display:inline-block;min-width:60px}
table{border-collapse:collapse}
</style>
</head>
<body>
<div class="main">

<!-- ========== ১ম পাতা - ছবির মতো ফাইনাল ========== -->
<div id="page1" class="page active">
<div class="gold"><img src="logo.jpg" onerror="this.src='IMG-20261005-WA0019(3).jpg';this.onerror=null"></div>
<div class="greenCard"><div class="blackPill">প্রাথমিক বিদ্যালয় হাজিরা</div></div>

<button class="whiteBtn" onclick="tog('f1')"><span>🏫 প্রতিষ্ঠান ফরম</span><span>▼</span></button>
<div id="f1" class="cardInner hidden">
<input id="bn" placeholder="প্রতিষ্ঠান নাম">
<input id="instPass" type="password" placeholder="পাসওয়ার্ড সেট করুন">
<button onclick="saveInst()" style="background:#16a34a;color:#fff;width:100%;padding:14px;border-radius:12px;border:none;margin-top:8px;font-weight:700">সেভ ✅</button>
</div>

<button class="whiteBtn" onclick="tog('f2')"><span>🔐 লগইন</span><span>▼</span></button>
<div id="f2" class="cardInner hidden">
<select id="instSel"></select>
<select id="shift"><option>🌅 প্রভাতি</option><option>দিবা</option></select>
<select id="cls"><option>প্রাক-প্রাথমিক</option><option>১ম</option><option>২য়</option><option>৩য়</option><option>৪র্থ</option><option>৫ম</option></select>
<select id="sec"><option>N/A</option><option>ক</option><option>খ</option><option>গ</option></select>
<input id="loginPass" type="password" placeholder="পাসওয়ার্ড দিন">
<button onclick="doLogin()" style="background:#1d4ed8;color:#fff;width:100%;padding:14px;border-radius:12px;border:none;font-weight:700;margin-top:8px">🔐 প্রবেশ করুন</button>
</div>

<button class="whiteBtn" onclick="tog('f3')"><span>🔒 তালিকা</span><span>▼</span></button>
<div id="f3" class="cardInner hidden"><div id="instList" style="font-size:14px"></div></div>
</div>

<!-- ========== ২য় পাতা - ছবির মতো ফাইনাল ========== -->
<div id="page2" class="page">
<div class="topbar"><b id="dInst"></b><br><small>📅 <span id="autoDate"></span> | <span id="dShift"></span> | <span id="dCls"></span> | <span id="dSec"></span></small><br><button onclick="goHome()" style="background:#fff;color:#000;width:100%;padding:8px;border-radius:20px;border:none;font-weight:700;margin-top:8px">⬅️ লগআউট</button></div>
<div class="whiteBox">
<button class="bigBtn" style="background:#2563eb" onclick="tog('c1')">শিক্ষার্থী যোগ করুন</button>
<div id="c1" class="hidden" style="margin-bottom:6px"><input id="sName" placeholder="নাম"><input id="sRoll" placeholder="রোল"><button onclick="addS()" style="background:#2563eb;color:#fff;width:100%;padding:12px;border-radius:10px;border:none;margin-top:6px;font-weight:700">OK</button></div>

<button class="bigBtn" style="background:#facc15;color:#000" onclick="tog('c2')">📋 শিক্ষার্থীর তালিকা দেখুন ( <span id="tc">0</span> )</button>
<div id="c2" class="hidden" style="margin-bottom:6px"><div id="sList"></div></div>

<button class="bigBtn" style="background:#16a34a" onclick="tog('c3')">✅ উপস্থিত <span id="pc">0</span> | ❌ অনুপস্থিত <span id="ac">0</span> দেখুন</button>
<div id="c3" class="hidden" style="margin-bottom:6px;display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><b>উপস্থিত</b><div id="pL"></div></div><div><b>অনুপস্থিত</b><div id="aL"></div></div></div>

<button class="bigBtn" style="background:#ef4444" onclick="tog('c4')">📢 নোটিশ বোর্ড</button>
<div id="c4" class="hidden" style="margin-bottom:6px"><textarea id="notice" placeholder="নোটিশ লিখুন"></textarea></div>

<button class="bigBtn" style="background:#16a34a" onclick="tog('c5')">💬 SMS পাঠান</button>
<div id="c5" class="hidden" style="margin-bottom:6px"><button style="background:#22c55e;color:#fff;width:100%;padding:12px;border-radius:10px;border:none">✅ উপস্থিত SMS</button><button style="background:#ef4444;color:#fff;width:100%;padding:12px;border-radius:10px;border:none;margin-top:6px">❌ অনুপস্থিত SMS</button></div>

<button class="bigBtn" style="background:#2563eb" onclick="tog('c6')">📱 WhatsApp-এ পাঠান</button>
<div id="c6" class="hidden" style="margin-bottom:6px"><button onclick="sendWA('P')" style="background:#16a34a;color:#fff;width:100%;padding:12px;border-radius:10px;border:none">✅ WA</button><button onclick="sendWA('A')" style="background:#ef4444;color:#fff;width:100%;padding:12px;border-radius:10px;border:none;margin-top:6px">❌ WA</button><button onclick="reportWA()" style="background:#7c3aed;color:#fff;width:100%;padding:12px;border-radius:10px;border:none;margin-top:6px">📊 রিপোর্ট WA</button></div>

<button class="bigBtn" style="background:#2563eb" onclick="tog('c7')">📋 মাসিক হাজিরা দেখুন</button>
<div id="c7" class="hidden" style="margin-bottom:6px;overflow:auto"><table border="1" style="width:100%;font-size:11px;text-align:center"><thead><tr id="dayH"></tr></thead><tbody id="monBody"></tbody></table></div>

<button class="bigBtn" style="background:#7c3aed" onclick="tog('c8')">🔽 ফলাফল দেখুন</button>
<div id="c8" class="hidden" style="margin-top:8px;background:#f5f0ff;border:3px solid #8b5cf6;border-radius:18px;padding:10px">
<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
<button onclick="editSubNames()" style="background:#7c3aed;color:#fff;padding:10px 14px;border-radius:12px;border:none;font-weight:700">নাম বদলান</button>
<span style="font-weight:800">বিষয়:</span><input id="subCount" type="number" min="1" max="20" value="3" onchange="updateSubCount()" style="width:65px;height:44px;text-align:center;border-radius:12px;font-weight:700">
<input id="fullMarkTop" value="100" style="width:65px;height:44px;text-align:center;border-radius:12px;font-weight:700">
<button onclick="setFullMarks()" style="background:#0ea5e9;color:#fff;padding:10px 14px;border-radius:12px;border:none;font-weight:700">পূর্ণমান সেট</button>
<button onclick="exportExcel()" style="background:#16a34a;color:#fff;padding:10px 16px;border-radius:12px;border:none;font-weight:700">এক্সেল</button>
</div>
<div style="overflow-x:auto;background:#fff;border-radius:12px;margin-top:10px;border:2px solid #ddd"><table style="width:100%;min-width:1100px;text-align:center;font-size:13px"><thead id="resHead"></thead><tbody id="resBody"></tbody></table></div>
</div>
</div>
</div>
</div>

<script>
function tog(id){document.getElementById(id).classList.toggle('hidden')}
let insts=JSON.parse(localStorage.getItem('malek_insts')||'[]');
function saveInst(){let b=bn.value.trim(),p=instPass.value.trim();if(!b||!p)return alert('নাম ও পাস দিন');insts.push({bn:b,pass:p});localStorage.setItem('malek_insts',JSON.stringify(insts));renderInst();bn.value='';instPass.value='';alert('সেভ হয়েছে');tog('f1');tog('f2')}
function renderInst(){instSel.innerHTML=insts.length?insts.map(x=>`<option>${x.bn}</option>`).join(''):'<option>কোন প্রতিষ্ঠান নেই</option>';instList.innerHTML=insts.length?insts.map(x=>`<div style="padding:8px;border-bottom:1px solid #eee">🏫 ${x.bn}</div>`).join(''):'<div>কোন প্রতিষ্ঠান নেই</div>'}
let currentInst=null;
function doLogin(){let sel=insts.find(x=>x.bn==instSel.value);if(!sel)return alert('প্রতিষ্ঠান নেই');if(loginPass.value!=sel.pass)return alert('পাস ভুল');currentInst=sel;dInst.innerText=sel.bn;dShift.innerText=shift.value;dCls.innerText=cls.value;dSec.innerText=sec.value;autoDate.innerText=new Date().toLocaleDateString('bn-BD',{day:'numeric',month:'long',year:'numeric'});page1.classList.remove('active');page2.classList.add('active');loadStudents()}
function goHome(){page2.classList.remove('active');page1.classList.add('active')}
let students=[];let subjects=["বাংলা","ইংরেজি","গণিত","বিজ্ঞান","সমাজ","ধর্ম","ICT","কৃষি","শা:শি:","চারু","বিষয়11","বিষয়12","বিষয়13","বিষয়14","বিষয়15","বিষয়16","বিষয়17","বিষয়18","বিষয়19","বিষয়20"];let fullMarks=Array(20).fill(100);
function getKey(){return `stu_${currentInst.bn}_${cls.value}_${sec.value}`}
function loadStudents(){students=JSON.parse(localStorage.getItem(getKey())||'[]');if(!students.length){students=[{name:'কালাম',roll:'202',marks:[70,70,65]},{name:'কমল',roll:'203',marks:[80,75,70]}];save2()}renderAll()}
function save2(){localStorage.setItem(getKey(),JSON.stringify(students));renderAll()}
function addS(){if(!sName.value||!sRoll.value)return alert('নাম রোল দিন');let c=parseInt(subCount.value)||3;students.push({name:sName.value,roll:sRoll.value,marks:Array(c).fill(0)});sName.value='';sRoll.value='';save2()}
let att={};
function renderAll(){tc.innerText=students.length;sList.innerHTML=students.map((s,i)=>`<div style="display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #eee"><span>${i+1}. ${s.name} (${s.roll})</span><span><input type="checkbox" ${att[i]!==false?'checked':''} onchange="att[${i}]=this.checked;updateAtt();renderMonthly()"> <button onclick="students.splice(${i},1);save2()" style="border:none;background:#fee2e2;border-radius:6px;padding:4px 6px">🗑️</button></span></div>`).join('');updateAtt();renderResult();renderMonthly()}
function updateAtt(){let p=[],a=[];students.forEach((s,i)=>{if(att[i]!==false)p.push(s.name);else a.push(s.name)});pc.innerText=p.length;ac.innerText=a.length;pL.innerHTML=p.join('<br>');aL.innerHTML=a.join('<br>')}
function updateSubCount(){let c=parseInt(subCount.value);if(c>20)c=20;if(c<1)c=1;subCount.value=c;students.forEach(s=>{while(s.marks.length<c)s.marks.push(0);s.marks=s.marks.slice(0,c)});save2()}
function editSubNames(){let c=parseInt(subCount.value);for(let i=0;i<c;i++){let n=prompt(`বিষয় ${i+1} নাম:`,subjects[i]);if(n!==null&&n.trim()!=='')subjects[i]=n.trim()}renderResult()}
function setFullMarks(){let v=parseInt(fullMarkTop.value)||100;let c=parseInt(subCount.value);for(let i=0;i<c;i++)fullMarks[i]=v;renderResult()}
function renderResult(){let c=parseInt(subCount.value)||3;let h=`<tr><th style="border:1px solid #ccc;padding:6px">ক্রম</th><th style="border:1px solid #ccc">নাম</th><th style="border:1px solid #ccc">রোল</th>`;for(let i=0;i<c;i++)h+=`<th style="border:1px solid #ccc"><span class="pill" onclick="let n=prompt('নাম',subjects[${i}]);if(n){subjects[${i}]=n;renderResult()}">${subjects[i]}</span></th>`;h+=`<th style="border:1px solid #ccc">মোট পূর্ণ</th><th style="border:1px solid #ccc">প্রাপ্ত</th><th style="border:1px solid #ccc">%</th><th style="border:1px solid #ccc">GPA</th></tr>`;resHead.innerHTML=h;let totalFull=fullMarks.slice(0,c).reduce((a,b)=>a+b,0);let b=`<tr style="background:#fef9c3"><td style="border:1px solid #ccc"></td><td style="border:1px solid #ccc"></td><td style="border:1px solid #ccc;font-weight:700">পূর্ণমান</td>`;for(let i=0;i<c;i++)b+=`<td style="border:1px solid #ccc"><span class="pill-y"><input value="${fullMarks[i]}" style="width:35px;border:none;background:transparent;text-align:center;font-weight:700" onchange="fullMarks[${i}]=parseInt(this.value)||0;renderResult()"></span></td>`;b+=`<td style="border:1px solid #ccc"><b>${totalFull}</b></td><td style="border:1px solid #ccc"></td><td style="border:1px solid #ccc"></td><td style="border:1px solid #ccc"></td></tr>`;students.forEach((s,idx)=>{let obtain=s.marks.slice(0,c).reduce((a,b)=>a+b,0);let perc=totalFull?((obtain/totalFull*100).toFixed(1)):0;let gpa=perc>=80?5:perc>=70?4:perc>=60?3.5:perc>=50?3:perc>=40?2:perc>=33?1:0;b+=`<tr><td style="border:1px solid #ccc">${idx+1}</td><td style="border:1px solid #ccc">${s.name}</td><td style="border:1px solid #ccc">${s.roll}</td>`;for(let i=0;i<c;i++)b+=`<td style="border:1px solid #ccc"><span class="pill-w"><input value="${s.marks[i]||0}" style="width:35px;border:none;background:transparent;text-align:center" onchange="students[${idx}].marks[${i}]=parseInt(this.value)||0;save2()"></span></td>`;b+=`<td style="border:1px solid #ccc">${totalFull}</td><td style="border:1px solid #ccc"><b>${obtain}</b></td><td style="border:1px solid #ccc">${perc}%</td><td style="border:1px solid #ccc">${gpa.toFixed(2)}</td></tr>`});resBody.innerHTML=b}
function renderMonthly(){let d=new Date();let days=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();let h='<th style="border:1px solid #ccc">রোল</th><th style="border:1px solid #ccc">নাম</th>';for(let i=1;i<=days;i++)h+=`<th style="border:1px solid #ccc">${i}</th>`;dayH.innerHTML=h;monBody.innerHTML=students.map((s,i)=>{let row=`<tr><td style="border:1px solid #ccc">${s.roll}</td><td style="border:1px solid #ccc">${s.name}</td>`;for(let j=1;j<=days;j++){let m=j==d.getDate()?(att[i]!==false?'P':'A'):'-';row+=`<td style="border:1px solid #ccc;${m=='P'?'background:#bbf7d0':m=='A'?'background:#fecaca':''}">${m}</td>`}return row+'</tr>'}).join('')}
function sendWA(t){window.open(`https://wa.me/?text=${encodeURIComponent(dInst.innerText+' হাজিরা '+t)}`)}
function reportWA(){let txt=`*${dInst.innerText}*%0Aতারিখ: ${autoDate.innerText}%0Aউপস্থিত: ${pc.innerText}, অনুপস্থিত: ${ac.innerText}`;window.open(`https://wa.me/?text=${txt}`)}
function exportExcel(){let c=parseInt(subCount.value)||3;let totalFull=fullMarks.slice(0,c).reduce((a,b)=>a+b,0);let csv="ক্রম,নাম,রোল,"+subjects.slice(0,c).join(',')+",মোট পূর্ণ,প্রাপ্ত,%,GPA\n";students.forEach((s,i)=>{let ob=s.marks.slice(0,c).reduce((a,b)=>a+b,0);let per=totalFull?((ob/totalFull*100).toFixed(1)):0;let gpa=per>=80?5:per>=70?4:per>=60?3.5:per>=50?3:per>=40?2:per>=33?1:0;csv+=`${i+1},${s.name},${s.roll},${s.marks.slice(0,c).join(',')},${totalFull},${ob},${per}%,${gpa}\n`});let blob=new Blob([csv],{type:'text/csv'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='result_20sub.csv';a.click()}
renderInst();renderResult();
</script>
</body>
</html>
