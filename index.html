<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FINAL A4</title><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;700&display=swap" rel="stylesheet"><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><style>*{box-sizing:border-box;font-family:'Hind Siliguri',sans-serif}body{margin:0;background:#082a1e;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:10px}.main-banner{width:380px;max-width:95%;border:4px solid #ffcc00;border-radius:22px;overflow:hidden;margin-top:10px;background:#000;line-height:0}.main-banner img{width:100%;display:block}.green-box{width:380px;max-width:95%;background:#16a34a;border-radius:16px;padding:12px;margin-top:20px;text-align:center}.green-box span{background:#000;color:#fff;display:inline-block;padding:8px 22px;border-radius:30px;font-weight:700;font-size:18px}.card{background:#fff;margin-top:12px;border-radius:24px;padding:16px;width:100%;max-width:430px}.menu{width:100%;max-width:430px;background:#fff;border:none;border-radius:16px;padding:16px;font-weight:700;color:#0d5bff;margin-top:12px;display:flex;justify-content:space-between;cursor:pointer}.hidden{display:none!important}.btn{width:100%;padding:14px;border:none;border-radius:14px;font-weight:700;cursor:pointer;margin-top:8px}.green{background:#0a7a42;color:#fff}.blue{background:#0d5bff;color:#fff}.red{background:#d61f1f;color:#fff}.yellow{background:#ffcc00;color:#1a1a1a}input,select{width:100%;padding:12px;border-radius:12px;border:1px solid #ccc;margin:5px 0}.acc{margin-bottom:8px;border-radius:12px;overflow:hidden;background:#fff;width:100%;max-width:430px}.acc-b{display:none;padding:8px;background:#fafafa}.acc-b.show{display:block}.btn2{padding:8px 10px;border:none;border-radius:20px;color:#fff;cursor:pointer;margin:3px;font-weight:bold;font-size:11px}.header3{display:flex;gap:6px;width:100%}.hbox{flex:1;padding:14px 2px;border-radius:14px;text-align:center;font-weight:bold;font-size:13px;cursor:pointer;border:3px solid transparent}.hbox.active{border-color:yellow}.boxPresent{background:#2e7d32;color:#fff}.boxAbsent{background:#c62828;color:#fff}.boxNotice{background:#ef6c00;color:#fff}.acc-h-normal{background:#1976d2;color:#fff;padding:10px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-weight:bold;border-radius:12px 12px 0 0}.acc-b-normal{display:none;padding:8px;background:#fafafa}.acc-b-normal.on{display:block}.fifty{display:flex;gap:6px}.fifty>*{flex:1}
#logoPreview{width:90px;height:90px;border-radius:50%;border:3px solid #ffcc00;object-fit:cover;object-position:center;background:#fff;display:none;margin:0 auto}
.subName{width:90px;padding:8px 6px;border-radius:6px;border:1.5px solid #0f5d1a;background:#e8f5e9;text-align:center;font-weight:700}
.subFull{width:70px;padding:7px;border-radius:6px;border:1.5px solid #b7791f;background:#fffbeb;text-align:center;font-weight:700}
.markGol{width:70px;height:38px;border-radius:6px;border:1.5px solid #94a3b8;background:#fff;text-align:center;font-weight:700}
.tbl{width:100%;border-collapse:collapse;font-size:12px;text-align:center;background:#fff}.tbl th{background:#0f5d1a;color:#fff;padding:10px 4px}.tbl td{padding:4px;border:1px solid #e2e8f0}
#institutePadFull{width:100%;max-width:800px;background:#fff;border:1px solid #ccc;overflow:hidden}

.infoLine{font-size:11px;color:#000;text-align:center;padding:4px 6px;background:#fff;border-top:1px solid #eee}
.blueLine{width:100%;height:4px;background:#0d2a7a}
.classPillWrap{width:100%;display:flex;justify-content:center;padding:6px 0 10px 0;background:#fff}

@media(max-width:500px){.bnName{font-size:14px}.enName{font-size:11px}.bnAddr{font-size:12px}.padLogo{width:58px;height:58px}.infoLine{font-size:9px}}
</style></head><body>
<div id="firstPageWrap" style="width:100%;display:flex;flex-direction:column;align-items:center">
<div class="main-banner"><img src="IMG-20261005-WA0019(3).jpg"></div>
<div class="green-box"><span>প্রাথমিক বিদ্যালয় হাজিরা</span></div>
<button class="menu" onclick="document.getElementById('formBox').classList.toggle('hidden')">🏫 প্রতিষ্ঠান ফরম ▼</button>
<div id="formBox" class="card hidden" style="text-align:center">
<img id="logoPreview" src=""><label for="logoInput" style="background:#ffcc00;color:#000;font-weight:700;font-size:14px;margin-top:10px;padding:7px 18px;border-radius:20px;cursor:pointer;display:inline-block">🖼️ লোগো চেঞ্জ ৯০x৯০ গোল</label><input type="file" id="logoInput" accept="image/*" style="position:absolute;left:-9999px;opacity:0;width:1px;height:1px">
<input id="bnName" placeholder="প্রতিষ্ঠানের নাম"><input id="enName" placeholder="English Name"><input id="address" placeholder="ঠিকানা"><div class="fifty"><input id="eiin" placeholder="EIIN"><input id="schoolCode" placeholder="Code"></div><div class="fifty"><input id="mobile" placeholder="মোবাইল"><input id="email" placeholder="Email"></div><input id="pass1" type="password" placeholder="পাসওয়ার্ড"><button class="btn green" onclick="savePrimary()">সেভ করুন ✅</button>
</div>
<button class="menu" onclick="document.getElementById('loginBox').classList.toggle('hidden')">🔐 লগইন ▼</button>
<div id="loginBox" class="card hidden"><select id="loginInst"></select><div class="fifty"><select id="shift"><option>🌅 প্রভাতি</option><option>দিবা</option></select><select id="cls"><option>১ম শ্রেণি</option><option>২য় শ্রেণি</option><option>৩য় শ্রেণি</option><option>৪র্থ শ্রেণি</option><option>৫ম শ্রেণি</option></select><select id="section"><option>ক</option><option>খ</option></select></div><input id="loginPass" type="password" placeholder="পাসওয়ার্ড"><button class="btn blue" onclick="primaryLogin()">🔒 প্রবেশ করুন</button><p id="loginMsg" style="color:red;text-align:center"></p></div>
<button class="menu" onclick="document.getElementById('listBox').classList.toggle('hidden')">🔒 তালিকা ▼</button>
<div id="listBox" class="card hidden"><button class="btn red" onclick="openListSecure()">🔓 তালিকা খুলুন (এডমিন)</button><div id="instList"></div></div>
</div>
<div id="secondPageWrap" class="hidden" style="width:100%;display:flex;flex-direction:column;align-items:center">
<div id="institutePadFull">
  <div class="padTop"><img id="padLogo" class="padLogo" src=""><div class="padText"><div id="instName" class="bnName"></div><div id="instEng" class="enName"></div><div id="instAddr" class="bnAddr"></div></div></div>
  <div class="infoLine">Mobile: <span id="padMobile"></span> | Email: <span id="padEmail"></span> | EIIN: <span id="padEiin"></span> | INS Code: <span id="padCode"></span></div>
  <div class="blueLine"></div>
  <div class="classPillWrap"><div class="classPill">শ্রেণী: <span id="pillCls"></span> | শাখা: <span id="pillSec"></span> | শিফট: <span id="pillShift"></span></div></div>
</div>
<div style="text-align:center;margin-top:8px"><button onclick="logout()" style="background:#d61f1f;color:#fff;border:none;padding:6px 14px;border-radius:8px;font-size:12px">🚪 লগআউট</button></div>
<div id="acc" style="width:100%;max-width:430px;margin-top:10px"></div>
</div>
<script>
let rawInsts=JSON.parse(localStorage.getItem('takrim_primary_insts')||'[]');let mapDedup=new Map();rawInsts.forEach(x=>{let k=(x.bnName||'').trim();if(k&&!mapDedup.has(k))mapDedup.set(k,x);});let insts=[...mapDedup.values()];localStorage.setItem('takrim_primary_insts',JSON.stringify(insts));
let students=JSON.parse(localStorage.getItem('students_v2')||'[]');let saved=JSON.parse(localStorage.getItem('fullResultSheet')||'null');let activeTab='';let tempLogo=localStorage.getItem('takrim_temp_logo')||'';
function refreshInstSelect(){let el=document.getElementById('loginInst');el.innerHTML='<option value="">প্রতিষ্ঠান নির্বাচন</option>'+insts.map((x,i)=>'<option value="'+i+'">'+x.bnName+'</option>').join('');}refreshInstSelect();
document.getElementById('logoInput').addEventListener('change',function(){if(!this.files[0])return;let r=new FileReader();r.onload=e=>{let img=new Image();img.onload=()=>{let c=document.createElement('canvas');c.width=600;c.height=600;let ctx=c.getContext('2d');let size=Math.min(img.width,img.height),sx=(img.width-size)/2,sy=(img.height-size)/2;ctx.fillStyle='#fff';ctx.fillRect(0,0,600,600);ctx.drawImage(img,sx,sy,size,size,0,0,600,600);tempLogo=c.toDataURL('image/png');let p=document.getElementById('logoPreview');p.src=tempLogo;p.style.display='block';localStorage.setItem('takrim_temp_logo',tempLogo);};img.src=e.target.result;};r.readAsDataURL(this.files[0]);});
function savePrimary(){let bn=document.getElementById('bnName').value.trim();let pass=document.getElementById('pass1').value.trim();if(!bn)return alert('প্রতিষ্ঠানের নাম দিন');if(!pass)return alert('পাসওয়ার্ড দিন');if(insts.some(x=>x.bnName.trim()===bn))return alert('❌ এই প্রতিষ্ঠান আগেই আছে');let o={bnName:bn,enName:document.getElementById('enName').value.trim(),addr:document.getElementById('address').value.trim(),eiin:document.getElementById('eiin').value.trim(),schoolCode:document.getElementById('schoolCode').value.trim(),mobile:document.getElementById('mobile').value.trim(),email:document.getElementById('email').value.trim(),pass:pass,logo:tempLogo||''};insts.push(o);localStorage.setItem('takrim_primary_insts',JSON.stringify(insts));localStorage.setItem('takrim_temp_logo','');alert('✅ সেভ');location.reload();}
function primaryLogin(){let idx=document.getElementById('loginInst').value;if(idx==='')return document.getElementById('loginMsg').textContent='প্রতিষ্ঠান নির্বাচন';let ins=insts[idx];if(document.getElementById('loginPass').value!==ins.pass)return document.getElementById('loginMsg').textContent='❌ ভুল পাস';localStorage.setItem('takrim_session',JSON.stringify({inst:ins,cls:document.getElementById('cls').value,shift:document.getElementById('shift').value,section:document.getElementById('section').value}));showSecondPage();}
function showSecondPage(){let sess=JSON.parse(localStorage.getItem('takrim_session')||'null');if(!sess)return;document.getElementById('firstPageWrap').classList.add('hidden');document.getElementById('secondPageWrap').classList.remove('hidden');document.body.style.background='#f0f4f8';document.getElementById('instName').innerText=sess.inst.bnName||'';document.getElementById('instEng').innerText=sess.inst.enName||'MOMTAZ UDDIN BUSINESS MANAGEMENT COLLEGE';document.getElementById('instAddr').innerText=sess.inst.addr||'উত্তর বাড্ডা, ঢাকা-১২১২';let logoEl=document.getElementById('padLogo');if(sess.inst.logo)logoEl.src=sess.inst.logo;document.getElementById('padEiin').innerText=sess.inst.eiin||'';document.getElementById('padCode').innerText=sess.inst.schoolCode||'';document.getElementById('padMobile').innerText=sess.inst.mobile||'';document.getElementById('padEmail').innerText=sess.inst.email||'';document.getElementById('pillCls').innerText=sess.cls;document.getElementById('pillSec').innerText=sess.section;document.getElementById('pillShift').innerText=sess.shift;buildAcc();showStu();renderHeaderCounts();}
function openListSecure(){let a=prompt('এডমিন নাম'),p=prompt('পাসওয়ার্ড');if(a!=='malek'||p!=='takrim2022')return alert('ভুল এডমিন');let listDiv=document.getElementById('instList');listDiv.innerHTML=insts.map((s,i)=>'<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 8px;border-bottom:1px solid #eee"><div style="display:flex;align-items:center;gap:8px"><img src="'+(s.logo||'')+'" style="width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid #ffcc00"><div><div style="font-weight:700;font-size:13px">'+s.bnName+'</div><div style="font-size:11px;background:#f3f4f6;padding:4px 8px;border-radius:8px;margin-top:4px">🔑 <b style="color:#dc2626">'+s.pass+'</b></div></div></div><div><button onclick="navigator.clipboard.writeText(\''+s.pass+'\');alert(\'কপি\')" style="background:#dbeafe;border:none;padding:8px;border-radius:10px">📋</button><button onclick="if(confirm(\'ডিলিট?\')){insts.splice('+i+',1);localStorage.setItem(\'takrim_primary_insts\',JSON.stringify(insts));location.reload();}" style="background:#fee2e2;border:none;padding:8px;border-radius:10px">🗑️</button></div></div>').join('');}
function logout(){if(confirm('লগআউট?')){localStorage.removeItem('takrim_session');location.reload();}}
function buildAcc(){document.getElementById('acc').innerHTML='<div class="acc"><div class="acc-h-normal" onclick="togN(1)"><span>1️⃣ শিক্ষার্থী যোগ</span><span>▼</span></div><div class="acc-b-normal" id="ab1"><input id="sn" placeholder="নাম"><input id="sr" placeholder="রোল"><input id="sm" placeholder="মোবাইল"><button class="btn2" style="background:#2e7d32;width:100%;padding:12px" onclick="addStu()">+ যোগ</button></div></div><div class="acc"><div class="acc-h-normal" onclick="togN(2)"><span>2️⃣ তালিকা</span><span>▼</span></div><div class="acc-b-normal" id="ab2"><div id="sList"></div></div></div><div class="acc" style="border:3px solid #0d47a1"><div class="acc-h-normal" style="background:#0d47a1" onclick="togN(3)"><div class="header3"><div id="hb_present" class="hbox boxPresent" onclick="event.stopPropagation();setTab(\'present\')">✅ উপস্থিত<br><span id="hc_present">0</span> জন</div><div id="hb_absent" class="hbox boxAbsent" onclick="event.stopPropagation();setTab(\'absent\')">❌ অনুপস্থিত<br><span id="hc_absent">0</span> জন</div><div id="hb_notice" class="hbox boxNotice" onclick="event.stopPropagation();setTab(\'notice\')">📢 নোটিশ</div></div></div><div class="acc-b" id="ab3"><div id="tabContent"></div></div></div><div class="acc"><div class="acc-h-normal" onclick="togN(4)"><span>4️⃣ মাসিক হাজিরা (১-৩১)</span><span>▼</span></div><div class="acc-b-normal" id="ab4"><input type="month" id="mp" value="'+new Date().toISOString().slice(0,7)+'" onchange="renderMonth()"><div id="monthTbl" style="margin-top:8px;overflow:auto"></div></div></div><div class="acc"><div class="acc-h-normal" onclick="togN(5)"><span>5️⃣ ফলাফল - আয়তক্ষেত্র + মোট % GPA</span><span>▼</span></div><div class="acc-b-normal" id="ab5"><div class="fifty"><b>বিষয়:</b><button onclick="chSub(-1)">-</button><input id="sc" type="number" value="3" style="text-align:center"><button onclick="chSub(1)">+</button><button onclick="makeSheet()" style="background:#7c4dff;color:#fff;border:none;padding:6px 14px;border-radius:8px">সেট</button><span id="lockB"></span></div><div id="pdfArea" style="margin-top:8px;overflow:auto;background:#fff;padding:8px"><table class="tbl" id="rt"><thead id="rh"></thead><tbody id="rb"></tbody></table></div><div class="fifty" style="margin-top:8px"><button style="background:#2e7d32;color:#fff;padding:10px;border-radius:8px;border:none;flex:1" onclick="saveRes()">💾 সেভ লক</button><button style="background:#ff9800;color:#fff;padding:10px;border-radius:8px;border:none;flex:1" onclick="unlockRes()">✏️ এডিট</button></div><div class="fifty" style="margin-top:8px"><button style="background:#16a34a;color:#fff;padding:10px;border:none;border-radius:8px;flex:1" onclick="expExcel()">⬇️ Excel A4</button><button style="background:#dc2626;color:#fff;padding:10px;border:none;border-radius:8px;flex:1" onclick="downPDF()">⬇️ PDF A4 প্যাড সহ</button></div><p id="st" style="font-size:11px;color:green;font-weight:bold;margin-top:4px"></p></div></div></div>';}
function togN(i){let b=document.getElementById('ab'+i);b.classList.toggle(i==3?'show':'on');if(i==2)showStu();if(i==4)renderMonth();if(i==5)makeSheet();}
function setTab(t){if(activeTab===t){activeTab='';document.querySelectorAll('.hbox').forEach(x=>x.classList.remove('active'));document.getElementById('ab3').classList.remove('show');return;}activeTab=t;document.querySelectorAll('.hbox').forEach(x=>x.classList.remove('active'));document.getElementById('hb_'+t).classList.add('active');document.getElementById('ab3').classList.add('show');renderTab();}
function renderHeaderCounts(){let p=students.filter(s=>s.present).length;let e1=document.getElementById('hc_present');let e2=document.getElementById('hc_absent');if(e1)e1.innerText=p;if(e2)e2.innerText=students.length-p;}
function renderTab(){let p=students.filter(s=>s.present);let a=students.filter(s=>!s.present);let el=document.getElementById('tabContent');let dateStr=new Date().toLocaleDateString('bn-BD');if(activeTab=='present'){let listHtml=p.map(s=>`✅ ${s.name} (${s.roll})`).join('<br>')||'কেউ নেই';let nums=p.map(s=>s.mobile).filter(x=>x).join(',');el.innerHTML=`<div style="padding:10px;background:#e8f5e9;border-radius:12px;font-weight:700">${listHtml}</div><div style="display:flex;gap:8px;margin-top:10px"><button onclick="sendSMS('${nums}','আপনার সন্তান আজ উপস্থিত ${dateStr}')" style="flex:1;background:#1565c0;color:#fff;padding:12px;border:none;border-radius:12px;font-weight:700">📩 SMS</button><button onclick="sendWAList('present','আপনার সন্তান আজ উপস্থিত ${dateStr}')" style="flex:1;background:#25D366;color:#fff;padding:12px;border:none;border-radius:12px;font-weight:700">💬 WhatsApp</button></div>`;}else if(activeTab=='absent'){let listHtml=a.map(s=>`❌ ${s.name} (${s.roll})`).join('<br>')||'কেউ নেই';let nums=a.map(s=>s.mobile).filter(x=>x).join(',');el.innerHTML=`<div style="padding:10px;background:#ffebee;border-radius:12px;font-weight:700">${listHtml}</div><div style="display:flex;gap:8px;margin-top:10px"><button onclick="sendSMS('${nums}','আপনার সন্তান আজ অনুপস্থিত ${dateStr}')" style="flex:1;background:#c62828;color:#fff;padding:12px;border:none;border-radius:12px;font-weight:700">📩 SMS</button><button onclick="sendWAList('absent','আপনার সন্তান আজ অনুপস্থিত ${dateStr}')" style="flex:1;background:#25D366;color:#fff;padding:12px;border:none;border-radius:12px;font-weight:700">💬 WhatsApp</button></div>`;}else{el.innerHTML=`<textarea id="notice" rows="3" style="width:100%;padding:10px;border-radius:12px;border:1px solid #ccc">${localStorage.getItem('notice')||''}</textarea><div style="display:flex;gap:8px;margin-top:10px"><button onclick="sendSMSBulk()" style="flex:1;background:#1565c0;color:#fff;padding:12px;border:none;border-radius:12px;font-weight:700">📩 সবাইকে SMS</button><button onclick="sendWABulk()" style="flex:1;background:#25D366;color:#fff;padding:12px;border:none;border-radius:12px;font-weight:700">💬 সবাইকে WhatsApp</button></div><button onclick="localStorage.setItem('notice',document.getElementById('notice').value);alert('✅ নোটিশ সেভ')" style="width:100%;background:#ef6c00;color:#fff;padding:10px;border:none;border-radius:12px;margin-top:8px">💾 নোটিশ সেভ</button>`;}}
function sendSMS(nums,msg){if(!nums)return alert('মোবাইল নাই');window.location.href='sms:'+nums+'?body='+encodeURIComponent(msg);}
function sendWAList(type,msg){let list=type=='present'?students.filter(s=>s.present):students.filter(s=>!s.present);list.forEach((s,i)=>{if(!s.mobile)return;let num=s.mobile.replace(/[^0-9]/g,'');if(num.startsWith('0'))num='88'+num;setTimeout(()=>window.open('https://wa.me/'+num+'?text='+encodeURIComponent(msg+' - '+s.name),'_blank'),i*800);});}
function sendSMSBulk(){let msg=document.getElementById('notice').value||'নোটিশ';let nums=students.map(s=>s.mobile).filter(x=>x).join(',');sendSMS(nums,msg);}
function sendWABulk(){let msg=document.getElementById('notice').value||'নোটিশ';students.forEach((s,i)=>{if(!s.mobile)return;let num=s.mobile.replace(/[^0-9]/g,'');if(num.startsWith('0'))num='88'+num;setTimeout(()=>window.open('https://wa.me/'+num+'?text='+encodeURIComponent(msg+' - '+s.name),'_blank'),i*800);});}
function addStu(){let n=document.getElementById('sn').value.trim(),r=document.getElementById('sr').value.trim(),m=document.getElementById('sm').value.trim();if(!n||!r)return alert('নাম রোল দিন');students.push({name:n,roll:r,mobile:m,present:true});localStorage.setItem('students_v2',JSON.stringify(students));location.reload();}
function showStu(){let h='';students.forEach((s,i)=>{let bg=s.present?'#dcfce7':'#fee2e2';let icon=s.present?'✅':'❌';h+='<div style="display:flex;justify-content:space-between;align-items:center;background:'+bg+';padding:8px 10px;border-radius:20px;margin:4px 0"><span>'+(i+1)+'. '+s.name+' ('+s.roll+')</span><span><button onclick="tp('+i+')" style="background:'+(s.present?'#16a34a':'#dc2626')+';color:#fff;border:none;padding:6px 12px;border-radius:20px">'+icon+'</button> <button onclick="ds('+i+')" style="background:#fff;border:1px solid #ccc;padding:6px 10px;border-radius:20px">🗑️</button></span></div>';});let el=document.getElementById('sList');if(el)el.innerHTML=h||'কেউ নেই';renderHeaderCounts();}
function tp(i){students[i].present=!students[i].present;localStorage.setItem('students_v2',JSON.stringify(students));let now=new Date();let monthStr=now.toISOString().slice(0,7);let day=now.getDate();let data=JSON.parse(localStorage.getItem('monthly31Data')||'{}');let k=monthStr+'_'+i+'_'+day;data[k]=students[i].present;localStorage.setItem('monthly31Data',JSON.stringify(data));showStu();renderMonth();if(activeTab)renderTab();}
function ds(i){if(confirm('ডিলিট?')){students.splice(i,1);localStorage.setItem('students_v2',JSON.stringify(students));location.reload();}}
function renderMonth(){let mp=document.getElementById('mp');if(!mp)return;let month=mp.value;let data=JSON.parse(localStorage.getItem('monthly31Data')||'{}');let now=new Date();let todayMonth=now.toISOString().slice(0,7);let todayDay=now.getDate();let html='<table border=1 style="width:100%;border-collapse:collapse;font-size:10px;min-width:900px;text-align:center"><tr style="background:#1976d2;color:#fff"><th>নাম</th>';for(let d=1;d<=31;d++){let isToday=(month===todayMonth&&d===todayDay);html+='<th style="'+(isToday?'background:#ffcc00;color:#000':'')+'">'+d+'</th>';}html+='</tr>';students.forEach((s,idx)=>{html+='<tr><td style="text-align:left">'+s.name+'</td>';for(let d=1;d<=31;d++){let k=month+'_'+idx+'_'+d;let v=data[k];if(v===undefined&&month===todayMonth&&d===todayDay){v=s.present;data[k]=v;localStorage.setItem('monthly31Data',JSON.stringify(data));}let bg=v===true?'background:#dcfce7':v===false?'background:#ffebee':'';let isToday=(month===todayMonth&&d===todayDay);if(isToday)bg+=';border:2px solid #ff9800';html+='<td onclick="togglePA('+idx+','+d+')" style="cursor:pointer;'+bg+'">'+(v===true?'P':v===false?'A':'')+'</td>';}html+='</tr>';});html+='</table>';document.getElementById('monthTbl').innerHTML=html;}
function togglePA(idx,d){let month=document.getElementById('mp').value;let data=JSON.parse(localStorage.getItem('monthly31Data')||'{}');let k=month+'_'+idx+'_'+d;data[k]=data[k]===true?false:data[k]===false?null:true;if(data[k]===null)delete data[k];localStorage.setItem('monthly31Data',JSON.stringify(data));renderMonth();}
function chSub(n){let c=parseInt(document.getElementById('sc').value)||3;c+=n;if(c<1)c=1;if(c>10)c=10;document.getElementById('sc').value=c;}
function getGPA(p){if(p>=80)return 5.00;if(p>=70)return 4.00;if(p>=60)return 3.50;if(p>=50)return 3.00;if(p>=40)return 2.00;if(p>=33)return 1.00;return 0.00;}
function makeSheet(){let cnt=parseInt(document.getElementById('sc')?.value)||3;if(students.length==0){alert('আগে শিক্ষার্থী যোগ করুন!');return;}let subs=saved?.subjects||[{name:'বাংলা',full:100},{name:'ইংরেজি',full:100},{name:'গণিত',full:100}];let head='<tr><th>রোল</th><th>নাম</th>';for(let i=0;i<cnt;i++)head+='<th><input id="sn'+i+'" value="'+(subs[i]?.name||'বি'+(i+1))+'" class="subName"></th>';head+='<th style="background:#1e3a8a">মোট</th><th style="background:#1e3a8a">%</th><th style="background:#1e3a8a">GPA</th></tr>';let fullRow='<tr style="background:#fffbeb"><td colspan="2" style="font-weight:700">পূর্ণমান</td>';for(let i=0;i<cnt;i++)fullRow+='<td><input id="sf'+i+'" type="number" value="'+(subs[i]?.full||100)+'" class="subFull" oninput="calcAll()"></td>';fullRow+='<td id="fullTot">0</td><td>-</td><td>-</td></tr>';document.getElementById('rh').innerHTML=head+fullRow;let body='';students.forEach((s,idx)=>{body+='<tr><td style="font-weight:700;background:#f8fafc">'+s.roll+'</td><td style="text-align:left;font-weight:700;background:#f8fafc">'+s.name+'</td>';for(let j=0;j<cnt;j++){let old=saved?.marks?.[idx]?.[j]||'';body+='<td><input id="m_'+idx+'_'+j+'" type="number" value="'+old+'" class="markGol" oninput="calcAll()"></td>';}body+='<td id="tot_'+idx+'" style="font-weight:700;background:#e0f2fe">0</td><td id="per_'+idx+'" style="font-weight:700;background:#fef3c7">0%</td><td id="gpa_'+idx+'" style="font-weight:700;background:#dcfce7">0.00</td></tr>';});document.getElementById('rb').innerHTML=body;applyLock();calcAll();}
function calcAll(){let cnt=parseInt(document.getElementById('sc').value)||3;let totalFull=0;for(let i=0;i<cnt;i++)totalFull+=parseInt(document.getElementById('sf'+i)?.value||0);let ft=document.getElementById('fullTot');if(ft)ft.innerText=totalFull;students.forEach((_,idx)=>{let sum=0;for(let j=0;j<cnt;j++)sum+=parseInt(document.getElementById('m_'+idx+'_'+j)?.value||0);let per=totalFull>0?(sum*100/totalFull):0;let gpa=getGPA(per);let t=document.getElementById('tot_'+idx);if(t)t.innerText=sum;let p=document.getElementById('per_'+idx);if(p)p.innerText=per.toFixed(1)+'%';let g=document.getElementById('gpa_'+idx);if(g)g.innerText=gpa.toFixed(2);});}
function applyLock(){let locked=localStorage.getItem('fullResultSheetLocked')=='true';document.querySelectorAll('#rh input,#rb input,#sc').forEach(el=>{el.disabled=locked;});let b=document.getElementById('lockB');if(b)b.innerHTML=locked?'<span style="background:#dc2626;color:#fff;padding:4px 10px;border-radius:8px;font-size:11px">🔒 লক</span>':'<span style="background:#16a34a;color:#fff;padding:4px 10px;border-radius:8px;font-size:11px">✏️ খোলা</span>';}
function saveRes(){let cnt=parseInt(document.getElementById('sc').value)||3;let subs=[];for(let i=0;i<cnt;i++)subs.push({name:document.getElementById('sn'+i).value,full:document.getElementById('sf'+i).value});let marks=[];students.forEach((_,idx)=>{let r=[];for(let j=0;j<cnt;j++)r.push(document.getElementById('m_'+idx+'_'+j).value);marks.push(r);});localStorage.setItem('fullResultSheet',JSON.stringify({subjects:subs,marks:marks}));localStorage.setItem('fullResultSheetLocked','true');saved=JSON.parse(localStorage.getItem('fullResultSheet'));document.getElementById('st').innerText='🔒 সেভ - PDF এ মার্ক সহ আসবে';applyLock();}
function unlockRes(){localStorage.setItem('fullResultSheetLocked','false');document.getElementById('st').innerText='✏️ এডিট খোলা';applyLock();}

// === PDF + EXCEL A4 ফাইনাল ===
function expExcel(){
 let cnt=parseInt(document.getElementById('sc').value)||3;
 let sess=JSON.parse(localStorage.getItem('takrim_session')||'null');
 let header=['রোল','নাম']; for(let i=0;i<cnt;i++) header.push(document.getElementById('sn'+i)?.value||'বি'+(i+1)); header.push('মোট','%','GPA');
 let rows=[]; students.forEach((s,idx)=>{ let r=[s.roll,s.name]; let sum=0,totalFull=0; for(let j=0;j<cnt;j++){ let m=parseInt(document.getElementById('m_'+idx+'_'+j)?.value||0); totalFull+=parseInt(document.getElementById('sf'+j)?.value||0); sum+=m; r.push(m); } let per=totalFull? (sum*100/totalFull).toFixed(1)+'%':'0%'; let gpa=getGPA(totalFull? sum*100/totalFull:0).toFixed(2); r.push(sum,per,gpa); rows.push(r); });
 let ws=XLSX.utils.aoa_to_sheet([[sess?.inst?.bnName||''],[sess?.inst?.enName||''],['Mobile: '+(sess?.inst?.mobile||'')+' | EIIN: '+(sess?.inst?.eiin||'')],[],header,...rows]);
 ws['!margins']={left:0.4,right:0.4,top:0.5,bottom:0.5,header:0.3,footer:0.3};
 ws['!pageSetup']={paperSize:9,orientation:'landscape',fitToWidth:1,fitToHeight:0};
 ws['!cols']=[{wch:8},{wch:20}];
 let wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Result A4'); XLSX.writeFile(wb,'Result_A4_'+(sess?.inst?.bnName||'')+'.xlsx');
}

async function downPDF(){
 let area=document.getElementById('pdfArea');
 let pad=document.getElementById('institutePadFull');
 let st=document.getElementById('st');
 let hasMark=false; document.querySelectorAll('.markGol').forEach(i=>{if(i.value) hasMark=true;});
 if(!hasMark){ alert('আগে মার্ক লিখে সেভ লক করুন'); return; }
 if(st) st.innerText='⏳ PDF A4 বানাচ্ছি...';
 let wrap=document.createElement('div'); wrap.style.background='#fff'; wrap.style.padding='10px'; wrap.style.width='1123px';
 let padClone=pad.cloneNode(true); padClone.style.maxWidth='100%'; padClone.style.border='1px solid #999';
 wrap.appendChild(padClone);
 let clone=area.cloneNode(true);
 clone.querySelectorAll('input').forEach(inp=>{ let div=document.createElement('div'); div.textContent=inp.value||'-'; div.style.cssText='display:inline-block;min-width:60px;height:32px;line-height:32px;border-radius:6px;text-align:center;font-weight:700;margin:2px;border:1px solid #999;background:#fff'; if(inp.className.includes('subName')) div.style.background='#e8f5e9'; if(inp.className.includes('subFull')) div.style.background='#fffbeb'; inp.parentNode.replaceChild(div, inp); });
 wrap.appendChild(clone);
 document.body.appendChild(wrap); wrap.style.position='fixed'; wrap.style.left='-9999px';
 let canvas=await html2canvas(wrap,{scale:2,useCORS:true,backgroundColor:'#fff'});
 document.body.removeChild(wrap);
 let img=canvas.toDataURL('image/png');
 let {jsPDF}=window.jspdf; let pdf=new jsPDF('l','mm','a4');
 let pw=pdf.internal.pageSize.getWidth()-10; let ph=canvas.height*pw/canvas.width;
 let totalH=ph; let y=5;
 pdf.addImage(img,'PNG',5,y,pw,ph);
 pdf.save('Result_A4_'+new Date().toISOString().slice(0,10)+'.pdf');
 if(st) st.innerText='✅ PDF A4 প্যাড সহ ডাউনলোড';
}
