<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>MALEK FINAL - ONE FILE</title><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;font-family:'Hind Siliguri',sans-serif}body{margin:0;background:#082a1e;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:10px}
.main-banner{width:380px;max-width:95%;border:4px solid #ffcc00;border-radius:22px;overflow:hidden;margin-top:10px;background:#000;line-height:0}.main-banner img{width:100%;display:block;height:auto;object-fit:contain;background:#000}
.green-box{width:380px;max-width:95%;background:#16a34a;border-radius:16px;padding:12px;margin-top:25px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.3)}.green-box span{background:#000;color:#fff;display:inline-block;padding:8px 22px;border-radius:30px;font-weight:700;font-size:18px}
.card{background:#fff;margin-top:12px;border-radius:24px;padding:16px;width:100%;max-width:430px;padding-bottom:30px;margin-bottom:10px}.menu{width:100%;max-width:430px;background:#fff;border:none;border-radius:16px;padding:16px;font-size:17px;font-weight:700;color:#0d5bff;margin-top:12px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}.hidden{display:none!important}.btn{width:100%;padding:14px;border:none;border-radius:14px;font-size:17px;font-weight:700;cursor:pointer;margin-top:8px}.green{background:#0a7a42;color:#fff}.blue{background:#0d5bff;color:#fff}.red{background:#d61f1f;color:#fff}input,select,textarea{width:100%;padding:12px;border-radius:12px;border:1.8px solid #d1d5db;margin:5px 0}
.pad-wrap{width:100%;max-width:430px;background:#fff;border-radius:22px;padding:12px;box-shadow:0 4px 15px rgba(0,0,0,.3);border:3px solid #ffcc00}
.pad-top{display:flex;gap:12px;align-items:center}.pad-logo{width:68px;height:68px;border-radius:50%;border:3px solid #ffcc00;object-fit:cover}
.login-info{background:#e3f2fd;border-radius:10px;padding:10px;margin:12px 0 15px 0;font-size:13px;line-height:20px;width:100%;max-width:430px;text-align:center}
.accordion{width:100%;max-width:430px;margin-bottom:10px;border-radius:12px;overflow:hidden;background:white;box-shadow:0 2px 6px rgba(0,0,0,0.1)}
.acc-header{background:#1976d2;color:white;padding:14px 15px;font-size:16px;font-weight:bold;display:flex;justify-content:space-between;cursor:pointer}
.acc-body{display:none;padding:12px;background:#fafafa}.acc-body.active{display:block}
.student-item{display:flex;justify-content:space-between;background:white;padding:8px;border-radius:6px;margin:5px 0;border:1px solid #ddd}
</style></head><body>

<!-- ========== প্রথম পাতা ========== -->
<div id="firstPage" style="width:100%;display:flex;flex-direction:column;align-items:center">
<div class="main-banner"><img id="mainBannerImg" src="IMG-20261005-WA0019(3).jpg" onerror="this.src='https://via.placeholder.com/400x220?text=MALEK+ATTENDANCE'"></div>
<div class="green-box"><span>প্রাথমিক বিদ্যালয় হাজিরা</span></div>
<button class="menu" onclick="document.getElementById('formBox').classList.toggle('hidden')">🏫 প্রতিষ্ঠান ফরম <span>▼</span></button>
<div id="formBox" class="card hidden"><div style="text-align:center"><img id="logoPreview" src="IMG-20261005-WA0019(3).jpg" style="width:84px;height:84px;border-radius:50%;border:3px solid #ffcc00;object-fit:cover" onerror="this.src='https://via.placeholder.com/80'"><br><button onclick="logoInput.click()" style="background:#ffcc00;border:none;padding:8px 14px;border-radius:10px;font-weight:700;margin:8px 0">🖼️ লোগো চেঞ্জ</button><input type="file" id="logoInput" accept="image/*" style="display:none"></div><input id="bnName" placeholder="প্রতিষ্ঠানের নাম"><input id="address" placeholder="ঠিকানা"><div style="display:flex;gap:6px"><input id="eiin" placeholder="EIIN"><input id="schoolCode" placeholder="Code"></div><div style="display:flex;gap:6px"><input id="mobile" placeholder="মোবাইল"><input id="email" placeholder="Email"></div><input id="pass1" type="password" placeholder="পাসওয়ার্ড"><button class="btn green" onclick="savePrimary()">সেভ করুন ✅</button></div>
<button class="menu" onclick="document.getElementById('loginBox').classList.toggle('hidden')">🔐 লগইন <span>▼</span></button>
<div id="loginBox" class="card hidden"><select id="loginInst"></select><div style="display:flex;gap:6px"><select id="shift"><option>🌅 প্রভাতি</option><option>দিবা</option></select><select id="cls"><option>১ম শ্রেণি</option><option>২য় শ্রেণি</option><option>৩য় শ্রেণি</option><option>৪র্থ শ্রেণি</option><option>৫ম শ্রেণি</option></select><select id="section"><option>ক</option><option>খ</option></select></div><input id="loginPass" type="password" placeholder="পাসওয়ার্ড"><button class="btn blue" onclick="primaryLogin()">🔒 প্রবেশ করুন</button><p id="loginMsg" style="color:red;text-align:center"></p></div>
<button class="menu" onclick="document.getElementById('listBox').classList.toggle('hidden')">🔒 তালিকা <span>▼</span></button>
<div id="listBox" class="card hidden"><button class="btn red" onclick="openListSecure()">🔓 তালিকা খুলুন</button><div id="instList" style="margin-top:10px"></div></div>
</div>

<!-- ========== দ্বিতীয় পাতা - একই ফাইলে ========== -->
<div id="secondPage" class="hidden" style="width:100%;display:flex;flex-direction:column;align-items:center">
<div class="pad-wrap" id="institutePad">
  <div class="pad-top">
    <img id="padLogo" class="pad-logo" src="IMG-20261005-WA0019(3).jpg">
    <div>
      <div id="instName" style="font-size:18px;font-weight:700;color:#1e293b">প্রতিষ্ঠান</div>
      <div id="instAddress" style="font-size:12px;color:#555"></div>
      <div style="font-size:13px;font-weight:700">EIIN: <b id="padEiin"></b> | Code: <b id="padCode"></b></div>
    </div>
  </div>
  <div id="classLine" style="background:#0a2e1c;color:#fff;text-align:center;padding:12px;border-radius:16px;margin-top:10px;font-size:16px;font-weight:700"></div>
</div>
<div class="login-info" id="loginInfo">👤 লগইন: সক্রিয় আছে - আলহামদুলিল্লাহ</div>
<div id="accordionContainer" style="width:100%;display:flex;flex-direction:column;align-items:center"></div>
<div style="width:100%;max-width:430px"><button onclick="showFirstPage()" style="width:100%;padding:12px;border:none;border-radius:14px;background:#fff;font-weight:700;margin-top:10px">⬅️ প্রথম পাতায় ফিরে যান</button></div>
</div>

<script>
// প্রথম পাতার স্ক্রিপ্ট - তোমার দেওয়া, কোনো পরিবর্তন নাই
let insts=JSON.parse(localStorage.getItem('takrim_primary_insts')||'[]');let tempLogo=localStorage.getItem('takrim_temp_logo')||'';
function refreshInstSelect(){document.getElementById('loginInst').innerHTML='<option value="">প্রতিষ্ঠান নির্বাচন</option>'+insts.map((x,i)=>`<option value="${i}">${x.bnName}</option>`).join('')}refreshInstSelect();
document.getElementById('logoInput').addEventListener('change',function(){if(this.files&&this.files[0]){let r=new FileReader();r.onload=e=>{tempLogo=e.target.result;document.getElementById('logoPreview').src=tempLogo;document.getElementById('mainBannerImg').src=tempLogo;localStorage.setItem('takrim_temp_logo',tempLogo)};r.readAsDataURL(this.files[0])}});
function savePrimary(){let obj={bnName:document.getElementById('bnName').value.trim(),addr:document.getElementById('address').value.trim(),eiin:document.getElementById('eiin').value.trim(),schoolCode:document.getElementById('schoolCode').value.trim(),mobile:document.getElementById('mobile').value.trim(),email:document.getElementById('email').value.trim(),pass:document.getElementById('pass1').value,logo:tempLogo||'IMG-20261005-WA0019(3).jpg'};if(!obj.bnName||!obj.pass) return alert('নাম ও পাস দিন');insts.push(obj);localStorage.setItem('takrim_primary_insts',JSON.stringify(insts));localStorage.removeItem('takrim_temp_logo');alert('✅ সেভ');location.reload();}
function openListSecure(){let a=prompt('এডমিন নাম');let p=prompt('পাস');if(a!=='malek'||p!=='takrim2022')return alert('ভুল');document.getElementById('instList').innerHTML=insts.map((s,i)=>`<div style="display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #eee"><div><img src="${s.logo}" style="width:28px;height:28px;border-radius:50%"> <b>${s.bnName}</b></div><button onclick="insts.splice(${i},1);localStorage.setItem('takrim_primary_insts',JSON.stringify(insts));refreshInstSelect();openListSecure()" style="background:#fee2e2;border:none;padding:6px;border-radius:6px">🗑️</button></div>`).join('')}
let saved=localStorage.getItem('takrim_temp_logo');if(saved){document.getElementById('logoPreview').src=saved;document.getElementById('mainBannerImg').src=saved}

// লগইন - এখানে শুধু সংযোজন: second-page এ না গিয়ে একই ফাইলে খুলবে
function primaryLogin(){
  let idx=document.getElementById('loginInst').value;
  if(idx==="")return document.getElementById('loginMsg').textContent='প্রতিষ্ঠান নির্বাচন';
  let ins=insts[idx];
  if(document.getElementById('loginPass').value!==ins.pass)return document.getElementById('loginMsg').textContent='❌ ভুল';
  let sess={inst:ins,cls:document.getElementById('cls').value,shift:document.getElementById('shift').value,section:document.getElementById('section').value};
  localStorage.setItem('takrim_session',JSON.stringify(sess));
  // প্যাড শ্রেণী অটো বসানো
  document.getElementById('instName').innerText = ins.bnName;
  document.getElementById('instAddress').innerText = ins.addr || 'ঠিকানা পাওয়া যায়নি';
  document.getElementById('padEiin').innerText = ins.eiin;
  document.getElementById('padCode').innerText = ins.schoolCode;
  document.getElementById('padLogo').src = ins.logo;
  document.getElementById('classLine').innerText = `শ্রেণী: ${sess.cls} | শাখা: ${sess.section} | শিফট: ${sess.shift}`;
  document.getElementById('loginInfo').innerHTML = `🏫 <b>${ins.bnName}</b> | 📚 ${sess.cls} | শাখা: ${sess.section} | শিফট: ${sess.shift} | ✅ সক্রিয়`;
  // পাতা বদল
  document.getElementById('firstPage').classList.add('hidden');
  document.getElementById('secondPage').classList.remove('hidden');
  initSecondPage();
}
function showFirstPage(){document.getElementById('secondPage').classList.add('hidden');document.getElementById('firstPage').classList.remove('hidden');}

// দ্বিতীয় পাতার স্ক্রিপ্ট - তোমার দেওয়া, কোনো পরিবর্তন নাই, শুধু ফাংশনে ভরলাম
let students = JSON.parse(localStorage.getItem('students')||'[{"name":"কালাম","roll":"202","present":true},{"name":"কমল","roll":"203","present":false},{"name":"সাকিব","roll":"204","present":true}]');
let savedResult = JSON.parse(localStorage.getItem('fullResultSheet')||'null');
function initSecondPage(){
  const steps = [
    {title:'1️⃣ শিক্ষার্থী যোগ করুন', content:`<input id="sName" placeholder="শিক্ষার্থীর নাম" style="width:100%;margin:5px 0"><input id="sRoll" placeholder="রোল" style="width:100%;margin:5px 0"><button class="btn" style="background:#2e7d32" onclick="addStudent()">+ যোগ করুন</button>`},
    {title:`2️⃣ 📋 শিক্ষার্থীর তালিকা দেখুন`, content:`<div id="studentList"></div>`},
    {title:'3️⃣ ✅ উপস্থিত দেখুন', content:`<div id="presentList"></div><button class="btn" style="background:#2e7d32" onclick="sendWA('present')">📱 WhatsApp</button>`},
    {title:'4️⃣ ❌ অনুপস্থিত দেখুন', content:`<div id="absentList"></div><button class="btn" style="background:#2e7d32" onclick="sendWA('absent')">📱 WhatsApp</button>`},
    {title:'5️⃣ 📢 নোটিশ বোর্ড', content:`<textarea id="noticeText" rows="3" placeholder="নোটিশ লিখুন..." style="width:100%"></textarea><button class="btn" style="background:#ef6c00" onclick="saveNotice()">সেভ</button>`},
    {title:'6️⃣ 📅 মাসিক হাজিরা দেখুন (১-৩১)', content:`<div style="background:white;padding:8px;border-radius:10px"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap"><label><b>মাস:</b> <input type="month" id="monthPicker" value="${new Date().toISOString().slice(0,7)}" onchange="renderMonthly()" style="padding:6px;border-radius:6px;border:2px solid #1976d2"></label><div><button class="btn" style="background:#1565c0" onclick="window.print()">🖨️ প্রিন্ট</button><button class="btn" style="background:#c62828" onclick="deleteMonthly31()">🗑️ ডিলিট</button></div></div><div id="monthlyTable" style="margin-top:10px"></div></div>`},
    {title:'7️⃣ 🔽 ফলাফল দেখুন', content:`<div id="resultSheetBox" style="background:white;padding:10px;border-radius:12px;border:2px solid #7c4dff"><h3 style="color:#6a1b9a">📋 ফলাফল সিট</h3><div style="display:flex;gap:6px;align-items:center;margin:10px 0;flex-wrap:wrap"><span style="background:#eee;padding:6px 10px;border-radius:20px;font-weight:bold">বিষয় সংখ্যা:</span><button onclick="changeSub(-1)" style="background:#2e7d32;color:white;border:none;width:32px;height:32px;border-radius:50%">-</button><input id="subCount" type="number" value="5" min="1" max="12" style="width:60px;text-align:center;padding:6px;border:2px solid #7c4dff;border-radius:8px"><button onclick="changeSub(1)" style="background:#2e7d32;color:white;border:none;width:32px;height:32px;border-radius:50%">+</button><button onclick="makeResultSheet()" style="background:#7c4dff;color:white;border:none;padding:6px 12px;border-radius:6px">✅ সেট করুন</button></div><div id="subjectEdit" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px"></div><div style="overflow:auto;border:1px solid #ddd;border-radius:8px"><table id="resultTable" border="1" style="width:100%;border-collapse:collapse;font-size:12px;text-align:center"><thead id="resultHead" style="background:#1b5e20;color:white"></thead><tbody id="resultBody"></tbody></table></div><div style="margin-top:12px;display:flex;gap:6px;flex-wrap:wrap"><button style="background:#2e7d32;color:white;padding:10px 18px;border-radius:8px;border:none;font-weight:bold" onclick="saveAllResult()">💾 সব সেভ করুন</button><button style="background:#1565c0;color:white;padding:10px 14px;border-radius:8px;border:none" onclick="calcAllResult()">🔄 হিসাব করুন</button><button style="background:#c62828;color:white;padding:10px 14px;border-radius:8px;border:none" onclick="deleteResult()">🗑️ ডিলিট</button></div><p id="saveStatus" style="margin-top:8px;color:green;font-weight:bold"></p></div>`}
  ];
  const container = document.getElementById('accordionContainer');
  container.innerHTML='';
  steps.forEach((step,i)=>{ container.innerHTML+=`<div class="accordion"><div class="acc-header" onclick="toggleAcc(${i})"><span>${step.title}</span><span id="arrow${i}">▼</span></div><div class="acc-body" id="accBody${i}">${step.content}</div></div>`; });
}
function toggleAcc(i){
  const body=document.getElementById('accBody'+i); const arrow=document.getElementById('arrow'+i);
  const isOpen=body.classList.contains('active');
  document.querySelectorAll('.acc-body').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('[id^=arrow]').forEach(a=>a.innerText='▼');
  if(!isOpen){ body.classList.add('active'); arrow.innerText='▲';
    if(i==1) renderStudents(); if(i==2) renderPresent(); if(i==3) renderAbsent(); if(i==5) renderMonthly(); if(i==6) makeResultSheet();
  }
}
function addStudent(){ const n=document.getElementById('sName').value, r=document.getElementById('sRoll').value; if(!n) return alert('নাম দিন'); students.push({name:n,roll:r,present:true}); localStorage.setItem('students',JSON.stringify(students)); location.reload(); }
function renderStudents(){ let h=''; students.forEach((s,idx)=>{ h+=`<div class="student-item"><span>${s.roll}. ${s.name}</span><span><button onclick="togglePresent(${idx})">${s.present?'✅':'❌'}</button> <button onclick="delStu(${idx})">🗑️</button></span></div>`}); document.getElementById('studentList').innerHTML=h; }
function renderPresent(){ document.getElementById('presentList').innerHTML=students.filter(s=>s.present).map(s=>`✅ ${s.name}`).join('<br>')||'কেউ নেই'; }
function renderAbsent(){ document.getElementById('absentList').innerHTML=students.filter(s=>!s.present).map(s=>`❌ ${s.name}`).join('<br>')||'সবাই উপস্থিত'; }
function togglePresent(i){ students[i].present=!students[i].present; localStorage.setItem('students',JSON.stringify(students)); renderStudents(); }
function delStu(i){ if(confirm('ডিলিট?')){ students.splice(i,1); localStorage.setItem('students',JSON.stringify(students)); location.reload(); } }
function saveNotice(){ localStorage.setItem('notice',document.getElementById('noticeText').value); alert('সেভ হয়েছে'); }
function sendWA(t){ let m=t=='present'?students.filter(s=>s.present).map(s=>s.name).join(','):students.filter(s=>!s.present).map(s=>s.name).join(','); window.open(`https://wa.me/?text=${encodeURIComponent(m)}`,'_blank'); }
function renderMonthly(){
  const month = document.getElementById('monthPicker')?.value || new Date().toISOString().slice(0,7);
  let monthlyData = JSON.parse(localStorage.getItem('monthly31Data')||'{}');
  let html = '<div style="overflow:auto;max-height:420px;border:1px solid #ddd;border-radius:8px"><table border="1" style="width:100%;border-collapse:collapse;text-align:center;font-size:12px;min-width:1100px"><tr style="background:#1976d2;color:white;position:sticky;top:0;z-index:3"><th style="position:sticky;left:0;background:#1976d2;z-index:4;min-width:45px">রোল</th><th style="position:sticky;left:45px;background:#1976d2;z-index:4;min-width:85px">নাম</th>';
  for(let i=1;i<=31;i++) html+=`<th style="min-width:32px">${i}</th>`;
  html+='<th style="background:#2e7d32;min-width:50px">উপস্থিত</th><th style="background:#c62828;min-width:55px">অনুপস্থিত</th></tr>';
  students.forEach((s, idx)=>{
    html+=`<tr><td style="position:sticky;left:0;background:white;font-weight:bold;z-index:2">${s.roll}</td><td style="position:sticky;left:45px;background:white;text-align:left;padding-left:4px;z-index:2">${s.name}</td>`;
    for(let d=1; d<=31; d++){
      const key = `${month}_${idx}_${d}`;
      const checked = monthlyData[key]!== false? 'checked' : '';
      html+=`<td><input type="checkbox" id="d_${idx}_${d}" ${checked} style="width:18px;height:18px" onchange="autoSave31(${idx},${d})"></td>`;
    }
    html+=`<td id="present_${idx}" style="background:#e8f5e9;font-weight:bold;color:green">0</td><td id="absent_${idx}" style="background:#ffebee;font-weight:bold;color:red">0</td></tr>`;
  });
  html+='</table></div>';
  document.getElementById('monthlyTable').innerHTML = html;
  students.forEach((_, idx)=> calcTotal31(idx));
}
function autoSave31(idx, day){
  const month = document.getElementById('monthPicker')?.value || new Date().toISOString().slice(0,7);
  let data = JSON.parse(localStorage.getItem('monthly31Data')||'{}');
  data[`${month}_${idx}_${day}`] = document.getElementById(`d_${idx}_${day}`).checked;
  localStorage.setItem('monthly31Data', JSON.stringify(data));
  calcTotal31(idx);
}
function calcTotal31(idx){
  let present=0; for(let d=1; d<=31; d++) if(document.getElementById(`d_${idx}_${d}`)?.checked) present++;
  document.getElementById(`present_${idx}`).innerText = present;
  document.getElementById(`absent_${idx}`).innerText = 31 - present;
}
function deleteMonthly31(){
  if(confirm('১-৩১ তারিখের সব হাজিরা মুছবেন?')){
    const month = document.getElementById('monthPicker')?.value || new Date().toISOString().slice(0,7);
    let data = JSON.parse(localStorage.getItem('monthly31Data')||'{}');
    students.forEach((_, idx)=>{ for(let d=1; d<=31; d++) delete data[`${month}_${idx}_${d}`]; });
    localStorage.setItem('monthly31Data', JSON.stringify(data));
    renderMonthly();
  }
}
function changeSub(n){ let c=parseInt(document.getElementById('subCount').value)||5; c+=n; if(c<1)c=1; if(c>12)c=12; document.getElementById('subCount').value=c; }
function makeResultSheet(){
  const finalCount=parseInt(document.getElementById('subCount').value)||5;
  let subjects=savedResult?.subjects||[];
  let editHtml=''; for(let i=0;i<finalCount;i++){ const s=subjects[i]||{name:`বিষয় ${i+1}`,full:100}; editHtml+=`<div style="background:#f3e5f5;padding:5px;border-radius:6px;display:flex;gap:4px"><input id="sname${i}" value="${s.name}" style="width:85px;padding:4px;border-radius:4px;border:1px solid #ccc"><input id="sfull${i}" type="number" value="${s.full}" style="width:60px;padding:4px;border-radius:4px;border:1px solid #ccc"></div>`; }
  document.getElementById('subjectEdit').innerHTML=editHtml;
  let head='<tr><th>রোল</th><th>নাম</th>'; for(let i=0;i<finalCount;i++) head+=`<th>বিষয় ${i+1}</th>`; head+='<th>পূর্ণ</th><th>প্রাপ্ত</th><th>%</th><th>GPA</th><th>গড়</th></tr>'; document.getElementById('resultHead').innerHTML=head;
  let body=''; students.forEach((stu,idx)=>{ body+=`<tr><td>${stu.roll}</td><td style="text-align:left">${stu.name}</td>`; for(let j=0;j<finalCount;j++){ const old=savedResult?.marks?.[idx]?.[j]||''; body+=`<td><input id="mark_${idx}_${j}" type="number" value="${old}" style="width:58px;text-align:center;border:1.5px dashed #4caf50;padding:5px;border-radius:5px"></td>`; } body+=`<td id="full_${idx}">-</td><td id="obt_${idx}">-</td><td id="per_${idx}">-</td><td id="gpa_${idx}">-</td><td id="avg_${idx}">-</td></tr>`; }); document.getElementById('resultBody').innerHTML=body;
  if(savedResult) calcAllResult();
}
function calcAllResult(){
  const count=parseInt(document.getElementById('subCount').value)||5;
  students.forEach((_,idx)=>{ let fullT=0,obtT=0; for(let j=0;j<count;j++){ fullT+=parseInt(document.getElementById(`sfull${j}`)?.value)||0; obtT+=parseInt(document.getElementById(`mark_${idx}_${j}`)?.value)||0; } const per=fullT?Math.round(obtT/fullT*100):0; const avg=count?Math.round(obtT/count):0; let gpa='F'; if(per>=80)gpa='5.00'; else if(per>=70)gpa='4.00'; else if(per>=60)gpa='3.50'; else if(per>=50)gpa='3.00'; else if(per>=40)gpa='2.00'; else if(per>=33)gpa='1.00'; document.getElementById(`full_${idx}`).innerText=fullT; document.getElementById(`obt_${idx}`).innerText=obtT; document.getElementById(`per_${idx}`).innerText=per+'%'; document.getElementById(`avg_${idx}`).innerText=avg; document.getElementById(`gpa_${idx}`).innerText=gpa; });
}
function saveAllResult(){
  const count=parseInt(document.getElementById('subCount').value)||5;
  let subjects=[]; for(let i=0;i<count;i++) subjects.push({name:document.getElementById(`sname${i}`).value, full:document.getElementById(`sfull${i}`).value});
  let marks=[]; students.forEach((_,idx)=>{ let row=[]; for(let j=0;j<count;j++) row.push(document.getElementById(`mark_${idx}_${j}`).value); marks.push(row); });
  savedResult={subjects,marks,count}; localStorage.setItem('fullResultSheet',JSON.stringify(savedResult)); calcAllResult(); document.getElementById('saveStatus').innerText='✅ আলহামদুলিল্লাহ সেভ হয়েছে';
}
function deleteResult(){ if(confirm('সব ফলাফল মুছবেন?')){ localStorage.removeItem('fullResultSheet'); savedResult=null; makeResultSheet(); } }
</script></body></html>
