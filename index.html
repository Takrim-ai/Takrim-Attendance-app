<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Final Student Add</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Hind Siliguri',sans-serif;margin:0}
body{background:#0f2f1f;padding:10px}
.card{background:#fff;border-radius:18px;padding:10px;max-width:1100px;margin:auto}
.add{width:100%;border:2.5px dashed #16a34a;background:#f6fef8;border-radius:14px;padding:14px;font-weight:700;font-size:18px;cursor:pointer}
.stats3{display:flex;gap:8px;margin:10px 0}
.stats3 div{flex:1;border-radius:14px;padding:10px;text-align:center;font-weight:700;color:#fff}
.s-y{background:#ffcc00;color:#000}.s-g{background:#16a34a}.s-r{background:#ef4444}
.resBtn{width:100%;background:#16a34a;color:#fff;border:none;border-radius:12px;padding:12px;font-weight:700;font-size:17px;margin-bottom:10px}
.box{border:2px solid #8b5cf6;border-radius:14px;padding:8px;display:none}
.box.show{display:block}
.topS{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.btnS{background:#7c3aed;color:#fff;border:none;border-radius:10px;padding:6px 8px;font-size:13px;width:60px;font-weight:700}
.inpS{width:60px;border:1.5px solid #ddd;border-radius:8px;padding:5px;text-align:center;font-weight:700}
.wrap{overflow-x:auto;border:2px solid #0f2f1f;border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:1000px}
th{background:#0f2f1f;color:#fff;padding:7px 3px;font-size:13px}
td{border:1px solid #e5e7eb;padding:5px;text-align:center;font-size:13px;font-weight:600}
.pill{background:#fff;border-radius:14px;padding:5px;display:inline-block;min-width:80px;font-size:12px;border:1px solid #eee;cursor:pointer}
.mark{width:65px;height:36px;border:1.8px solid #cbd5e1;border-radius:18px;text-align:center;font-weight:700}
.mark:focus{border-color:#16a34a;background:#f0fdf4;outline:none}
.yellow{background:#fef9c3!important}
.c1{background:#dcfce7!important}.c2{background:#dbeafe!important}.c3{background:#ffedd5!important}.c4{background:#f3e8ff!important}
/* Modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:99}
.modal.show{display:flex}
.modalBox{background:#fff;border-radius:16px;padding:14px;width:92%;max-width:380px}
.modalBox h3{text-align:center;margin-bottom:10px;color:#0f2f1f}
.modalBox input{width:100%;border:2px solid #e5e7eb;border-radius:10px;padding:11px;margin:6px 0;font-size:16px;font-weight:600;outline:none}
.modalBox input:focus{border-color:#16a34a}
.mBtns{display:flex;gap:8px;margin-top:10px}
.mBtns button{flex:1;padding:12px;border-radius:10px;border:none;font-weight:700;color:#fff}
</style>
</head>
<body>
<div class="card">
<button class="add" onclick="openAdd()">+ শিক্ষার্থী যোগ করুন</button>
<div class="stats3">
<div class="s-y">📋 সবাই<br><span id="cAll">0</span></div>
<div class="s-g">✅ উপস্থিত<br><span id="cPre">0</span></div>
<div class="s-r">❌ অনুপস্থিত<br><span id="cAbs">0</span></div>
</div>
<button class="resBtn" onclick="toggleRes()" id="rBtn">🏆 ফলাফল দেখুন ▼</button>
<div class="box" id="rBox">
<div class="topS">
<button class="btnS" onclick="editSubs()">নাম<br>বদলান</button>
<span style="font-weight:700;font-size:13px">বিষয়:</span>
<input class="inpS" id="sc" type="number" onchange="changeCount(this.value)">
</div>
<div class="wrap"><table id="tbl"></table></div>
</div>
</div>

<!-- Add Student Modal with 3 fields -->
<div class="modal" id="modal">
<div class="modalBox">
<h3>👨‍🎓 নতুন শিক্ষার্থী</h3>
<input id="fName" placeholder="নাম * যেমন: কালাম">
<input id="fRoll" placeholder="রোল * যেমন: 202" type="number" inputmode="numeric">
<input id="fMobile" placeholder="মোবাইল নাম্বার * যেমন: 017... " type="tel">
<div class="mBtns">
<button style="background:#6b7280" onclick="closeAdd()">বাতিল</button>
<button style="background:#16a34a" onclick="saveStudent()">✅ যোগ করুন</button>
</div>
</div>
</div>

<script>
let subjects = JSON.parse(localStorage.getItem('subs_final')||'["বাংলা","ইংরেজি","গণিত","বিজ্ঞান","ধর্ম"]');
let students = JSON.parse(localStorage.getItem('studs_final')||'[]');
let showRes=false;

function openAdd(){ document.getElementById('modal').classList.add('show'); document.getElementById('fName').focus(); }
function closeAdd(){ document.getElementById('modal').classList.remove('show'); document.getElementById('fName').value=""; document.getElementById('fRoll').value=""; document.getElementById('fMobile').value=""; }
function saveStudent(){
  let name=document.getElementById('fName').value.trim();
  let roll=document.getElementById('fRoll').value.trim();
  let mobile=document.getElementById('fMobile').value.trim();
  if(!name||!roll||!mobile){ alert("মামা ৩টাই লিখতে হবে: নাম, রোল, মোবাইল"); return; }
  students.push({name, roll, mobile, marks: subjects.map(()=>"")});
  localStorage.setItem('studs_final',JSON.stringify(students));
  closeAdd(); render();
}
function toggleRes(){ showRes=!showRes; document.getElementById('rBox').classList.toggle('show',showRes); document.getElementById('rBtn').textContent=showRes?"🏆 ফলাফল লুকান ▲":"🏆 ফলাফল দেখুন ▼"; if(showRes) render(); }
function changeCount(n){ n=parseInt(n)||1; if(n>10)n=10; if(n>subjects.length){while(subjects.length<n){subjects.push("বিষয় "+(subjects.length+1));}}else{subjects=subjects.slice(0,n);} students.forEach(s=>{ if(s.marks.length<n){while(s.marks.length<n)s.marks.push("");}else s.marks=s.marks.slice(0,n);}); saveAll(); render();}
function editSubs(){ let t=prompt("বিষয় নাম কমা দিয়ে:",subjects.join(", ")); if(!t)return; let a=t.split(",").map(x=>x.trim()).filter(Boolean); if(a.length){subjects=a.slice(0,10); students.forEach(s=>{if(s.marks.length<subjects.length){while(s.marks.length<subjects.length)s.marks.push("");}else s.marks=s.marks.slice(0,subjects.length);}); saveAll(); render();}}
function saveAll(){ localStorage.setItem('subs_final',JSON.stringify(subjects)); localStorage.setItem('studs_final',JSON.stringify(students)); }
function getGPA(p){ if(p>=80) return "5.00"; if(p>=70) return "4.00"; if(p>=60) return "3.50"; if(p>=50) return "3.00"; if(p>=40) return "2.00"; if(p>=33) return "1.00"; return "0.00"; }
function render(){
  document.getElementById('cAll').textContent=students.length;
  document.getElementById('cPre').textContent=students.length;
  document.getElementById('cAbs').textContent=0;
  document.getElementById('sc').value=subjects.length;
  let h=`<tr><th>নাম</th><th>রোল</th><th>মোবাইল</th>`; subjects.forEach((s,i)=>h+=`<th><div class="pill" onclick="let nn=prompt('নতুন নাম',subjects[${i}]); if(nn){subjects[${i}]=nn; saveAll(); render();}">${s}</div></th>`); h+=`<th>মোট</th><th>প্রাপ্ত</th><th>%</th><th>GPA</th></tr>`;
  h+=`<tr><td>পূর্ণমান</td><td></td><td></td>`; subjects.forEach(()=>h+=`<td class="yellow">100</td>`); h+=`<td class="yellow">${subjects.length*100}</td><td>-</td><td>-</td><td>-</td></tr>`;
  students.forEach((st, si)=>{
    let obt=st.marks.reduce((a,b)=>a+(parseInt(b)||0),0); let tot=subjects.length*100; let per=tot?((obt/tot)*100).toFixed(1):0;
    h+=`<tr><td>${st.name}</td><td>${st.roll}</td><td>${st.mobile}</td>`;
    st.marks.forEach((m, mi)=>{ h+=`<td><input class="mark" type="number" value="${m}" oninput="students[${si}].marks[${mi}]=this.value; saveAll(); this.parentElement.nextElementSibling.nextElementSibling.textContent=this.value?'' : '' ; renderCalc()" onfocus="this.select()"></td>`; });
    h+=`<td class="c1">${tot}</td><td class="c2">${obt}</td><td class="c3">${per}%</td><td class="c4">${getGPA(parseFloat(per))}</td></tr>`;
  });
  document.getElementById('tbl').innerHTML=h;
}
function renderCalc(){ /* live calc handled by full render on next type, keep simple */ render(); }
if(students.length==0){ /* demo */ }
render();
</script>
</body>
</html>
