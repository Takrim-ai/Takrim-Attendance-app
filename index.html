<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#082a1e;padding:8px;display:flex;flex-direction:column;align-items:center}.pad-main{width:380px;max-width:95%;border:4px solid #ffcc00;border-radius:22px;overflow:hidden;background:#000;line-height:0}.pad-main img{width:100%;display:block}.green-box{width:380px;max-width:95%;background:#16a34a;border-radius:16px;padding:12px;margin-top:25px;text-align:center}.green-box span{background:#000;color:#fff;display:inline-block;padding:8px 22px;border-radius:30px;font-weight:700;font-size:18px}.card{background:#fff;margin-top:12px;border-radius:24px;padding:16px;width:100%;max-width:430px}.menu{width:100%;max-width:430px;background:#fff;border:none;border-radius:16px;padding:16px;font-weight:700;color:#0d5bff;margin-top:12px;display:flex;justify-content:space-between;cursor:pointer}.hidden{display:none!important}.btn{padding:8px 10px;border:none;border-radius:20px;color:#fff;cursor:pointer;margin:3px;font-weight:bold;font-size:11px}.header3{display:flex;gap:4px;flex-wrap:nowrap;width:100%}.hbox{flex:1 1 0;min-width:0;padding:12px 2px;border-radius:14px;text-align:center;font-weight:bold;font-size:12px;cursor:pointer;border:3px solid transparent;box-shadow:0 2px 4px #0002;line-height:1.3}.hbox.active{border-color:yellow;transform:scale(1.04)}.boxPresent{background:#2e7d32;color:#fff}.boxAbsent{background:#c62828;color:#fff}.boxNotice{background:#ef6c00;color:#fff}.cbox{border-radius:14px;overflow:hidden;background:#fff;border:2px solid #ddd;margin-bottom:8px}.cbox-head{color:#fff;padding:8px;text-align:center;font-weight:bold;font-size:13px}.cbox-body{padding:10px;min-height:40px;font-size:13px;background:#fff}.todayCol{background:#fff176!important}.subName{width:70px;padding:6px 8px;border-radius:20px;border:2px solid #7c4dff;background:#f3e5f5;text-align:center;font-size:11px;font-weight:bold}.subFull{width:54px;padding:6px;border-radius:20px;border:2px solid #ff9800;background:#fff8e1;text-align:center;font-size:12px;font-weight:bold}.markGol{width:52px;height:36px;border-radius:18px;border:2px solid #4caf50;background:#e8f5e9;text-align:center;font-weight:bold;font-size:13px}.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:11px;text-align:center;background:#fff}.tbl th{padding:6px 3px;background:#1b5e20;color:#fff;font-size:10px}.tbl td{padding:5px 2px;border-bottom:1px solid #ddd}.pillTotal{border-radius:14px;padding:4px 6px;background:#fef9c3;font-weight:bold}.pillGot{border-radius:14px;padding:4px 6px;background:#dcfce7;font-weight:bold}.acc-h-normal{background:#1976d2;color:#fff;padding:10px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-weight:bold;font-size:12px;border-radius:12px 12px 0 0}.acc-b-normal{display:none;padding:8px;background:#fafafa}.acc-b-normal.on{display:block}.paP{background:#e8f5e9;color:#2e7d32;font-weight:bold}.paA{background:#ffebee;color:#c62828;font-weight:bold}.acc{margin-bottom:8px;border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 2px 6px #0001;width:100%;max-width:430px}.acc-h{background:#0d47a1;padding:6px;display:flex;align-items:center;cursor:default;font-weight:bold}.acc-b{display:none;padding:8px;background:#fafafa}.acc-b.show{display:block}</style></head><body>
<div class="pad-main" id="firstPageBanner"><img id="mainBannerImg" src="IMG-20261005-WA0019(3).jpg"></div><div class="green-box" id="firstGreen"><span>প্রাথমিক বিদ্যালয় হাজিরা - EIIN 108412</span></div>
<button class="menu" id="btnForm" onclick="document.getElementById('formBox').classList.toggle('hidden')">🏫 প্রতিষ্ঠান ফরম ▼</button>
<div id="formBox" class="card hidden"><div style="text-align:center"><img id="logoPreview" src="IMG-20261005-WA0019(3).jpg" style="width:84px;height:84px;border-radius:50%;border:3px solid #ffcc00"><br><button onclick="logoInput.click()" style="background:#ffcc00;border:none;padding:8px 14px;border-radius:10px;font-weight:700;margin:8px 0">🖼️ লোগো চেঞ্জ</button><input type="file" id="logoInput" accept="image/*" style="display:none"></div><input id="bnName" placeholder="প্রতিষ্ঠানের নাম"><input id="address" placeholder="ঠিকানা"><div style="display:flex;gap:6px"><input id="eiin" placeholder="EIIN" value="108412"><input id="schoolCode" placeholder="INS Code"></div><div style="display:flex;gap:6px"><input id="mobile" placeholder="মোবাইল"><input id="email" placeholder="Email"></div><input id="pass1" type="password" placeholder="পাসওয়ার্ড"><button class="btn" style="background:#0a7a42;color:#fff;width:100%;padding:12px" onclick="savePrimary()">সেভ করুন ✅</button></div>
<button class="menu" id="btnLogin" onclick="document.getElementById('loginBox').classList.toggle('hidden')">🔐 লগইন ▼</button>
<div id="loginBox" class="card hidden"><select id="loginInst" style="padding:12px;border-radius:12px;border:1px solid #ccc;width:100%"></select><div style="display:flex;gap:6px;margin-top:6px"><select id="shift" style="padding:12px;border-radius:12px"><option>🌅 প্রভাতি</option><option>দিবা</option></select><select id="cls" style="padding:12px;border-radius:12px"><option>১ম শ্রেণি</option><option>২য় শ্রেণি</option><option>৩য় শ্রেণি</option><option>৪র্থ শ্রেণি</option><option>৫ম শ্রেণি</option><option>একাদশ-দ্বাদশ</option></select><select id="section" style="padding:12px;border-radius:12px"><option>ক</option><option>খ</option><option>গ</option></select></div><input id="loginPass" type="password" placeholder="পাসওয়ার্ড" style="padding:12px;border-radius:12px;border:1px solid #ccc;width:100%;margin-top:6px"><button class="btn" style="background:#0d5bff;color:#fff;width:100%;padding:12px;margin-top:6px" onclick="primaryLogin()">🔒 প্রবেশ করুন</button><p id="loginMsg" style="color:red;text-align:center"></p></div>
<button class="menu" id="btnList" onclick="document.getElementById('listBox').classList.toggle('hidden')">🔒 তালিকা ▼</button>
<div id="listBox" class="card hidden"><button class="btn" style="background:#d61f1f;color:#fff;width:100%;padding:10px" onclick="openListSecure()">🔓 তালিকা খুলুন</button><div id="instList"></div></div>
<div class="hidden" id="institutePad" style="width:100%;max-width:430px;background:#fff;border-radius:12px;padding:10px 12px 6px 12px;margin-top:16px;box-shadow:0 2px 8px #0002">
  <div style="display:flex;gap:10px"><img id="padLogo" style="width:62px;height:62px;min-width:62px;border-radius:50%;border:2px solid #0d2a7a;object-fit:cover" src=""><div style="flex:1;text-align:center;min-width:0"><div id="instName" style="font-size:17px;font-weight:700;color:#0d1b5e;line-height:1.2;word-break:break-word"></div><div style="font-size:11px;font-weight:700;color:#a11d23;text-transform:uppercase">MOMTAZ UDDIN BUSINESS MANAGEMENT COLLEGE</div><div id="instAddress" style="font-size:11px;font-weight:600;word-break:break-word"></div><div style="font-size:8px;font-weight:600;word-break:break-all">Mobile: <span id="padMobile"></span> | Email: <span id="padEmail"></span> | EIIN: <span id="padEiin"></span> | INS: <span id="padCode"></span></div></div></div>
  <div style="height:5px;background:#184a9e;width:calc(100% + 24px);margin:6px -12px 0 -12px"></div>
  <div style="display:flex;justify-content:center;margin-top:6px;padding-bottom:6px"><div style="background:#0d2a7a;color:#fff;padding:4px 14px;border-radius:999px;font-size:10px">শ্রেণী: <span id="pillCls"></span> | শাখা: <span id="pillSec"></span> | শিফট: <span id="pillShift"></span></div></div>
  <div style="text-align:center;padding-bottom:6px"><button onclick="logout()" style="background:#d61f1f;color:#fff;border:none;padding:4px 12px;border-radius:8px;font-size:11px">🚪 লগআউট</button></div>
</div>
<div id="accWrap" class="hidden" style="width:100%;max-width:430px"><div id="acc"></div></div>
<script>
let insts=JSON.parse(localStorage.getItem('takrim_primary_insts')||'[]');let tempLogo=localStorage.getItem('takrim_temp_logo')||'';
function refreshInstSelect(){document.getElementById('loginInst').innerHTML='<option value="">প্রতিষ্ঠান নির্বাচন</option>'+insts.map((x,i)=>`<option value="${i}">${x.bnName}</option>`).join('')}refreshInstSelect();
document.getElementById('logoInput').addEventListener('change',function(){if(this.files&&this.files[0]){let r=new FileReader();r.onload=e=>{tempLogo=e.target.result;document.getElementById('logoPreview').src=tempLogo;document.getElementById('mainBannerImg').src=tempLogo;localStorage.setItem('takrim_temp_logo',tempLogo)};r.readAsDataURL(this.files[0])}});
function savePrimary(){let obj={bnName:document.getElementById('bnName').value.trim(),addr:document.getElementById('address').value.trim(),eiin:document.getElementById('eiin').value.trim(),schoolCode:document.getElementById('schoolCode').value.trim(),mobile:document.getElementById('mobile').value.trim(),email:document.getElementById('email').value.trim(),pass:document.getElementById('pass1').value,logo:tempLogo||'IMG-20261005-WA0019(3).jpg'};if(!obj.bnName||!obj.pass)return alert('নাম ও পাস দিন');insts.push(obj);localStorage.setItem('takrim_primary_insts',JSON.stringify(insts));localStorage.removeItem('takrim_temp_logo');alert('✅ সেভ');location.reload();}
function primaryLogin(){let idx=document.getElementById('loginInst').value;if(idx==="")return document.getElementById('loginMsg').textContent='প্রতিষ্ঠান নির্বাচন';let ins=insts[idx];if(document.getElementById('loginPass').value!==ins.pass)return document.getElementById('loginMsg').textContent='❌ ভুল';localStorage.setItem('takrim_session',JSON.stringify({inst:ins,cls:document.getElementById('cls').value,shift:document.getElementById('shift').value,section:document.getElementById('section').value}));location.reload();}
function openListSecure(){let a=prompt('এডমিন নাম');let p=prompt('পাস');if(a!=='malek'||p!=='takrim2022')return alert('ভুল');document.getElementById('instList').innerHTML=insts.map((s,i)=>`<div style="display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #eee"><div><img src="${s.logo}" style="width:28px;height:28px;border-radius:50%"> <b>${s.bnName}</b></div><button onclick="insts.splice(${i},1);localStorage.setItem('takrim_primary_insts',JSON.stringify(insts));refreshInstSelect();openListSecure()" style="background:#fee2e2;border:none;padding:6px;border-radius:6px">🗑️</button></div>`).join('')}
function logout(){localStorage.removeItem('takrim_session');location.reload();}
let sess=JSON.parse(localStorage.getItem('takrim_session')||'null');
let students=JSON.parse(localStorage.getItem('students_v2')||'[{"name":"কালাম","roll":"202","mobile":"01700000001","present":true},{"name":"কমল","roll":"203","mobile":"01700000002","present":false}]');
let saved=JSON.parse(localStorage.getItem('fullResultSheet')||'null');let locked=localStorage.getItem('fullResultSheetLocked')=='true';let activeTab='';
function buildAcc(){let html=`<div class="acc"><div class="acc-h-normal" onclick="togN(1)"><span>1️⃣ শিক্ষার্থী যোগ</span>▼</div><div class="acc-b-normal" id="ab1"><input id="sn" placeholder="নাম" style="padding:8px;border:1px solid #ccc;border-radius:20px;width:100%;margin:4px 0"><input id="sr" placeholder="রোল" style="padding:8px;border:1px solid #ccc;border-radius:20px;width:100%;margin:4px 0"><input id="sm" placeholder="মোবাইল" style="padding:8px;border:1px solid #ccc;border-radius:20px;width:100%;margin:4px 0"><button class="btn" style="background:#2e7d32;width:100%;padding:10px" onclick="addStu()">+ যোগ</button></div></div><div class="acc"><div class="acc-h-normal" onclick="togN(2)"><span>2️⃣ তালিকা</span>▼</div><div class="acc-b-normal" id="ab2"><div id="sList"></div></div></div><div class="acc" style="border:3px solid #0d47a1"><div class="acc-h" style="background:#0d47a1"><div class="header3"><div id="hb_present" class="hbox boxPresent" onclick="setTab('present')">✅ উপস্থিত<br><span id="hc_present">0</span></div><div id="hb_absent" class="hbox boxAbsent" onclick="setTab('absent')">❌ অনুপস্থিত<br><span id="hc_absent">0</span></div><div id="hb_notice" class="hbox boxNotice" onclick="setTab('notice')">📢 নোটিশ</div></div></div><div class="acc-b" id="ab3"><div id="tabContent"></div></div></div><div class="acc"><div class="acc-h-normal" onclick="togN(4)"><span>4️⃣ মাসিক হাজিরা (১-৩১)</span>▼</div><div class="acc-b-normal" id="ab4"><input type="month" id="mp" value="${new Date().toISOString().slice(0,7)}" onchange="renderMonth()" style="width:130px;padding:6px;border-radius:20px;border:1px solid #ccc"><button class="btn" style="background:#ff9800" onclick="goToday()">📅 আজ</button><button class="btn" style="background:#c62828" onclick="delMonth()">🗑️</button><div id="monthTbl" style="margin-top:8px;overflow:auto"></div></div></div><div class="acc"><div class="acc-h-normal" onclick="togN(5)"><span>5️⃣ ফলাফল গোল</span>▼</div><div class="acc-b-normal" id="ab5"><div style="display:flex;gap:6px"><b>বিষয়:</b><button onclick="chSub(-1)" style="width:32px;height:32px;border-radius:50%;border:none;background:#2e7d32;color:#fff">-</button><input id="sc" type="number" value="5" style="width:55px;text-align:center;padding:6px;border-radius:20px;border:2px solid #7c4dff"><button onclick="chSub(1)" style="width:32px;height:32px;border-radius:50%;border:none;background:#2e7d32;color:#fff">+</button><button onclick="makeSheet()" style="background:#7c4dff;color:#fff;border:none;padding:6px 12px;border-radius:20px">সেট</button><span id="lockB" style="font-size:11px;padding:5px 10px;border-radius:20px"></span></div><div id="pdfArea" style="overflow:auto;border:1px solid #ddd;max-height:60vh"><table class="tbl" id="rt"><thead id="rh"></thead><tbody id="rb"></tbody></table></div><div style="display:flex;gap:6px;margin-top:8px"><button style="background:#2e7d32;color:#fff;padding:10px;border-radius:20px;border:none;flex:1" onclick="saveRes()">💾 সেভ লক</button><button style="background:#ff9800;color:#fff;padding:10px;border-radius:20px;border:none;flex:1" onclick="unlockRes()">✏️ এডিট</button><button style="background:#16a34a;color:#fff;padding:10px;border-radius:20px;border:none;flex:1" onclick="expExcel()">Excel</button><button style="background:#dc2626;color:#fff;padding:10px;border-radius:20px;border:none;flex:1" onclick="downPDF()">PDF</button></div><p id="st" style="font-size:11px;color:green"></p></div></div>`;document.getElementById('acc').innerHTML=html;}
buildAcc();
function togN(i){let b=document.getElementById('ab'+i);if(!b)return;b.classList.toggle('on');if(i==2)showStu();if(i==4)renderMonth();if(i==5)makeSheet();}
function setTab(t){activeTab=t;document.querySelectorAll('.hbox').forEach(x=>x.classList.remove('active'));document.getElementById('hb_'+t).classList.add('active');document.getElementById('ab3').classList.add('show');renderTab();}
function renderHeaderCounts(){let p=students.filter(s=>s.present).length;document.getElementById('hc_present').innerText=p;document.getElementById('hc_absent').innerText=students.length-p;}
function renderTab(){let pList=students.filter(s=>s.present);let aList=students.filter(s=>!s.present);let notice=localStorage.getItem('notice')||'';if(activeTab==='present')document.getElementById('tabContent').innerHTML=`✅ ${pList.length}<br>${pList.map(s=>s.name).join('<br>')}`;else if(activeTab==='absent')document.getElementById('tabContent').innerHTML=`❌ ${aList.length}<br>${aList.map(s=>s.name).join('<br>')}`;else document.getElementById('tabContent').innerHTML=`<textarea id="notice" style="width:100%">${notice}</textarea><button class="btn" style="background:#ef6c00;width:100%" onclick="localStorage.setItem('notice',document.getElementById('notice').value);alert('সেভ')">সেভ</button>`;}
function addStu(){let n=document.getElementById('sn').value.trim(),r=document.getElementById('sr').value.trim(),m=document.getElementById('sm').value.trim();if(!n||!r||!m)return alert('দিন');students.push({name:n,roll:r,mobile:m,present:true});localStorage.setItem('students_v2',JSON.stringify(students));location.reload();}
function showStu(){let h='';students.forEach((s,i)=>{h+=`<div style="display:flex;justify-content:space-between;padding:6px;border-bottom:1px solid #eee"><span>${s.name}-${s.roll}</span><button onclick="students.splice(${i},1);localStorage.setItem('students_v2',JSON.stringify(students));showStu();renderHeaderCounts()" style="background:#fee2e2;border:none;padding:4px 8px;border-radius:8px">🗑️</button></div>`});document.getElementById('sList').innerHTML=h;renderHeaderCounts();}
function renderMonth(){let ym=document.getElementById('mp').value,[y,m]=ym.split('-').map(Number),d=new Date(y,m,0).getDate(),h='<table class="tbl"><tr><th>নাম</th>';for(let i=1;i<=d;i++)h+=`<th>${i}</th>`;h+='</tr>';students.forEach(s=>{h+=`<tr><td>${s.name}</td>`;for(let i=1;i<=d;i++)h+=`<td><input type="checkbox" style="width:auto"></td>`;h+='</tr>'});h+='</table>';document.getElementById('monthTbl').innerHTML=h;}
function goToday(){document.getElementById('mp').value=new Date().toISOString().slice(0,7);renderMonth();}
function delMonth(){if(confirm('মুছবেন?')){localStorage.removeItem('monthly31Data');renderMonth();}}
function chSub(n){let c=parseInt(document.getElementById('sc').value)||5;c+=n;if(c<1)c=1;if(c>20)c=20;document.getElementById('sc').value=c;}
function makeSheet(){let cnt=parseInt(document.getElementById('sc').value)||5;let head='<tr><th>রোল</th><th>নাম</th>';for(let i=0;i<cnt;i++)head+=`<th>বি${i+1}</th>`;head+='<th>মোট</th><th>GPA</th></tr>';document.getElementById('rh').innerHTML=head;let body='';students.forEach((s,si)=>{body+=`<tr><td>${s.roll}</td><td>${s.name}</td>`;for(let j=0;j<cnt;j++)body+=`<td><input id="m_${si}_${j}" type="number" class="markGol" oninput="calcRes()"></td>`;body+=`<td><span id="f_${si}">0</span></td><td id="g_${si}">-</td></tr>`;});document.getElementById('rb').innerHTML=body;}
function calcRes(){students.forEach((_,si)=>{let tot=0,cnt=parseInt(document.getElementById('sc').value)||5;for(let j=0;j<cnt;j++)tot+=parseInt(document.getElementById(`m_${si}_${j}`)?.value)||0;document.getElementById(`f_${si}`).innerText=tot;});}
function saveRes(){alert('সেভ 108412');}function unlockRes(){}function delRes(){}function expExcel(){let wb=XLSX.utils.book_new();let ws=XLSX.utils.aoa_to_sheet([['Roll','Name','Total']].concat(students.map((s,si)=>[s.roll,s.name,document.getElementById(`f_${si}`)?.innerText||''])));XLSX.utils.book_append_sheet(wb,ws,'108412');XLSX.writeFile(wb,'MUMC_108412.xlsx');}
function downPDF(){const {jsPDF}=window.jspdf;let doc=new jsPDF();doc.text('MUMC 108412',10,10);doc.save('MUMC.pdf');}
function initSecondPage(){if(sess&&sess.inst){document.getElementById('firstPageBanner').classList.add('hidden');document.getElementById('firstGreen').classList.add('hidden');document.getElementById('btnForm').classList.add('hidden');document.getElementById('btnLogin').classList.add('hidden');document.getElementById('btnList').classList.add('hidden');document.getElementById('formBox').classList.add('hidden');document.getElementById('loginBox').classList.add('hidden');document.getElementById('listBox').classList.add('hidden');document.getElementById('institutePad').classList.remove('hidden');document.getElementById('accWrap').classList.remove('hidden');document.getElementById('instName').innerText=sess.inst.bnName||'';document.getElementById('instAddress').innerText=sess.inst.addr||'';document.getElementById('padLogo').src=sess.inst.logo||'';document.getElementById('padEiin').innerText=sess.inst.eiin||'';document.getElementById('padCode').innerText=sess.inst.schoolCode||'';document.getElementById('padMobile').innerText=sess.inst.mobile||'';document.getElementById('padEmail').innerText=sess.inst.email||'';document.getElementById('pillCls').innerText=sess.cls||'';document.getElementById('pillSec').innerText=sess.section||'';document.getElementById('pillShift').innerText=sess.shift||'';}else{document.getElementById('institutePad').classList.add('hidden');document.getElementById('accWrap').classList.add('hidden');}}initSecondPage();showStu();renderHeaderCounts();
</script></body></html>
