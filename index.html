<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Al-Hera Final Gol</title><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script><style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#f0f4f8;padding:8px}.pad{background:#fff;border:2px solid #0d47a1;border-radius:12px;padding:12px;text-align:center;margin-bottom:8px}.acc{margin-bottom:8px;border-radius:10px;overflow:hidden;background:#fff;box-shadow:0 2px 5px #0001}.acc-h{background:#1976d2;color:#fff;padding:12px;display:flex;justify-content:space-between;cursor:pointer;font-weight:bold;font-size:13px}.acc-b{display:none;padding:8px;background:#fafafa}.acc-b.on{display:block}.btn{padding:8px 10px;border:none;border-radius:20px;color:#fff;cursor:pointer;margin:3px;font-weight:bold;font-size:11px}.box-stack{display:flex;flex-direction:column;gap:10px}.cbox{border-radius:14px;overflow:hidden;background:#fff}.cbox-head{color:#fff;padding:8px;text-align:center;font-weight:bold;font-size:14px}.cbox-body{padding:8px;min-height:40px;font-size:13px}.todayCol{background:#fff176!important}.subName{width:70px;padding:6px 8px;border-radius:20px;border:2px solid #7c4dff;background:#f3e5f5;text-align:center;font-size:11px;font-weight:bold}.subFull{width:54px;padding:6px;border-radius:20px;border:2px solid #ff9800;background:#fff8e1;text-align:center;font-size:12px;font-weight:bold}.markGol{width:52px;height:36px;border-radius:18px;border:2px solid #4caf50;background:#e8f5e9;text-align:center;font-weight:bold;font-size:13px}.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:11px;text-align:center}.tbl th{padding:6px 3px;background:#1b5e20;color:#fff;font-size:10px}.tbl td{padding:5px 2px;border-bottom:1px solid #eee}.pillTotal{border-radius:14px;padding:4px 6px;background:#fef9c3;font-weight:bold}.pillGot{border-radius:14px;padding:4px 6px;background:#dcfce7;font-weight:bold}</style></head><body><div class="pad"><h1 style="color:#0d47a1;font-size:18px">আল-হেরা আইডিয়াল মাদ্রাসা</h1></div><div id="acc"></div><script>
let students=JSON.parse(localStorage.getItem('students_v2')||'[{"name":"কালাম","roll":"202","mobile":"01700000001","present":true},{"name":"কমল","roll":"203","mobile":"01700000002","present":false},{"name":"সাকিব","roll":"204","mobile":"01700000003","present":true}]');
let saved=JSON.parse(localStorage.getItem('fullResultSheet')||'null');let locked=localStorage.getItem('fullResultSheetLocked')=='true';
const steps=[{title:'1️⃣ শিক্ষার্থী যোগ করুন',html:`<div style="background:#fff;padding:8px;border-radius:14px"><input id="sn" placeholder="নাম" style="padding:8px;border:1px solid #ccc;border-radius:20px;width:100%;margin:4px 0"><input id="sr" placeholder="রোল" style="padding:8px;border:1px solid #ccc;border-radius:20px;width:100%;margin:4px 0"><input id="sm" placeholder="মোবাইল" style="padding:8px;border:1px solid #ccc;border-radius:20px;width:100%;margin:4px 0"><button class="btn" style="background:#2e7d32;width:100%;padding:10px" onclick="addStu()">+ যোগ</button></div>`},{title:'2️⃣ শিক্ষার্থীর তালিকা',html:`<div id="sList"></div>`},{title:'3️⃣ 📊 মোট উপস্থিত | মোট অনুপস্থিত | নোটিশ - ৩ কালার',html:`<div style="background:#fff;padding:8px;border-radius:14px"><div class="box-stack"><div class="cbox" style="border:2px solid #2e7d32"><div class="cbox-head" style="background:#2e7d32">✅ মোট উপস্থিত</div><div class="cbox-body" id="presentBox"></div></div><div class="cbox" style="border:2px solid #c62828"><div class="cbox-head" style="background:#c62828">❌ মোট অনুপস্থিত</div><div class="cbox-body" id="absentBox"></div></div><div class="cbox" style="border:2px solid #ef6c00"><div class="cbox-head" style="background:#ef6c00">📢 নোটিশ</div><div class="cbox-body"><textarea id="notice" rows="4" style="width:100%;border-radius:12px;padding:8px;border:1px solid #ccc" placeholder="আজকে বন্ধ..."></textarea><button class="btn" style="background:#ef6c00;width:100%;margin-top:6px;padding:10px" onclick="saveNotice()">💾 সেভ</button></div></div></div><div style="display:flex;gap:8px;margin-top:12px"><button class="btn" style="background:#0284c7;flex:1;padding:12px" onclick="sendSMS()">📱 SMS</button><button class="btn" style="background:#16a34a;flex:1;padding:12px" onclick="sendWA()">💬 WhatsApp</button></div></div>`},{title:'4️⃣ মাসিক হাজিরা (১-৩১)',html:`<div style="background:#fff;padding:6px;border-radius:14px"><div style="display:flex;justify-content:space-between;flex-wrap:wrap"><div><input type="month" id="mp" value="${new Date().toISOString().slice(0,7)}" onchange="renderMonth()" style="width:130px;padding:6px;border-radius:20px;border:1px solid #ccc"><button class="btn" style="background:#ff9800" onclick="goToday()">📅 আজ</button></div><div><button class="btn" style="background:#1565c0" onclick="window.print()">🖨️</button><button class="btn" style="background:#c62828" onclick="delMonth()">🗑️</button></div></div><div id="monthTbl" style="margin-top:8px;overflow:auto"></div></div>`},{title:'5️⃣ ফলাফল - গোল ডিজাইন সরাসরি চেঞ্জ',html:`<div style="background:#fff;padding:8px;border-radius:16px;border:2px solid #7c4dff"><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px"><b>বিষয়:</b><button onclick="chSub(-1)" style="width:32px;height:32px;border-radius:50%;border:none;background:#2e7d32;color:#fff">-</button><input id="sc" type="number" value="5" style="width:55px;text-align:center;padding:6px;border-radius:20px;border:2px solid #7c4dff"><button onclick="chSub(1)" style="width:32px;height:32px;border-radius:50%;border:none;background:#2e7d32;color:#fff">+</button><button onclick="makeSheet()" style="background:#7c4dff;color:#fff;border:none;padding:6px 12px;border-radius:20px">সেট</button><span id="lockB" style="font-size:11px;padding:5px 10px;border-radius:20px"></span></div><div style="overflow:auto;border-radius:12px;border:1px solid #ddd;max-height:60vh"><table class="tbl" id="rt"><thead id="rh"></thead><tbody id="rb"></tbody></table></div><div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap"><button style="background:#2e7d32;color:#fff;padding:10px 14px;border-radius:20px;border:none;flex:1" onclick="saveRes()">💾 সেভ লক</button><button style="background:#ff9800;color:#fff;padding:10px 14px;border-radius:20px;border:none;flex:1" onclick="unlockRes()">✏️ এডিট</button><button style="background:#1565c0;color:#fff;padding:10px 14px;border-radius:20px;border:none" onclick="calcRes()">🔄 হিসাব</button><button style="background:#c62828;color:#fff;padding:10px 14px;border-radius:20px;border:none" onclick="delRes()">🗑️</button></div><div style="margin-top:8px;display:flex;gap:8px"><button style="background:#16a34a;color:#fff;padding:10px;border:none;border-radius:20px;flex:1" onclick="expExcel()">⬇️ Excel</button><button style="background:#dc2626;color:#fff;padding:10px;border:none;border-radius:20px;flex:1" onclick="downPDF()">⬇️ PDF</button></div><p id="st" style="font-size:11px;color:green;font-weight:bold;margin-top:4px"></p></div>`}];
document.getElementById('acc').innerHTML=steps.map((s,i)=>`<div class="acc"><div class="acc-h" onclick="tog(${i})"><span>${s.title}</span><span id="ar${i}">▼</span></div><div class="acc-b" id="ab${i}">${s.html}</div></div>`).join('');
function tog(i){let b=document.getElementById('ab'+i),o=b.classList.contains('on');document.querySelectorAll('.acc-b').forEach(x=>x.classList.remove('on'));document.querySelectorAll('[id^=ar]').forEach(x=>x.innerText='▼');if(!o){b.classList.add('on');document.getElementById('ar'+i).innerText='▲';if(i==1)showStu();if(i==2)renderHajira();if(i==3)renderMonth();if(i==4)makeSheet();}}
function addStu(){let n=document.getElementById('sn').value.trim(),r=document.getElementById('sr').value.trim(),m=document.getElementById('sm').value.trim();if(!n||!r||!m)return alert('দিন');students.push({name:n,roll:r,mobile:m,present:true});localStorage.setItem('students_v2',JSON.stringify(students));location.reload();}
function showStu(){let h='';students.forEach((s,i)=>{h+=`<div style="display:flex;justify-content:space-between;background:#fff;padding:8px;border-radius:20px;margin:4px 0;border:1px solid #ddd;font-size:12px"><span>${i+1}. ${s.name} (${s.roll})</span><span><button onclick="tp(${i})" style="border-radius:50%;border:none;padding:4px 8px;background:#e8f5e9">${s.present?'✅':'❌'}</button> <button onclick="ds(${i})" style="border-radius:50%;border:none">🗑️</button></span></div>`});document.getElementById('sList').innerHTML=h;}
function tp(i){students[i].present=!students[i].present;localStorage.setItem('students_v2',JSON.stringify(students));showStu();renderHajira();}
function ds(i){if(confirm('ডিলিট?')){students.splice(i,1);localStorage.setItem('students_v2',JSON.stringify(students));location.reload();}}
function renderHajira(){let notice=localStorage.getItem('notice')||'';if(document.getElementById('notice'))document.getElementById('notice').value=notice;let p=students.filter(s=>s.present).map(s=>`✅ ${s.name}`).join('<br>')||'কেউ নেই';let a=students.filter(s=>!s.present).map(s=>`❌ ${s.name}`).join('<br>')||'সবাই উপস্থিত';document.getElementById('presentBox').innerHTML=p;document.getElementById('absentBox').innerHTML=a;}
function saveNotice(){localStorage.setItem('notice',document.getElementById('notice').value);alert('নোটিশ সেভ');}
function getMsg(){let n=document.getElementById('notice')?.value||localStorage.getItem('notice')||'';let p=students.filter(s=>s.present).length;let ab=students.filter(s=>!s.present).length;return `📢 নোটিশ: ${n}\nমোট উপস্থিত: ${p} জন\nমোট অনুপস্থিত: ${ab} জন`;}
function sendSMS(){window.open(`sms:?body=${encodeURIComponent(getMsg())}`,'_blank');}
function sendWA(){window.open(`https://wa.me/?text=${encodeURIComponent(getMsg())}`,'_blank');}
function renderMonth(){let month=document.getElementById('mp')?.value||new Date().toISOString().slice(0,7);let data=JSON.parse(localStorage.getItem('monthly31Data')||'{}');let today=new Date();let tDay=today.getDate();let tMonth=today.toISOString().slice(0,7);let html=`<table border=1 style="width:100%;border-collapse:collapse;text-align:center;font-size:10px;min-width:900px"><tr style="background:#1976d2;color:#fff"><th>ক্রম</th><th>নাম</th><th>রোল</th>`;for(let i=1;i<=31;i++){let cls=(month==tMonth && i==tDay)?' class="todayCol" style="background:#fff176"':'';html+=`<th${cls}>${i}</th>`;}html+=`<th>মোট উপ</th><th>মোট অনু</th></tr>`;students.forEach((s,idx)=>{html+=`<tr><td>${idx+1}</td><td style="text-align:left">${s.name}</td><td>${s.roll}</td>`;for(let d=1;d<=31;d++){let k=`${month}_${idx}_${d}`;let ch=data[k]===true?'checked':'';let cls=(month==tMonth && d==tDay)?' class="todayCol"':'';html+=`<td${cls}><input type="checkbox" id="d_${idx}_${d}" ${ch} onchange="save31(${idx},${d})" style="width:16px;height:16px"></td>`;}html+=`<td id="p_${idx}" style="background:#e8f5e9">0</td><td id="a_${idx}" style="background:#ffebee">0</td></tr>`;});html+=`</table>`;document.getElementById('monthTbl').innerHTML=html;students.forEach((_,i)=>calc31(i));}
function save31(idx,d){let month=document.getElementById('mp').value;let data=JSON.parse(localStorage.getItem('monthly31Data')||'{}');data[`${month}_${idx}_${d}`]=document.getElementById(`d_${idx}_${d}`).checked;localStorage.setItem('monthly31Data',JSON.stringify(data));calc31(idx);}
function calc31(idx){let c=0;for(let d=1;d<=31;d++)if(document.getElementById(`d_${idx}_${d}`)?.checked)c++;document.getElementById(`p_${idx}`).innerText=c;document.getElementById(`a_${idx}`).innerText=31-c;}
function goToday(){let m=new Date().toISOString().slice(0,7);document.getElementById('mp').value=m;renderMonth();}
function delMonth(){if(confirm('মুছবেন?')){let month=document.getElementById('mp').value;let data=JSON.parse(localStorage.getItem('monthly31Data')||'{}');students.forEach((_,idx)=>{for(let d=1;d<=31;d++)delete data[`${month}_${idx}_${d}`]});localStorage.setItem('monthly31Data',JSON.stringify(data));renderMonth();}}
function chSub(n){let c=parseInt(document.getElementById('sc').value)||5;c+=n;if(c<1)c=1;if(c>20)c=20;document.getElementById('sc').value=c;}
function makeSheet(){let cnt=parseInt(document.getElementById('sc').value)||saved?.count||5;document.getElementById('sc').value=cnt;let subs=saved?.subjects||[{name:'বাংলা',full:100},{name:'ইংরেজি',full:100},{name:'গণিত',full:100},{name:'পদার্থ',full:50},{name:'রসায়ন',full:50}];let head='<tr><th>রোল</th><th>নাম</th>';for(let i=0;i<cnt;i++){let s=subs[i]||{name:`বি${i+1}`,full:100};head+=`<th><input id="sn${i}" value="${s.name}" class="subName" ${locked?'disabled':''}></th>`;}head+='<th>মোট</th><th>প্রাপ্ত</th><th>%</th><th>GPA</th></tr>';let fullRow='<tr style="background:#fff8e1"><td colspan="2" style="font-weight:bold;color:#ef6c00">পূর্ণমান</td>';for(let i=0;i<cnt;i++){let s=subs[i]||{full:100};fullRow+=`<td><input id="sf${i}" type="number" value="${s.full}" class="subFull" ${locked?'disabled':''}></td>`;}fullRow+='<td colspan="4"><span class="pillTotal" id="totalFull">-</span></td></tr>';document.getElementById('rh').innerHTML=head+fullRow;let body='';students.forEach((stu,idx)=>{body+=`<tr><td>${stu.roll}</td><td style="text-align:left;font-weight:bold">${stu.name}</td>`;for(let j=0;j<cnt;j++){let old=saved?.marks?.[idx]?.[j]||'';body+=`<td><input id="m_${idx}_${j}" type="number" value="${old}" class="markGol" oninput="calcRes()" ${locked?'disabled':''}></td>`;}body+=`<td><span class="pillTotal" id="f_${idx}">-</span></td><td><span class="pillGot" id="o_${idx}">-</span></td><td id="pe_${idx}">-</td><td id="g_${idx}">-</td></tr>`;});document.getElementById('rb').innerHTML=body;updLock();calcRes();}
function updLock(){let b=document.getElementById('lockB');if(!b)return;if(locked){b.innerText='🔒 লক';b.style.background='#fecaca';}else{b.innerText='🔓 আনলক';b.style.background='#bbf7d0';}}
function calcRes(){let cnt=parseInt(document.getElementById('sc').value)||5;let totFull=0;for(let j=0;j<cnt;j++)totFull+=parseInt(document.getElementById(`sf${j}`)?.value)||0;document.getElementById('totalFull').innerText=totFull;students.forEach((_,idx)=>{let f=0,o=0;for(let j=0;j<cnt;j++){f+=parseInt(document.getElementById(`sf${j}`)?.value)||0;o+=parseInt(document.getElementById(`m_${idx}_${j}`)?.value)||0;}let per=f?(o/f*100).toFixed(1):0;let gpa=Math.min(5,per/20).toFixed(2);document.getElementById(`f_${idx}`).innerText=f;document.getElementById(`o_${idx}`).innerText=o;document.getElementById(`pe_${idx}`).innerText=per+'%';document.getElementById(`g_${idx}`).innerText=gpa;});}
function saveRes(){let cnt=parseInt(document.getElementById('sc').value)||5;let subs=[];for(let i=0;i<cnt;i++)subs.push({name:document.getElementById(`sn${i}`).value,full:document.getElementById(`sf${i}`).value});let marks=[];students.forEach((_,idx)=>{let r=[];for(let j=0;j<cnt;j++)r.push(document.getElementById(`m_${idx}_${j}`).value);marks.push(r);});saved={subjects:subs,marks:marks,count:cnt};localStorage.setItem('fullResultSheet',JSON.stringify(saved));localStorage.setItem('fullResultSheetLocked','true');locked=true;document.getElementById('st').innerText='✅ সেভ ও লক';makeSheet();}
function unlockRes(){if(confirm('এডিট?')){locked=false;localStorage.setItem('fullResultSheetLocked','false');makeSheet();}}
function delRes(){if(confirm('মুছবেন?')){localStorage.removeItem('fullResultSheet');localStorage.removeItem('fullResultSheetLocked');saved=null;locked=false;makeSheet();}}
function expExcel(){let cnt=parseInt(document.getElementById('sc').value)||5;let data=students.map((s,idx)=>{let row={"রোল":s.roll,"নাম":s.name};let f=0,o=0;for(let j=0;j<cnt;j++){let nm=document.getElementById(`sn${j}`)?.value||`বি${j+1}`;let v=document.getElementById(`m_${idx}_${j}`)?.value||'';row[nm]=v;f+=parseInt(document.getElementById(`sf${j}`)?.value)||0;o+=parseInt(v)||0;}let per=f?(o/f*100).toFixed(1):0;let gpa=Math.min(5,per/20).toFixed(2);row["মোট"]=f;row["প্রাপ্ত"]=o;row["%"]=per;row["GPA"]=gpa;return row;});let ws=XLSX.utils.json_to_sheet(data);let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Result");XLSX.writeFile(wb,`Result_${new Date().toISOString().slice(0,10)}.xlsx`);}
function downPDF(){let {jsPDF}=window.jspdf;let doc=new jsPDF('l','mm','a4');let cnt=parseInt(document.getElementById('sc').value)||5;doc.text('Al-Hera - Result Gol',14,10);let head=["রোল","নাম"];for(let i=0;i<cnt;i++)head.push(document.getElementById(`sn${i}`)?.value||`B${i+1}`);head.push("মোট","প্রাপ্ত","%","GPA");let body=[];students.forEach((s,idx)=>{let r=[s.roll,s.name];let f=0,o=0;for(let j=0;j<cnt;j++){let v=document.getElementById(`m_${idx}_${j}`)?.value||'';r.push(v);f+=parseInt(document.getElementById(`sf${j}`)?.value)||0;o+=parseInt(v)||0;}let per=f?(o/f*100).toFixed(1):0;let gpa=Math.min(5,per/20).toFixed(2);r.push(f,o,per+'%',gpa);body.push(r);});doc.autoTable({head:[head],body:body,startY:14,styles:{fontSize:7}});doc.save(`Result_Gol.pdf`);}
showStu();</script></body></html>
