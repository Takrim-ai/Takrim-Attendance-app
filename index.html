<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>School College - First Page</title><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;font-family:'Hind Siliguri',sans-serif}body{margin:0;background:#082a1e;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:10px}.main-banner{width:380px;max-width:95%;border:4px solid #ffcc00;border-radius:22px;overflow:hidden;margin-top:10px;background:#000;line-height:0}.main-banner img{width:100%;display:block}.green-box{width:380px;max-width:95%;background:#16a34a;border:3px solid #ffcc00;border-radius:16px;padding:12px;margin-top:20px;text-align:center}.green-box span{background:#000;color:#fff;display:inline-block;padding:8px 22px;border-radius:30px;font-weight:700;font-size:18px}.card{background:#fff;margin-top:12px;border-radius:24px;padding:16px;width:100%;max-width:430px}.menu{width:380px;max-width:95%;border:3px solid #ffcc00;border-radius:16px;padding:12px;margin-top:14px;display:flex;justify-content:center;cursor:pointer}.menu span{background:#000;color:#fff;padding:8px 22px;border-radius:30px;font-weight:700;font-size:17px}.hidden{display:none!important}.btn{width:100%;padding:14px;border:none;border-radius:14px;font-weight:700;cursor:pointer;margin-top:8px}.green{background:#0a7a42;color:#fff}.blue{background:#0d5bff;color:#fff}.red{background:#d61f1f;color:#fff}input,select{width:100%;padding:12px;border-radius:12px;border:1px solid #ccc;margin:5px 0}.fifty{display:flex;gap:6px}.fifty>*{flex:1}#logoPreview{width:95px;height:95px;border-radius:50%;border:3px solid #ffcc00;object-fit:cover;object-position:center;background:#fff;display:none;margin:0 auto}</style></head><body>
<div id="firstPageWrap" style="width:100%;display:flex;flex-direction:column;align-items:center">
<div class="main-banner"><img src="IMG-20261005-WA0019(3).jpg"></div>
<div class="green-box"><span>প্রাথমিক বিদ্যালয় হাজিরা</span></div>

<div class="menu" style="background:#1e90ff" onclick="document.getElementById('formBox').classList.toggle('hidden')"><span>🏫 প্রতিষ্ঠান ফরম ▼</span></div>
<div id="formBox" class="card hidden" style="text-align:center">
<img id="logoPreview" src=""><label for="logoInput" style="background:#ffcc00;color:#000;font-weight:700;font-size:14px;margin-top:10px;padding:7px 18px;border-radius:20px;cursor:pointer;display:inline-block">🖼️ লোগো চেঞ্জ ৯৫x৯৫ গোল</label><input type="file" id="logoInput" accept="image/*" style="position:absolute;left:-9999px;opacity:0;width:1px;height:1px">
<input id="bnName" placeholder="প্রতিষ্ঠানের নাম"><input id="enName" placeholder="English Name"><input id="address" placeholder="ঠিকানা"><div class="fifty"><input id="eiin" placeholder="EIIN"><input id="schoolCode" placeholder="Code"></div><div class="fifty"><input id="mobile" placeholder="মোবাইল"><input id="email" placeholder="Email"></div><input id="pass1" type="password" placeholder="পাসওয়ার্ড"><button class="btn green" onclick="savePrimary()">সেভ করুন ✅</button>
</div>

<div class="menu" style="background:#8b5cf6" onclick="document.getElementById('loginBox').classList.toggle('hidden')"><span>🔐 লগইন ▼</span></div>
<div id="loginBox" class="card hidden"><select id="loginInst"></select><div class="fifty"><select id="shift"><option>🌅 প্রভাতি</option><option>দিবা</option></select><select id="cls"><option>১ম শ্রেণি</option><option>২য় শ্রেণি</option><option>৩য় শ্রেণি</option><option>৪র্থ শ্রেণি</option><option>৫ম শ্রেণি</option></select><select id="section"><option>ক</option><option>খ</option></select></div><input id="loginPass" type="password" placeholder="পাসওয়ার্ড"><button class="btn blue" onclick="primaryLogin()">🔒 প্রবেশ করুন</button><p id="loginMsg" style="color:red;text-align:center"></p></div>

<!-- কাউন্টার - ফিরোজা -->
<div class="menu" style="background:#0fa3b1;cursor:default;display:flex;gap:10px;justify-content:center;padding:12px">
<span style="flex:1;text-align:center;background:#000;color:#ffcc00;border:2px solid #ffcc00;padding:10px 6px;border-radius:30px;font-size:15px;font-weight:700">মোট প্রতিষ্ঠান: <b id="totalInst" style="color:#ffcc00">০</b></span>
<span style="flex:1;text-align:center;background:#000;color:#ffcc00;border:2px solid #ffcc00;padding:10px 6px;border-radius:30px;font-size:15px;font-weight:700">মোট লগইন: <b id="totalLoginCount" style="color:#ffcc00">০</b></span>
</div>

<div class="menu" style="background:#ef4444" onclick="document.getElementById('listBox').classList.toggle('hidden')"><span>🔒 তালিকা ▼</span></div>
<div id="listBox" class="card hidden"><button class="btn red" onclick="openListSecure()">🔓 তালিকা খুলুন (এডমিন)</button><div id="instList"></div></div>
</div>
<script>
let rawInsts=JSON.parse(localStorage.getItem('takrim_primary_insts')||'[]');let mapDedup=new Map();rawInsts.forEach(x=>{let k=(x.bnName||'').trim();if(k&&!mapDedup.has(k))mapDedup.set(k,x);});let insts=[...mapDedup.values()];localStorage.setItem('takrim_primary_insts',JSON.stringify(insts));
let tempLogo=localStorage.getItem('takrim_temp_logo')||'';
function toBn(n){return n.toString().replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);}
function updateCounter(){let a=JSON.parse(localStorage.getItem('takrim_primary_insts')||'[]');let b=JSON.parse(localStorage.getItem('takrim_login_logs')||'[]');let e1=document.getElementById('totalInst');let e2=document.getElementById('totalLoginCount');if(e1)e1.innerText=toBn(a.length);if(e2)e2.innerText=toBn(b.length);}
function refreshInstSelect(){let el=document.getElementById('loginInst');el.innerHTML='<option value="">প্রতিষ্ঠান নির্বাচন</option>'+insts.map((x,i)=>'<option value="'+i+'">'+x.bnName+'</option>').join('');}refreshInstSelect();updateCounter();
document.getElementById('logoInput').addEventListener('change',function(){if(!this.files[0])return;let r=new FileReader();r.onload=e=>{tempLogo=e.target.result;document.getElementById('logoPreview').src=tempLogo;document.getElementById('logoPreview').style.display='block';localStorage.setItem('takrim_temp_logo',tempLogo);};r.readAsDataURL(this.files[0]);});
function savePrimary(){let bn=document.getElementById('bnName').value.trim();let pass=document.getElementById('pass1').value.trim();if(!bn)return alert('প্রতিষ্ঠানের নাম দিন');if(!pass)return alert('পাসওয়ার্ড দিন');if(insts.some(x=>x.bnName.trim()===bn))return alert('❌ এই প্রতিষ্ঠান আগেই আছে');let o={bnName:bn,enName:document.getElementById('enName').value.trim(),addr:document.getElementById('address').value.trim(),eiin:document.getElementById('eiin').value.trim(),schoolCode:document.getElementById('schoolCode').value.trim(),mobile:document.getElementById('mobile').value.trim(),email:document.getElementById('email').value.trim(),pass:pass,logo:tempLogo||''};insts.push(o);localStorage.setItem('takrim_primary_insts',JSON.stringify(insts));localStorage.setItem('takrim_temp_logo','');updateCounter();alert('✅ সেভ');location.reload();}
function primaryLogin(){let idx=document.getElementById('loginInst').value;if(idx==='')return document.getElementById('loginMsg').textContent='প্রতিষ্ঠান নির্বাচন';let ins=insts[idx];if(document.getElementById('loginPass').value!==ins.pass)return document.getElementById('loginMsg').textContent='❌ ভুল পাস';let logs=JSON.parse(localStorage.getItem('takrim_login_logs')||'[]');logs.push({code:ins.eiin||ins.schoolCode||ins.bnName,time:new Date().toISOString()});localStorage.setItem('takrim_login_logs',JSON.stringify(logs));localStorage.setItem('takrim_session',JSON.stringify({inst:ins,cls:document.getElementById('cls').value,shift:document.getElementById('shift').value,section:document.getElementById('section').value}));window.location.href='dashboard.html';}
function openListSecure(){let a=prompt('এডমিন নাম'),p=prompt('পাসওয়ার্ড');if(a!=='malek'||p!=='takrim2022')return alert('ভুল এডমিন');let listDiv=document.getElementById('instList');listDiv.innerHTML=insts.map((s,i)=>'<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 8px;border-bottom:1px solid #eee"><div style="display:flex;align-items:center;gap:8px"><img src="'+(s.logo||'')+'" style="width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid #ffcc00"><div><div style="font-weight:700;font-size:13px">'+s.bnName+'</div><div style="font-size:11px;background:#f3f4f6;padding:4px 8px;border-radius:8px;margin-top:4px">🔑 <b style="color:#dc2626">'+s.pass+'</b></div></div></div><div><button onclick="navigator.clipboard.writeText(\''+s.pass+'\');alert(\'কপি\')" style="background:#dbeafe;border:none;padding:8px;border-radius:10px">📋</button><button onclick="if(confirm(\'ডিলিট?\')){insts.splice('+i+',1);localStorage.setItem(\'takrim_primary_insts\',JSON.stringify(insts));location.reload();}" style="background:#fee2e2;border:none;padding:8px;border-radius:10px">🗑️</button></div></div>').join('');}
let savedLogo=localStorage.getItem('takrim_temp_logo');if(savedLogo){let lp=document.getElementById('logoPreview');if(lp){lp.src=savedLogo;lp.style.display='block';}tempLogo=savedLogo;}
if(JSON.parse(localStorage.getItem('takrim_session')||'null')){window.location.href='dashboard.html';}
</script></body></html>
