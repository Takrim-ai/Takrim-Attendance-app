<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Takrim Final</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Kalpurush,Arial}
body{background:#0a2e1f;padding:8px}
.main{max-width:520px;margin:auto;background:#fff;border-radius:18px;padding:12px}
.add{width:100%;padding:14px;background:#2563eb;color:#fff;border:none;border-radius:12px;font-weight:bold;font-size:18px;cursor:pointer;margin-bottom:12px}
.listBtn{width:100%;padding:14px;background:#ffcc00;color:#000;border:none;border-radius:12px;font-weight:bold;font-size:18px;cursor:pointer;margin-bottom:8px}
#list{display:none;margin-bottom:10px}#list.show{display:block}
.stu{background:#f3f4f6;display:flex;justify-content:space-between;align-items:center;padding:10px;border-radius:10px;margin-bottom:6px;font-size:16px}
.stats{display:flex;gap:8px;margin-bottom:10px}.s{flex:1;padding:14px;border-radius:12px;text-align:center;font-weight:bold;font-size:16px;cursor:pointer;border:2px solid transparent}.s.active{border-color:#000;transform:scale(0.97)}
.s2{background:#16a34a;color:#fff}.s3{background:#ef4444;color:#fff}
.toggle{width:100%;padding:14px;background:#7c3aed;color:#fff;border:none;border-radius:12px;font-weight:bold;font-size:18px;cursor:pointer;margin-bottom:10px}
.box{border:2px solid #a78bfa;border-radius:14px;padding:8px;display:none}.box.show{display:block}
.sheetHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sheetTitle{font-weight:bold;color:#7c3aed}
.headRight{display:flex;align-items:center;gap:8px}
.btnName{padding:8px 14px;background:#7c3aed;color:#fff;border:none;border-radius:20px;font-weight:bold;font-size:13px;cursor:pointer}
.subCountBox{display:flex;align-items:center;gap:6px;background:#f3f4f6;padding:6px 10px;border-radius:20px;border:1px solid #ddd}
.subCountBox label{font-weight:bold;font-size:14px}
.subCountBox input{width:60px;padding:7px;border:2px solid #7c3aed;border-radius:10px;text-align:center;font-weight:bold;font-size:16px;background:#fff}
.wrap{overflow-x:auto;border:1px solid #ddd;border-radius:10px}table{width:100%;border-collapse:collapse;min-width:750px;font-size:13px}th{background:#0a2e1f;color:#fff;padding:8px;text-align:center}td{padding:6px;border:1px solid #ddd;text-align:center;background:#fff}
td input{width:70px;padding:7px;border:2px dashed #16a34a;border-radius:8px;text-align:center;font-weight:bold;background:#f3f4f6}
.pra{background:#dcfce7;font-weight:bold}.per{background:#dbeafe;font-weight:bold}.gpa{background:#fef3c7;font-weight:bold}
.row{display:flex;gap:8px;margin-top:8px}.row button{flex:1;padding:11px;border:none;border-radius:10px;font-weight:bold;color:#fff;cursor:pointer}.save{background:#16a34a}.edit{background:#6b7280}.pdf{background:#111827}.excel{background:#047857}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:none;justify-content:center;align-items:center;z-index:999}.modal.active{display:flex}.modalBox{background:#fff;width:90%;max-width:380px;border-radius:18px;padding:18px}.modalBox input{width:100%;padding:12px;margin-bottom:10px;border:2px solid #16a34a;border-radius:10px;font-size:16px}.modalBtns{display:flex;gap:10px}.modalBtns button{flex:1;padding:12px;border:none;border-radius:10px;font-weight:bold;cursor:pointer}.btnCancel{background:#e5e7eb}.btnOk{background:#2563eb;color:#fff}
</style>
</head>
<body>
<div class="main">
<button class="add" onclick="openModal()">+ শিক্ষার্থী যোগ করুন</button>
<button class="listBtn" id="listBtn" onclick="setFilter('all')">📋 শিক্ষার্থীর তালিকা দেখুন (2)</button>
<div id="list"></div>
<div class="stats">
<div class="s s2" id="presentBox" onclick="setFilter('present')">✅ উপস্থিত<br><span id="t2">0</span></div>
<div class="s s3" id="absentBox" onclick="setFilter('absent')">❌ অনুপস্থিত<br><span id="t3">0</span></div>
</div>
<button class="toggle" id="togBtn" onclick="togBox()">🏆 ফলাফল দেখুন</button>
<div class="box" id="resultBox">
<div class="sheetHead">
<span class="sheetTitle">📋 ফলাফল সিট</span>
<div class="headRight">
<button class="btnName" onclick="renameSubject()">নাম বদলান</button>
<div class="subCountBox"><label>বিষয় সংখ্যা:</label><input type="number" id="subCount" min="1" max="20" value="1"></div>
</div>
</div>
<div class="wrap"><table id="mainTable"><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
<div class="row"><button class="save" onclick="saveNow()">💾 সেভ</button><button class="edit" onclick="editNow()">✏️ এডিট</button></div>
<div class="row"><button class="pdf" onclick="toPDF_A4()">📄 PDF A4</button><button class="excel" onclick="toExcel()">📊 Excel</button></div></div>
</div>
<div class="modal" id="modal"><div class="modalBox"><h3 style="text-align:center;margin-bottom:10px">নতুন শিক্ষার্থী</h3><input id="mName" placeholder="নাম *"><input id="mRoll" placeholder="রোল *"><input id="mPhone" placeholder="মোবাইল (ঐচ্ছিক)"><div class="modalBtns"><button class="btnCancel" onclick="closeModal()">Cancel</button><button class="btnOk" onclick="confirmAdd()">OK</button></div></div></div>
<script>
const SAVE_KEY='takrim_final_v107';const UI_KEY='takrim_ui_v107';
let subNames=["বাংলা"]; let full=[100];
let students=[{name:"কালাম",roll:"202",present:true,marks:[78]},{name:"কমল",roll:"203",present:false,marks:[75]}];
let edit=true;let resultVisible=false;let listVisible=false;let filter='all';
function getGPA(per){if(per>=80)return "5.00";if(per>=70)return "4.00";if(per>=60)return "3.50";if(per>=50)return "3.00";if(per>=40)return "2.00";if(per>=33)return "1.00";return "0.00";}
function getGrade(per){if(per>=80)return "A+";if(per>=70)return "A";if(per>=60)return "A-";if(per>=50)return "B";if(per>=40)return "C";if(per>=33)return "D";return "F";}
try{let d=localStorage.getItem(SAVE_KEY); if(d){let o=JSON.parse(d); if(o.full) full=o.full; if(o.subNames) subNames=o.subNames; if(o.students) students=o.students;}}catch(e){}
try{let u=localStorage.getItem(UI_KEY); if(u){let ui=JSON.parse(u); resultVisible=ui.resultVisible||false; listVisible=ui.listVisible||false; filter=ui.filter||'all';}}catch(e){}
function autoSave(){localStorage.setItem(SAVE_KEY, JSON.stringify({full,subNames,students})); localStorage.setItem(UI_KEY, JSON.stringify({resultVisible,listVisible,filter}));}

function updateSubjects(n){
 n=parseInt(n); if(isNaN(n)||n<1) n=1; if(n>20) n=20;
 if(n > subNames.length){
  for(let i=subNames.length;i<n;i++){ subNames.push("বিষয় "+(i+1)); full.push(100); students.forEach(s=>s.marks.push(0)); }
 }else if(n < subNames.length){
  subNames=subNames.slice(0,n); full=full.slice(0,n); students.forEach(s=>s.marks=s.marks.slice(0,n));
 }
 autoSave(); renderTableOnly();
}
function renameSubject(){
 for(let i=0;i<subNames.length;i++){
  let nm=prompt((i+1)+" নং বিষয়ের নাম লিখুন:", subNames[i]);
  if(nm===null) break;
  if(nm.trim()) subNames[i]=nm.trim();
 }
 autoSave(); renderTableOnly();
}
function setFilter(f){
 if(filter===f && listVisible){ listVisible=false; } else { filter=f; listVisible=true; }
 autoSave(); render();
}
function openModal(){document.getElementById('modal').classList.add('active');}function closeModal(){document.getElementById('modal').classList.remove('active');}
function confirmAdd(){let n=document.getElementById('mName').value.trim(); let r=document.getElementById('mRoll').value.trim(); if(!n){alert('নাম লিখুন'); return;} if(!r){r=200+students.length+1;} students.push({name:n,roll:r,present:true,marks:full.map(()=>0)}); closeModal(); autoSave(); render();}
function togBox(){resultVisible=!resultVisible; autoSave(); render();}

function renderTableOnly(){
 let tb=document.getElementById('tbody'); tb.innerHTML=''; let totalFull=0; for(let f of full) totalFull+=Number(f)||0;
 let thead=document.getElementById('thead');
 let h=`<tr><th>ক্রম</th><th>নাম</th><th>রোল</th>`;
 for(let i=0;i<subNames.length;i++){ h+=`<th>${subNames[i]} ${full[i]}</th>`; }
 h+=`<th>পূর্ণমান</th><th>প্রাপ্ত</th><th>%</th><th>GPA</th></tr>`;
 thead.innerHTML=h;
 document.getElementById('mainTable').style.minWidth = (350 + subNames.length*110) + 'px';
 let trFull=`<tr style="background:#f3f4f6;font-weight:bold"><td></td><td>পূর্ণমান</td><td></td>`;
 for(let j=0;j<full.length;j++) trFull+=`<td>
