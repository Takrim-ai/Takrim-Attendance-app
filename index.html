t:space-between;align-items:center;cursor:pointer;font-weight:bold;font-size:13px;border-radius:12px 12px 0 0}.acc-b-normal{display:none;padding:8px;background:#fafafa}.acc-b-normal.on{display:block}.paP{background:#e8f5e9;color:#2e7d32;font-weight:bold}.paA{background:#ffebee;color:#c62828;font-weight:bold}.subCtrl{display:flex;gap:6px;align-items:center;background:#f3f0ff;padding:8px;border-radius:12px}</style></head><body>

ton class="menu" onclick="document.getElementById('listBox').classList.toggle('hidden')">🔒 তালিকা ▼</button><div id="listBox" class="card hidden"><button class="btn red" onclick="openListSecure()">🔓 তালিকা খুলুন</button><div id="instList"></div></div></div>
<div id="secondPageWrap" class="hidden" style="width:100%;display:flex;flex-direction:column;align-items:center"><div id="institutePad" style="width:100%;max-width:430px;background:#fff;border-radius:8px;padding:8px 10px 6px 10px;margin-bottom:8px;box-shadow:0 2px 8px #0002;border:1px solid #e5e7eb"><div style="display:flex;gap:10px;align-items:center"><img id="padLogo" style="width:62px;height:62px;border-radius:50%;border:2px solid #1e3a8a;object-fit:cover;background:#fff" src=""><div style="flex:1;text-align:center"><div id="instName" style="font-size:16px;font-weight:700;color:#1e1b8a"></div><div id="instEng" style="font-size:11px;font-weight:800;color:#b91c1c;white-space:nowrap"></div><div id="instAddress" style="font-size:12px;font-weight:600;color:#000"></div><div style="font-size:9px;font-weight:600;color:#000">Mobile: <span id="padMobile"></span> | Email: <span id="padEmail"></span> | EIIN: <span id="padEiin"></span> | INS Code: <span id="padCode"></span></div></div></div><div style="height:4px;background:#1e40af;width:calc(100% + 20px);margin:6px -10px 0 -10px"></div><div style="display:flex;justify-content:center;margin-top:6px"><div style="background:#1e3a8a;color:#fff;padding:4px 14px;border-radius:999px;font-size:11px">শ্রেণী: <span id="pillCls"></span> | শাখা: <span id="pillSec"></span> | শিফট: <span id="pillShift"></span></div></div><div style="text-align:center;margin-top:4px"><button onclick="logout()" style="background:#d61f1f;color:#fff;border:none;padding:6px 14px;border-radius:8px;font-size:12px;font-weight:bold">🚪 লগআউট</button></div></div><div id="acc" style="width:100%;max-width:430px"></div></div><script>
let students=JSON.parse(localStorage.getItem('students_v2')||'[]');let saved=JSON.parse(localStorage.getItem('fullResultSheet')||'null');let activeTab='';
function buildAcc(){let html='<div class="acc"><div class="acc-h-normal" onclick="togN(1)"><span>1️⃣ শিক্ষার্থী যোগ</span><span id="ar1">▼</span></div><div class="acc-b-normal" id="ab1"><div style="background:#fff;padding:8px;border-radius:14px"><input id="sn" placeholder="নাম"><input id="sr" placeholder="রোল"><input id="sm" placeholder="মোবাইল"><button class="btn2" style="background:#2e7d32;width:100%;padding:12px" onclick="addStu()">+ যোগ</button></div></div></div><div class="acc"><div class="acc-h-normal" onclick="togN(2)"><span>2️⃣ তালিকা</span><span id="ar2">▼</span></div><div class="acc-b-normal" id="ab2"><div id="sList"></div></div></div><div class="acc" style="border:3px solid #0d47a1"><div class="acc-h" style="background:#0d47a1"><div class="header3"><div id="hb_present" class="hbox boxPresent" onclick="setTab(\'present\')">✅ উপস্থিত<br><span id="hc_present">0</span> জন</div><div id="hb_absent" class="hbox boxAbsent" onclick="setTab(\'absent\')">❌ অনুপস্থিত<br><span id="hc_absent">0</span> জন</div><div id="hb_notice" class="hbox boxNotice" onclick="setTab(\'notice\')">📢 নোটিশ</div></div></div><div class="acc-b" id="ab3"><div id="tabContent"></div></div></div><div class="acc"><div class="acc-h-normal" onclick="togN(4)"><span>4️⃣ মাসিক হাজিরা (১-৩১)</span><span id="ar4">▼</span></div><div class="acc-b-normal" id="ab4"><div style="background:#fff;padding:6px;border-radius:14px"><div style="display:flex;justify-content:space-between"><div><input type="month" id="mp" value="'+new Date().toISOString().slice(0,7)+'" onchange="renderMonth()" style="width:130px"><button class="btn2" style="background:#ff9800" onclick="goToday()">📅 আজ</button></div><div><button class="btn2" style="background:#1565c0" onclick="window.print()">🖨️</button><button class="btn2" style="background:#c62828" onclick="delMonth()">🗑️</button></div></div><div id="monthTbl" style="margin-top:8px;overflow:auto"></div></div></div></div><div class="acc"><div class="acc-h-normal" onclick="togN(5)"><span>5️⃣ ফলাফল - গোল ডিজাইন</span><span id="ar5">▼</span></div><div class="acc-b-normal" id="ab5"><div style="background:#fff;padding:8px;border-radius:16px;border:2px solid #7c4dff"><div class="subCtrl"><b>বিষয়:</b><button onclick="chSub(-1)">-</button><input id="sc" type="number" value="5" style="width:70px;text-align:center"><button onclick="chSub(1)">+</button><button onclick="makeSheet()" style="background:#7c4dff;color:#fff;border:none;padding:6px 14px;border-radius:8px">সেট</button><span id="lockB"></span></div><div id="pdfArea" style="margin-top:8px;overflow:auto;background:#fff;padding:8px"><table class="tbl" id="rt"><thead id="rh"></thead><tbody id="rb"></tbody></table></div><div style="margin-top:8px;display:flex;gap:6px"><button style="background:#2e7d32;color:#fff;padding:10px 14px;border-radius:20px;border:none;flex:1" onclick="saveRes()">💾 সেভ লক</button><button style="background:#ff9800;color:#fff;padding:10px 14px;border-radius:20px;border:none;flex:1" onclick="unlockRes()">✏️ এডিট</button><button style="background:#1565c0;color:#fff;padding:10px 14px;border-radius:20px;border:none" onclick="calcRes()">🔄 হিসাব</button><button style="background:#c62828;color:#fff;padding:10px 14px;border-radius:20px;border:none" onclick="delRes()">🗑️</button></div><div style="margin-top:8px;display:flex;gap:8px"><button style="background:#16a34a;color:#fff;padding:10px;border:none;border-radius:20px;flex:1" onclick="expExcel()">⬇️ Excel</button><button style="background:#dc2626;color:#fff;padding:10px;border:none;border-radius:20px;flex:1" onclick="downPDF()">⬇️ PDF বাংলা FIX</button></div><p id="st" style="font-size:11px;color:green;font-weight:bold;margin-top:4px"></p></div></div></div>';document.getElementById('acc').innerHTML=html;}
function togN(i){let b=document.getElementById('ab'+i);if(!b)return;b.classList.toggle('on');if(i==2)showStu();if(i==4)renderMonth();if(i==5)makeSheet();}
function setTab(t){if(activeTab===t){activeTab='';document.querySelectorAll('.hbox').forEach(x=>x.classList.remove('active'));document.getElementById('ab3').classList.remove('show');return;}activeTab=t;document.querySelectorAll('.hbox').forEach(x=>x.classList.remove('active'));document.getElementById('hb_'+t).classList.add('active');document.getElementById('ab3').classList.add('show');renderTab();}
function renderHeaderCounts(){let p=students.filter(s=>s.present).length;let a=students.length-p;let hp=document.getElementById('hc_present');let ha=document.getElementById('hc_absent');if(hp)hp.innerText=p;if(ha)ha.innerText=a;}
function smsCurrent(){let t=document.getElementById('tabContent').innerText;let inst=document.getElementById('instName')?.innerText||'';window.location.href='sms:?body='+encodeURIComponent(inst+'\n'+t);}
function waCurrent(){let t=document.getElementById('tabContent').innerText;let inst=document.getElementById('instName')?.innerText||'';window.open('https://wa.me/?text='+encodeURIComponent(inst+'\n'+t),'_blank');}
function renderTab(){
  let n=localStorage.getItem('notice')||'';
  let p=students.filter(s=>s.present);
  let a=students.filter(s=>!s.present);
  let el=document.getElementById('tabContent');
  if(activeTab=='present'){
    let list = p.length? p.map(s=>`✅ ${s.name} (${s.roll}) - ${s.mobile}`).join('<br>') : 'কেউ নেই';
    el.innerHTML=`<div class="cbox" style="border-color:#2e7d32"><div class="cbox-head" style="background:#2e7d32">✅ মোট উপস্থিত - ${p.length} জন</div><div class="cbox-body">${list}</div></div><div style="display:flex;gap:8px;margin-top:10px"><button onclick="smsCurrent()" style="flex:1;background:#1976d2;color:#fff;padding:14px 6px;border:none;border-radius:30px;font-weight:700;font-size:13px">📱 SMS উপস্থিত</button><button onclick="waCurrent()" style="flex:1;background:#2e7d32;color:#fff;padding:14px 6px;border:none;border-radius:30px;font-weight:700;font-size:13px">💬 WhatsApp উপস্থিত</button></div>`;
  }else if(activeTab=='absent'){
    let list = a.length? a.map(s=>`❌ ${s.name} (${s.roll}) - ${s.mobile}`).join('<br>') : 'কেউ নেই';
    el.innerHTML=`<div class="cbox" style="border-color:#c62828"><div class="cbox-head" style="background:#c62828">❌ মোট অনুপস্থিত - ${a.length} জন</div><div class="cbox-body">${list}</div></div><div style="display:flex;gap:8px;margin-top:10px"><button onclick="smsCurrent()" style="flex:1;background:#c62828;color:#fff;padding:14px 6px;border:none;border-radius:30px;font-weight:700;font-size:13px">📱 SMS অনুপস্থিত</button><button onclick="waCurrent()" style="flex:1;background:#ef6c00;color:#fff;padding:14px 6px;border:none;border-radius:30px;font-weight:700;font-size:13px">💬 WhatsApp অনুপস্থিত</button></div>`;
  }else{
    el.innerHTML=`<textarea id="notice" rows="4" style="width:100%;padding:12px;border-radius:12px;border:2px solid #ff9800">${n}</textarea><div style="display:flex;gap:8px;margin-top:10px"><button onclick="smsCurrent()" style="flex:1;background:#1976d2;color:#fff;padding:14px 6px;border:none;border-radius:30px;font-weight:700">📱 SMS নোটিশ</button><button onclick="waCurrent()" style="flex:1;background:#16a34a;color:#fff;padding:14px 6px;border:none;border-radius:30px;font-weight:700">💬 WhatsApp নোটিশ</button></div><button onclick="localStorage.setItem('notice',document.getElementById('notice').value);alert('✅ সেভ')" style="width:100%;background:#ef6c00;color:#fff;padding:12px;border:none;border-radius:20px;font-weight:700;margin-top:8px">💾 সেভ</button>`;
  }
}
function addStu(){let n=document.getElementById('sn').value.trim(),r=document.getElementById('sr').value.trim(),m=document.getElementById('sm').value.trim();if(!n||!r||!m)return alert('নাম রোল মোবাইল দিন');students.push({name:n,roll:r,mobile:m,present:true});localStorage.setItem('students_v2',JSON.stringify(students));location.reload();}
function showStu(){let h='';students.forEach((s,i)=>{let bg=s.present?'#dcfce7':'#fee2e2';let btnBg=s.present?'#16a34a':'#dc2626';let icon=s.present?'✅':'❌';h+='<div style="display:flex;justify-content:space-between;align-items:center;background:'+bg+';padding:8px 10px;border-radius:20px;margin:4px 0;border:1px solid #ddd"><span>'+(i+1)+'. '+s.name+' ('+s.roll+')</span><span><button onclick="tp('+i+')" style="background:'+btnBg+';color:#fff;border:none;padding:6px 12px;border-radius:20px">'+icon+'</button> <button onclick="ds('+i+')" style="background:#fff;border:1px solid #ccc;padding:6px 10px;border-radius:20px">🗑️</button></span></div>';});document.getElementById('sList').innerHTML=h||'<div style="text-align:center;color:#999;padding:10px">কোন শিক্ষার্থী নেই</div>';renderHeaderCounts();}
function tp(i){
  students[i].present=!students[i].present;
  localStorage.setItem('students_v2',JSON.stringify(students));
  let today=new Date();let month=today.toISOString().slice(0,7);let day=today.getDate();
  let data=JSON.parse(localStorage.getItem('monthly31Data')||'{}');
  data[month+'_'+i+'_'+day]=students[i].present;
  localStorage.setItem('monthly31Data',JSON.stringify(data));
  showStu();if(activeTab)renderTab();renderMonth();
}
function ds(i){if(confirm('ডিলিট?')){students.splice(i,1);localStorage.setItem('students_v2',JSON.stringify(students));location.reload();}}
function renderMonth(){let month=document.getElementById('mp')?.value||new Date().toISOString().slice(0,7);let data=JSON.parse(localStorage.getItem('monthly31Data')||'{}');let today=new Date();let tDay=today.getDate();let tMonth=today.toISOString().slice(0,7);let html='<table border=1 style="width:100%;border-collapse:collapse;text-align:center;font-size:10px;min-width:900px"><tr style="background:#1976d2;color:#fff"><th>ক্রম</th><th>নাম</th><th>রোল</th>';for(let d=1;d<=31;d++){let cls=(month==tMonth&&d==tDay)?' class="todayCol"':'';html+='<th'+cls+'>'+d+'</th>';}html+='<th>P</th><th>A</th></tr>';students.forEach((s,idx)=>{html+='<tr><td>'+(idx+1)+'</td><td style="text-align:left">'+s.name+'</td><td>'+s.roll+'</td>';for(let d=1;d<=31;d++){let k=month+'_'+idx+'_'+d;let v=data[k];let txt=v===true?'P':v===false?'A':'';let bg=v===true?' paP':v===false?' paA':'';html+='<td class="'+bg.trim()+'" onclick="togglePA('+idx+','+d+')" style="cursor:pointer;min-width:22px">'+txt+'</td>';}html+='<td id="p_'+idx+'">0</td><td id="a_'+idx+'">0</td></tr>';});html+='</table>';document.getElementById('monthTbl').innerHTML=html;students.forEach((_,i)=>{let c=0,tot=0;for(let d=1;d<=31;d++){let k=month+'_'+i+'_'+d;let v=data[k];if(v===true)c++;if(v===true||v===false)tot++;}let pe=document.getElementById('p_'+i);if(pe)pe.innerText=c;let ae=document.getElementById('a_'+i);if(ae)ae.innerText=tot-c;});}
function togglePA(idx,d){let month=document.getElementById('mp').value;let data=JSON.parse(localStorage.getItem('monthly31Data')||'{}');let k=month+'_'+idx+'_'+d;data[k]=data[k]===true?false:data[k]===false?null:true;if(data[k]===null)delete data[k];localStorage.setItem('monthly31Data',JSON.stringify(data));renderMonth();}
function goToday(){document.getElementById('mp').value=new Date().toISOString().slice(0,7);renderMonth();}
function delMonth(){if(confirm('মুছবেন?')){let month=document.getElementById('mp').value;let data=JSON.parse(localStorage.getItem('monthly31Data')||'{}');students.forEach((_,idx)=>{for(let d=1;d<=31;d++)delete data[month+'_'+idx+'_'+d];});localStorage.setItem('monthly31Data',JSON.stringify(data));renderMonth();}}
function chSub(n){let c=parseInt(document.getElementById('sc').value)||5;c+=n;if(c<1)c=1;if(c>20)c=20;document.getElementById('sc').value=c;}
function makeSheet(){
  let cnt=parseInt(document.getElementById('sc').value)||5;
  let subs=saved?.subjects||[{name:'বাংলা',full:100},{name:'ইংরেজি',full:100},{name:'গণিত',full:100},{name:'বিজ্ঞান',full:50},{name:'ধর্ম',full:50}];
  let head='<tr><th>রোল</th><th>নাম</th>';for(let i=0;i<cnt;i++){let s=subs[i]||{name:'বি'+(i+1),full:100};head+='<th><input id="sn'+i+'" value="'+s.name+'" class="subName"></th>';}head+='<th>মোট</th><th>প্রাপ্ত</th><th>%</th><th>GPA</th></tr>';
  let fullRow='<tr style="background:#fff8e1"><td colspan="2">পূর্ণমান</td>';for(let i=0;i<cnt;i++){let s=subs[i]||{full:100};fullRow+='<td><input id="sf'+i+'" type="number" value="'+s.full+'" class="subFull"></td>';}fullRow+='<td colspan="4"><span class="pillTotal" id="totalFull">-</span></td></tr>';
  document.getElementById('rh').innerHTML=head+fullRow;
  let body='';students.forEach((s,idx)=>{body+='<tr><td>'+s.roll+'</td><td style="text-align:left;font-weight:bold">'+s.name+'</td>';for(let j=0;j<cnt;j++){let old=saved?.marks?.[idx]?.[j]||'';body+='<td><input id="m_'+idx+'_'+j+'" type="number" value="'+old+'" class="markGol" oninput="calcRes()"></td>';}body+='<td><span class="pillTotal" id="f_'+idx+'">-</span></td><td><span class="pillGot" id="o_'+idx+'">-</span></td><td id="pe_'+idx+'">-</td><td id="g_'+idx+'">-</td></tr>';});document.getElementById('rb').innerHTML=body;calcRes();applyLock();
}
function applyLock(){
  let locked=localStorage.getItem('fullResultSheetLocked')=='true';
  document.querySelectorAll('#rh input, #rb input, #sc').forEach(el=>{
    el.disabled=locked;
    el.style.opacity=locked?'0.6':'1';
  });
  let b=document.getElementById('lockB');
  if(b) b.innerHTML=locked?'<span style="background:#dc2626;color:#fff;padding:4px 10px;border-radius:20px;font-size:11px">🔒 লক</span>':'<span style="background:#16a34a;color:#fff;padding:4px 10px;border-radius:20px;font-size:11px">✏️ খোলা</span>';
}
function calcRes(){let cnt=parseInt(document.getElementById('sc').value)||5;let tot=0;for(let j=0;j<cnt;j++)tot+=parseInt(document.getElementById('sf'+j)?.value)||0;document.getElementById('totalFull').innerText=tot;students.forEach((_,idx)=>{let f=0,o=0;for(let j=0;j<cnt;j++){f+=parseInt(document.getElementById('sf'+j)?.value)||0;o+=parseInt(document.getElementById('m_'+idx+'_'+j)?.value)||0;}let per=f?(o/f*100).toFixed(1):0;let gpa=Math.min(5,per/20).toFixed(2);document.getElementById('f_'+idx).innerText=f;document.getElementById('o_'+idx).innerText=o;document.getElementById('pe_'+idx).innerText=per+'%';document.getElementById('g_'+idx).innerText=gpa;});}
function saveRes(){
  let cnt=parseInt(document.getElementById('sc').value)||5;
  let subs=[];for(let i=0;i<cnt;i++)subs.push({name:document.getElementById('sn'+i).value,full:document.getElementById('sf'+i).value});
  let marks=[];students.forEach((_,idx)=>{let r=[];for(let j=0;j<cnt;j++)r.push(document.getElementById('m_'+idx+'_'+j).value);marks.push(r);});
  localStorage.setItem('fullResultSheet',JSON.stringify({subjects:subs,marks:marks,count:cnt}));
  localStorage.setItem('fullResultSheetLocked','true');
  saved=JSON.parse(localStorage.getItem('fullResultSheet'));
  document.getElementById('st').innerText='🔒 ফিক্সড - এডিট ছাড়া চেঞ্জ হবে না';
  applyLock();
}
function unlockRes(){
  if(!confirm('এডিট করবেন? লক খুলে যাবে'))return;
  localStorage.setItem('fullResultSheetLocked','false');
  document.getElementById('st').innerText='✏️ এডিট মোড খোলা';
  applyLock();
}
function delRes(){if(confirm('মুছবেন?')){localStorage.removeItem('fullResultSheet');localStorage.removeItem('fullResultSheetLocked');document.getElementById('st').innerText='🗑️ মুছা';saved=null;makeSheet();}}
function expExcel(){let cnt=parseInt(document.getElementById('sc').value)||5;let header=['রোল','নাম'];for(let i=0;i<cnt;i++)header.push(document.getElementById('sn'+i)?.value||'বি'+(i+1));header.push('মোট','প্রাপ্ত','%','GPA');let rows=[];students.forEach((s,idx)=>{let r=[s.roll,s.name];for(let j=0;j<cnt;j++)r.push(document.getElementById('m_'+idx+'_'+j)?.value||0);r.push(document.getElementById('f_'+idx)?.innerText||'',document.getElementById('o_'+idx)?.innerText||'',document.getElementById('pe_'+idx)?.innerText||'',document.getElementById('g_'+idx)?.innerText||'');rows.push(r);});let aoa=[header,...rows];let ws=XLSX.utils.aoa_to_sheet(aoa);let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Result');XLSX.writeFile(wb,'Result_'+new Date().toISOString().slice(0,10)+'.xlsx');}
async function downPDF(){
  let area=document.getElementById('pdfArea');
  if(!area)return alert('ফলাফল নেই');
  document.getElementById('st').innerText='⏳ PDF তৈরি...';
  calcRes();
  try{
    let oldW=area.style.width;let oldO=area.style.overflow;
    area.style.width='1100px';area.style.overflow='visible';area.style.background='#fff';
    window.scrollTo(0,0);
    let canvas=await html2canvas(area,{scale:2,useCORS:true,backgroundColor:'#ffffff',scrollY:0,windowWidth:1200});
    area.style.width=oldW;area.style.overflow=oldO;
    let imgData=canvas.toDataURL('image/png');
    let {jsPDF}=window.jspdf;let pdf=new jsPDF('l','mm','a4');
    let pageW=pdf.internal.pageSize.getWidth();let pageH=pdf.internal.pageSize.getHeight();
    let imgW=pageW-20;let imgH=canvas.height*imgW/canvas.width;
    if(imgH <= pageH-20){pdf.addImage(imgData,'PNG',10,10,imgW,imgH);}
    else{let remaining=imgH;let position=10;pdf.addImage(imgData,'PNG',10,position,imgW,imgH);remaining-=(pageH-20);while(remaining>0){pdf.addPage();position=-(imgH-remaining-10);pdf.addImage(imgData,'PNG',10,position,imgW,imgH);remaining-=(pageH-20);}}
    pdf.save('Result_'+new Date().toISOString().slice(0,10)+'.pdf');
    document.getElementById('st').innerText='✅ PDF OK';
  }catch(e){document.getElementById('st').innerText='❌ '+e.message;}
}
let insts=JSON.parse(localStorage.getItem('takrim_primary_insts')||'[]');let tempLogo=localStorage.getItem('takrim_temp_logo')||'';function refreshInstSelect(){let el=document.getElementById('loginInst');if(!el)return;el.innerHTML='<option value="">প্রতিষ্ঠান নির্বাচন</option>'+insts.map((x,i)=>'<option value="'+i+'">'+x.bnName+'</option>').join('');}refreshInstSelect();
let logoInput=document.getElementById('logoInput');if(logoInput)logoInput.addEventListener('change',function(){if(this.files&&this.files[0]){let r=new FileReader();r.onload=e=>{tempLogo=e.target.result;document.getElementById('logoPreview').src=tempLogo;document.getElementById('mainBannerImg').src=tempLogo;localStorage.setItem('takrim_temp_logo',tempLogo);};r.readAsDataURL(this.files[0]);}});
function savePrimary(){let o={bnName:document.getElementById('bnName').value.trim(),addr:document.getElementById('address').value.trim(),eiin:document.getElementById('eiin').value.trim(),schoolCode:document.getElementById('schoolCode').value.trim(),mobile:document.getElementById('mobile').value.trim(),email:document.getElementById('email').value.trim(),pass:document.getElementById('pass1').value,logo:tempLogo||'IMG-20261005-WA0019(3).jpg'};if(!o.bnName||!o.pass)return alert('নাম পাস দিন');insts.push(o);localStorage.setItem('takrim_primary_insts',JSON.stringify(insts));alert('✅ সেভ');location.reload();}
function primaryLogin(){let idx=document.getElementById('loginInst').value;if(idx==='')return document.getElementById('loginMsg').textContent='নির্বাচন';let ins=insts[idx];if(document.getElementById('loginPass').value!==ins.pass)return document.getElementById('loginMsg').textContent='❌ ভুল';localStorage.setItem('takrim_session',JSON.stringify({inst:ins,cls:document.getElementById('cls').value,shift:document.getElementById('shift').value,section:document.getElementById('section').value}));showSecondPage();}
function showSecondPage(){let sess=JSON.parse(localStorage.getItem('takrim_session')||'null');if(!sess)return;document.getElementById('firstPageWrap').classList.add('hidden');document.getElementById('secondPageWrap').classList.remove('hidden');document.body.style.background='#f0f4f8';let bn=sess.inst.bnName||'';document.getElementById('instName').innerText=bn;let engEl=document.getElementById('instEng');if(bn.includes('মমতাজ')||bn.toLowerCase().includes('momtaz')){engEl.innerText='MOMTAZ UDDIN BUSINESS MANAGEMENT COLLEGE';engEl.style.display='block';}else if(bn.includes('মাহমুদপুর')){engEl.innerText='MAHMUDPUR HIGH SCHOOL';engEl.style.display='block';}else{engEl.innerText='';engEl.style.display='none';}document.getElementById('instAddress').innerText=sess.inst.addr;document.getElementById('padLogo').src=sess.inst.logo;document.getElementById('padMobile').innerText=sess.inst.mobile;document.getElementById('padEmail').innerText=sess.inst.email;document.getElementById('padEiin').innerText=sess.inst.eiin;document.getElementById('padCode').innerText=sess.inst.schoolCode;document.getElementById('pillCls').innerText=sess.cls;document.getElementById('pillSec').innerText=sess.section;document.getElementById('pillShift').innerText=sess.shift;buildAcc();showStu();renderHeaderCounts();}

      <button onclick="if(confirm('ডিলিট করলে ${s.bnName} আর ঢুকতে পারবে না! নতুন করে ফরম পূরণ করতে হবে। ডিলিট?')){insts.splice(${i},1);localStorage.setItem('takrim_primary_insts',JSON.stringify(insts));openListSecure();refreshInstSelect();}" style="background:#fee2e2;border:none;padding:6px 10px;border-radius:8px;font-size:14px">🗑️</button>
    </div>
