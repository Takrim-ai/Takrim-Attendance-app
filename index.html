<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>শিক্ষার্থীর তালিকা</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;font-family:'Hind Siliguri',sans-serif;margin:0}
body{background:#0a2e1e;min-height:100vh;padding:10px}
.top{text-align:center;color:#fff;padding:8px 0}
.top h1{font-size:24px}.top p{color:#ffcc00;font-size:14px;font-weight:700;margin-top:6px}
.btn-dash{background:#fff;border:none;border-radius:20px;padding:6px 18px;font-weight:700;margin-top:10px;cursor:pointer}
.main{background:#fff;border-radius:26px;padding:12px;margin-top:8px}
.add-btn{width:100%;border:2.5px dashed #16a34a;background:#e8f5e9;border-radius:16px;padding:16px;font-size:16px;font-weight:700;cursor:pointer}
.stats{display:flex;gap:8px;margin-top:12px}
.stats div{flex:1;border-radius:14px;padding:12px 2px;text-align:center;font-weight:700}
.s-yellow{background:#ffcc00}.s-green{background:#16a34a;color:#fff}.s-purple{background:#7c3aed;color:#fff;cursor:pointer}
.s-red-full{background:#ef4444;color:#fff;width:100%;border-radius:14px;padding:12px;text-align:center;font-weight:700;margin-top:8px;cursor:pointer}
.controls{background:#f3e8ff;border:2px solid #8b5cf6;border-radius:18px;padding:10px;margin-top:12px}
.c-row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;align-items:center}
.c-btn{border:none;border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer}
.purple{background:#7c3aed;color:#fff}.blue{background:#0ea5e9;color:#fff}.green2{background:#16a34a;color:#fff}.gray{background:#6b7280;color:#fff}.red{background:#ef4444;color:#fff}
.input-sm{border:2px solid #ddd;border-radius:12px;padding:10px;width:75px;text-align:center;font-weight:700}
.table-wrap{overflow:auto;margin-top:8px;border:2px solid #ddd;border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:700px}
th,td{border:1px solid #ddd;padding:7px;text-align:center;font-size:13px}
th{background:#f9fafb}
.mark-input{width:55px;border:2px solid #ddd;border-radius:8px;padding:6px;text-align:center;font-weight:700}
.full-input{background:#fef9c3}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;justify-content:center;align-items:center;z-index:99}
.modal-box{background:#fff;border-radius:20px;padding:18px;width:360px;max-width:92%}
.modal-box input{width:100%;padding:13px;border-radius:12px;border:1.8px solid #ddd;margin:7px 0;font-size:15px}
.hidden{display:none!important}
@media print{body{background:#fff}.no-print{display:none!important}.main{box-shadow:none} }
</style>
</head>
<body>

<div class="top no-print">
<h1>শিক্ষার্থীর তালিকা</h1>
<p id="classInfo">শ্রেণী: ১ম শ্রেণি | সেশন 2025-26 | সেমিস্টার ক</p>
<button class="btn-dash" onclick="location.href='second-page.html'">ড্যাশবোর্ড</button>
</div>

<div class="main" id="printArea">
<button class="add-btn no-print" onclick="openAddModal()">শিক্ষার্থী যোগ করুন (+)</button>

<!-- সিরিয়াল চেঞ্জ: 1.সবাই 2.উপস্থিত 3.ফলাফল -->
<div class="stats no-print">
<div class="s-yellow">সবাই<br><span id="cAll">0</span></div>
<div class="s-green">উপস্থিত<br><span id="cPresent">0</span></div>
<div class="s-purple" onclick="toggleResult()">ফলাফল<br>👁️</div>
</div>
<!-- 4 নম্বরটা নিচে আলাদা -->
<div class="s-red-full no-print" onclick="filterAbsent()">অনুপস্থিত - <span id="cAbsent">0</span> জন</div>

<div class="controls no-print">
<div class="c-row">
<button class="c-btn purple" onclick="renameSubs()">নাম বদলান</button>
<span style="font-weight:700">বিষয়:</span>
<input id="subCount" class="input-sm" type="number" value="5">
<span style="font-weight:700">পূর্ণমান:</span>
<input id="fullMark" class="input-sm" type="number" value="100">
</div>
<div class="c-row">
<button class="c-btn blue" onclick="applyCounts()">পূর্ণমান সেট</button>
<button class="c-btn green2" onclick="downloadExcel()">এক্সেল</button>
<button class="c-btn gray" onclick="window.print()">📄 PDF / প্রিন্ট</button>
<button class="c-btn red" onclick="deleteAll()">সব ডিলিট</button>
</div>
</div>

<div class="table-wrap">
<table id="mainTable">
<thead id="tHead"></thead>
<tbody id="tBody"></tbody>
</table>
</div>
</div>

<!-- নতুন শিক্ষার্থী - ৩ ঘর -->
<div id="addModal" class="modal hidden no-print">
<div class="modal-box">
<h2 style="text-align:center;margin-bottom:10px">নতুন শিক্ষার্থী</h2>
<input id="sName" placeholder="নাম লিখুন (যেমন Kalam)">
<input id="sRoll" placeholder="রোল (যেমন 201)" type="number">
<input id="sMobile" placeholder="মোবাইল নাম্বার (যেমন 017...)" type="tel">
<div style="display:flex;gap:8px;margin-top:12px">
<button class="c-btn blue" style="flex:1;padding:14px" onclick="saveStudent()">সেভ</button>
<button class="c-btn red" style="flex:1;padding:14px" onclick="closeAddModal()">বাতিল</button>
</div>
</div>
</div>

<script>
let session=JSON.parse(localStorage.getItem('takrim_session')||'null');
let allStudents=JSON.parse(localStorage.getItem('takrim_students')||'[]');
let subjects=JSON.parse(localStorage.getItem('takrim_subjects')||'["বাংলা","ইংরেজি"]');
let fullMarks=JSON.parse(localStorage.getItem('takrim_fullmarks')||'[100,100]');
let showResult=true; let filterMode='all';

if(session)document.getElementById('classInfo').textContent=`শ্রেণী: ${session.cls} | সেশন 2025-26 | সেমিস্টার ${session.section}`;

function getFiltered(){let list=allStudents.filter(s=>!session||(s.cls===session.cls && s.section===session.section)); if(filterMode==='absent')return list.filter(s=>s.present===false); return list;}

function saveMeta(){localStorage.setItem('takrim_subjects',JSON.stringify(subjects));localStorage.setItem('takrim_fullmarks',JSON.stringify(fullMarks));localStorage.setItem('takrim_students',JSON.stringify(allStudents));}

function render(){
let students=getFiltered();
let totalAll=allStudents.filter(s=>!session||(s.cls===session.cls && s.section===session.section));
document.getElementById('cAll').textContent=totalAll.length;
document.getElementById('cPresent').textContent=totalAll.filter(s=>s.present!==false).length;
document.getElementById('cAbsent').textContent=totalAll.filter(s=>s.present===false).length;
document.getElementById('subCount').value=subjects.length;
document.getElementById('fullMark').value=fullMarks[0]||100;

let head=`<tr><th>ক্রম</th><th>নাম</th><th>রোল</th><th>মোবাইল</th>`;
subjects.forEach((sub,i)=>head+=`<th>${sub}</th>`);
if(showResult)head+=`<th>প্রাপ্ত</th><th>%</th><th>গ্রেড</th><th>জিপিএ</th>`;
head+=`<th class="no-print">ডিলিট</th></tr>`;
head+=`<tr><td></td><td></td><td>পূর্ণমান</td><td></td>`;
fullMarks.forEach((fm,i)=>head+=`<td><input class="mark-input full-input" value="${fm}" onchange="editFull(${i},this.value)"></td>`);
if(showResult)head+=`<td colspan="4"></td><td class="no-print"></td>`;
head+='</tr>';
document.getElementById('tHead').innerHTML=head;

let body='';
students.forEach((st,idx)=>{
let marks=st.marks||Array(subjects.length).fill('');
let total=marks.reduce((a,b)=>a+(parseFloat(b)||0),0);
let fullTotal=fullMarks.reduce((a,b)=>a+(parseFloat(b)||0),0);
let perc=fullTotal?((total/fullTotal)*100).toFixed(1):0;
let grade=perc>=80?'A+':perc>=70?'A':perc>=60?'A-':perc>=50?'B':'F';
let gpa=perc>=80?'5.00':perc>=70?'4.00':perc>=60?'3.50':'0.00';
body+=`<tr><td>${idx+1}</td><td style="text-align:left">${st.name}</td><td>${st.roll}</td><td>${st.mobile||''}</td>`;
marks.forEach((m,i)=>body+=`<td><input class="mark-input" type="number" value="${m}" onchange="editMark(${allStudents.indexOf(st)},${i},this.value)"></td>`);
if(showResult)body+=`<td><b>${total}</b></td><td>${perc}</td><td>${grade}</td><td>${gpa}</td>`;
body+=`<td class="no-print"><button onclick="deleteOne(${allStudents.indexOf(st)})" style="border:none;background:#fee2e2;padding:6px 8px;border-radius:8px;cursor:pointer">🗑️</button></td></tr>`;
});
document.getElementById('tBody').innerHTML=body||`<tr><td colspan="20">কোনো শিক্ষার্থী নেই</td></tr>`;
}

function applyCounts(){
let n=parseInt(document.getElementById('subCount').value)||2; if(n>13)n=13;
let fm=parseInt(document.getElementById('fullMark').value)||100;
subjects=Array.from({length:n},(_,i)=>subjects[i]||`বিষয় ${i+1}`);
fullMarks=Array.from({length:n},()=>fm);
saveMeta();render();
}
function editFull(i,v){fullMarks[i]=parseInt(v)||0;saveMeta();render();}
function editMark(gIdx,sIdx,v){if(!allStudents[gIdx].marks)allStudents[gIdx].marks=[];allStudents[gIdx].marks[sIdx]=v;saveMeta();render();}
function renameSubs(){let names=prompt('বিষয়ের নাম কমা দিয়ে লিখুন',subjects.join(','));if(!names)return;subjects=names.split(',').map(s=>s.trim());saveMeta();render();}
function openAddModal(){document.getElementById('addModal').classList.remove('hidden')}function closeAddModal(){document.getElementById('addModal').classList.add('hidden')}
function saveStudent(){
let name=sName.value.trim(),roll=sRoll.value.trim(),mobile=sMobile.value.trim();
if(!name||!roll)return alert('নাম ও রোল দিন');
allStudents.push({name,roll,mobile,cls:session?.cls||'১ম শ্রেণি',section:session?.section||'ক',marks:Array(subjects.length).fill(''),present:true});
saveMeta();closeAddModal();sName.value='';sRoll.value='';sMobile.value='';render();
}
function deleteOne(i){if(confirm('এই শিক্ষার্থী ডিলিট করবেন?')){allStudents.splice(i,1);saveMeta();render();}}
function deleteAll(){if(confirm('এই ক্লাসের সব ডিলিট হবে!')){let ids=getFiltered().map(s=>allStudents.indexOf(s)).sort((a,b)=>b-a);ids.forEach(i=>allStudents.splice(i,1));saveMeta();render();}}
function toggleResult(){showResult=!showResult;render();}
function filterAbsent(){filterMode=filterMode==='absent'?'all':'absent';render();}
function downloadExcel(){
let students=getFiltered();
let header=['ক্রম','নাম','রোল','মোবাইল',...subjects,'প্রাপ্ত','%','গ্রেড','জিপিএ'];
let rows=students.map((st,i)=>{
let marks=st.marks||Array(subjects.length).fill('');
let total=marks.reduce((a,b)=>a+(parseFloat(b)||0),0);
let fullTotal=fullMarks.reduce((a,b)=>a+(parseFloat(b)||0),0);
let perc=fullTotal?((total/fullTotal)*100).toFixed(1):0;
return [i+1,st.name,st.roll,st.mobile||'',...marks,total,perc,'',''];
});
let ws=XLSX.utils.aoa_to_sheet([header,['','','','পূর্ণমান',...fullMarks],...rows]);
let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Result');
XLSX.writeFile(wb,`result_${document.getElementById('classInfo').textContent}.xlsx`);
}
render();
</script>
</body>
</html>
