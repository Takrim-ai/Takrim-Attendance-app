<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MALEK Monogram + Primary Hajira</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Hind Siliguri',sans-serif}
body{margin:0;background:#082a1e;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:15px}
.monogram{
 width:400px;max-width:95%;border:4px solid #ffcc00;border-radius:22px;overflow:hidden;background:#000;box-shadow:0 8px 20px rgba(0,0,0,.5);
}
.monogram img{width:100%;height:240px;object-fit:cover;display:block}
.green-box{
 width:400px;max-width:95%;background:#16a34a;border-radius:16px;padding:14px;margin-top:12px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.3);
}
.green-box span{
 background:#000;color:#fff;display:inline-block;padding:8px 22px;border-radius:30px;font-weight:700;font-size:18px;letter-spacing:.5px;
}
</style>
</head>
<body>

<div class="monogram">
  <img src="IMG-20261005-WA0019(3).jpg" onerror="this.src='https://via.placeholder.com/400x240?text=MALEK+ATTENDANCE'" alt="MALEK">
</div>

<div class="green-box">
  <span>প্রাথমিক বিদ্যালয় হাজিরা</span>
</div>

</body>
</html>
