<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MALEK PRIMARY</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Hind Siliguri',sans-serif}
body{margin:0;background:#082a1e;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:10px}
.main-banner{width:380px;max-width:95%;border:4px solid #ffcc00;border-radius:22px;overflow:hidden;margin-top:10px}
.main-banner img{width:100%;display:block}
.page{display:none;width:100%;max-width:420px}.page.active{display:flex;flex-direction:column;align-items:center;width:100%}
.card{background:#fff;margin-top:14px;border-radius:24px;padding:18px;width:100%;box-shadow:0 6px 18px rgba(0,0,0,.3)}
input,select,textarea{width:100%;padding:14px;border-radius:14px;border:1.8px solid #d1d5db;font-size:16px;margin:7px 0;outline:none}
label{font-size:15px;font-weight:700;color:#1e40af;margin-top:8px;display:block}
.step{background:#eef4ff;border-radius:16px;padding:10px 12px;margin:8px 0}
.btn{width:100%;padding:14px;border:none;border-radius:14px;font-size:18px;font-weight:700;cursor:pointer;margin-top:10px}
.yellow{background:#ffcc00;color:#000}
.green{background:#0a7a42;color:#fff}
.blue{background:#0d5bff;color:#fff}
.red{background:#d61f1f;color:#fff}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center;margin:8px 0;color:#fff}
</style>
</head>
<body>

<!-- ১ম পাতা -->
<div id="home" class="page active">
<div class="main-banner"><img src="IMG-20261005-WA0019(3).jpg" onerror="this.src='https://via.placeholder.com/400x300?text=MALEK+PRIMARY'"></div>

<div class="card">
<div style="text-align:center;color:#0d5bff;font-weight:700;font-size:19px;margin-bottom:8px">🏫 প্রাইমারি প্রতিষ্ঠান ফরম</div>
<button class="btn yellow" onclick="document.getElementById('logoInput').click()">🖼️ লোগো চেঞ্জ</button><input type="file" id="logoInput" accept="image/*" style="display:none" onchange="previewLogo(this)">
<input id="bnName" placeholder="বাংলা নাম - ২৭নং পোতরপাড়া আছমা খাতুন সরকারি">
<input id="address" placeholder="ঠিকানা - পোতরপাড়া, চাটখিল, নোয়াখালী">
<div style="display:flex;gap:8px"><input id="eiin" placeholder="9141109607" value="9141109607"><input id="schoolCode" placeholder="School Code"></div>
<div style="display:flex;gap:8px"><input id="mobile" placeholder="মোবাইল"><input id="email" placeholder="Email"></div>
<input id="headName" placeholder="প্রধান শিক্ষকের নাম">
<input id="pass1" type="password" placeholder="🔑 পাসওয়ার্ড">
<button class="btn green" onclick="savePrimary()">সেভ করুন ✅</button>
</div>

<div class="card">
<div style="text-align:center;color:#0d5bff;font-weight:700;font-size:19px;margin-bottom:8px">🔐 প্রতিষ্ঠান লগইন</div>
<select id="loginInst"></select>
<div class="step"><label>ধাপ ১: শিফট</label><select id="shift"><option>🌅 প্রভাতি</option><option>দিবা</option></select></div>
<div class="step"><label>ধাপ ২: শ্রেণি</label><select id="cls"><option>প্রাক-প্রাথমিক</option><option>১ম শ্রেণি</option><option>২য় শ্রেণি</option><option>৩য় শ্রেণি</option><option>৪র্থ শ্রেণি</option><option>৫ম শ্রেণি</option></select></div>
<div class="step"><label>ধাপ ৩: শাখা</label><select id="section"><option>N/A</option><option>ক</option><option>খ</option></select></div>
<div class="step"><label>ধাপ ৪: পাসওয়ার্ড</label><input id="loginPass" type="password" placeholder="পাসওয়ার্ড"></div>
<button class="btn blue" onclick="primaryLogin()">🔒 প্রবেশ করুন</button>
<p id="loginMsg" style="color:red;text-align:center"></p>
</div>

<div class="card">
<div style="text-align:center;color:#0d5bff;font-weight:700;font-size:19px;margin-bottom:8px">🔒 প্রতিষ্ঠানের তালিকা</div>
<input id="adminName" placeholder="এডমিন নাম - malek" value="malek">
<input id="adminPass" type="password" placeholder="এডমিন পাসওয়ার্ড - takrim2022" value="takrim2022">
<button class="btn red" onclick="openList()">🔓 তালিকা খুলুন</button>
<div id="instList" style="margin-top:12px"></div>
</div>

</div>

<!-- ২য় পাতা - DASHBOARD -->
<div id="dashPage" class="page">
<div class="topbar"><button onclick="show('home')" style="background:#ffcc00;border:none;border-radius:10px;padding:8px 14px;font-weight:bold">⬅ ফিরুন</button><span id="dashTitle" style="font-weight:700"></span><span></span></div>
<div class="card">
<img id="dashLogo" src="IMG-20261005-WA0019(3).jpg" style="width:60px;height:60px;border-radius:50%;border:3px solid #ffcc00;display:block;margin:0 auto">
<h3 id="dashBn" style="text-align:center;margin:8px 0 0"></h3><p id="dashAddr" style="text-align:center;font-size:12px;color:#555;margin:2px 0"></p>
<p style="text-align:center;color:#0a7a42;font-weight:700">শ্রেণি: <span id="dashCls"></span> | শিফট: <span id="dashShift"></span></p>
<button class="btn yellow" onclick="show('studentPage')">👥 শিক্ষার্থীর তালিকা দেখুন</button>
<button class="btn" style="background:#fff;border:2px dashed #0d5bff;color:#0d5bff" onclick="toggleMonthly()">📅 মাসিক হাজিরা দেখুন</button>
<div id="monthlyDiv" style="display:none;margin-top:10px;border:2px dashed #0d5bff;border-radius:12px;padding:10px;overflow:auto"></div>
<textarea id="noticeText" placeholder="📢 নোটিশ লিখুন..."></textarea>
<button class="btn blue" onclick="shareNotice()">📢 নোটিশ WhatsApp এ দিন</button>
<button class="btn green" onclick="shareReport()">📊 রিপোর্ট WhatsApp এ দিন</button>
<button onclick="show('home')" class="btn" style="background:#333;color:#fff">⬅️ লগআউট</button>
</div></div>

<!-- ৩য় পাতা - STUDENT LIST - ক্যামেরা বাদ -->
<div id="studentPage" class="page">
<div class="topbar"><button onclick="show('dashPage')" style="background:#fff;border:none;border-radius:10px;padding:8px 14px;font-weight:bold">⬅️ ড্যাশবোর্ড</button><span style="font-weight:700;color:#fff">শিক্ষার্থী</span><span></span></div>
<div class="card">
<div style="display:flex;gap:6px;margin-bottom:10px">
<button style="flex:1;padding:8px;background:#ffcc00;border:none;border-radius:8px;font-weight:bold" onclick="filterList('all')">সবাই<br><span id="cAll">0</span></button>
<button style="flex:1;padding:8px;background:#16a34a;color:#fff;border:none;border-radius:8px" onclick="filterList('present')">✅<br><span id="cPre">0</span></button>
<button style="flex:1;padding:8px;background:#ef4444;color:#fff;border:none;border-radius:8px" onclick="filterList('absent')">❌<br><span id="cAbs">0</span></button>
<button style="flex:1;padding:8px;background:#7c3aed;color:#fff;border:none;border-radius:8px" onclick="filterList('result')">🏆</button>
</div>
<div id="sList"></div>
<div id="resDiv" style="display:none"><div style="background:#f5f3ff;border:2px solid #7c3aed;border-radius:12px;padding:10px"><h3 style="text-align:center;color:#7c3aed">🏆 ফলাফল</h3><div id="resInputs"></div><button class="btn" style="background:#7c3aed;color:#fff" onclick="saveResults()">💾 সেভ</button></div></div>
<button onclick="toggleAdd()" style="width:100%;margin-top:10px;padding:12px;background:#dcfce7;border:2px dashed #16a34a;border-radius:12px;font-weight:bold">➕ শিক্ষার্থী যোগ করুন</button>
<div id="addForm" style="display:none;margin-top:10px;background:#f0fdf4;padding:10px;border-radius:12px"><input id="sName" placeholder="নাম"><input id="sRoll" placeholder="রোল"><input id="sMobile" placeholder="মোবাইল"><button class="btn green" onclick="addStudent()">✅ যোগ করুন</button></div>
</div></div>

<script>
function show(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');}
let insts=JSON.parse(localStorage.getItem('takrim_primary_insts')||'[]');
let curClass="",students=[],att={},res={},curInst=null;
function refreshInstSelect(){loginInst.innerHTML='<option value="">প্রতিষ্ঠান নির্বাচন করুন</option>'+insts.map((x,i)=>`<option value="${i}">${x.bnName} (${x.schoolCode||x.eiin})</option>`).join('');}
refreshInstSelect();
function previewLogo(inp){if(inp.files[0]){let r=new FileReader();r.onload=e=>{localStorage.setItem('takrim_temp_logo',e.target.result);alert('লোগো সিলেক্ট হয়েছে, সেভ করুন');};r.readAsDataURL(inp.files[0]);}}
function savePrimary(){let obj={bnName:bnName.value.trim(),addr:address.value.trim(),eiin:eiin.value.trim(),schoolCode:schoolCode.value.trim(),mobile:mobile.value.trim(),email:email.value.trim(),head:headName.value.trim(),pass:pass1.value,logo:localStorage.getItem('takrim_temp_logo')||'IMG-20261005-WA0019(3).jpg'};if(!obj.bnName||!obj.pass)return alert('নাম ও পাসওয়ার্ড দিন');insts.push(obj);localStorage.setItem('takrim_primary_insts',JSON.stringify(insts));localStorage.removeItem('takrim_temp_logo');refreshInstSelect();alert('✔️ প্রাইমারি প্রতিষ্ঠান সেভ হয়েছে');}
function primaryLogin(){let idx=loginInst.value;if(idx==="")return loginMsg.textContent='প্রতিষ্ঠান নির্বাচন করুন';let ins=insts[idx];if(loginPass.value!==ins.pass)return loginMsg.textContent='❌ পাসওয়ার্ড ভুল';curInst=ins;curClass=cls.value;loadData();dashBn.textContent=ins.bnName;dashAddr.textContent=ins.addr;dashCls.textContent=curClass;dashShift.textContent=shift.value;dashLogo.src=ins.logo;show('dashPage');}
function openList(){if(adminName.value!=='malek'||adminPass.value!=='takrim2022')return alert('❌ এডমিন ভুল');instList.innerHTML=insts.map((s,i)=>`<div style="display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #eee"><div><b>${s.bnName}</b><br><small>${s.eiin} | ${s.schoolCode}</small></div><button onclick="insts.splice(${i},1);localStorage.setItem('takrim_primary_insts',JSON.stringify(insts));refreshInstSelect();openList()" style="background:#fee2e2;border:none;padding:6px 10px;border-radius:8px">🗑️</button></div>`).join('')||'নাই';}
function key(n){return n+'_'+curInst.eiin+'_'+curClass+'_'+shift.value;}
function loadData(){students=JSON.parse(localStorage.getItem(key('students'))||'[]');att=JSON.parse(localStorage.getItem(key('att'))||'{}');res=JSON.parse(localStorage.getItem(key('res'))||'{}');}
function saveAll(){localStorage.setItem(key('students'),JSON.stringify(students));localStorage.setItem(key('att'),JSON.stringify(att));localStorage.setItem(key('res'),JSON.stringify(res));}
function toggleAdd(){addForm.style.display=addForm.style.display=='none'?'block':'none';}
function addStudent(){if(!sName.value.trim())return alert('নাম দিন');students.push({name:sName.value.trim(),roll:sRoll.value.trim(),mobile:sMobile.value.trim()});saveAll();sName.value='';sRoll.value='';sMobile.value='';addForm.style.display='none';updateCounts();render();}
function updateCounts(){let p=0;students.forEach((_,i)=>{if(att[i]!=='absent')p++;});cAll.textContent=students.length;cPre.textContent=p;cAbs.textContent=students.length-p;}
function filterList(t){if(t=='result'){sList.style.display='none';resDiv.style.display='block';renderRes();}else{sList.style.display='block';resDiv.style.display='none';render(t);}}
function render(f='all'){sList.innerHTML='';students.forEach((s,i)=>{if(f=='present'&&att[i]=='absent')return;if(f=='absent'&&att[i]!=='absent')return;let isP=att[i]!=='absent';sList.innerHTML+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid #eee"><div><b>${s.roll}. ${s.name}</b><br><small>📞 ${s.mobile||'N/A'}</small>${res[i]?`<br><small style="color:#7c3aed">🏆 ${res[i]}</small>`:''}</div><div style="display:flex;gap:4px"><button onclick="att[${i}]=att[${i}]=='absent'?'present':'absent';saveAll();updateCounts();render()" style="padding:6px 10px;border:none;border-radius:8px;background:${isP?'#16a34a':'#ef4444'};color:#fff">${isP?'✅':'❌'}</button><button onclick="if(confirm('ডিলিট?')){students.splice(${i},1);saveAll();updateCounts();render()}" style="padding:6px 8px;border:none;border-radius:8px;background:#fee2e2">🗑️</button></div></div>`;});if(students.length==0)sList.innerHTML='<p style="text-align:center;color:#777">কোনো শিক্ষার্থী নেই</p>';updateCounts();}
function renderRes(){resInputs.innerHTML='';students.forEach((s,i)=>{resInputs.innerHTML+=`<div style="display:flex;gap:8px;margin:6px 0"><div style="flex:1"><b>${s.roll}. ${s.name}</b></div><input id="r_${i}" value="${res[i]||''}" placeholder="GPA"></div>`;});}
function saveResults(){students.forEach((_,i)=>{let el=document.getElementById('r_'+i);if(el)res[i]=el.value;});saveAll();alert('✅ সেভ');filterList('all');}
function toggleMonthly(){let d=monthlyDiv;d.style.display=d.style.display=='none'?'block':'none';if(d.style.display=='block'){let html='<b>মাসিক P/A</b><table border=1 style="width:100%;border-collapse:collapse;font-size:12px;margin-top:6px"><tr><th>রোল</th><th>নাম</th><th>P/A</th></tr>';students.forEach(s=>{html+=`<tr><td>${s.roll}</td><td>${s.name}</td><td style="text-align:center">P</td></tr>`});html+='</table>';d.innerHTML=html;}}
function shareNotice(){let t=noticeText.value;if(!t)return alert('নোটিশ লিখুন');window.open('https://wa.me/?text='+encodeURIComponent('📢 নোটিশ: '+t+'\n'+curInst.bnName+'\nশ্রেণি: '+curClass),'_blank');}
function shareReport(){let p=0;students.forEach((_,i)=>{if(att[i]!=='absent')p++;});let txt=`📊 হাজিরা রিপোর্ট\n${curInst.bnName}\nশ্রেণি: ${curClass}\nমোট: ${students.length}\nউপস্থিত: ${p}\nঅনুপ: ${students.length-p}`;window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');}
</script>
</body>
</html>
