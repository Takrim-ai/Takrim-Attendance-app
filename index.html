<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>প্রাথমিক বিদ্যালয় হাজিরা</title>
<style>
*{box-sizing:border-box;font-family:SolaimanLipi,'Noto Sans Bengali'}
body{margin:0;background:#0a2e1f;display:flex;justify-content:center}
.main{width:400px;max-width:100vw;min-height:100vh;background:#0a2e1f;padding:12px}
.banner{width:100%;border-radius:22px;overflow:hidden;border:4px solid #facc15;background:#000}
.banner img{width:100%;display:block;min-height:200px}
.greenBox{background:#16a34a;border-radius:18px;padding:12px;margin-top:14px;display:flex;justify-content:center}
.blackPill{background:#000;color:#fff;padding:12px 32px;border-radius:28px;font-size:20px;font-weight:900}
.card{width:100%;background:#fff;border-radius:16px;padding:14px 16px;margin-top:12px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.card b{color:#1d4ed8;font-size:18px}
.drop{display:none;background:#fff;border-radius:16px;margin-top:8px;padding:14px}
.drop.open{display:block}
.input{width:100%;padding:13px;border:2px solid #ccc;border-radius:12px;margin-top:10px}
.yellowBtn{width:100%;padding:13px;background:#facc15;border:none;border-radius:12px;font-weight:900}
.blueBtn{width:100%;padding:14px;background:#2563eb;color:#fff;border:none;border-radius:12px;font-weight:900;margin-top:12px}
.greenBtn{width:100%;padding:14px;background:#16a34a;color:#fff;border:none;border-radius:12px;font-weight:900}
.redBtn{width:100%;padding:14px;background:#dc2626;color:#fff;border:none;border-radius:12px;font-weight:900;margin-top:10px}
.step{background:#eef2ff;border-radius:10px;padding:8px;margin-top:10px}
.lbl{color:#1d4ed8;font-weight:800;font-size:13px}
</style>
</head>
<body>
<div class="main">

<!-- ব্যানার - তোমার GitHub ছবি FIX -->
<div class="banner">
<img id="bannerImg" alt="MALEK Banner">
</div>

<div class="greenBox"><div class="blackPill">প্রাথমিক বিদ্যালয় হাজিরা</div></div>

<div class="card" onclick="tog('f1')"><div>🏫 <b>প্রতিষ্ঠান ফরম</b></div><div>▼</div></div>
<div id="f1" class="drop">
<button onclick="logoIn.click()" class="yellowBtn">🖼️ লোগো চেঞ্জ</button>
<input type="file" id="logoIn" accept="image/*" hidden>
<input id="bn" class="input" placeholder="বাংলা নাম">
<input id="thikana" class="input" placeholder="ঠিকানা">
<div style="display:flex;gap:8px"><input id="eiin" class="input" placeholder="EIIN"><input id="code" class="input" placeholder="Code"></div>
<input id="pass" type="password" class="input" placeholder="🔑 পাসওয়ার্ড">
<button id="saveBtn" class="greenBtn">সেভ করুন ✅</button>
</div>

<div class="card" onclick="tog('f2')"><div>🔑 <b>লগইন</b></div><div>▼</div></div>
<div id="f2" class="drop">
<select id="instSel" class="input"><option>-- কোনো প্রতিষ্ঠান নেই --</option></select>
<div class="step"><div class="lbl">ধাপ ১: শিফট</div><select id="shift" class="input"><option>প্রভাতি</option><option>দিবা</option></select></div>
<div class="step"><div class="lbl">ধাপ ২: শ্রেণি</div><select id="sreni" class="input"><option>প্রাক-প্রাথমিক</option><option>১ম</option><option>২য়</option><option>৩য়</option><option>৪র্থ</option><option>৫ম</option><option>৬ষ্ঠ</option><option>৭ম</option><option>৮ম</option></select></div>
<div class="step"><div class="lbl">ধাপ ৩: শাখা</div><select id="shakha" class="input"><option>N/A</option><option>ক</option><option>খ</option></select></div>
<div class="step"><div class="lbl">ধাপ ৪: পাসওয়ার্ড</div><input id="loginPass" type="password" class="input" placeholder="প্রতিষ্ঠানের পাসওয়ার্ড"></div>
<button id="loginBtn" class="blueBtn">🔒 প্রবেশ করুন</button>
</div>

<div class="card" onclick="tog('f3')"><div>🔒 <b>তালিকা</b></div><div>▼</div></div>
<div id="f3" class="drop">
<input id="adminName" class="input" placeholder="এডমিন নাম">
<input id="adminPass" type="password" class="input" placeholder="এডমিন পাসওয়ার্ড">
<button id="adminBtn" class="redBtn">🔒 তালিকা খুলুন</button>
<div id="adminBox" style="display:none;margin-top:10px"><div id="allList"></div></div>
</div>

</div>

<script>
// ১. ব্যানার লোড - ব্র্যাকেটের জন্য encodeURI ব্যবহার
const imgName = "IMG-20261005-WA0019(3).jpg";
const baseURL = "https://takrim-ai.github.io/Takrir/";
document.getElementById('bannerImg').src = baseURL + encodeURIComponent(imgName);

// যদি না আসে, raw github থেকে চেষ্টা
document.getElementById('bannerImg').onerror = function(){
  this.src = "https://raw.githubusercontent.com/Takrim-ai/Takrir/main/" + encodeURIComponent(imgName);
  this.onerror = function(){ this.style.background="#001a33"; this.alt="ছবি পাওয়া যায়নি - নাম বদলে banner.jpg করুন"; }
};
