<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MALEK FINAL - 200/400 AUTO + 2 SHEET</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;font-family:'Hind Siliguri',sans-serif}
body{margin:0;background:#082a1e;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:10px}
.main-banner{width:380px;max-width:95%;border:4px solid #ffcc00;border-radius:22px;overflow:hidden;margin-top:10px;background:#000}
.main-banner img{width:100%;display:block;height:220px;object-fit:cover}
.page{display:none;width:100%;max-width:430px}.page.active{display:flex;flex-direction:column;align-items:center;width:100%}
.card{background:#fff;margin-top:12px;border-radius:24px;padding:16px;width:100%;box-shadow:0 6px 18px rgba(0,0,0,.3)}
input,select,textarea{width:100%;padding:12px;border-radius:12px;border:1.8px solid #d1d5db;font-size:14px;margin:5px 0;outline:none}
.menu{width:100%;max-width:420px;background:#fff;border:none;border-radius:16px;padding:16px;font-size:17px;font-weight:700;color:#0d5bff;margin-top:12px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.hidden{display:none!important}
.btn{width:100%;padding:14px;border:none;border-radius:14px;font-size:17px;font-weight:700;cursor:pointer;margin-top:8px}
.yellow{background:#ffcc00;color:#000}.green{background:#0a7a42;color:#fff}.blue{background:#0d5bff;color:#fff}.red{background:#d61f1f;color:#fff}
.small-btn{flex:1;padding:10px;border:none;border-radius:10px;font-weight:bold;cursor:pointer;font-size:12px}
.m-inp{width:62px;padding:7px;border-radius:10px;border:1.8px solid #7c3aed;text-align:center;font-weight:800;background:#fff}
.mark{background:#fef9c3;border-radius:10px;padding:3px 8px;font-weight:700;font-size:11px}
.sub-card{background:#fff;border:1.5px solid #ddd;border-radius:14px;padding:7px;text-align:center}
</style>
</head>
<body>

<div id="home" class="page active">
<div class="main-banner"><img id="mainBannerImg" src="https://via.placeholder.com/400x220?text=MALEK"></div>
<button class="menu" onclick="tog('formBox')">🏫 প্রাইমারি প্রতিষ্ঠান ফরম <span>▼</span></button>
<div id="formBox" class="card hidden">
<div style="text-align:center">
<img id="logoPreview" src="https://via.placeholder.com/80?text=LOGO" style="width:84px;height:84px;border-radius:50%;border:3px solid #ffcc00;object-fit:cover">
<br><button onclick="logoInput.click()" style="background:#ffcc00;border:none;padding:8px 14px;border-radius:10px;font-weight:700;margin:8px 0">🖼️ লোগো চেঞ্জ</button>
<input type="file" id="logoInput" accept="image/*" style="display:none" onchange="previewLogo(this)">
</div>
<input id="bnName" placeholder="প্রতিষ্ঠানের নাম"><input id="address" placeholder="ঠিকানা">
<div style="display:flex;gap:6px"><input id="eiin" placeholder="EIIN"><input id="schoolCode" placeholder="Code"></div>
<div style="display:flex;gap:6px"><input id="mobile" placeholder="মোবাইল"><input id="email" placeholder="Email"></div>
<input id="pass1" type="password" placeholder="পাসওয়ার্ড">
<button class="btn green" onclick="savePrimary()">সেভ করুন ✅</button>
</div>

<button class="menu" onclick="tog('loginBox')">🔐 প্রতিষ্ঠান লগইন <span>▼</span></button>
<div id="loginBox" class="card hidden"><select id="loginInst"></select><div style="display:flex;gap:6px"><select id="shift"><option>🌅 প্রভাতি</option><option>দিবা</option></select><select id="cls"><option>১ম শ্রেণি</option><option>২য় শ্রেণি</option><option>৩য় শ্রেণি</option><option>৪র্থ শ্রেণি</option><option>৫ম শ্রেণি</option></select><select id="section"><option>ক</option><option>খ</option></select></div><input id="loginPass" type="password" placeholder="পাসওয়ার্ড"><button class="btn blue" onclick="primaryLogin()">🔒 প্রবেশ করুন</button><p id="loginMsg" style="color:red;text-align:center"></p></div>
<button class="menu" onclick="tog('listBox')">🔒 প্রতিষ্ঠানের তালিকা <span>▼</span></button>
<div id="listBox" class="card hidden"><button class="btn red" onclick="openListSecure()">🔓 তালিকা খুলুন</button><div id="instList" style="margin-top:10px"></div></div>
</div>

<div id="dashPage" class="page">
<div style="width:100%;background:#0f3d2e;padding:12px 12px 32px;border-radius:0 0 28px 28px"><div style="background:#fff;border-radius:18px;padding:12px"><div style="display:flex;gap:10px;align-items:center"><img id="dashLogo" src="https://via.placeholder.com/80?text=LOGO" style="width:56px;height:56px;border-radius:50%;border:3px solid #ffcc00;object-fit:cover"><div><div id="dashBn" style="font-weight:700"></div><div id="dashAddr" style="font-size:11px"></div><div style="font-size:11px">EIIN: <b id="dashEIIN"></b> | <span id="dashCls"></span></div></div></div></div></div>
<div class="card" style="margin:-22px 10px 12px">
<button class="btn yellow" onclick="showP('studentPage');render();buildResultUI()" style="border-radius:18px">👥 শিক্ষার্থীর তালিকা দেখুন</button>
<button onclick="tog('monthlyDiv');renderMonthly()" style="width:100%;margin-top:10px;padding:14px;background:#fff;border:2.5px dashed #2563eb;border-radius:18px;font-weight:700;color:#2563eb">📋 মাসিক হাজিরা দেখুন</button>
<div id="monthlyDiv" class="hidden" style="margin-top:10px;border:2px dashed #2563eb;border-radius:16px;padding:10px;background:#fff"><div style="display:flex;justify-content:space-between"><div id="monthTitle" style="font-weight:700;font-size:12px"></div><button onclick="window.print()" style="background:#0f3d2e;color:#fff;border:none;padding:6px 12px;border-radius:8px">🖨️ প্রিন্ট</button></div><div style="overflow:auto;margin-top:6px"><table id="monthlyTable" border="1" style="border-collapse:collapse;font-size:10px;min-width:600px;width:100%;text-align:center"></table></div></div>
<label>📢 নোটিশ বোর্ড</label><textarea id="noticeText" rows="2" placeholder="নোটিশ..."></textarea>
<button class="btn" style="background:#16a34a;color:#fff" onclick="shareReport()">📊 হাজিরা রিপোর্ট WhatsApp গ্রুপে দিন</button>
<button onclick="showP('home')" class="btn" style="background:#333;color:#fff">⬅️ লগআউট</button>
</div>
</div>

<div id="studentPage" class="page">
<div style="width:100%;background:#0f3d2e;padding:12px 12px 24px;border-radius:0 0 28px 28px"><div style="background:#fff;border-radius:18px;padding:12px"><div style="display:flex;gap:10px;align-items:center"><img id="dashLogo3" src="https://via.placeholder.com/80?text=LOGO" style="width:56px;height:56px;border-radius:50%;border:3px solid #ffcc00;object-fit:cover"><div><div id="dashBn3" style="font-weight:700"></div><div id="dashCls3" style="font-size:11px"></div></div></div></div></div>
<div class="card" style="margin-top:-16px">
<div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0;color:#0f3d2e">শিক্ষার্থীর তালিকা</h3><button onclick="showP('dashPage')" style="background:#fff;border:1px solid #ddd;padding:6px 12px;border-radius:20px;font-weight:bold">⬅️ ড্যাশবোর্ড</button></div>
<div style="display:flex;gap:6px;margin-top:10px"><button class="small-btn" style="background:#ffcc00" onclick="filterList('all')">📋 সবাই<br><b id="cAll">0</b></button><button class="small-btn" style="background:#16a34a;color:#fff" onclick="filterList('present')">✅ উপস্থিত<br><b id="cPre">0</b></button><button class="small-btn" style="background:#ef4444;color:#fff" onclick="filterList('absent')">❌ অনুপস্থিত<br><b id="cAbs">0</b></button><button class="small-btn" style="background:#7c3aed;color:#fff" onclick="tog('resultSheetDiv');buildResultUI()">🏆 ফলাফল</button></div>

<div id="resultSheetDiv" class="hidden" style="margin-top:12px;border:2.5px solid #7c3aed;border-radius:18px;padding:10px;background:#fff">
<div style="background:#f0f9ff;border-radius:14px;padding:12px;margin-bottom:10px">
<div style="font-weight:800;color:#0d5bff;font-size:13px;margin-bottom:10px">✏️ বিষয়ের নাম ও পূর্ণমান এডিট (৫০/১০০ নিজে দিন - ০ দিলে বাদ যাবে):</div>
<div id="subEditRow" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:320px;overflow:auto;padding:4px"></div>
<div style="display:grid;grid-template-columns:1fr 1.2fr 1fr 0.6fr;gap:8px;margin-top:12px">
<button style="background:#0f3d2e;color:#fff;border:none;padding:12px;border-radius:12px;font-weight:700" onclick="window.print()">🖨️ A4</button>
<button style="background:#16a34a;color:#fff;border:none;padding:12px;border-radius:12px;font-weight:700;line-height:1.1" onclick="exportExcel()">📊 এক্সেল<br>২ শিট</button>
<button style="background:#0a7a42;color:#fff;border:none;padding:12px;border-radius:12px;font-weight:700" onclick="saveResult()">💾 সেভ</button>
<button style="background:#ef4444;color:#fff;border:none;padding:12px;border-radius:12px;font-weight:700" onclick="deleteResult()">🗑️</button>
</div>
</div>
<div style="overflow:auto;border:2px solid #7c3aed;border-radius:12px"><table id="resultTable13" style="width:100%;border-collapse:collapse;font-size:11px;text-align:center;min-width:1350px"></table></div>
<div style="margin-top:10px;background:#fffbeb;border:2.5px solid #f59e0b;border-radius:14px;padding:12px;display:flex;justify-content:space-between;font-weight:800;flex-wrap:wrap;gap:8px;font-size:12px"><span>মোট: <b id="totalShow13" style="color:#0d5bff">0</b></span><span>প্রাপ্ত: <b id="prapto13" style="color:#0a7a42">0</b></span><span>%: <b id="percent13">0.0%</b></span><span>গ্রেড: <b id="grade13">F</b> | GPA: <b id="gpa13">0.00</b></span></div>
<p style="font-size:11px;color:#16a34a;font-weight:700">💡 ২টা দিলে মোট ২০০, ৪টা দিলে ৪টা যোগ হবে (৪*৫০=২০০ বা ৪*১০০=৪০০)। ০ দিলে বাদ।</p>
</div>

<div id="sList" style="margin-top:12px"></div>
<button onclick="tog('addForm')" style="width:100%;margin-top:12px;padding:12px;background:#dcfce7;border:2px dashed #16a34a;border-radius:12px;font-weight:bold">➕ শিক্ষার্থী যোগ করুন</button>
<div id="addForm" class="hidden" style="margin-top:8px;background:#f0fdf4;padding:10px;border-radius:12px"><input id="sName" placeholder="নাম"><input id="sRoll" placeholder="রোল"><input id="sMobile" placeholder="মোবাইল"><button class="btn green" onclick="addStudent()">✅ যোগ করুন</button></div>
</div>
</div>

<script>
function tog(id){document.getElementById(id).classList.toggle('hidden')}
function showP(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0)}
let insts=JSON.parse(localStorage.getItem('takrim_primary_insts')||'[]');let curClass="",students=[],att={},curInst=null,tempLogo='';
let subNames=JSON.parse(localStorage.getItem('takrim_subNames_final')||'null')||["বাংলা","ইংরেজি","গণিত","বিজ্ঞান","সমাজ","ধর্ম","ICT","কৃষি","শারীরিক","চারু","বিষয় 11","বিষয় 12","বিষয় 13"];
let subFull=JSON.parse(localStorage.getItem('takrim_subFull_final')||'null')||Array(13).fill(100);
let studentMarks=JSON.parse(localStorage.getItem('takrim_studentMarks_final')||'null')||[];
function key(n){return n+'_'+(curInst?curInst.eiin:'')+'_'+curClass}
function saveAll(){localStorage.setItem(key('students'),JSON.stringify(students));localStorage.setItem(key('att'),JSON.stringify(att));localStorage.setItem(key('marks'),JSON.stringify(studentMarks))}
function loadData(){students=JSON.parse(localStorage.getItem(key('students'))||'[]');att=JSON.parse(localStorage.getItem(key('att'))||'{}');studentMarks=JSON.parse(localStorage.getItem(key('marks'))||'[]')}
function refreshInstSelect(){document.getElementById('loginInst').innerHTML='<option value="">প্রতিষ্ঠান নির্বাচন</option>'+insts.map((x,i)=>`<option value="${i}">${x.bnName}</option>`).join('')}refreshInstSelect();
function previewLogo(input){if(input.files&&input.files[0]){let r=new FileReader();r.onload=e=>{tempLogo=e.target.result;logoPreview.src=tempLogo;mainBannerImg.src=tempLogo;localStorage.setItem('takrim_temp_logo',tempLogo)};r.readAsDataURL(input.files[0])}}
function savePrimary(){let obj={bnName:bnName.value.trim(),addr:address.value.trim(),eiin:eiin.value.trim(),schoolCode:schoolCode.value.trim(),mobile:mobile.value.trim(),email:email.value.trim(),pass:pass1.value,logo:tempLogo||localStorage.getItem('takrim_temp_logo')||'https://via.placeholder.com/80?text=LOGO'};if(!obj.bnName||!obj.pass)return alert('নাম ও পাস দিন');insts.push(obj);localStorage.setItem('takrim_primary_insts',JSON.stringify(insts));localStorage.removeItem('takrim_temp_logo');alert('✅ লোগো সহ সেভ');location.reload()}
function primaryLogin(){let idx=loginInst.value;if(idx==="")return loginMsg.textContent='প্রতিষ্ঠান নির্বাচন';let ins=insts[idx];if(loginPass.value!==ins.pass)return loginMsg.textContent='❌ ভুল';curInst=ins;curClass=cls.value;loadData();dashBn.textContent=ins.bnName;dashAddr.textContent=ins.addr;dashEIIN.textContent=ins.eiin;dashCls.textContent=curClass+" | "+section.value;dashBn3.textContent=ins.bnName;dashCls3.textContent=curClass+" | "+section.value+" | "+shift.value;dashLogo.src=ins.logo;dashLogo3.src=ins.logo;mainBannerImg.src=ins.logo;showP('dashPage')}
function openListSecure(){let a=prompt('এডমিন নাম');let p=prompt('পাস');if(a!=='malek'||p!=='takrim2022')return alert('ভুল');instList.innerHTML=insts.map((s,i)=>`<div style="display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #eee;font-size:12px"><div><img src="${s.logo}" style="width:28px;height:28px;border-radius:50%"> <b>${s.bnName}</b></div><button onclick="insts.splice(${i},1);localStorage.setItem('takrim_primary_insts',JSON.stringify(insts));refreshInstSelect();openListSecure()" style="background:#fee2e2;border:none;padding:6px;border-radius:6px">🗑️</button></div>`).join('')}
function addStudent(){if(!sName.value.trim())return alert('নাম');students.push({name:sName.value.trim(),roll:sRoll.value.trim(),mobile:sMobile.value.trim()});studentMarks.push(Array(13).fill(''));saveAll();sName.value='';sRoll.value='';sMobile.value='';addForm.classList.add('hidden');render();buildResultUI()}
function render(f='all'){sList.innerHTML='';students.forEach((s,i)=>{if(f=='present'&&att[i]=='absent')return;if(f=='absent'&&att[i]!='absent')return;let isP=att[i]!='absent';sList.innerHTML+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px;border-bottom:1px solid #eee"><div><b>${s.roll}. ${s.name}</b><br><small>📞 ${s.mobile||'N/A'}</small></div><div style="display:flex;gap:4px"><button onclick="att[${i}]=att[${i}]=='absent'?'present':'absent';saveAll();render()" style="padding:6px 10px;border:none;border-radius:8px;background:${isP?'#16a34a':'#ef4444'};color:#fff">${isP?'✅':'❌'}</button><button onclick="if(confirm('ডিলিট?')){students.splice(${i},1);studentMarks.splice(${i},1);saveAll();render();buildResultUI()}" style="padding:6px;border:none;background:#fee2e2;border-radius:8px">🗑️</button></div></div>`});cAll.textContent=students.length;let p=0;students.forEach((_,i)=>{if(att[i]!='absent')p++});cPre.textContent=p;cAbs.textContent=students.length-p}
function filterList(t){render(t)}
function renderMonthly(){let now=new Date();let y=now.getFullYear();let m=now.getMonth();let td=now.getDate();let days=new Date(y,m+1,0).getDate();let bnM=['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];monthTitle.textContent=`${bnM[m]} ${y} - আজ ${td}`;let tbl=monthlyTable;let head='<tr style="background:#fef9c3"><th style="position:sticky;left:0;background:#fef9c3">নাম</th>';for(let d=1;d<=days;d++)head+=`<th style="background:${d==td?'#ffcc00':'#fff'}">${d}</th>`;head+='</tr>';let body='';let mk=`${y}-${m+1}`;let mAtt=JSON.parse(localStorage.getItem(key('monthly_'+mk))||'{}');students.forEach((s,idx)=>{body+=`<tr><td style="position:sticky;left:0;background:#fff;font-weight:700;text-align:left">${s.name}</td>`;for(let d=1;d<=days;d++){let st=mAtt[`${idx}_${d}`]||'-';let bg=st=='P'?'#dcfce7':st=='A'?'#fee2e2':'#fff';body+=`<td onclick="toggleDaily(${idx},${d})" style="cursor:pointer;background:${bg}">${st}</td>`}body+='</tr>'});tbl.innerHTML=head+body}
function toggleDaily(sIdx,day){let now=new Date();let mk=`${now.getFullYear()}-${now.getMonth()+1}`;let k=key('monthly_'+mk);let data=JSON.parse(localStorage.getItem(k)||'{}');let cur=data[`${sIdx}_${day}`];data[`${sIdx}_${day}`]=cur=='P'?'A':cur=='A'?'-':'P';localStorage.setItem(k,JSON.stringify(data));renderMonthly()}

function buildResultUI(){
 let row=document.getElementById('subEditRow');row.innerHTML='';
 for(let i=0;i<13;i++){row.innerHTML+=`<div class="sub-card"><input id="sN${i}" value="${subNames[i]}" style="padding:6px;font-size:12px;font-weight:700"><input id="sF${i}" type="number" value="${subFull[i]}" style="margin-top:4px;padding:6px;text-align:center;background:#fef9c3;font-weight:700" oninput="renderResultTable()"></div>`}
 renderResultTable();
}
function renderResultTable(){
 for(let i=0;i<13;i++){let a=document.getElementById('sN'+i);let b=document.getElementById('sF'+i);if(a)subNames[i]=a.value;if(b)subFull[i]=parseInt(b.value)||0}
 let tbl=document.getElementById('resultTable13');let activeIdx=[];for(let i=0;i<13;i++){if(subFull[i]>0)activeIdx.push(i)}
 let th='<tr style="background:#f3f4f6"><th>ক্রম</th><th>নাম</th><th>রোল</th>';activeIdx.forEach(i=>{th+=`<th>${subNames[i]}<br><span class="mark">${subFull[i]}</span></th>`});th+='<th style="background:#fef08a">মোট</th><th style="background:#bbf7d0">প্রাপ্ত</th><th>%</th><th>গ্রেড</th><th>GPA</th></tr>';
 let body='<tr style="background:#fefce8;font-weight:700"><td colspan="3" style="text-align:right">পূর্ণমান</td>';let tF=0;activeIdx.forEach(i=>{body+=`<td><span class="mark">${subFull[i]}</span></td>`;tF+=subFull[i]});body+=`<td style="background:#fef08a">${tF}</td><td colspan="4"></td></tr>`;
 if(students.length==0){body+='<tr><td colspan="20">কোনো শিক্ষার্থী নেই</td></tr>'}else{
  students.forEach((s,si)=>{
   if(!studentMarks[si])studentMarks[si]=Array(13).fill('');
   body+=`<tr><td>${si+1}</td><td style="text-align:left">${s.name}</td><td>${s.roll}</td>`;
   activeIdx.forEach(subI=>{let v=studentMarks[si][subI]||'';body+=`<td><input class="m-inp" value="${v}" oninput="studentMarks[${si}][${subI}]=this.value;calcRow(${si});saveAll()"></td>`});
   body+=`<td id="tf${si}" style="background:#fef08a;font-weight:700">${tF}</td><td id="t${si}" style="background:#bbf7d0;font-weight:700">0</td><td id="p${si}">0</td><td id="g${si}">F</td><td id="gp${si}">0.00</td></tr>`;
  });
 }
 tbl.innerHTML=th+body;students.forEach((_,si)=>calcRow(si));
}
function calcRow(si){
 let enteredIdx=[];
 for(let i=0;i<13;i++){
  if(subFull[i]>0 && studentMarks[si] && studentMarks[si][i]!=='' && studentMarks[si][i]!==undefined && studentMarks[si][i].toString().trim()!=='' && studentMarks[si][i]!=='0') enteredIdx.push(i);
 }
 let calcIdx = enteredIdx.length>0? enteredIdx : (()=>{let a=[];for(let i=0;i<13;i++){if(subFull[i]>0)a.push(i)}return a})();

 let sum=0,total=0;
 calcIdx.forEach(subI=>{let v=parseFloat(studentMarks[si][subI])||0;if(studentMarks[si][subI]!==''&&studentMarks[si][subI]!==undefined){sum+=v;total+=subFull[subI];}});

 document.getElementById('tf'+si).innerText=total;
 document.getElementById('t'+si).innerText=sum;
 let perc=total>0?(sum/total*100):0;
 document.getElementById('p'+si).innerText=perc.toFixed(1);
 let g='F',gp='0.00';if(perc>=80){g='A+';gp='5.00'}else if(perc>=70){g='A';gp='4.00'}else if(perc>=60){g='A-';gp='3.50'}else if(perc>=50){g='B';gp='3.00'}else if(perc>=40){g='C';gp='2.00'}else if(perc>=33){g='D';gp='1.00'}
 document.getElementById('g'+si).innerText=g;document.getElementById('gp'+si).innerText=gp;
 if(si==0){totalShow13.innerText=total;prapto13.innerText=sum;percent13.innerText=perc.toFixed(1)+'%';grade13.innerText=g;gpa13.innerText=gp}
}
function saveResult(){localStorage.setItem('takrim_subNames_final',JSON.stringify(subNames));localStorage.setItem('takrim_subFull_final',JSON.stringify(subFull));saveAll();alert('✅ সেভ হয়েছে')}
function deleteResult(){if(!confirm('সব মার্ক ডিলিট?'))return;studentMarks=students.map(()=>Array(13).fill(''));saveAll();renderResultTable()}
function exportExcel(){
 let activeIdx=[];for(let i=0;i<13;i++){if(subFull[i]>0)activeIdx.push(i)}
 if(activeIdx.length==0)return alert('পূর্ণমান দিন');
 let wb=XLSX.utils.book_new();
 let data1=[],data2=[];
 let h1=["ক্রম","নাম","রোল"];activeIdx.forEach(i=>h1.push(subNames[i]+"("+subFull[i]+")"));h1.push("মোট","প্রাপ্ত","%","গ্রেড","GPA");data1.push(h1);
 data2.push(["ক্রম","নাম","রোল","মোট","প্রাপ্ত","%","গ্রেড","GPA"]);

 students.forEach((s,si)=>{
  let marks=[];let sum=0,total=0;let entered=[];
  for(let i=0;i<13;i++){if(subFull[i]>0 && studentMarks[si] && studentMarks[si][i]!=='' && studentMarks[si][i]!==undefined && studentMarks[si][i].toString().trim()!=='') entered.push(i)}
  let useIdx = entered.length>0? entered : activeIdx;
  useIdx.forEach(subI=>{let v=parseFloat(studentMarks[si][subI])||0;let raw=studentMarks[si][subI]||'';if(raw!==''){sum+=v;total+=subFull[subI];}});

  // ফাঁকা বাদ - শুধু ভরা ঘর এক্সেলে যাবে
  let filledMarks=[];
  useIdx.forEach(subI=>{filledMarks.push(studentMarks[si][subI]||'');});

  let perc=total>0?(sum/total*100):0;let g='F',gp='0.00';if(perc>=80){g='A+';gp='5.00'}else if(perc>=70){g='A';gp='4.00'}else if(perc>=60){g='A-';gp='3.50'}else if(perc>=50){g='B';gp='3.00'}else if(perc>=40){g='C';gp='2.00'}else if(perc>=33){g='D';gp='1.00'}

  // শিট ১ এ সব, শিট ২ এ সারাংশ
  // শিট ১ এর জন্য ফাঁকা বাদ হেডার
  if(si==0){
   let h1b=["ক্রম","নাম","রোল"];useIdx.forEach(i=>h1b.push(subNames[i]));h1b.push("মোট","প্রাপ্ত","%","গ্রেড","GPA");
   data1=[h1b];
  }
  data1.push([si+1,s.name,s.roll,...filledMarks,total,sum,perc.toFixed(1),g,gp]);
  data2.push([si+1,s.name,s.roll,total,sum,perc.toFixed(1),g,gp]);
 });

 let ws1=XLSX.utils.aoa_to_sheet(data1);
 let ws2=XLSX.utils.aoa_to_sheet(data2);
 XLSX.utils.book_append_sheet(wb,ws1,"ফলাফল-বিস্তারিত");
 XLSX.utils.book_append_sheet(wb,ws2,"ফলাফল-২০০/৪০০");
 XLSX.writeFile(wb,"MALEK_Result_200_400_2sheet.xlsx");
}
