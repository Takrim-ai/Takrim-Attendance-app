<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Takrim Final One Page</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Kalpurush,Arial}
body{background:#0a1931;padding:10px}
.main{max-width:500px;margin:auto;background:#fff;border-radius:22px;padding:10px}
.top{background:#0f3d2e;color:#fff;text-align:center;padding:16px;border-radius:16px;font-weight:bold;font-size:20px;line-height:1.5;margin-bottom:10px}
.btn{width:100%;padding:16px;border:none;border-radius:14px;font-weight:bold;font-size:19px;cursor:pointer;margin-bottom:10px;display:flex;justify-content:center;align-items:center;gap:8px;color:#fff}
.btn-blue{background:#2d6bff}.btn-yellow{background:#ffcc00;color:#000}.btn-red{background:#e11d2e}.btn-green{background:#16a34a}.btn-purple{background:#7c3aed}
.row2{display:flex;gap:10px;margin-bottom:10px}.row2.btn{flex:1;flex-direction:column;padding:14px}
.card{border-radius:14px;margin-bottom:10px;overflow:hidden}
.card-head{padding:16px;border-radius:14px;font-weight:bold;font-size:19px;cursor:pointer;color:#fff;display:flex;justify-content:center;align-items:center;gap:8px}
.card-body{max-height:0;overflow:hidden;transition:max-height.35s;background:#f9fafb;border-radius:0 0 14px 14px}
.card.active.card-body{max-height:800px;padding:10px}
.box{border:2px solid #a78bfa;border-radius:14px;padding:8px;display:none;margin-top:10px}.box.show{display:block}
.sheetHead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.btnName{padding:8px 14px;background:#7c3aed;color:#fff;border:none;border-radius:20px;font-weight:bold}
.subBox{display:flex;align-items:center;gap:4px;background:#f3f4f6;padding:5px 8px;border-radius:20px;border:1px solid #ddd}
.subBox input{width:50px;padding:6px;border:1px solid #a78bfa;border-radius:8px;text-align:center;font-weight:bold}
.wrap{overflow-x:auto;border:1px solid #ddd;border-radius:10px}table{width:100%;border-collapse:collapse;min-width:700px;font-size:13px}th{background:#0a2e1f;color:#fff;padding:8px}td{padding:6px;border:1px solid #ddd;text-align:center;background:#fff}td input{width:65px;padding:6px;border:2px dashed #16a34a;border-radius:8px;text-align:center;font-weight:bold;background:#f3f4f6}
textarea{width:100%;padding:12px;border:2px dashed #a78bfa;border-radius:12px;min-height:70px}
</style>
</head>
<body>
<div class="main">
<div class="top">শ্রেণী: কম্পিউটার টেকনোলজি | সেশন<br>2025-26 | সেমিস্টার ০২</div>

<div class="btn btn-blue" onclick="openModal()">+ শিক্ষার্থী যোগ করুন</div>
<div class="btn btn-yellow" onclick="toggleList()">📋 শিক্ষার্থীর তালিকা দেখুন (<span id="cnt">2</span>)</div>
<div id="list" style="display:none;margin-bottom:10px"></div>

<div class="row2">
<div class="btn btn-green" onclick="toggleList()">✅ উপস্থিত<br><span id="t2">1</span></div>
<div class="btn btn-red" style="background:#ff4a4a" onclick="toggleList()">❌ অনুপস্থিত<br><span id="t3">1</span></div>
</div>

<div class="card" id="c1"><div class="card-head btn-red" onclick="tog('c1')">📢 নোটিশ বোর্ড</div><div class="card-body"><textarea placeholder="নোটিশ লিখুন..."></textarea><button style="width:100%;margin-top:8px;padding:12px;background:#ffcc00;border:none;border-radius:10px;font-weight:bold">📢 নোটিশ পাঠান</button></div></div>

<div class="card" id="c2"><div class="card-head btn-green" onclick="tog('c2')">💬 SMS পাঠান</div><div class="card-body"><div style="display:flex;gap:8px"><button style="flex:1;padding:12px;background:#16a34a;color:#fff;border:none;border-radius:10px">✅ উপস্থিত</button><button style="flex:1;padding:12px;background:#ef4444;color:#fff;border:none;border-radius:10px">❌ অনুপস্থিত</button><button style="flex:1;padding:12px;background:#ffcc00;border:none;border-radius:10px">📢 নোটিশ</button></div></div></div>

<div class="card" id="c3"><div class="card-head btn-blue" onclick="tog('c3')">📱 WhatsApp-এ পাঠান</div><div class="card-body"><div style="display:flex;gap:8px"><button style="flex:1;padding:12px;background:#16a34a;color:#fff;border:none;border-radius:10px">✅</button><button style="flex:1;padding:12px;background:#ef4444;color:#fff;border:none;border-radius:10px">❌</button><button style="flex:1;padding:12px;background:#ffcc00;border:none;border-radius:10px">📢</button></div><button style="width:100%;margin-top:8px;padding:12px;background:#22c55e;color:#fff;border:none;border-radius:10px;font-weight:bold">📊 হাজিরা রিপোর্ট WhatsApp গ্রুপে দিন</button></div></div>

<div class="card" id="c4"><div class="card-head btn-blue" onclick="tog('c4')">📋 মাসিক হাজিরা দেখুন</div><div class="card-body"><p style="text-align:center">মাসিক হাজিরা এখানে আসবে</p></div></div>

<div class="btn btn-purple" id="togBtn" onclick="togResult()">🔽 ফলাফল দেখুন</div>

<div class="box" id="resultBox">
<div class="sheetHead"><span style="font-weight:bold;color:#7c3aed">📋 ফলাফল সিট</span><div style="display:flex;gap:6px;align-items:center"><button class="btnName" onclick="renameSubject()">নাম বদলান</button><div class="subBox"><label style="font-size:12px;font-weight:bold">বিষয় সংখ্যা:</label><button onclick="changeSubCount(subNames.length-1)" style="width:32px;height:32px;border-radius:50%;border:none;background:#16a34a;color:#fff">-</button><input id="subCount" type="number" value="4" onchange="changeSubCount(this.value)"><button onclick="changeSubCount(subNames.length+1)" style="width:32px;height:32px;border-radius:50%;border:none;background:#16a34a;color:#fff">+</button></div></div></div>
<div class="wrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
</div>
</div>

<script>
let subNames=["বাংলা","গণিত","ইংরেজি","বিজ্ঞান"],full=[50,50,50,50],students=[{name:"কালাম",roll:"202",present:true,marks:[78,0,0,0]},{name:"কমল",roll:"203",present:false,marks:[75,0,0,0]}],resultVisible=false,listVisible=false,edit=true;
function tog(id){document.getElementById(id).classList.toggle('active');}
function toggleList(){listVisible=!listVisible; render();}
function togResult(){resultVisible=!resultVisible; render();}
function changeSubCount(n){n=parseInt(n); if(n<1)n=1;if(n>20)n=20;if(n>subNames.length){for(let i=subNames.length;i<n;i++){subNames.push("বিষয় "+(i+1)); full.push(100); students.forEach(s=>s.marks.push(0));}}else if(n<subNames.length){subNames=subNames.slice(0,n); full=full.slice(0,n); students.forEach(s=>s.marks=s.marks.slice(0,n));} render();}
function renameSubject(){for(let i=0;i<subNames.length;i++){let nm=prompt((i+1)+" নং:",subNames[i]); if(nm===null) return; if(nm.trim()) subNames[i]=nm.trim();} render();}
function updateOnly(){let total=full.reduce((a,b)=>a+Number(b||0),0); document.querySelectorAll('#tbody tr').forEach((tr,i)=>{if(i===0){tr.querySelector('.pra').innerText=total;return;} let s=students[i-1]; let p=s.marks.reduce((a,b)=>a+Number(b||0),0); let per=total? p/total*100:0; let tds=tr.querySelectorAll('td'); tds[tds.length-3].innerText=total; tds[tds.length-2].innerText=p; tds[tds.length-1].innerText=per.toFixed(1)+'%';});}
function render(){
 document.getElementById('cnt').innerText=students.length;
 document.getElementById('t2').innerText=students.filter(s=>s.present).length;
 document.getElementById('t3').innerText=students.filter(s=>!s.present).length;
 document.getElementById('subCount').value=subNames.length;
 let list=document.getElementById('list'); list.innerHTML=''; students.forEach((s,i)=>{list.innerHTML+=`<div style="background:#f3f4f6;padding:8px;border-radius:10px;margin-bottom:5px;display:flex;justify-content:space-between"><span>${i+1}. ${s.name} (${s.roll})</span><span>${s.present?'✅':'❌'} <button onclick="students.splice(${i},1);render()">❌</button></span></div>`;}); list.style.display=listVisible?'block':'none';
 document.getElementById('resultBox').classList.toggle('show',resultVisible);
 document.getElementById('togBtn').innerHTML=resultVisible?'🔼 ফলাফল বন্ধ করুন':'🔽 ফলাফল দেখুন';
 let thead=document.getElementById('thead'); let h=`<tr><th>ক্রম</th><th>নাম</th><th>রোল</th>`; for(let i=0;i<subNames.length;i++) h+=`<th>${subNames[i]}<br>${full[i]}</th>`; h+=`<th>পূর্ণ</th><th>প্রাপ্ত</th><th>%</th></tr>`; thead.innerHTML=h;
 let tb=document.getElementById('tbody'); tb.innerHTML=''; let total=full.reduce((a,b)=>a+Number(b||0),0);
 let tr=`<tr><td></td><td>পূর্ণমান</td><td></td>`; for(let j=0;j<full.length;j++) tr+=`<td><input value="${full[j]}" oninput="full[${j}]=Number(this.value)||0; updateOnly()"></td>`; tr+=`<td class="pra">${total}</td><td>-</td><td>-</td></tr>`; tb.innerHTML+=tr;
 students.forEach((s,i)=>{let pra=s.marks.reduce((a,b)=>a+Number(b||0),0); let per=total?pra/total*100:0; let r=`<tr><td>${i+1}</td><td>${s.name}</td><td>${s.roll}</td>`; for(let j=0;j<full.length;j++) r+=`<td><input value="${s.marks[j]}" oninput="students[${i}].marks[${j}]=Number(this.value)||0; updateOnly()"></td>`; r+=`<td>${total}</td><td>${pra}</td><td>${per.toFixed(1)}%</td></tr>`; tb.innerHTML+=r;});
}
function openModal(){let n=prompt('নাম:'); if(!n) return; let r=prompt('রোল:'); students.push({name:n,roll:r||202+students.length,present:true,marks:full.map(()=>0)}); render();}
render();
</script>
</body>
</html>
