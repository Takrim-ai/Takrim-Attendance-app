<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Takrim Final - Auto Subject</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Kalpurush,Arial}
body{background:#0a2e1f;padding:8px}
.main{max-width:520px;margin:auto;background:#fff;border-radius:18px;padding:12px}
.add{width:100%;padding:14px;background:#2563eb;color:#fff;border:none;border-radius:12px;font-weight:bold;font-size:18px;cursor:pointer;margin-bottom:10px}
.listBtn{width:100%;padding:14px;background:#ffcc00;color:#000;border:none;border-radius:12px;font-weight:bold;font-size:18px;cursor:pointer;margin-bottom:8px}
#list{display:none;margin-bottom:10px}#list.show{display:block}
.stu{background:#f3f4f6;display:flex;justify-content:space-between;align-items:center;padding:10px;border-radius:10px;margin-bottom:6px}
.stats{display:flex;gap:8px;margin-bottom:10px}.s{flex:1;padding:12px;border-radius:12px;text-align:center;font-weight:bold;cursor:pointer;border:2px solid transparent}
.s.active{border-color:#000}
.s2{background:#16a34a;color:#fff}.s3{background:#ef4444;color:#fff}
.toggle{width:100%;padding:13px;background:#7c3aed;color:#fff;border:none;border-radius:12px;font-weight:bold;font-size:16px;cursor:pointer;margin-bottom:10px}
.box{border:2px solid #a78bfa;border-radius:14px;padding:8px;display:none}.box.show{display:block}
.sheetHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:6px}
.sheetTitle{font-weight:bold;color:#7c3aed;font-size:15px}
.headBtns{display:flex;gap:6px}
.btnAdd{padding:6px 10px;background:#16a34a;color:#fff;border:none;border-radius:20px;font-weight:bold;font-size:12px;cursor:pointer}
.btnName{padding:6px 10px;background:#7c3aed;color:#fff;border:none;border-radius:20px;font-weight:bold;font-size:12px;cursor:pointer}
.wrap{overflow-x:auto;border:1px solid #ddd;border-radius:12px;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;min-width:500px;font-size:14px}
th{background:#0a2e1f;color:#fff;padding:10px;text-align:center;white-space:nowrap}
td{padding:6px;border:1px solid #ddd;text-align:center;background:#fff}
td input{width:70px;padding:8px;border:2px dashed #16a34a;border-radius:10px;text-align:center;font-weight:bold;background:#f8fafc}
.row{display:flex;gap:8px;margin-top:8px}.row button{flex:1;padding:11px;border:none;border-radius:10px;font-weight:bold;color:#fff;cursor:pointer}
.save{background:#16a34a}.edit{background:#6b7280}.pdf{background:#111827}.excel{background:#047857}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:none;justify-content:center;align-items:center;z-index:999}
.modal.active{display:flex}.modalBox{background:#fff;width:90%;max-width:380px;border-radius:18px;padding:18px}
.modalBox input{width:100%;padding:12px;margin-bottom:10px;border:2px solid #16a34a;border-radius:10px;font-size:16px}
.modalBtns{display:flex;gap:10px}.modalBtns button{flex:1;padding:12px;border:none;border-radius:10px;font-weight:bold;cursor:pointer}.btnCancel{background:#e5e7eb}.btnOk{background:#2563eb;color:#fff}
</style>
</head>
<body>
<div class="main">
<button class="add" onclick="openModal()">+ শিক্ষার্থী যোগ করুন</button>
<button class="listBtn" id="listBtn" onclick="setFilter('all')">📋 শিক্ষার্থীর তালিকা দেখুন (2)</button>
<div id="list"></div>
<div class="stats">
<div class="s s2" id="boxP" onclick="setFilter('present')">✅ উপস্থিত<br><span id="t2">0</span></div>
<div class="s s3" id="boxA" onclick="setFilter('absent')">❌ অনুপস্থিত<br><span id="t3">0</span></div>
</div>
<button class="toggle" id="togBtn" onclick="togBox()">🏆 ফলাফল দেখুন</button>

<div class="box" id="resultBox">
<div class="sheetHead">
<span class="sheetTitle">📋 ফলাফল সিট</span>
<div class="headBtns">
<button class="btnAdd" onclick="addSubject()">+ বিষয়</button>
<button class="btnName" onclick="renameAll()">নাম বদলান</button>
</div>
</div>
<div class="wrap"><table id="mainTable"><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
<div class="row"><button class="save" onclick="saveNow()">💾 সেভ</button><button class="edit" onclick="editNow()">✏️ এডিট</button></div>
<div class="row"><button class="pdf" onclick="toPDF()">📄 PDF A4</button><button class="excel" onclick="toExcel()">📊 Excel</button></div>
</div>
</div>

<div class="modal" id="modal"><div class="modalBox"><h3 style="text-align:center;margin-bottom:10px">নতুন শিক্ষার্থী
