<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mumtaz Uddin College - Result</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;font-family:'Hind Siliguri',sans-serif;margin:0}
body{background:#0f2f1f;padding:10px}
.top-banner{background:#fff;border-radius:22px;padding:12px;display:flex;align-items:center;gap:12px;justify-content:center;text-align:center}
.top-banner img{width:62px;height:62px;border-radius:50%}
.top-banner h2{font-size:16px;color:#0f2f1f;line-height:1.2}
.top-banner p{font-size:13px;color:#d00;font-weight:700}
.top-banner small{font-size:12px;color:#333}
.main-title{text-align:center;color:#fff;font-size:30px;font-weight:700;margin:14px 0 4px}
.class-title{text-align:center;color:#ffeb3b;font-size:18px;margin-bottom:12px}
.dash-btn{background:#fff;border-radius:14px;padding:6px 14px;border:none;font-weight:700;display:block;margin:0 auto 12px}
.card{background:#fff;border-radius:22px;padding:12px;margin-top:8px}
.add-stu{width:100%;border:2px dashed #16a34a;border-radius:14px;padding:14px;background:#f0fdf4;font-weight:700;font-size:17px;color:#000}

.stats{display:flex;gap:8px;margin:12px 0}
.stats div{flex:1;border-radius:16px;padding:12px 2px;text-align:center;font-weight:700;color:#fff;font-size:15px}
.s-y{background:#ffcc00;color:#000}.s-g{background:#16a34a}.s-r{background:#ef4444}.s-p{background:#7c3aed}

.table-box{border:2.5px solid #8b5cf6;border-radius:16px;overflow:hidden;margin-top:8px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:700px}
th{background:#0f2f1f;color:#fff;padding:8px 4px;border:1px solid #1a4a2f;font-size:14px}
td{border:1px solid #d1d5db;padding:8px;text-align:center;background:#fff}

/* তোমার চাওয়া সাদা গোল */
.sub-pill{background:#fff;color:#333;border-radius:10px;padding:10px 14px;font-weight:700;min-width:110px;display:inline-block;cursor:pointer;border:none;outline:none;text-align:center;width:90%}
.mark-pill{background:#fff;border:1.5px solid #d1d5db;border-radius:30px;width:75px;height:42px;display:flex;align-items:center;justify-content:center;margin:0 auto}
.mark-pill input{border:none;background:transparent;width:100%;text-align:center;font-weight:700;outline:none;font-size:16px}

.dl-btn{width:100%;background:#16a34a;color:#fff;border:none;border-radius:14px;padding:14px;font-weight:700;font-size:17px;margin-top:10px}
</style>
</head>
<body>

<div class="top-banner">
<img src="https://cdn-icons-png.flaticon.com/512/2232/2232688.png">
<div>
<h2>মমতাজ উদ্দিন বিজনেস ম্যানেজমেন্ট কলেজ</h2>
<p>Mumtaz Uddin Business Management College</p>
<small>EIIN: 132332 | Code: 50017</small>
</div>
</div>

<div class="main-title">শিক্ষার্থীর তালিকা</div>
<div class="class-title">শ্রেণী: ১০ম শ্রেণি</div>
<button class="dash-btn">⬅️ ড্যাশবোর্ড</button>

<div class="card">
<button class="add-stu" onclick="addStudent()">+ শিক্ষার্থী যোগ করুন</button>

<div class="stats">
<div class="s-y">📋 সবাই<br><span id="cAll">1</span></div>
<div class="s-g">✅ উপস্থিত<br>1</div>
<div class="s-r">❌ অনুপস্থিত<br>0</div>
<div class="s-p">🏆 ফলাফল</div>
</div>

<div class="table-box">
<div class="tbl-wrap"><table id="tbl"></table></div>
<button class="dl-btn" onclick="downloadExcel()">⬇️ রেজাল্ট Excel ডাউনলোড</button>
</div>
</div>

<script>
let subjects = JSON.parse(localStorage.getItem('m_subjects')||'["বিষয় 1","বিষয় 2","বিষয় 3"]');
let students = JSON.parse(localStorage.getItem('m_students')||'[{"name":"কালাম","roll":"202","marks":["","",""]}]');

function save(){
 localStorage.setItem('m_subjects',JSON.stringify(subjects));
 localStorage.setItem('m_students',JSON.stringify(students));
 document.getElementById('cAll').textContent=students.length;
}

function render(){
 let h=`<tr><th>ক্রম</th><th>নাম</th><th>রোল</th>`;
 subjects.forEach((s,i)=>h+=`<th><input class="sub-pill" value="${s}" onchange="subjects[${i}]=this.value;save()"></th>`);
 h+=`</tr>`;
 students.forEach((st,gi)=>{
   h+=`<tr><td>${gi+1}</td><td>${st.name}</td><td>${st.roll}</td>`;
   st.marks.forEach((m,si)=>{
     h+=`<td><div class="mark-pill"><input value="${m}" oninput="editLive(${gi},${si},this.value)" placeholder=""></div></td>`;
   });
   h+=`</tr>`;
 });
 document.getElementById('tbl').innerHTML=h;
 save();
}

// এখানে চাপ দিয়ে এডিট - কার্সর বাইরে যাবে না
function editLive(gi,si,val){
 students[gi].marks[si]=val;
 localStorage.setItem('m_students',JSON.stringify(students));
 // পুরা রেন্ডার না, তাই কার্সর থাকবে
}

function addStudent(){
 let n=prompt('নাম:'); if(!n)return;
 let r=prompt('রোল:');
 students.push({name:n,roll:r||'',marks:Array(subjects.length).fill('')});
 save(); render();
}

function downloadExcel(){
 let head=['ক্রম','নাম','রোল',...subjects];
 let rows=students.map((st,i)=>[i+1,st.name,st.roll,...st.marks]);
 let ws=XLSX.utils.aoa_to_sheet([head,...rows]);
 let wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Result');
 XLSX.writeFile(wb,'result.xlsx');
}
render();
</script>
</body>
</html>
