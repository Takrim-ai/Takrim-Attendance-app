<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Primary</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a1a0f">
<style>
body{margin:0;background:#0a1a0f;font-family:sans-serif;display:flex;justify-content:center}
.main-box{width:100%;max-width:400px;background:#0a1a0f;min-height:100vh;padding:10px;box-sizing:border-box}
.banner{width:100%;border:2px solid #c5a02c;border-radius:20px;overflow:hidden;margin-bottom:15px}
.banner img{width:100%;display:block}
.card{background:#0d4a2a;border:2px solid #c5a02c;border-radius:20px;padding:15px;margin-bottom:15px;text-align:center;color:white}
.green-btn{background:#14532d;color:white;border:none;padding:12px 20px;border-radius:25px;width:100%;font-size:16px;margin-top:10px}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #c5a02c;margin-top:8px;box-sizing:border-box}
</style>
</head>
<body>
<div class="main-box">

<!-- শুধু একটাই ব্যানার থাকবে, আর ডাবল হবে না -->
<div class="banner">
<img src="icon-512.png" alt="Primary Logo">
</div>

<div class="card">
<h3>🏫 প্রতিষ্ঠান ফরম ▼</h3>
<input type="text" placeholder="প্রতিষ্ঠানের নাম">
<input type="text" placeholder="EMIS Code">
<button class="green-btn">প্রবেশ করুন</button>
</div>

<div class="card">
<h3>লগইন</h3>
<input type="text" placeholder="ইউজার আইডি">
<input type="password" placeholder="পাসওয়ার্ড">
<button class="green-btn">লগইন</button>
</div>

</div>
</body>
</html>
