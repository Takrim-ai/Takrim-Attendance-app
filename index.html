<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard Final</title><style>body{margin:0;background:#082a1e;padding:8px;font-family:sans-serif}.card{background:#fff;border-radius:14px;padding:12px;margin-top:10px}input{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;margin:5px 0}button{width:100%;padding:14px;border:none;border-radius:12px;font-weight:700;font-size:16px;cursor:pointer}.green{background:#0a7a42;color:#fff}.red{background:#dc2626;color:#fff}.blue{background:#1e3a8a;color:#fff}.item{display:flex;justify-content:space-between;background:#e8ffe8;padding:8px;margin:4px 0;border-radius:8px}</style></head><body>
<div class="card" style="border:4px solid #ffcc00;text-align:center;font-weight:700" id="head">হেডার লোড...</div>
<div class="card" style="text-align:center;background:#1e2a8a;color:#ffcc00;font-weight:700" id="cls">শ্রেণী: ৯ম</div>
<div style="display:flex;gap:8px;margin-top:10px"><button type="button" class="red" onclick="localStorage.removeItem('takrim_session');location.href='index.html'">লগআউট</button><button type="button" class="blue" onclick="location.href='index.html'">হোম</button></div>
<div class="card">
<input id="n" placeholder="ছাত্রের নাম">
<input id="r" placeholder="রোল">
<input id="m" placeholder="মোবাইল">
<button type="button" class="green" id="addBtn">+ যোগ করুন</button>
<p id="msg" style="text-align:center;color:green"></p>
</div>
<div class="card" id="list"></div>
<script>
let sess=null; try{sess=JSON.parse(localStorage.getItem('takrim_session'))}catch(e){}
let insts=JSON.parse(localStorage.getItem('takrim_primary_insts')||'[]');
let name = sess?.inst?.bnName || insts[0]?.bnName || 'প্রতিষ্ঠান পাওয়া যায়নি';
document.getElementById('head').innerText=name;
document.getElementById('cls').innerText='শ্রেণী: '+(sess?.cls||'৯ম')+' | শাখা: '+(sess?.section||'ক');
let KEY='takrim_final_'+(sess?.cls||'9')+'_'+(sess?.section||'ক');
let arr=JSON.parse(localStorage.getItem(KEY)||'[]');
function render(){ let h=''; arr.forEach((x,i)=>{ h+=`<div class="item"><span>${x.name} (${x.roll})</span><span onclick="arr.splice(${i},1);save()">🗑️</span></div>`; }); document.getElementById('list').innerHTML=h||'কোন ছাত্র নেই'; }
function save(){ localStorage.setItem(KEY, JSON.stringify(arr)); render(); }
document.getElementById('addBtn').addEventListener('click', function(e){
  e.preventDefault();
  let nm=document.getElementById('n').value.trim(), rl=document.getElementById('r').value.trim();
  if(!nm||!rl){ alert('নাম রোল দিন'); return; }
  arr.push({name:nm, roll:rl});
  document.getElementById('n').value=''; document.getElementById('r').value='';  document.getElementById('msg').innerText='✅ '+nm+' যোগ হয়েছে';
  save();
});
render();
</script>
</body></html>
