<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>প্রাথমিক হাজিরা - FINAL</title><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;700&display=swap" rel="stylesheet"><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><style>*{box-sizing:border-box;font-family:'Hind Siliguri',sans-serif}body{margin:0;background:#082a1e;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:10px}.main-banner{width:380px;max-width:95%;border:4px solid #ffcc00;border-radius:22px;overflow:hidden;margin-top:10px;background:#000;line-height:0}.main-banner img{width:100%;display:block}.green-box{width:380px;max-width:95%;background:#16a34a;border-radius:16px;padding:12px;margin-top:25px;text-align:center}.green-box span{background:#000;color:#fff;display:inline-block;padding:8px 22px;border-radius:30px;font-weight:700;font-size:18px}.card{background:#fff;margin-top:12px;border-radius:24px;padding:16px;width:100%;max-width:430px}.menu{width:100%;max-width:430px;background:#fff;border:none;border-radius:16px;padding:16px;font-weight:700;color:#0d5bff;margin-top:12px;display:flex;justify-content:space-between;cursor:pointer}.hidden{display:none!important}.btn{width:100%;padding:14px;border:none;border-radius:14px;font-weight:700;cursor:pointer;margin-top:8px}.green{background:#0a7a42;color:#fff}.blue{background:#0d5bff;color:#fff}.red{background:#d61f1f;color:#fff}.yellow{background:#ffcc00;color:#1a1a1a}input,select{width:100%;padding:12px;border-radius:12px;border:1px solid #ccc;margin:5px 0}.acc{margin-bottom:8px;border-radius:12px;overflow:hidden;background:#fff;width:100%;max-width:430px}.acc-b{display:none;padding:8px;background:#fafafa}.acc-b.show{display:block}.btn2{padding:8px 10px;border:none;border-radius:20px;color:#fff;cursor:pointer;margin:3px;font-weight:bold;font-size:11px}.header3{display:flex;gap:6px;width:100%}.hbox{flex:1;padding:14px 2px;border-radius:14px;text-align:center;font-weight:bold;font-size:13px;cursor:pointer;border:3px solid transparent}.hbox.active{border-color:yellow}.boxPresent{background:#2e7d32;color:#fff}.boxAbsent{background:#c62828;color:#fff}.boxNotice{background:#ef6c00;color:#fff}.cbox{border-radius:18px;overflow:hidden;background:#fff;border:2px solid #2e7d32;margin-bottom:10px}.cbox-head{color:#fff;padding:10px;text-align:center;font-weight:700}.cbox-body{padding:12px;background:#fff}.subName{width:78px;padding:6px 8px;border-radius:20px;border:2px solid #7c4dff;background:#f3e5f5;text-align:center;font-size:12px;font-weight:bold}.subFull{width:62px;padding:6px;border-radius:20px;border:2px solid #ff9800;background:#fff8e1;text-align:center;font-size:12px;font-weight:bold}.markGol{width:58px;height:38px;border-radius:18px;border:2px solid #4caf50;background:#e8f5e9;text-align:center;font-weight:bold}.markGol:disabled{background:#e5e7eb!important;opacity:.6;border-color:#9ca3af!important}.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:11px;text-align:center;background:#fff}.tbl th{padding:6px 3px;background:#1b5e20;color:#fff}.tbl td{padding:5px 2px;border-bottom:1px solid #ddd}.acc-h-normal{background:#1976d2;color:#fff;padding:10px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-weight:bold;border-radius:12px 12px 0 0}.acc-b-normal{display:none;padding:8px;background:#fafafa}.acc-b-normal.on{display:block}.subCtrl{display:flex;gap:6px;align-items:center;background:#f3f0ff;padding:8px;border-radius:12px}
#logoPreview{width:90px;height:90px;border-radius:50%;border:3px solid #ffcc00;object-fit:cover;object-position:center;background:#fff;display:none;padding:0;margin:0 auto}
#padLogo{width:56px;height:56px;border-radius:50%;border:3px solid #ffcc00;object-fit:cover;object-position:center;background:#fff;padding:0;display:block;flex-shrink:0}
</style></head><body>
<div id="firstPageWrap" style="width:100%;display:flex;flex-direction:column;align-items:center">
<div class="main-banner"><img id="mainBannerImg" src="IMG-20261005-WA0019(3).jpg" alt="Banner"></div>
<div class="green-box"><span>প্রাথমিক বিদ্যালয় হাজিরা</span></div>

<button class="menu" onclick="document.getElementById('formBox').classList.toggle('hidden')">🏫 প্রতিষ্ঠান ফরম ▼</button>

</div>
<input id="bnName" placeholder="প্রতিষ্ঠানের নাম"><input id="enName" placeholder="English Name (ঐচ্ছিক)"><input id="address" placeholder="ঠিকানা"><div style="display:flex;gap:6px"><input id="eiin" placeholder="EIIN"><input id="schoolCode" placeholder="Code"></div><div style="display:flex;gap:6px"><input id="mobile" placeholder="মোবাইল"><input id="email" placeholder="Email"></div><input id="pass1" type="password" placeholder="পাসওয়ার্ড"><button class="btn green" onclick="savePrimary()">সেভ করুন ✅</button>
</div>

<button class="menu" onclick="document.getElementById('loginBox').classList.toggle('hidden')">🔐 লগইন ▼</button>
<div id="loginBox" class="card hidden"><select id="loginInst"></select><div style="display:flex;gap:6px"><select id="shift"><option>🌅 প্রভাতি</option><option>দিবা</option></select><select id="cls"><option>১ম শ্রেণি</option><option>২য় শ্রেণি</option><option>৩য় শ্রেণি</option><option>৪র্থ শ্রেণি</option><option>৫ম শ্রেণি</option></select><select id="section"><option>ক</option><option>খ</option></select></div><input id="loginPass" type="password" placeholder="পাসওয়ার্ড"><button class="btn blue" onclick="primaryLogin()">🔒 প্রবেশ করুন</button><p id="loginMsg" style="color:red;text-align:center"></p></div>

<button class="menu" onclick="document.getElementById('listBox').classList.toggle('hidden')">🔒 তালিকা ▼</button>
<div id="listBox" class="card hidden"><button class="btn red" onclick="openListSecure()">🔓 তালিকা খুলুন (এডমিন)</button><div id="instList"></div></div>
</div>

<div id="secondPageWrap" class="hidden" style="width:100%;display:flex;flex-direction:column;align-items:center">
<div id="institutePad" style="width:100%;max-width:400px;background:#fff;border-radius:16px;padding:10px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 4px 12px #0002;border:1px solid #e5e7eb">
<img id="padLogo" src="" onerror="this.style.display='none'">
<div style="flex:1;text-align:center;line-height:1.3">
<div id="instName" style="font-size:13px;font-weight:700;color:#1e1b8a">প্রতিষ্ঠান</div>
<div id="instEng" style="font-size:11px;font-weight:700;color:#b91c1c;margin-top:1px"></div>
<div style="font-size:10px;font-weight:600;color:#000;margin-top:2px">EIIN: <span id="padEiin"></span> | Code: <span id="padCode"></span></div>
</div>
</div>
<div style="display:flex;justify-content:center;margin-top:8px"><div style="background:#1e3a8a;color:#fff;padding:4px 14px;border-radius:999px;font-size:11px">শ্রেণী: <span id="pillCls"></span> | শাখা: <span id="pillSec"></span> | শিফট: <span id="pillShift"></span></div></div>
<div style="text-align:center;margin-top:6px"><button onclick="logout()" style="background:#d61f1f;color:#fff;border:none;padding:6px 14px;border-radius:8px;font-size:12px;font-weight:bold">🚪 লগআউট</button></div>
<div id="acc" style="width:100%;max-width:430px;margin-top:10px"></div>
</div>

<script>
let students=JSON.parse(localStorage.getItem('students_v2')||'[]');
let saved=JSON.parse(localStorage.getItem('fullResultSheet')||'null');
let activeTab='';
let insts=JSON.parse(localStorage.getItem('takrim_primary_insts')||'[]');
let tempLogo=localStorage.getItem('takrim_temp_logo')||'';

function refreshInstSelect(){let el=document.getElementById('loginInst');el.innerHTML='<option value="">প্রতিষ্ঠান নির্বাচন</option>'+insts.map((x,i)=>'<option value="'+i+'">'+x.bnName+'</option>').join('');}refreshInstSelect();

// === গ্যালারি ফিক্স + 90x90 গোল + ফাঁকা বন্ধ ===
document.getElementById('logoInput').addEventListener('change',function(){
 if(!this.files ||!this.files[0]) return;
 let file=this.files[0];
 let r=new FileReader();
 r.onload=e=>{
  let img=new Image();
  img.onload=()=>{
   let canvas=document.createElement('canvas'); canvas.width=600; canvas.height=600;
   let ctx=canvas.getContext('2d');
   let w=img.width, h=img.height;
   let size=Math.min(w,h);
   let sx=(w-size)/2, sy=(h-size)/2;
   ctx.fillStyle='#fff'; ctx.fillRect(0,0,600,600);
   ctx.drawImage(img, sx, sy, size, size, 0, 0, 600, 600);
   tempLogo=canvas.toDataURL('image/png');
   let p=document.getElementById('logoPreview');
   p.src=tempLogo; p.style.display='block';
   localStorage.setItem('takrim_temp_logo',tempLogo);
  };
  img.src=e.target.result;
 };
 r.readAsDataURL(file);
});

function buildAcc(){document.getElementById('acc').innerHTML='<div class="acc"><div class="acc-h-normal" onclick="togN(1)"><span>1️⃣ শিক্ষার্থী যোগ</span><span>▼</span></div><div class="acc-b-normal" id="ab1"><input id="sn" placeholder="নাম"><input id="sr" placeholder="রোল"><input id="sm" placeholder="মোবাইল"><button class="btn2" style="background:#2e7d32;width:100%;padding:12px" onclick="addStu()">+ যোগ</button></div></div><div class="acc"><div class="acc-h-normal" onclick="togN(2)"><span>2️⃣ তালিকা</span><span>▼</span></div><div class="acc-b-normal" id="ab2"><div id="sList"></div></div></div><div class="acc" style="border:3px solid #0d47a1"><div class="acc-h-normal" style="background:#0d47a1" onclick="togN(3)"><div class="header3"><div id="hb_present" class="hbox boxPresent" onclick="event.stopPropagation();setTab(\'present\')">✅ উপস্থিত<br><span id="hc_present">0</span> জন</div><div id="hb_absent" class="hbox boxAbsent" onclick="event.stopPropagation();setTab(\'absent\')">❌ অনুপস্থিত<br><span id="hc_absent">0</span> জন</div><div id="hb_notice" class="hbox boxNotice" onclick="event.stopPropagation();setTab(\'notice\')">📢 নোটিশ</div></div></div><div class="acc-b" id="ab3"><div id="tabContent"></div></div></div><div class="acc"><div class="acc-h-normal" onclick="togN(4)"><span>4️⃣ মাসিক হাজিরা (১-৩১)</span><span>▼</span></div><div class="acc-b-normal" id="ab4"><input type="month" id="mp" value="'+new Date().toISOString().slice(0,7)+'" onchange="renderMonth()" style="width:100%"><div id="monthTbl" style="margin-top:8px;overflow:auto"></div></div></div><div class="acc"><div class="acc-h-normal" onclick="togN(5)"><span>5️⃣ ফলাফল - গোল ডিজাইন</span><span>▼</span></div><div class="acc-b-normal" id="ab5"><div style="background:#fff;padding:8px;border-radius:16px;border:2px solid #7c4dff"><div class="subCtrl"><b>বিষয়:</b><button onclick="chSub(-1)">-</button><input id="sc" type="number" value="5" style="width:70px;text-align:center"><button onclick="chSub(1)">+</button><button onclick="makeSheet()" style="background:#7c4dff;color:#fff;border:none;padding:6px 14px;border-radius:8px">সেট</button><span id="lockB"></span></div><div id="pdfArea" style="margin-top:8px;overflow:auto;background:#fff;padding:8px"><table class="tbl" id="rt"><thead id="rh"></thead><tbody id="rb"></tbody></table></div><div style="margin-top:8px;display:flex;gap:6px"><button style="background:#2e7d32;color:#fff;padding:10px;border-radius:20px;border:none;flex:1" onclick="saveRes()">💾 সেভ লক</button><button style="background:#ff9800;color:#fff;padding:10px;border-radius:20px;border:none;flex:1" onclick="unlockRes()">✏️ এডিট</button></div><div style="margin-top:8px;display:flex;gap:8px"><button style="background:#16a34a;color:#fff;padding:10px;border:none;border-radius:20px;flex:1" onclick="expExcel()">⬇️ Excel</button><button style="background:#dc2626;color:#fff;padding:10px;border:none;border-radius:20px;flex:1" onclick="downPDF()">⬇️ PDF</button></div><p id="st" style="font-size:11px;color:green;font-weight:bold;margin-top:4px"></p></div></div></div>';}
function togN(i){let b=document.getElementById('ab'+i);b.classList.toggle(i==3?'show':'on');if(i==2)showStu();if(i==4)renderMonth();if(i==5)makeSheet();}
function setTab(t){if(activeTab===t){activeTab='';document.querySelectorAll('.hbox').forEach(x=>x.classList.remove('active'));document.getElementById('ab3').classList.remove('show');return;}activeTab=t;document.querySelectorAll('.hbox').forEach(x=>x.classList.remove('active'));document.getElementById('hb_'+t).classList.add('active');document.getElementById('ab3').classList.add('show');renderTab();}
function renderHeaderCounts(){let p=students.filter(s=>s.present).length;let el1=document.getElementById('hc_present');let el2=document.getElementById('hc_absent');if(el1)el1.innerText=p;if(el2)el2.innerText=students.length-p;}
function smsCurrent(){let t=document.getElementById('tabContent').innerText;window.location.href='sms:?body='+encodeURIComponent(t);}
function waCurrent(){let t=document.getElementById('tabContent').innerText;window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank');}
function renderTab(){let n=localStorage.getItem('notice')||'';let p=students.filter(s=>s.present);let a=students.filter(s=>!s.present);let el=document.getElementById('tabContent');if(activeTab=='present'){el.innerHTML='<div class="cbox"><div class="cbox-head" style="background:#2e7d32">✅ উপস্থিত '+p.length+' জন</div><div class="cbox-body">'+(p.length?p.map(s=>'✅ '+s.name+' ('+s.roll+')').join('<br>'):'কেউ নেই')+'</div></div><div style="display:flex;gap:8px;margin-top:8px"><button onclick="smsCurrent()" style="flex:1;background:#1976d2;color:#fff;padding:12px;border:none;border-radius:20px">📱 SMS</button><button onclick="waCurrent()" style="flex:1;background:#2e7d32;color:#fff;padding:12px;border:none;border-radius:20px">💬 WhatsApp</button></div>';}else if(activeTab=='absent'){el.innerHTML='<div class="cbox" style="border-color:#c62828"><div class="cbox-head" style="background:#c62828">❌ অনুপস্থিত '+a.length+' জন</div><div class="cbox-body">'+(a.length?a.map(s=>'❌ '+s.name+' ('+s.roll+')').join('<br>'):'কেউ নেই')+'</div></div><div style="display:flex;gap:8px;margin-top:8px"><button onclick="smsCurrent()" style="flex:1;background:#c62828;color:#fff;padding:12px;border:none;border-radius:20px">📱 SMS</button><button onclick="waCurrent()" style="flex:1;background:#ef6c00;color:#fff;padding:12px;border:none;border-radius:20px">💬 WhatsApp</button></div>';}else{el.innerHTML='<textarea id="notice" rows="3" style="width:100%;padding:12px;border-radius:12px;border:2px solid #ff9800">'+n+'</textarea><div style="display:flex;gap:8px;margin-top:8px"><button onclick="smsCurrent()" style="flex:1;background:#1976d2;color:#fff;padding:12px;border:none;border-radius:20px">📱 SMS</button><button onclick="waCurrent()" style="flex:1;background:#16a34a;color:#fff;padding:12px;border:none;border-radius:20px">💬 WhatsApp</button></div><button onclick="localStorage.setItem(\'notice\',document.getElementById(\'notice\').value);alert(\'✅ সেভ\')" style="width:100%;background:#ef6c00;color:#fff;padding:12px;border:none;border-radius:20px;font-weight:700;margin-top:8px">💾 সেভ</button>';}}
function addStu(){let n=document.getElementById('sn').value.trim(),r=document.getElementById('sr').value.trim(),m=document.getElementById('sm').value.trim();if(!n||!r||!m)return alert('নাম রোল মোবাইল দিন');students.push({name:n,roll:r,mobile:m,present:true});localStorage.setItem('students_v2',JSON.stringify(students));location.reload();}
function showStu(){let h='';students.forEach((s,i)=>{let bg=s.present?'#dcfce7':'#fee2e2';let icon=s.present?'✅':'❌';let btnBg=s.present?'#16a34a':'#dc2626';h+='<div style="display:flex;justify-content:space-between;align-items:center;background:'+bg+';padding:8px 10px;border-radius:20px;margin:4px 0;border:1px solid #ddd"><span>'+(i+1)+'. '+s.name+' ('+s.roll+')</span><span><button onclick="tp('+i+')" style="background:'+btnBg+';color:#fff;border:none;padding:6px 12px;border-radius:20px">'+icon+'</button> <button onclick="ds('+i+')" style="background:#fff;border:1px solid #ccc;padding:6px 10px;border-radius:20px">🗑️</button></span></div>';});let el=document.getElementById('sList');if(el)el.innerHTML=h||'<div style="text-align:center;color:#999">কোন শিক্ষার্থী নেই</div>';renderHeaderCounts();}
function tp(i){students[i].present=!students[i].present;localStorage.setItem('students_v2',JSON.stringify(students));let month=new Date().toISOString().slice(0,7),day=new Date().getDate(),data=JSON.parse(localStorage.getItem('monthly31Data')||'{}');data[month+'_'+i+'_'+day]=students[i].present;localStorage.setItem('monthly31Data',JSON.stringify(data));showStu();if(activeTab)renderTab();renderMonth();}
function ds(i){if(confirm('ডিলিট?')){students.splice(i,1);localStorage.setItem('students_v2',JSON.stringify(students));location.reload();}}
function renderMonth(){let mp=document.getElementById('mp');if(!mp)return;let month=mp.value;let data=JSON.parse(localStorage.getItem('monthly31Data')||'{}');let html='<table border=1 style="width:100%;border-collapse:collapse;font-size:10px;min-width:900px;text-align:center"><tr style="background:#1976d2;color:#fff"><th>নাম</th>';for(let d=1;d<=31;d++)html+='<th>'+d+'</th>';html+='</tr>';students.forEach((s,idx)=>{html+='<tr><td style="text-align:left">'+s.name+'</td>';for(let d=1;d<=31;d++){let k=month+'_'+idx+'_'+d;let v=data[k];html+='<td onclick="togglePA('+idx+','+d+')" style="cursor:pointer;'+(v===true?'background:#e8f5e9':'')+(v===false?'background:#ffebee':'')+'">'+(v===true?'P':v===false?'A':'')+'</td>';}html+='</tr>';});html+='</table>';document.getElementById('monthTbl').innerHTML=html;}
function togglePA(idx,d){let month=document.getElementById('mp').value;let data=JSON.parse(localStorage.getItem('monthly31Data')||'{}');let k=month+'_'+idx+'_'+d;data[k]=data[k]===true?false:data[k]===false?null:true;if(data[k]===null)delete data[k];localStorage.setItem('monthly31Data',JSON.stringify(data));renderMonth();}
function chSub(n){let c=parseInt(document.getElementById('sc').value)||5;c+=n;if(c<1)c=1;if(c>20)c=20;document.getElementById('sc').value=c;}
function makeSheet(){let cnt=parseInt(document.getElementById('sc')?.value)||5;let subs=saved?.subjects||[{name:'বাংলা',full:100},{name:'ইংরেজি',full:100},{name:'গণিত',full:100},{name:'বিজ্ঞান',full:50},{name:'ধর্ম',full:50}];let head='<tr><th>রোল</th><th>নাম</th>';for(let i=0;i<cnt;i++){let s=subs[i]||{name:'বি'+(i+1),full:100};head+='<th><input id="sn'+i+'" value="'+s.name+'" class="subName"></th>';}head+='</tr>';let fullRow='<tr style="background:#fff8e1"><td colspan="2">পূর্ণমান</td>';for(let i=0;i<cnt;i++){let s=subs[i]||{full:100};fullRow+='<td><input id="sf'+i+'" type="number" value="'+s.full+'" class="subFull"></td>';}fullRow+='</tr>';let rh=document.getElementById('rh');if(rh)rh.innerHTML=head+fullRow;let body='';students.forEach((s,idx)=>{body+='<tr><td>'+s.roll+'</td><td style="text-align:left;font-weight:bold">'+s.name+'</td>';for(let j=0;j<cnt;j++){let old=saved?.marks?.[idx]?.[j]||'';body+='<td><input id="m_'+idx+'_'+j+'" type="number" value="'+old+'" class="markGol"></td>';}body+='</tr>';});let rb=document.getElementById('rb');if(rb)rb.innerHTML=body;applyLock();}
function applyLock(){let locked=localStorage.getItem('fullResultSheetLocked')=='true';document.querySelectorAll('#rh input,#rb input,#sc').forEach(el=>{el.disabled=locked;});let b=document.getElementById('lockB');if(b)b.innerHTML=locked?'<span style="background:#dc2626;color:#fff;padding:4px 10px;border-radius:20px;font-size:11px">🔒 লক</span>':'<span style="background:#16a34a;color:#fff;padding:4px 10px;border-radius:20px;font-size:11px">✏️ খোলা</span>';}
function saveRes(){let cnt=parseInt(document.getElementById('sc').value)||5;let subs=[];for(let i=0;i<cnt;i++)subs.push({name:document.getElementById('sn'+i).value,full:document.getElementById('sf'+i).value});let marks=[];students.forEach((_,idx)=>{let r=[];for(let j=0;j<cnt;j++)r.push(document.getElementById('m_'+idx+'_'+j).value);marks.push(r);});localStorage.setItem('fullResultSheet',JSON.stringify({subjects:subs,marks:marks}));localStorage.setItem('fullResultSheetLocked','true');saved=JSON.parse(localStorage.getItem('fullResultSheet'));document.getElementById('st').innerText='🔒 ফিক্সড';applyLock();}
function unlockRes(){if(!confirm('এডিট করবেন?'))return;localStorage.setItem('fullResultSheetLocked','false');document.getElementById('st').innerText='✏️ এডিট খোলা';applyLock();}
function expExcel(){let cnt=parseInt(document.getElementById('sc').value)||5;let header=['রোল','নাম'];for(let i=0;i<cnt;i++)header.push(document.getElementById('sn'+i)?.value||'বি'+(i+1));let rows=[];students.forEach((s,idx)=>{let r=[s.roll,s.name];for(let j=0;j<cnt;j++)r.push(document.getElementById('m_'+idx+'_'+j)?.value||0);rows.push(r);});let ws=XLSX.utils.aoa_to_sheet([header,...rows]);let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Result');XLSX.writeFile(wb,'Result.xlsx');}
async function downPDF(){let area=document.getElementById('pdfArea');let st=document.getElementById('st');if(st)st.innerText='⏳ PDF...';let oldW=area.style.width;area.style.width='1100px';area.style.overflow='visible';let canvas=await html2canvas(area,{scale:2,useCORS:true,backgroundColor:'#fff'});area.style.width=oldW;let img=canvas.toDataURL('image/png');let {jsPDF}=window.jspdf;let pdf=new jsPDF('l','mm','a4');let w=pdf.internal.pageSize.getWidth()-20;let h=canvas.height*w/canvas.width;pdf.addImage(img,'PNG',10,10,w,h);pdf.save('Result.pdf');if(st)st.innerText='✅ PDF OK';}

function savePrimary(){
 let logoToSave = tempLogo || document.getElementById('logoPreview')?.src || '';
 if(logoToSave.startsWith('data:')===false || logoToSave.length<100){ logoToSave = tempLogo; }
 let bn = document.getElementById('bnName').value.trim();
 let pass = document.getElementById('pass1').value.trim();
 if(!bn) return alert('প্রতিষ্ঠানের নাম দিন');
 if(!pass) return alert('পাসওয়ার্ড দিন');
 let o={
   bnName:bn,
   enName:document.getElementById('enName').value.trim(),
   addr:document.getElementById('address').value.trim(),
   eiin:document.getElementById('eiin').value.trim(),
   schoolCode:document.getElementById('schoolCode').value.trim(),
   mobile:document.getElementById('mobile').value.trim(),
   email:document.getElementById('email').value.trim(),
   pass:pass,
   logo:logoToSave
 };
 insts.push(o);
 localStorage.setItem('takrim_primary_insts',JSON.stringify(insts));
 localStorage.setItem('takrim_temp_logo','');
 alert('✅ সেভ হয়েছে - লোগো ' + (logoToSave?'আছে':'নাই'));
 location.reload();
}
function primaryLogin(){let idx=document.getElementById('loginInst').value;if(idx==='')return document.getElementById('loginMsg').textContent='প্রতিষ্ঠান নির্বাচন';let ins=insts[idx];if(document.getElementById('loginPass').value!==ins.pass)return document.getElementById('loginMsg').textContent='❌ ভুল পাস';localStorage.setItem('takrim_session',JSON.stringify({inst:ins,cls:document.getElementById('cls').value,shift:document.getElementById('shift').value,section:document.getElementById('section').value}));showSecondPage();}
function showSecondPage(){let sess=JSON.parse(localStorage.getItem('takrim_session')||'null');if(!sess)return;document.getElementById('firstPageWrap').classList.add('hidden');document.getElementById('secondPageWrap').classList.remove('hidden');document.body.style.background='#f0f4f8';document.getElementById('instName').innerText=sess.inst.bnName;document.getElementById('instEng').innerText=sess.inst.enName||'';let logoEl=document.getElementById('padLogo');if(sess.inst.logo){logoEl.src=sess.inst.logo;logoEl.style.display='block';}document.getElementById('padEiin').innerText=sess.inst.eiin||'';document.getElementById('padCode').innerText=sess.inst.schoolCode||'';document.getElementById('pillCls').innerText=sess.cls;document.getElementById('pillSec').innerText=sess.section;document.getElementById('pillShift').innerText=sess.shift;buildAcc();showStu();renderHeaderCounts();}
function openListSecure(){let a=prompt('এডমিন নাম'),p=prompt('পাসওয়ার্ড');if(a!=='malek'||p!=='takrim2022')return alert('ভুল এডমিন');let listDiv=document.getElementById('instList');if(insts.length==0){listDiv.innerHTML='<div style="text-align:center;color:#999;padding:10px">কোন প্রতিষ্ঠান নেই</div>';return;}listDiv.innerHTML=insts.map((s,i)=>'<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 8px;border-bottom:1px solid #eee;gap:8px"><div style="display:flex;align-items:center;gap:8px;flex:1;text-align:left"><img src="'+(s.logo||'')+'" style="width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid #ffcc00;background:#fff" onerror="this.style.display=\'none\'"><div><div style="font-weight:700;font-size:13px">'+s.bnName+'</div><div style="font-size:11px;background:#f3f4f6;padding:4px 8px;border-radius:8px;margin-top:4px;border:1px solid #e5e7eb;display:inline-block">🔑 <b style="color:#dc2626;user-select:all">'+s.pass+'</b></div></div></div><div style="display:flex;gap:6px"><button onclick="navigator.clipboard.writeText(\''+s.pass+'\');alert(\'কপি\')" style="background:#dbeafe;border:none;padding:8px;border-radius:10px">📋</button><button onclick="if(confirm(\'ডিলিট?\')){insts.splice('+i+',1);localStorage.setItem(\'takrim_primary_insts\',JSON.stringify(insts));openListSecure();refreshInstSelect();}" style="background:#fee2e2;border:none;padding:8px;border-radius:10px">🗑️</button></div></div>').join('');}
function logout(){if(confirm('লগআউট?')){localStorage.removeItem('takrim_session');location.reload();}}
let savedLogo=localStorage.getItem('takrim_temp_logo');if(savedLogo){let lp=document.getElementById('logoPreview');if(lp){lp.src=savedLogo;lp.style.display='block';} tempLogo=savedLogo;}
let existing=localStorage.getItem('takrim_session');if(existing)showSecondPage();
</script></body></html>
