<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>২য় পাতা</title><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;font-family:'Hind Siliguri',sans-serif}body{margin:0;background:#082a1e;display:flex;flex-direction:column;align-items:center;padding:0}.top-head{width:100%;background:#0f3d2e;padding:12px 12px 32px;border-radius:0 0 28px 28px;display:flex;justify-content:center}.top-inner{background:#fff;border-radius:18px;padding:12px;width:100%;max-width:400px;display:flex;gap:10px;align-items:center}.card{background:#fff;margin-top:12px;border-radius:24px;padding:16px;width:95%;max-width:420px}.hidden{display:none!important}textarea{width:100%;padding:12px;border-radius:12px;border:1.8px solid #d1d5db}</style></head><body>
<div class="top-head"><div class="top-inner"><img id="dashLogo" src="" style="width:56px;height:56px;border-radius:50%;border:3px solid #ffcc00;object-fit:cover"><div><div id="dashBn" style="font-weight:700"></div><div id="dashAddr" style="font-size:11px"></div><div style="font-size:11px">EIIN: <b id="dashEIIN"></b> | <span id="dashCls"></span></div></div></div></div>
<div class="card" style="margin:-22px 0 12px"><button style="width:100%;background:#ffcc00;border:none;border-radius:18px;padding:16px;font-weight:700" onclick="location.href='third-page.html'">👥 শিক্ষার্থীর তালিকা দেখুন</button><button onclick="document.getElementById('monthlyDiv').classList.toggle('hidden');renderMonthly()" style="width:100%;margin-top:10px;padding:14px;background:#fff;border:2.5px dashed #2563eb;border-radius:18px;font-weight:700;color:#2563eb">📋 মাসিক হাজিরা দেখুন</button><div id="monthlyDiv" class="hidden" style="margin-top:10px;border:2px dashed #2563eb;border-radius:16px;padding:10px;background:#fff"><div style="display:flex;justify-content:space-between"><div id="monthTitle" style="font-weight:700;font-size:12px"></div><button onclick="window.print()" style="background:#0f3d2e;color:#fff;border:none;padding:6px 12px;border-radius:8px">🖨️ প্রিন্ট</button></div><div style="overflow:auto"><table id="monthlyTable" border="1" style="border-collapse:collapse;font-size:10px;min-width:600px;width:100%;text-align:center"></table></div></div><label style="font-weight:700;margin-top:10px;display:block">📢 নোটিশ বোর্ড</label><textarea id="noticeText" rows="2" placeholder="নোটিশ..."></textarea><button style="width:100%;margin-top:8px;background:#16a34a;color:#fff;border:none;padding:14px;border-radius:14px;font-weight:700" onclick="shareReport()">📊 হাজিরা রিপোর্ট WhatsApp</button><button onclick="location.href='first-page.html'" style="width:100%;margin-top:8px;background:#333;color:#fff;border:none;padding:14px;border-radius:14px;font-weight:700">⬅️ লগআউট</button></div>
<script>let ses=JSON.parse(localStorage.getItem('takrim_session')||'null');if(!ses){location.href='first-page.html';}let curInst=ses.inst;let curClass=ses.cls;document.getElementById('dashBn').textContent=curInst.bnName;document.getElementById('dashAddr').textContent=curInst.addr;document.getElementById('dashEIIN').textContent=curInst.eiin;document.getElementById('dashCls').textContent=curClass+" | "+ses.section+" | "+ses.shift;document.getElementById('dashLogo').src=curInst.logo;function key(n){return n+'_'+curInst.eiin+'_'+curClass}function renderMonthly(){let now=new Date();let y=now.getFullYear();let m=now.getMonth();let days=new Date(y,m+1,0).getDate();let bnM=['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];document.getElementById('monthTitle').textContent=`${bnM[m]} ${y}`;let mk=`${y}-${m+1}`;let mAtt=JSON.parse(localStorage.getItem(key('monthly_'+mk))||'{}');let students=JSON.parse(localStorage.getItem(key('students'))||'[]');let head='<tr style="background:#fef9c3"><th>নাম</th>';for(let d=1;d<=days;d++)head+=`<th>${d}</th>`;head+='</tr>';let body='';students.forEach((s,idx)=>{body+=`<tr><td style="text-align:left;font-weight:700">${s.name}</td>`;for(let d=1;d<=days;d++){let st=mAtt[`${idx}_${d}`]||'-';let bg=st=='P'?'#dcfce7':st=='A'?'#fee2e2':'#fff';body+=`<td style="background:${bg}">${st}</td>`}body+='</tr>'});document.getElementById('monthlyTable').innerHTML=head+body;}function shareReport(){let students=JSON.parse(localStorage.getItem(key('students'))||'[]');let att=JSON.parse(localStorage.getItem(key('att'))||'{}');let t='হাজিরা রিপোর্ট\n';students.forEach((s,i)=>{t+=`${s.roll}. ${s.name} - ${att[i]=='absent'?'❌':'✅'}\n`});window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank')}</script></body></html>
