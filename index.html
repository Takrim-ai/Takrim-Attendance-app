<body>
<!-- উপরে ৩টা ঘর -->
<div class="top">
 <div class="s-y">সবাই<br><span id="cAll">0</span></div>
 <div class="s-g">উপস্থিত<br>1</div>
 <div class="s-r">অনুপস্থিত<br>0</div>
</div>

<!-- মাঝে শিক্ষার্থী তালিকা কার্ড (আগের মতো) -->
<div class="main">
 <button class="add-btn">+ শিক্ষার্থী যোগ করুন</button>
 <div class="list">...তালিকা...</div>
</div>

<!-- নিচে আলাদা ফলাফল বার -->
<div class="s-p" onclick="toggleResult()" style="margin-top:14px">
 🏆 ফলাফল - <span id="eye">👁️ লুকান</span>
</div>

<!-- ফলাফল বার এর নিচে ফলাফল সিট -->
<div class="main" id="resultBox">
 <div class="box">
  <div class="title">📋 ফলাফল সিট <button class="add-sub" onclick="addSubject()">+ বিষয়</button></div>
  <div class="tbl-wrap"><table id="tbl"></table></div>
  <div class="save-row">
   <button class="b-green" onclick="saveAll()">💾 সেভ</button>
   <button class="b-gray" onclick="render()">✏️ রিফ্রেশ</button>
  </div>
  <button class="dl-btn" onclick="downloadExcel()">📊 রেজাল্ট Excel ডাউনলোড</button>
 </div>
</div>
</body>
