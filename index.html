<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Primary School - Final 3 Page</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Hind Siliguri',sans-serif}
body{margin:0;background:#0a2342;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:12px}
.logo{width:360px;max-width:92%;border-radius:22px;border:3px solid #ffd700;margin-top:10px}
.menu-btn{display:block;width:100%;max-width:380px;background:#fff;border:3px solid #ffd700;border-radius:18px;padding:16px;font-size:19px;font-weight:bold;color:#111;margin-top:14px;cursor:pointer;text-align:center}
.page{display:none;width:100%;max-width:480px}.page.active{display:flex;flex-direction:column;align-items:center;width:100%}
.header{background:#0f3d2e;color:white;padding:25px 15px 50px;text-align:center;border-radius:0 0 25px 25px;width:100%}
.card{background:white;margin:-25px 12px 15px;border-radius:18px;padding:15px;width:100%}
.yellow-btn{background:#ffcc00;width:100%;padding:14px;border:none;border-radius:12px;font-weight:bold;cursor:pointer}
.sms-btns{display:flex;gap:8px}.sms-btns button{flex:1;padding:12px;border:none;border-radius:10px;color:white;font-weight:bold}
.green{background:#16a34a}.orange{background:#ea580c}.yellow{background:#eab308;color:#000!important}
.student-row{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid #eee}
.filter-tabs{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}.filter-tabs button{flex:1;min-width:70px;padding:10px 6px;border:none;border-radius:10px;font-weight:bold;cursor:pointer;font-size:13px}
select,input{width:100%;padding:14px;border-radius:14px;border:1.5px solid #ccc;font-size:16px;margin:6px 0;background:white}
.college-pad{background:#fff!important;border-radius:14px!important;padding:8px 12px!important;display:flex!important;align-items:center!important;gap:10px!important;box-shadow:0 3px 10px rgba(0,0,0,.2)!important;width:100%}
.college-pad img{width:56px!important;height:56px!important;border-radius:50%!important;border:3px solid #ffcc00!important;object-fit:cover!important;flex-shrink:0;background:white}
.pad-bn{font-size:12px!important;font-weight:700!important;color:#0f2d5a!important;line-height:1.3}
.pad-sm{font-size:10px!important;color:#333!important;margin-top:2px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;width:100%}
.topbar button{background:#ffcc00;border:none;border-radius:10px;padding:8px 14px;font-weight:bold;cursor:pointer}
.btn{width:100%;padding:13px;background:linear-gradient(135deg,#ffcc00,#ffb300);border:none;border-radius:12px;font-size:17px;font-weight:bold;color:#0f2d5a;margin-top:10px;cursor:pointer}
.btn-blue{background:linear-gradient(135deg,#0f3d2e,#1a6b4f);color:#fff}
.pa{padding:8px 14px;border-radius:10px;border:none;font-weight:bold;cursor:pointer}.a-on{background:#f44336;color:#fff}
#monthlyDivFirst{display:none}
#studentList{display:none!important} #studentList.show{display:block!important}
#resultDiv{display:none}
</style>
</head>
<body>

<!-- ১ম পাতা -->
<div id="home" class="page active">
<img class="logo" src="logo.jpg" onerror="this.style.display='none'">
<button class="menu-btn" onclick="show('newInstScr')">➕ নতুন প্রতিষ্ঠান যোগ করুন</button>
<button class="menu-btn" onclick="show('loginScr')">🔑 প্রতিষ্ঠান লগইন</button>
<button class="menu-btn" onclick="adminGate()">🏫 প্রতিষ্ঠানের তালিকা দেখুন</button>
</div>

<!-- নতুন প্রতিষ্ঠান - প্রাইমারি ফাইনাল -->
<div id="newInstScr" class="page">
<div class="topbar"><button onclick="show('home')">⬅ ফিরুন</button><h2 style="color:#fff;margin:0">➕ নতুন প্রতিষ্ঠান</h2><span></span></div>
<div class="card">
<div style="border:2px solid #ffcc00;border-radius:22px;padding:18px;margin-bottom:12px">
<div style="display:flex;gap:14px;align-items:center">
<div style="text-align:center;min-width:90px">
<label for="npLogoInp" style="cursor:pointer;display:block">
<img id="npLogo" src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iODAiIGhlaWdodD0iODAiIHZpZXdCb3g9IjAgMCA4MCA4MCI+PGNpcmNsZSBjeD0iNDAiIGN5PSI0MCIgcj0iNDAiIGZpbGw9IiNmNWY1ZjUiLz48L3N2Zz4=" style="width:80px;height:80px;border-radius:50%;border:5px solid #ffcc00;object-fit:cover;background:#f5f5f5;display:block;margin:0 auto">
<div style="color:#1a3aed;font-weight:bold;margin-top:6px;font-size:14px">লোগো চেঞ্জ</div>
</label>
<input type="file" id="npLogoInp" accept="image/*" onchange="npLogoChg(this)" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
</div>
<div style="flex:1">
<input id="npBn" placeholder="বাংলা নাম - ২৭নং পোতরপাড়..." style="text-align:center;font-weight:bold">
<div style="display:flex;gap:8px">
<input id="npEi" placeholder="EMIS Code - 9141109607" style="text-align:center;margin:0">
<input id="npCd" placeholder="বিদ্যালয় কোড" style="text-align:center;margin:0">
</div>
</div></div>
<input id="npAddr" placeholder="ঠিকানা - পোতরপাড়, সোনারগাঁও, নারায়ণগঞ্জ" style="text-align:center">
<div style="display:flex;gap:8px">
<input id="npMobile" placeholder="মোবাইল নম্বর" style="text-align:center;margin:0">
<input id="npEmail" placeholder="ইমেইল" style="text-align:center;margin:0">
</div>
</div>
<label style="font-weight:bold">🔑 পাসওয়ার্ড</label><input id="npPass" type="password" placeholder="পাসওয়ার্ড দিন">
<button class="btn btn-blue" onclick="saveNewInst()">সেভ করুন ✔️</button>
</div></div>

<!-- লগইন -->
<div id="loginScr" class="page">
<div class="topbar"><button onclick="show('home')">⬅ ফিরুন</button><span></span><span></span></div>
<div class="card" style="text-align:center;border:3px solid #ffcc00;margin-top:0">
<div style="font-size:50px">🔐</div><h2>প্রতিষ্ঠান লগইন</h2>
<label style="text-align:left;font-weight:bold">🏫 EMIS / কোড</label><input id="l_code" placeholder="যেমন: 9141109607">
<label style="text-align:left;font-weight:bold">🔑 পাসওয়ার্ড</label><input id="l_pass" type="password" placeholder="পাসওয়ার্ড দিন">
<label style="text-align:left;font-weight:bold">🎓 শ্রেণি</label><select id="l_cls"></select>
<button class="btn" onclick="teacherLogin()">প্রবেশ করুন ➜</button>
<p id="l_msg" style="color:red;font-size:14px;margin-top:8px"></p>
</div></div>

<!-- তালিকা -->
<div id="listScr" class="page">
<div class="topbar"><button onclick="show('home')">⬅ ফিরুন</button><h2 style="color:#fff;margin:0">🏫 তালিকা</h2><span></span></div>
<div class="card"><div id="instList"></div></div>
</div>

<!-- ২য় পাতা - ড্যাশবোর্ড -->
<div id="firstPage" class="page">
<div class="header" style="padding:10px 10px 35px">
<div class="college-pad"><div onclick="logoInput.click()" style="cursor:pointer;text-align:center;min-width:60px"><img id="boxLogo" src="https://via.placeholder.com/65"><div style="font-size:9px;color:blue">লোগো চেঞ্জ</div><input type="file" id="logoInput" accept="image/*" style="display:none" onchange="changeBoxLogo(this)"></div>
<div style="flex:1;overflow:hidden;text-align:left">
<div id="boxNameBn" class="pad-bn" contenteditable="true" onblur="saveBox()">২৭নং পোতরপাড় আছমা খাতুন সরকারি প্রাথমিক বিদ্যালয়</div>
<div class="pad-sm">EMIS: <b><span id="boxEIIN" contenteditable="true" onblur="saveBox()">9141109607</span></b> | Code: <b><span id="boxIns" contenteditable="true" onblur="saveBox()">-</span></b></div>
<div class="pad-sm"><span id="boxAddr" contenteditable="true" onblur="saveBox()">পোতরপাড়, সোনারগাঁও, নারায়ণগঞ্জ</span> | <span id="boxMobile" contenteditable="true" onblur="saveBox()">01724-057734</span></div>
</div></div>
<p id="boxStatus" style="color:#ffcc00;font-size:12px;height:12px;margin:5px 0 0"></p>
<p style="margin:8px 0 0;font-weight:700">শ্রেণী: <span id="showClass"></span></p></div>
<div class="card">
<button class="yellow-btn" onclick="openStudentPage()">👥 শিক্ষার্থীর তালিকা দেখুন</button>
<button onclick="toggleMonthlyFirst()" style="width:100%;margin-top:12px;padding:14px;background:#fff;border:2px dashed #2563eb;border-radius:12px;font-weight:bold;color:#2563eb">📋 মাসিক হাজিরা দেখুন</button>
<div id="monthlyDivFirst" style="overflow:auto;margin-top:10px;border:2px dashed #2563eb;border-radius:12px;padding:10px;background:#f8fafc"></div>
<h3>📢 নোটিশ বোর্ড</h3><input type="text" id="noticeText" placeholder="নোটিশ লিখুন...">
<h3>💬 SMS পাঠান</h3><div class="sms-btns"><button class="green" onclick="sendDirectSMS('present')">✅ উপস্থিত</button><button class="orange" onclick="sendDirectSMS('absent')">❌ অনুপস্থিত</button><button class="yellow" onclick="sendDirectSMS('notice')">📢 নোটিশ</button></div>
<h3>📲 WhatsApp-এ পাঠান</h3><div class="sms-btns"><button class="green" onclick="sendWA('present')">✅ উপস্থিত</button><button class="orange" onclick="sendWA('absent')">❌ অনুপস্থিত</button><button class="yellow" onclick="sendWA('notice')">📢 নোটিশ</button></div>
<button onclick="shareReport()" style="width:100%;margin-top:10px;padding:14px;background:#25D366;color:white;border:none;border-radius:12px;font-weight:bold">📊 হাজিরা রিপোর্ট WhatsApp গ্রুপে দিন</button>
<button onclick="location.reload()" style="width:100%;margin-top:12px;padding:10px;background:#555;color:white;border:none;border-radius:10px">⬅️ লগআউট</button>
</div></div>

<!-- ৩য় পাতা - শিক্ষার্থী তালিকা -->
<div id="secondPage" class="page">
<div class="header" style="padding-bottom:20px"><div class="college-pad"><img id="boxLogo3"><div style="flex:1;overflow:hidden;text-align:left"><div id="boxNameBn3" class="pad-bn"></div><div class="pad-sm"><span id="boxEIIN3"></span> | <span id="boxIns3"></span></div><div class="pad-sm" id="boxAddr3"></div></div></div>
<h2 style="margin:10px 0 0">শিক্ষার্থীর তালিকা</h2><div style="color:#ffcc00;font-size:13px;margin-top:6px;font-weight:700">শ্রেণী: <span id="showClass3"></span></div>
<button onclick="show('firstPage')" style="margin-top:10px;background:white;color:#0f3d2e;border:none;padding:6px 15px;border-radius:20px;font-weight:bold">⬅️ ড্যাশবোর্ড</button></div>
<div class="card">
<button onclick="toggleAdd()" style="width:100%;padding:14px;background:#dcfce7;border:2px dashed #16a34a;border-radius:12px;font-weight:bold">➕ শিক্ষার্থী যোগ করুন</button>
<div id="addForm" style="display:none;margin-top:10px;padding:12px;background:#f0fdf4;border-radius:12px;border:1px solid #16a34a"><input type="text" id="sName" placeholder="নাম"><input type="text" id="sRoll" placeholder="রোল"><input type="text" id="sMobile" placeholder="মোবাইল"><div style="display:flex;gap:8px"><button onclick="addStudent()" style="flex:1;padding:12px;background:#16a34a;color:white;border:none;border-radius:8px">✅ যোগ</button><button onclick="toggleAdd()" style="flex:1;padding:12px;background:#555;color:white;border:none;border-radius:8px">❌ বন্ধ</button></div></div>
<div class="filter-tabs"><button style="background:#ffcc00" onclick="filterList('all')">📋 সবাই<br><span id="cAll">0</span></button><button style="background:#16a34a;color:white" onclick="filterList('present')">✅ উপস্থিত<br><span id="cPresent">0</span></button><button style="background:#ef4444;color:white" onclick="filterList('absent')">❌ অনুপস্থিত<br><span id="cAbsent">0</span></button><button style="background:#7c3aed;color:white" onclick="filterList('result')">🏆 ফলাফল</button></div>
<div id="studentList"></div><div id="resultDiv" style="overflow:auto;margin-top:10px;border:2px solid #7c3aed;border-radius:12px;padding:10px;background:#f5f3ff"></div>
</div></div>

<script>
function show(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
let users=JSON.parse(localStorage.getItem('takrim_users')||'{}');
let insts=JSON.parse(localStorage.getItem('takrim_insts')||'[]');
const LCLASSES=['১ম শ্রেণি','২য় শ্রেণি','৩য় শ্রেণি','৪র্থ শ্রেণি','৫ম শ্রেণি'];
l_cls.innerHTML='<option value="">শ্রেণি সিলেক্ট করুন</option>'+LCLASSES.map(c=>'<option value="'+c+'">'+c+'</option>').join('');
let npLogoData='';function npLogoChg(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{npLogoData=e.target.result;npLogo.src=e.target.result;};r.readAsDataURL(f);}
function saveNewInst(){let bn=npBn.value.trim();if(!bn){alert('বাংলা নাম দিন');return;}let ei=npEi.value.trim(),cd=npCd.value.trim(),addr=npAddr.value.trim(),mob=npMobile.value.trim(),em=npEmail.value.trim(),pass=npPass.value;if(!pass){alert('পাসওয়ার্ড দিন');return;}insts.push({name:bn,eiin:ei,code:cd,addr:addr,mobile:mob,email:em,logo:npLogoData,pass:pass});localStorage.setItem('takrim_insts',JSON.stringify(insts));let k=cd||ei;if(k&&pass){users[k]=pass;localStorage.setItem('takrim_users',JSON.stringify(users));}npBn.value='';npEi.value='';npCd.value='';npAddr.value='';npMobile.value='';npEmail.value='';npPass.value='';npLogoData='';alert('✔️ প্রাইমারি প্রতিষ্ঠান যোগ হয়েছে');show('home');}
function teacherLogin(){let c=l_code.value.trim(),p=l_pass.value,cl=l_cls.value;if(!c||!p){l_msg.textContent='কোড ও পাসওয়ার্ড দিন';return;}if(!cl){l_msg.textContent='শ্রেণি সিলেক্ট করুন';return;}let i=insts.findIndex(s=>((s.code||'').trim()===c||(s.eiin||'').trim()===c));let ok=(users[c]&&users[c]===p);if(!ok&&i>=0&&(insts[i].pass||'')===p)ok=true;if(!ok){l_msg.textContent='❌ ভুল কোড বা পাসওয়ার্ড!';return;}l_msg.textContent='';l_code.value='';l_pass.value='';l_cls.value='';let s=insts[i>=0?i:0]||{};localStorage.setItem('collegeInfo',JSON.stringify({nameBn:s.name||'',eiin:s.eiin||'',ins:s.code||'',addr:s.addr||'',mobile:s.mobile||'',email:s.email||'',logo:s.logo||''}));currentClass=cl;loadClassData();showClass.innerText=currentClass;showClass3.innerText=currentClass;loadBox();show('firstPage');}
function adminGate(){let ap=localStorage.getItem('takrim_admin_pass');if(!ap){let np=prompt('প্রথমবার: এডমিন পাসওয়ার্ড সেট করুন (ID: takrim)');if(!np)return;localStorage.setItem('takrim_admin_pass',np);alert('✔️ সেট হয়েছে');openListScr();return;}let id=prompt('🔐 এডমিন আইডি দিন');if(id!=='takrim'){alert('❌ অনুমতি নেই!');return;}let pw=prompt('🔐 এডমিন পাসওয়ার্ড দিন');if(pw!==ap){alert('❌ ভুল পাসওয়ার্ড!');return;}openListScr();}
function openListScr(){show('listScr');let seen={},uniq=[];insts.forEach((s,i)=>{let k=(s.eiin||'')+(s.name||'');if(!seen[k]){seen[k]=1;uniq.push(i);}});instList.innerHTML=uniq.length?uniq.map(i=>{let s=insts[i];return '<div class="card" style="display:flex;align-items:center;gap:10px;padding:10px;margin:0 0 10px">'+(s.logo?'<img src="'+s.logo+'" style="width:45px;height:45px;border-radius:50%;object-fit:cover">':'🏫')+'<div style="flex:1"><b>'+s.name+'</b><br><small>EMIS: '+(s.eiin||'-')+' | Code: '+(s.code||'-')+'<br>📍 '+(s.addr||'-')+'<br>📱 '+(s.mobile||'-')+'</small></div><button class="pa a-on" onclick="delInst('+i+')">🗑️</button></div>';}).join(''):'<p style="text-align:center;color:#888">কোনো প্রতিষ্ঠান নেই</p>';}
function delInst(idx){if(!confirm('ডিলিট করবেন?'))return;let s=insts[idx];if(s.code&&users[s.code]){delete users[s.code];localStorage.setItem('takrim_users',JSON.stringify(users));}insts.splice(idx,1);localStorage.setItem('takrim_insts',JSON.stringify(insts));openListScr();}
let currentClass="";let students=[],attendance={};let currentFilter='none';
function key(n){return n+'_'+currentClass;}
function loadClassData(){students=JSON.parse(localStorage.getItem(key('students'))||'[]');attendance=JSON.parse(localStorage.getItem(key('att'))||'{}');}
function saveAll(){if(!currentClass)return;localStorage.setItem(key('students'),JSON.stringify(students));localStorage.setItem(key('att'),JSON.stringify(attendance));}
function saveBox(){let info={nameBn:boxNameBn.innerText.trim(),eiin:boxEIIN.innerText.trim(),ins:boxIns.innerText.trim(),addr:boxAddr.innerText.trim(),mobile:boxMobile.innerText.trim(),logo:boxLogo.src};localStorage.setItem('collegeInfo',JSON.stringify(info));boxStatus.innerText="✅ সেভ হয়েছে";setTimeout(()=>boxStatus.innerText="",1200);boxNameBn3.innerText=info.nameBn;boxEIIN3.innerText="EMIS: "+info.eiin;boxIns3.innerText="Code: "+info.ins;boxAddr3.innerText=info.addr+" | "+info.mobile;boxLogo3.src=info.logo;}
function changeBoxLogo(i){let f=i.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{boxLogo.src=e.target.result;saveBox();};r.readAsDataURL(f);}
function loadBox(){let info=JSON.parse(localStorage.getItem('collegeInfo')||'{}');if(info.nameBn)boxNameBn.innerText=info.nameBn;if(info.eiin)boxEIIN.innerText=info.eiin;if(info.ins)boxIns.innerText=info.ins;if(info.addr)boxAddr.innerText=info.addr;if(info.mobile)boxMobile.innerText=info.mobile;if(info.logo){boxLogo.src=info.logo;boxLogo3.src=info.logo;}boxNameBn3.innerText=info.nameBn||boxNameBn.innerText;boxEIIN3.innerText="EMIS: "+(info.eiin||boxEIIN.innerText);boxIns3.innerText="Code: "+(info.ins||boxIns.innerText);boxAddr3.innerText=(info.addr||'')+" | "+(info.mobile||'');}
function openStudentPage(){show('secondPage');loadBox();updateCounts();studentList.style.display='none';studentList.classList.remove('show');resultDiv.style.display='none';currentFilter='none';}
function toggleAdd(){let f=addForm;f.style.display=f.style.display=='none'?'block':'none';}
function addStudent(){let n=sName.value.trim();if(!n)return alert('নাম দিন');students.push({name:n,roll:sRoll.value.trim(),mobile:sMobile.value.trim()});saveAll();addForm.style.display='none';sName.value='';sRoll.value='';sMobile.value='';filterList('all');}
function toggleAtt(i,isP){attendance[i]=isP?'present':'absent';saveAll();render();updateCounts();}
function updateCounts(){let p=0;students.forEach((_,i)=>{if(attendance[i]!=='absent')p++;});cAll.innerText=students.length;cPresent.innerText=p;cAbsent.innerText=students.length-p;}
function filterList(t){currentFilter=t;let sl=studentList,rd=resultDiv;sl.style.display='none';rd.style.display='none';sl.classList.remove('show');if(t=='result'){rd.style.display='block';}else{sl.style.display='block';sl.classList.add('show');render();}}
function render(){let sl=studentList;sl.innerHTML='';students.forEach((s,i)=>{if(currentFilter=='present'&&attendance[i]=='absent')return;if(currentFilter=='absent'&&attendance[i]!=='absent')return;let isP=attendance[i]!=='absent';sl.innerHTML+='<div class="student-row" style="background:'+(isP?'#e8f5e9':'#ffebee')+'"><div><b>'+s.name+'</b><br><small>রোল: '+(s.roll||'-')+' | '+(s.mobile||'-')+'</small></div><div><button class="pa" style="background:'+(isP?'#16a34a':'#ccc')+';color:#fff" onclick="toggleAtt('+i+',true)">✅</button> <button class="pa" style="background:'+(!isP?'#ef4444':'#ccc')+';color:#fff" onclick="toggleAtt('+i+',false)">❌</button></div></div>';});}
function toggleMonthlyFirst(){let d=monthlyDivFirst;d.style.display=d.style.display=='none'?'block':'none';}
function sendDirectSMS(t){alert(t+' SMS');}function sendWA(t){alert(t+' WA');}function shareReport(){alert('রিপোর্ট শেয়ার');}
</script>
