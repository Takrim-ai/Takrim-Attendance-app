<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Takrim - Final</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Kalpurush,Arial}
body{background:#0a2e1f;padding:8px}
.main{max-width:520px;margin:auto;background:#fff;border-radius:18px;padding:12px}
.add{width:100%;padding:14px;background:#2563eb;color:#fff;border:2px solid #1e40af;border-radius:12px;font-weight:bold;font-size:18px;cursor:pointer;margin-bottom:12px}
.stu{background:#f3f4f6;display:flex;justify-content:space-between;padding:10px;border-radius:10px;margin-bottom:6px}
#list{display:none;margin-bottom:10px}#list.show{display:block}
.stats{display:flex;gap:6px;margin-bottom:10px}.s{flex:1;padding:12px;border-radius:12px;text-align:center;font-weight:bold;cursor:pointer}.s1{background:#ffcc00}.s2{background:#16a34a;color:#fff}.s3{background:#ef4444;color:#fff}
.toggle{width:100%;padding:13px;background:#7c3aed;color:#fff;border:none;border-radius:12px;font-weight:bold;font-size:16px;cursor:pointer;margin-bottom:10px}
.box{border:2px solid #a78bfa;border-radius:14px;padding:8px;display:none}.box.show{display:block}
.sheetHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sheetHead h3{color:#7c3aed;font-size:16px}
.btnName{padding:6px 12px;background:#7c3aed;color:#fff;border:none;border-radius:20px;font-weight:bold;cursor:pointer;font-size:13px}
.wrap{overflow-x:auto;border:1px solid #ddd;border-radius:10px}
table{width:100%;border-collapse:collapse;min-width:750px;font-size:13px}
th{background:#0a2e1f;color:#fff;padding:8px;text-align:center}
td{padding:6px;border:1px solid #ddd;text-align:center;background:#fff}
td input{width:70px;padding:7px;border:2px dashed #16a34a;border-radius:8px;text-align:center;font-weight:bold;background:#f3f4f6}
.pra{background:#dcfce7;font-weight:bold}.per{background:#dbeafe;font-weight:bold}.gpa{background:#fef3c7;font-weight:bold}
.row{display:flex;gap:8px;margin-top:8px}.row button{flex:1;padding:11px;border:none;border-radius:10px;font-weight:bold;color:#fff;cursor:pointer}
.save{background:#16a34a}.edit{background:#6b7280}.pdf{background:#111827}.excel{background:#047857}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:none;justify-content:center;align-items:center;z-index:999}
.modal.active{display:flex}.modalBox{background:#fff;width:90%;max-width:380px;border-radius:18px;padding:18px}
.modalBox input{width:100%;padding:12px;margin-bottom:10px;border:2px solid #16a34a;border-radius:10px;font-size:16px}
.modalBtns{display:flex;gap:10px}.modalBtns button{flex:1;padding:12px;border:none;border-radius:10px;font-weight:bold;cursor:pointer}.btnCancel{background:#e5e7eb}.btnOk{background:#2563eb;color:#fff}
</style>
</head>
<body>
<div class="main">
<button class="add" onclick="openModal()">+ শিক্ষার্থী যোগ করুন</button>
<div id="list"></div>
<div class="stats">
<div class="s s1" onclick="toggleStudentList()">📋 সবাই<br><span id="t1">0</span></div>
<div class="s s2" onclick="toggleStudentList()">✅ উপস্থিত<br><span id="t2">0</span></div>
<div class="s s3" onclick="toggleStudentList()">❌ অনুপস্থিত<br><span id="t3">0</span></div>
</div>
<button class="toggle" id="togBtn" onclick="togBox()">🏆 ফলাফল দেখুন</button>
<div class="box" id="resultBox">
<div class="sheetHead"><h3>📋 ফলাফল সিট</h3><button class="btnName" onclick="renameSubject()">✏️ নাম বদলান</button></div>
<div class="wrap"><table><thead><tr><th>ক্রম</th><th>নাম</th><th>রোল</th><th id="h1">বাংলা 100</th><th id="h2">গণিত 100</th><th>পূর্ণমান</th><th>প্রাপ্ত</th><th>%</th><th>GPA</th></tr></thead><tbody id="tbody"></tbody></table></div>
<div class="row"><button class="save" onclick="saveNow()">💾 সেভ (অটো)</button><button class="edit" onclick="editNow()">✏️ এডিট</button></div>
<div class="row"><button class="pdf" onclick="toPDF_fixed()">📄 PDF A4</button><button class="excel" onclick="toExcel()">📊 Excel</button></div>
</div>
</div>
<div class="modal" id="modal"><div class="modalBox"><h3 style="text-align:center;margin-bottom:10px">নতুন শিক্ষার্থী</h3><input id="mName" placeholder="নাম *"><input id="mRoll" placeholder="রোল *"><input id="mPhone" placeholder="মোবাইল (ঐচ্ছিক)"><div class="modalBtns"><button class="btnCancel" onclick="closeModal()">Cancel</button><button class="btnOk" onclick="confirmAdd()">OK</button></div></div></div>

<script>
const SAVE_KEY='takrim_final_v105';const UI_KEY='takrim_ui_v105';
let subNames=["বাংলা","গণিত"];let full=[100,100];
let students=[{name:"কালাম",roll:"202",present:true,marks:[78,80]},{name:"কমল",roll:"203",present:true,marks:[75,90]}];
let edit=true;let resultVisible=false;let listVisible=false;
function getGPA(per){if(per>=80)return "5.00";if(per>=70)return "4.00";if(per>=60)return "3.50";if(per>=50)return "3.00";if(per>=40)return "2.00";if(per>=33)return "1.00";return "0.00";}
function getGrade(per){if(per>=80)return "A+";if(per>=70)return "A";if(per>=60)return "A-";if(per>=50)return "B";if(per>=40)return "C";if(per>=33)return "D";return "F";}
try{let d=localStorage.getItem(SAVE_KEY); if(d){let o=JSON.parse(d); if(o.full) full=o.full; if(o.subNames) subNames=o.subNames; if(o.students) students=o.students;} let u=localStorage.getItem(UI_KEY); if(u){let ui=JSON.parse(u); resultVisible=ui.resultVisible||false; listVisible=ui.listVisible||false;}}catch(e){}
function autoSave(){localStorage.setItem(SAVE_KEY, JSON.stringify({full,subNames,students})); localStorage.setItem(UI_KEY, JSON.stringify({resultVisible,listVisible}));}
function toggleStudentList(){listVisible=!listVisible; document.getElementById('list').classList.toggle('show', listVisible); autoSave();}
function openModal(){document.getElementById('modal').classList.add('active');}function closeModal(){document.getElementById('modal').classList.remove('active');}
function confirmAdd(){let n=document.getElementById('mName').value.trim(); let r=document.getElementById('mRoll').value.trim(); if(!n){alert('নাম লিখুন'); return;} if(!r){r=200+students.length+1;} students.push({name:n,roll:r,present:true,marks:full.map(()=>0)}); closeModal(); autoSave(); render();}
function renameSubject(){
 let n1=prompt("১ম বিষয়ের নতুন নাম:", subNames[0]); if(n1===null) return;
 let n2=prompt("২য় বিষয়ের নতুন নাম:", subNames[1]); if(n2===null) return;
 if(n1.trim()) subNames[0]=n1.trim();
 if(n2.trim()) subNames[1]=n2.trim();
 autoSave(); render();
}
function togBox(){resultVisible=!resultVisible; let b=document.getElementById('resultBox'); let t=document.getElementById('togBtn'); if(resultVisible){b.classList.add('show'); t.innerHTML='🔼 ফলাফল বন্ধ করুন';} else{b.classList.remove('show'); t.innerHTML='🏆 ফলাফল দেখুন';} autoSave();}
function render(){
 let tb=document.getElementById('tbody'); tb.innerHTML='';
 let totalFull=0; for(let f of full) totalFull+=Number(f)||0;
 document.getElementById('t1').innerText=students.length;
 document.getElementById('t2').innerText=students.filter(x=>x.present).length;
 document.getElementById('t3').innerText=students.filter(x=>!x.present).length;
 document.getElementById('h1').innerHTML=subNames[0]+" 100";
 document.getElementById('h2').innerHTML=subNames[1]+" 100";
 let listDiv=document.getElementById('list'); listDiv.innerHTML='';
 students.forEach((s,i)=>{listDiv.innerHTML+=`<div class="stu"><span>${i+1}. ${s.name} (${s.roll}) - ${s.present?'✅':'❌'}</span><span><input type="checkbox" ${s.present?'checked':''} onchange="students[${i}].present=this.checked; autoSave(); render()"> <button onclick="if(confirm('ডিলিট?')){students.splice(${i},1); autoSave(); render();}">❌</button></span></div>`;});
 listDiv.classList.toggle('show', listVisible);
 let box=document.getElementById('resultBox'); let btn=document.getElementById('togBtn'); box.classList.toggle('show', resultVisible); btn.innerHTML=resultVisible?'🔼 ফলাফল বন্ধ করুন':'🏆 ফলাফল দেখুন';
 let trFull=`<tr style="background:#f3f4f6;font-weight:bold"><td></td><td>পূর্ণমান</td><td></td>`;
 for(let j=0;j<full.length;j++) trFull+=`<td><input type="number" value="${full[j]}" ${edit?'':'disabled'} oninput="full[${j}]=Number(this.value)||0; autoSave(); render()"></td>`;
 trFull+=`<td class="pra">${totalFull}</td><td class="pra">-</td><td class="per">100%</td><td class="gpa">-</td></tr>`;
 tb.innerHTML+=trFull;
 students.forEach((s,i)=>{
  let prapto=0; for(let m of s.marks) prapto+=Number(m)||0;
  let per=totalFull>0?prapto/totalFull*100:0;
  let tr=`<tr><td>${i+1}</td><td>${s.name}</td><td>${s.roll}</td>`;
  for(let j=0;j<full.length;j++){tr+=`<td><input type="number" value="${s.marks[j]}" ${edit?'':'disabled'} oninput="students[${i}].marks[${j}]=Number(this.value)||0; autoSave(); render()"></td>`;}
  tr+=`<td class="pra">${totalFull}</td><td class="pra">${prapto}</td><td class="per">${per.toFixed(1)}%</td><td class="gpa">${getGPA(per)}<br><small>${getGrade(per)}</small></td></tr>`;
  tb.innerHTML+=tr;
 });
}
function editNow(){edit=true;render();}function saveNow(){edit=false; autoSave(); render();}
function toPDF_fixed(){
 let totalFull=0; for(let f of full) totalFull+=Number(f)||0;
 let dateStr=new Date().toLocaleDateString('bn-BD');
 let rows=''; students.forEach((s,i)=>{let prapto=0; for(let m of s.marks) prapto+=Number(m)||0; let per=totalFull>0?prapto/totalFull*100:0; rows+=`<tr><td>${i+1}</td><td style="text-align:left">${s.name}</td><td>${s.roll}</td><td>${s.marks[0]}</td><td>${s.marks[1]}</td><td>${totalFull}</td><td>${prapto}</td><td>${per.toFixed(1)}%</td><td>${getGPA(per)}</td></tr>`;});
 let html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Result</title><style>body{font-family:Kalpurush,Arial;padding:20px}h2{text-align:center}table{width:100%;border-collapse:collapse}th,td{border:1.5px solid #000;padding:8px;text-align:center;font-size:13px}th{background:#0a2e1f;color:#fff}@media print{@page{size:A4 landscape;margin:10mm}}</style></head><body><h2>ফলাফল শীট - ${subNames.join(' + ')}</h2><p style="text-align:center">তারিখ: ${dateStr} | মোট: ${students.length}</p><table><thead><tr><th>ক্রম</th><th>নাম</th><th>রোল</th><th>${subNames[0]}</th><th>${subNames[1]}</th><th>মোট</th><th>প্রাপ্ত</th><th>%</th><th>GPA</th></tr></thead><tbody>${rows}</tbody></table><script>window.onload=function(){setTimeout(function(){window.print()},800)}<\/script></body></html>`;
 let win=window.open('','_blank'); win.document.open(); win.document.write(html); win.document.close();
}
function toExcel(){let totalFull=0; for(let f of full) totalFull+=Number(f)||0; let data=[['ক্রম','নাম','রোল',subNames[0],subNames[1],'পূর্ণমান','প্রাপ্ত','%','GPA']]; students.forEach((s,i)=>{let prapto=0; for(let m of s.marks) prapto+=Number(m)||0; let per=totalFull>0?prapto/totalFull*100:0; data.push([i+1,s.name,s.roll,s.marks[0],s.marks[1],totalFull,prapto,per.toFixed(1)+'%',getGPA(per)]);}); let ws=XLSX.utils.aoa_to_sheet(data); let wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Result'); XLSX.writeFile(wb,'Result.xlsx');}
render();
</script>
</body>
</html>
