<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Result - Fixed Like Photo</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Hind Siliguri',sans-serif;margin:0}
body{background:#0f2f1f;padding:8px}
.card{background:#fff;border-radius:16px;padding:8px;max-width:1100px;margin:auto}
.top{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.btn-purple{background:#7c3aed;color:#fff;border:none;border-radius:12px;padding:8px 10px;font-weight:700;width:70px;line-height:1.2;font-size:13px}
.inp-count{flex:1;border:1.8px solid #e5e7eb;border-radius:12px;padding:10px;text-align:center;font-weight:700;font-size:18px;outline:none}
.wrap{overflow-x:auto;border:2px solid #0f2f1f;border-radius:14px;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:max-content;min-width:100%}
th{background:#0f2f1f;color:#fff;padding:8px 4px;font-size:14px;white-space:nowrap}
td{border:1px solid #e5e7eb;padding:6px 4px;text-align:center;font-weight:600;background:#fff;white-space:nowrap}
.pill-sub{background:#fff;color:#000;border-radius:18px;padding:9px 12px;min-width:95px;display:inline-block;font-weight:700;cursor:pointer;border:2px solid #fff}
.pill-sub:active{border-color:#7c3aed}
.yellow{background:#fef9c3!important}
.input-full{width:80px;height:34px;border:1.8px dashed #c9a800;background:transparent;border-radius:10px;text-align:center;font-weight:700;font-size:16px;outline:none}
.input-full:focus{border-style:solid;border-color:#16a34a;background:#fff}
.input-mark{width:92px;height:42px;border:2px solid #cbd5e1;border-radius:22px;text-align:center;font-weight:700;font-size:17px;outline:none;background:#fff}
.input-mark:focus{border-color:#16a34a;background:#f0fdf4;box-shadow:0 0 0 3px rgba(22,163,74,.2)}
.total-bar{background:#ffcc00;border-radius:12px;padding:12px;display:flex;justify-content:space-between;font-weight:700;margin-top:8px;font-size:15px}
.btns{display:flex;gap:10px;margin-top:10px}
.btns button{flex:1;padding:13px;border-radius:12px;border:none;font-weight:700;color:#fff;font-size:16px}
.g{background:#16a34a}.gr{background:#6b7280}
/* Add Student Modal - Fix input issue */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:999}
.modal.show{display:flex}
.mBox{background:#fff;border-radius:16px;padding:14px;width:92%;max-width:360px}
.mBox h3{text-align:center;margin-bottom:8px}
.mBox input{width:100%;border:2px solid #ddd;border-radius:10px;padding:12px;margin:6px 0;font-size:16px;font-weight:600;outline:none}
.mBox input:focus{border-color:#7c3aed}
.addBtn{width:100%;border:2.5px dashed #16a34a;background:#f6fef8;border-radius:12px;padding:12px;font-weight:700;margin-bottom:8px}
</style>
</head>
<body>
<div class="card">
<button class="addBtn" onclick="openAdd()">+ শিক্ষার্থী যোগ করুন (নাম, রোল, মোবাইল)</button>
<div class="top">
<button class="btn-purple" onclick="editAllSub()">নাম<br>বদলান</button>
<span style="font-weight:700;font-size:14px">বিষয় সংখ্যা:</span>
<input class="inp-count" id="subCount" type="number" value="5" onchange="changeCount(this.value)">
</div>

<div class="wrap"><table id="tbl"></table></div>
<div class="total-bar"><span id="tFull">মোট পূর্ণমান: 500</span><span id="tGot">মোট প্রাপ্ত: 260</span></div>
<div class="btns"><button class="gr" id="editBtn" onclick="toggleEdit()">✏️ এডিট</button><button class="g" onclick="saveData()">💾 সেভ</button></div>
</div>

<div class="modal" id="modal">
<div class="mBox">
<h3>নতুন শিক্ষার্থী</h3>
<input id="fName" placeholder="নাম" autocomplete="name">
<input id="fRoll" placeholder="রোল" type="number" inputmode="numeric">
<input id="fMobile" placeholder="মোবাইল নাম্বার" type="tel" inputmode="numeric">
<div style="display:flex;gap:8px;margin-top:8px"><button style="flex:1;padding:12px;border-radius:10px;border:none;background:#6b7280;color:#fff;font-weight:700" onclick="closeAdd()">বাতিল</button><button style="flex:1;padding:12px;border-radius:10px;border:none;background:#16a34a;color:#fff;font-weight:700" onclick="addStudent()">যোগ করুন</button></div>
</div>
</div>

<script>
let subjects = JSON.parse(localStorage.getItem('sub_final_fix')||'["বাংলা","ইংরেজি","গণিত","বিজ্ঞান","ধর্ম"]');
let fullMarks = JSON.parse(localStorage.getItem('full_final_fix')||'[100,100,100,100,100]');
let students = JSON.parse(localStorage.getItem('stu_final_fix')||'[{"name":"গোলাম","roll":"202","mobile":"01700","marks":[50,40,60,50,60]}]');
let editMode = true;

function openAdd(){document.getElementById('modal').classList.add('show'); setTimeout(()=>document.getElementById('fName').focus(),100);}
function closeAdd(){document.getElementById('modal').classList.remove('show');}
function addStudent(){
 let n=document.getElementById('fName').value.trim();
 let r=document.getElementById('fRoll').value.trim();
 let m=document.getElementById('fMobile').value.trim();
 if(!n||!r){alert("নাম আর রোল লিখতে হবে মামা");return;}
 students.push({name:n,roll:r,mobile:m,marks:subjects.map(()=>0)});
 document.getElementById('fName').value="";document.getElementById('fRoll').value="";document.getElementById('fMobile').value="";
 closeAdd(); saveData(); render();
}
function changeCount(v){v=parseInt(v)||1; if(v>10)v=10; if(v>subjects.length){while(subjects.length<v){subjects.push("বিষয় "+(subjects.length+1)); fullMarks.push(100);} }else{subjects=subjects.slice(0,v); fullMarks=fullMarks.slice(0,v);} students.forEach(s=>{if(s.marks.length<v){while(s.marks.length<v)s.marks.push(0)}else s.marks=s.marks.slice(0,v)}); saveData(); render();}
function editAllSub(){let t=prompt("বিষয়ের নাম কমা দিয়ে লিখো:",subjects.join(", ")); if(!t)return; let a=t.split(",").map(x=>x.trim()).filter(Boolean); if(a.length){subjects=a.slice(0,10); if(fullMarks.length<subjects.length){while(fullMarks.length<subjects.length)fullMarks.push(100);} saveData(); render();}}
function editOneSub(i){let nn=prompt(subjects[i]+" এর নতুন নাম:",subjects[i]); if(nn){subjects[i]=nn.trim(); saveData(); render();}}
function toggleEdit(){editMode=!
