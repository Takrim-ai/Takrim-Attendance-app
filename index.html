<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ফলাফল সিট</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;font-family:'Hind Siliguri',sans-serif;margin:0}
body{background:#0a2e1e;padding:8px}
.top-stats{display:flex;gap:8px}
.top-stats div{flex:1;border-radius:16px;padding:12px 2px;text-align:center;font-weight:700;color:#fff}
.s-y{background:#ffcc00;color:#000}.s-g{background:#16a34a}.s-r{background:#ef4444}.s-p{background:#7c3aed}
.main{background:#fff;border-radius:26px;padding:12px;margin-top:10px;min-height:90vh}
.box{border:2.5px solid #8b5cf6;border-radius:20px;padding:12px}
.title{text-align:center;color:#7c3aed;font-weight:700;font-size:20px;margin:6px 0}
.row{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.btn{border:none;border-radius:12px;padding:12px 18px;font-weight:700;color:#fff;cursor:pointer}
.b-p{background:#7c3aed}.b-blue{background:#0ea5e9}.b-green{background:#16a34a}.b-gray{background:#6b7280}.b-red{background:#ef4444}
.inp{border:2px solid #ddd;border-radius:12px;padding:11px;width:90px;text-align:center;font-weight:700}
.inp-y{background:#fef9c3;border-color:#eab308}
table{width:100%;border-collapse:collapse;margin-top:8px;min-width:900px}
th,td{border:1px solid #e5e7eb;padding:0;text-align:center}
th{background:#f3e8ff;padding:10px}
.mark{width:100%;border:none;padding:12px;text-align:center;font-weight:700;background:transparent;outline:none}
.mark-y{background:#fef9c3!important}
.cell{padding:10px;font-weight:700}
.save-row{display:flex;gap:10px;margin-top:14px}
.save-row button{flex:1;padding:14px;border-radius:14px;border:none;font-weight:700;color:#fff;font-size:16px}
.dl-row{display:flex;gap:10px;margin-top:14px}
.dl-row button{flex:1;padding:14px;border-radius:16px;border:none;font-weight:700;color:#fff}
@media print{.no-print{display:none!important}}
</style>
</head>
<body>
<div class="top-stats no-print">
<div class="s-y">সবাই<br><span id="cAll">0</span></div>
<div class="s-g">উপস্থিত<br><span id="cP">0</span></div>
<div class="s-r">অনুপস্থিত<br><span id="cA">0</span></div>
<div class="s-p">ফলাফল</div>
</div>

<div class="main">
<div class="box">
<div class="title">📋 ফলাফল সিট</div>

<div class="row no-print">
<button class="btn b-p" onclick="renameSubs()">নাম বদলান</button>
<span style="font-weight:700">বিষয় সংখ্যা:</span>
<input id="subCount" class="inp" type="number" value="5" min="1" max="13">
</div>

<div class="row no-print">
<span style="font-weight:700">পূর্ণমান:</span>
<input id="fullMark" class="inp inp-y" type="number" value="50">
<button class="btn b-blue" onclick="applyCounts()">পূর্ণমান সেট</button>
</div>

<div id="sheet" style="overflow:auto"></div>

<div class="save-row no-print">
<button class="b-green" onclick="saveAll()">💾 সেভ</button>
<button class="b-gray" onclick="alert('এখন নম্বর ঘরে ট্যাপ করে এডিট করো')">✏️ এডিট</button>
</div>
</div>

<div class="dl-row no-print">
<button style="background:#334155" onclick="window.print()">📄 PDF ডাউনলোড</button>
<button style="background:#16a34a" onclick="downloadExcel()">📊 Excel ডাউনলোড</button>
</div>
</div>

<script>
let allStudents=JSON.parse(localStorage.getItem('takrim_students')||'[{"name":"Kalam","roll":"1","marks":[75,80,78,80,80]}]');
let subjects=JSON.parse(localStorage.getItem('takrim_subjects')||'["বাংলা","ইংরেজি","গণিত","বিজ্ঞান","সামাজিক বিজ্ঞান"]');
let fullMarks=JSON.parse(localStorage.getItem('takrim_fullmarks')||'[50,50,50,50,50]');

function saveAll(){
 localStorage.setItem('takrim_students',JSON.stringify(allStudents));
 localStorage.setItem('takrim_subjects',JSON.stringify(subjects));
 localStorage.setItem('takrim_fullmarks',JSON.stringify(fullMarks));
 alert('✅ সেভ হয়েছে');
}

function render(){
 let n=subjects.length;
 document.getElementById('subCount').value=n;
 let ft=fullMarks.slice(0,n).reduce((a,b)=>a+(+b||0),0);
 document.getElementById('cAll').textContent=allStudents.length;

 // হেডার - ছবির মত
 let h=`<table><tr><th>ক্রম</th><th>নাম</th><th>রোল</th>`;
 subjects.forEach(s=>h+=`<th>${s}</th>`);
 h+=`<th>প্রাপ্ত</th><th>%</th><th>গ্রেড</th><th class="no-print">🗑️</th></tr>`;

 // পূর্ণমান রো - হলুদ - বাগ ফিক্স: এখন আর ০ / ১০০ / ১০০ আসবে না
 h+=`<tr><td></td><td style="font-weight:700">পূর্ণমান</td><td></td>`;
 fullMarks.slice(0,n).forEach((fm,i)=>h+=`<td style="background:#fef9c3"><input class="mark mark-y" value="${fm}" onchange="editFull(${i},this.value)"></td>`);
 h+=`<td style="background:#fef9c3;font-weight:700">${ft}</td><td>-</td><td>-</td><td class="no-print"></td></tr>`;

 allStudents.forEach((st,gi)=>{
   if(!st.marks) st.marks=Array(n).fill('');
   st.marks=st.marks.slice(0,n); while(st.marks.length<n) st.marks.push('');
   let tot=st.marks.reduce((a,b)=>a+(+b||0),0);
   let per=ft? (tot/ft*100):0;
   let gr=per>=80?'A+':per>=70?'A':per>=60?'A-':per>=50?'B':per>=40?'C':per>=33?'D':'F';
   h+=`<tr><td>${gi+1}</td><td style="text-align:left;padding-left:8px">${st.name}</td><td>${st.roll}</td>`;
   st.marks.forEach((m,i)=>h+=`<td><input class="mark" type="number" value="${m}" oninput="editMark(${gi},${i},this.value)"></td>`);
   h+=`<td class="cell" style="background:#fef9c3">${tot}</td><td class="cell">${per.toFixed(1)}</td><td class="cell">${gr}</td><td class="no-print"><button onclick="del(${gi})" style="border:none;background:#fee2e2;padding:6px 8px;border-radius:8px">🗑️</button></td></tr>`;
 });
 h+=`</table>`;
 document.getElementById('sheet').innerHTML=h;
}

function editMark(gi,si,v){allStudents[gi].marks[si]=v; localStorage.setItem('takrim_students',JSON.stringify(allStudents)); render();}
function editFull(i,v){fullMarks[i]=parseInt(v)||0; localStorage.setItem('takrim_fullmarks',JSON.stringify(fullMarks)); render();}
function applyCounts(){let n=parseInt(subCount.value)||5;let fm=parseInt(fullMark.value)||50;if(n>13)n=13;subjects=Array.from({length:n},(_,i)=>subjects[i]||`বিষয় ${i+1}`);fullMarks=Array(n).fill(fm);allStudents.forEach(s=>s.marks=Array.from({length:n},(_,i)=>s.marks?.[i]||''));saveAll();render();}
function renameSubs(){let nm=prompt('বিষয় নাম কমা দিয়ে',subjects.join(','));if(!nm)return;subjects=nm.split(',').map(s=>s.trim());fullMarks=fullMarks.slice(0,subjects.length);while(fullMarks.length<subjects.length)fullMarks.push(parseInt(fullMark.value)||50);saveAll();render();}
function del(i){if(confirm('ডিলিট?')){allStudents.splice(i,1);saveAll();render();}}
function downloadExcel(){let head=['ক্রম','নাম','রোল',...subjects,'প্রাপ্ত','%','গ্রেড'];let rows=allStudents.map((st,i)=>{let t=st.marks.reduce((a,b)=>a+(+b||0),0);let ft=fullMarks.reduce((a,b)=>a+b,0);let p=ft?(t/ft*100).toFixed(1):0;return [i+1,st.name,st.roll,...st.marks,t,p];});let ws=XLSX.utils.aoa_to_sheet([head,...rows]);let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Result');XLSX.writeFile(wb,'result.xlsx');}
render();
</script>
</body>
</html>
