<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>প্রতিষ্ঠান হাজিরা সিস্টেম</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Hind Siliguri',sans-serif}
body{background:#0b2b23;padding:12px;min-height:100vh}
.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.step{background:#eef4ff;border-radius:10px;padding:10px;margin:8px 0}
.step b{color:#1a56db}
select,input,button{width:100%;padding:11px;margin:6px 0;border-radius:10px;border:1px solid #ccc;font-size:15px}
button{background:#1a56db;color:#fff;border:none;font-weight:bold;cursor:pointer}
button.green{background:#16a34a}button.red{background:#dc2626}button.yellow{background:#facc15;color:#1a1a1a}
.hidden{display:none}
.pad{background:#fff;border-radius:16px;padding:12px;display:flex;align-items:center;gap:12px;margin-bottom:4px}
.pad img{width:64px;height:64px;border-radius:50%;border:3px solid #facc15;object-fit:cover}
.pad.t b{color:#1e3a8a;font-size:16px;display:block}
.pad.t span{color:#dc2626;font-size:13px;display:block}
.pad.t small{color:#333;font-size:12px}
.clsline{text-align:center;color:#fff;font-size:20px;font-weight:bold;margin:12px 0}
.clsline2{text-align:center;color:#facc15;font-size:17px;font-weight:bold;margin:8px 0}
.dbtn{display:block;width:100%;padding:14px;margin:8px 0;border-radius:12px;font-size:16px;font-weight:bold;text-align:center}
.dash{border:2px dashed #1a56db;background:#fff;color:#1a56db}
.secttl{font-size:18px;font-weight:bold;margin:14px 0 6px;color:#fff}
.noticebox{background:#fff;border-radius:12px;padding:12px;margin:6px 0}
.row3{display:flex;gap:8px}
.row3 button{flex:1;padding:12px;font-size:14px}
.stats{display:flex;gap:8px;margin:10px 0}
.stat{flex:1;border-radius:12px;padding:12px 6px;text-align:center;color:#fff;font-weight:bold;font-size:14px}
.student{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid #eee;background:#fff}
.btns{display:flex;gap:6px}.btns button{width:auto;padding:8px 12px;font-size:13px}
.present{background:#e6f9ec!important;border-left:4px solid #16a34a}
.absent{background:#fdeaea!important;border-left:4px solid #dc2626}
table{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
th,td{border:1px solid #ddd;padding:7px;text-align:center}
th{background:#1a56db;color:#fff}
.backbtn{background:#fff;color:#1a56db;width:auto;padding:8px 20px;border-radius:20px;display:block;margin:8px auto}
.addstd{border:2px dashed #16a34a;background:#f0fdf4;color:#111;border-radius:12px;padding:14px;text-align:center;font-weight:bold;cursor:pointer;margin:10px 0}
h2.pttl{text-align:center;color:#fff;font-size:24px;margin:6px 0}
.admrow{display:flex;gap:6px}.admrow input{flex:1}
.lrow{display:flex;justify-content:space-between;align-items:center;background:#f8fafc;border-radius:10px;padding:10px;margin:6px 0}
.lrow button{width:auto;padding:6px 12px;font-size:13px}
</style>
</head>
<body>

<!-- ============ প্রথম পাতা ============ -->
<div id="pg1">
<div style="margin-bottom:10px;border-radius:18px;overflow:hidden;border:3px solid #d4af37"><img src="IMG-20261005-WA0019(3).jpg" style="width:100%;display:block" alt="banner"></div>
<div id="pad1"></div>

<div class="card">
<h3 style="text-align:center;color:#1a56db;margin-bottom:8px">🏫 নতুন প্রতিষ্ঠান ফরম</h3>
<center><img id="logoPrev" src="" style="width:80px;height:80px;border-radius:50%;border:3px solid #facc15;object-fit:cover;display:none;margin-bottom:6px"></center>
<button class="yellow" onclick="document.getElementById('logoFile').click()">🖼️ লোগো চেঞ্জ</button>
<input type="file" id="logoFile" accept="image/*" class="hidden" onchange="prevLogo(this)">
<input id="f_bn" placeholder="বাংলা নাম">
<input id="f_en" placeholder="English Name">
<div class="admrow"><input id="f_eiin" placeholder="EIIN"><input id="f_code" placeholder="Code"></div>
<input id="f_pass" type="password" placeholder="🔑 পাসওয়ার্ড দিন">
<button class="green" onclick="saveInst()">সেভ করুন ✅</button>
</div>

<div class="card">
<h3 style="text-align:center;color:#1a56db;margin-bottom:8px">🔐 প্রতিষ্ঠান লগইন</h3>
<label>প্রতিষ্ঠান:</label><select id="l_inst"></select>
<div class="step"><b>ধাপ ১: শিফট</b><select id="l_shift"><option value="morning">🌅 প্রভাতি</option><option value="day">☀️ দিবা</option><option value="single">🏫 এক শিফট</option></select></div>
<div class="step"><b>ধাপ ২: শ্রেণি</b><select id="l_cls"><option>প্রাক-প্রাথমিক</option><option>১ম শ্রেণি</option><option>২য় শ্রেণি</option><option>৩য় শ্রেণি</option><option>৪র্থ শ্রেণি</option><option>৫ম শ্রেণি</option><option>৬ষ্ঠ শ্রেণি</option><option>৭ম শ্রেণি</option><option>৮ম শ্রেণি</option><option>৯ম শ্রেণি</option><option>১০ম শ্রেণি</option></select></div>
<div class="step"><b>ধাপ ৩: শাখা</b><select id="l_sec"><option value="na">N/A</option><option>শাখা এ</option><option>শাখা বি</option></select></div>
<div class="step"><b>ধাপ ৪: পাসওয়ার্ড</b><input id="l_pass" type="password" placeholder="প্রতিষ্ঠানের পাসওয়ার্ড"></div>
<button onclick="doLogin()">🔓 প্রবেশ করুন</button>
<p id="loginErr" style="color:#dc2626;text-align:center;min-height:20px"></p>
</div>

<div class="card">
<h3 style="text-align:center;color:#1a56db;margin-bottom:8px">🔒 প্রতিষ্ঠানের তালিকা দেখুন</h3>
<div id="lockBox">
<input id="a_user" placeholder="এডমিন নাম">
<input id="a_pass" type="password" placeholder="এডমিন পাসওয়ার্ড">
<button class="red" onclick="unlockList()">🔓 তালিকা খুলুন</button>
<p id="admErr" style="color:#dc2626;text-align:center;min-height:20px"></p>
</div>
<div id="instList" class="hidden"></div>
</div>
</div>

<!-- ============ দ্বিতীয় পাতা: ড্যাশবোর্ড ============ -->
<div id="pg2" class="hidden">
<div id="pad2"></div>
<div class="clsline">শ্রেণী: <span id="d_cls"></span></div>
<button class="dbtn yellow" onclick="goPage('pg3');loadStdPage()">👥 শিক্ষার্থীর তালিকা দেখুন</button>
<button class="dbtn dash" onclick="goPage('pgM');showMonthly()">📋 মাসিক হাজিরা দেখুন</button>
<div class="secttl">📢 নোটিশ বোর্ড</div>
<div class="noticebox"><input id="noticeTxt" placeholder="নোটিশ লিখুন..."><button class="green" onclick="saveNotice()">📢 নোটিশ সেভ করুন</button><div id="noticeList"></div></div>
<div class="secttl">💬 SMS পাঠান</div>
<div class="row3"><button class="green" onclick="sendSMS('p')">✅ উপস্থিত</button><button class="red" onclick="sendSMS('a')">❌ অনুপস্থিত</button><button class="yellow" onclick="sendSMS('n')">📢 নোটিশ</button></div>
<div class="secttl">📲 WhatsApp-এ পাঠান</div>
<div class="row3"><button class="green" onclick="sendWA('p')">✅ উপস্থিত</button><button class="red" onclick="sendWA('a')">❌ অনুপস্থিত</button><button class="yellow" onclick="sendWA('n')">📢 নোটিশ</button></div>
<button class="dbtn green" onclick="sendWAReport()">📊 হাজিরা রিপোর্ট WhatsApp গ্রুপে দিন</button>
<button class="dbtn red" onclick="logout()">🚪 লগআউট</button>
</div>

<!-- ============ তৃতীয় পাতা: শিক্ষার্থীর তালিকা ============ -->
<div id="pg3" class="hidden">
<div id="pad3"></div>
<h2 class="pttl">শিক্ষার্থীর তালিকা</h2>
<div class="clsline2">শ্রেণী: <span id="s_cls"></span></div>
<button class="backbtn" onclick="goPage('pg2')">⬅ ড্যাশবোর্ড</button>
<div class="card">
<div class="addstd" onclick="document.getElementById('addForm').classList.toggle('hidden')">➕ শিক্ষার্থী যোগ করুন</div>
<div id="addForm" class="hidden">
<input id="s_name" placeholder="শিক্ষার্থীর নাম">
<div class="admrow"><input id="s_roll" type="number" placeholder="রোল"><input id="s_phone" placeholder="মোবাইল (ঐচ্ছিক)"></div>
<button class="green" onclick="addStudent()">➕ যোগ করুন</button>
</div>
<div class="stats">
<div class="stat" style="background:#facc15;color:#111">📋 সবাই<br><span id="c_all">0</span></div>
<div class="stat" style="background:#16a34a">✅ উপস্থিত<br><span id="c_p">0</span></div>
<div class="stat" style="background:#dc2626">❌ অনুপস্থিত<br><span id="c_a">0</span></div>
<div class="stat" style="background:#7c3aed" onclick="goPage('pgM');showMonthly()">🏆<br>ফলাফল</div>
</div>
<label>তারিখ:</label>
<input type="date" id="attDate">
<div id="stdRows"></div>
<button class="green" onclick="saveAtt()">💾 হাজিরা সংরক্ষণ</button>
</div>
</div>

<!-- ============ মাসিক হাজিরা ============ -->
<div id="pgM" class="hidden">
<div id="pad4"></div>
<h2 class="pttl">📋 মাসিক হাজিরা</h2>
<button class="backbtn" onclick="goPage('pg2')">⬅ ড্যাশবোর্ড</button>
<div class="card">
<label>মাস নির্বাচন:</label>
<input type="month" id="mMonth" onchange="showMonthly()">
<div id="mOut" style="overflow-x:auto"></div>
</div>
</div>

<script>
const ADMIN_U="malek", ADMIN_P="takrim2022";
function get(k){try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return[]}}
function set(k,v){localStorage.setItem(k,JSON.stringify(v))}
function today(){return new Date().toISOString().slice(0,10)}
function goPage(id){['pg1','pg2','pg3','pgM'].forEach(x=>document.getElementById(x).classList.add('hidden'));document.getElementById(id).classList.remove('hidden');window.scrollTo(0,0)}
function S(){return sessionStorage}
const DEF_LOGO="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%231e3a8a'/><text x='50' y='70' font-size='52' text-anchor='middle'>🎓</text></svg>";
function padHTML(inst){
  const logo=(inst&&inst.logo)||DEF_LOGO;
  const bn=inst?inst.bn:'প্রতিষ্ঠানের নাম';
  const en=(inst&&inst.en)?'<span>'+inst.en+'</span>':'';
  const ec='EIIN: '+((inst&&inst.eiin)||'-')+' &nbsp; Code: '+((inst&&inst.code)||'-');
  return '<div class="pad"><img src="'+logo+'"><div class="t"><b>'+bn+'</b>'+en+'<small>'+ec+'</small></div></div>';
}
function renderPads(){
  const insts=get('inst_list');
  const sel=insts.find(x=>x.id===document.getElementById('l_inst').value)||insts[0]||null;
  document.getElementById('pad1').innerHTML=padHTML(sel);
  const cur=curInst();
  document.getElementById('pad2').innerHTML=padHTML(cur);
  document.getElementById('pad3').innerHTML=padHTML(cur);
  document.getElementById('pad4').innerHTML=padHTML(cur);
}
let tmpLogo="";
function prevLogo(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{tmpLogo=e.target.result;const p=document.getElementById('logoPrev');p.src=tmpLogo;p.style.display='block'};r.readAsDataURL(f)}
function saveInst(){
  const bn=document.getElementById('f_bn').value.trim(),en=document.getElementById('f_en').value.trim(),eiin=document.getElementById('f_eiin').value.trim(),code=document.getElementById('f_code').value.trim(),pass=document.getElementById('f_pass').value;
  if(!bn||!pass){alert('বাংলা নাম ও পাসওয়ার্ড দিন!');return}
  const l=get('inst_list');l.push({id:'i'+Date.now(),bn:bn,en:en,eiin:eiin,code:code,pass:pass,logo:tmpLogo||''});set('inst_list',l);
  ['f_bn','f_en','f_eiin','f_code','f_pass'].forEach(id=>document.getElementById(id).value='');
  tmpLogo='';document.getElementById('logoPrev').style.display='none';
  fillLoginInsts();renderPads();alert('✅ প্রতিষ্ঠান সেভ হয়েছে!');
}
function fillLoginInsts(){const l=get('inst_list');document.getElementById('l_inst').innerHTML=l.map(x=>'<option value="'+x.id+'">'+x.bn+'</option>').join('')||'<option value="">-- কোনো প্রতিষ্ঠান নেই --</option>'}
function doLogin(){
  const inst=get('inst_list').find(x=>x.id===document.getElementById('l_inst').value);
  if(!inst){document.getElementById('loginErr').textContent='আগে প্রতিষ্ঠান যোগ করুন!';return}
  if(document.getElementById('l_pass').value!==inst.pass){document.getElementById('loginErr').textContent='❌ ভুল পাসওয়ার্ড!';return}
  S().setItem('login','1');S().setItem('inst',inst.id);
  S().setItem('shift',document.getElementById('l_shift').value);
  S().setItem('cls',document.getElementById('l_cls').value);
  S().setItem('sec',document.getElementById('l_sec').value);
  enterDash();
}
function curInst(){return get('inst_list').find(x=>x.id===S().getItem('inst'))||null}
function key(){return S().getItem('inst')+'_'+S().getItem('shift')+'_'+S().getItem('cls')+'_'+S().getItem('sec')}
function enterDash(){renderPads();document.getElementById('d_cls').textContent=S().getItem('cls');document.getElementById('s_cls').textContent=S().getItem('cls');loadNotices();goPage('pg2')}
function logout(){S().removeItem('login');location.reload()}
function unlockList(){
  const u=document.getElementById('a_user').value.trim(),p=document.getElementById('a_pass').value;
  if(u===ADMIN_U&&p===ADMIN_P){
    const l=get('inst_list');
    document.getElementById('instList').innerHTML=l.map(x=>'<div class="lrow"><span>🏫 '+x.bn+'<br><small>EIIN:'+(x.eiin||'-')+' | Code:'+(x.code||'-')+'</small></span><button class="red" onclick="delInst(\''+x.id+'\')">মুছুন</button></div>').join('')||'<p>কোনো প্রতিষ্ঠান নেই</p>';
    document.getElementById('instList').classList.remove('hidden');
    document.getElementById('admErr').textContent='';
  }else{document.getElementById('admErr').textContent='❌ ভুল এডমিন তথ্য!'}
}
function delInst(id){if(!confirm('মুছে ফেলবেন?'))return;set('inst_list',get('inst_list').filter(x=>x.id!==id));fillLoginInsts();renderPads();unlockList()}
function addStudent(){
  const n=document.getElementById('s_name').value.trim(),r=document.getElementById('s_roll').value.trim(),ph=document.getElementById('s_phone').value.trim();
  if(!n||!r){alert('নাম ও রোল দিন!');return}
  const s=get('std_'+key());s.push({n:n,r:r,ph:ph});set('std_'+key(),s);
  document.getElementById('s_name').value='';document.getElementById('s_roll').value='';document.getElementById('s_phone').value='';
  loadStdPage();
}
function loadStdPage(){
  const s=get('std_'+key());
  if(!document.getElementById('attDate').value)document.getElementById('attDate').value=today();
  document.getElementById('stdRows').innerHTML=s.map((x,i)=>'<div class="student" id="row'+i+'"><span>রোল '+x.r+' - '+x.n+'</span><div class="btns"><button class="green" onclick="mark('+i+',1)">✅</button><button class="red" onclick="mark('+i+',0)">❌</button><button onclick="delStd('+i+')" style="background:#64748b">🗑</button></div>').join('')||'<p style="color:#fff">কোনো শিক্ষার্থী নেই</p>';
  window._att=s.map(()=>1);updCounts();
}
function mark(i,v){window._att[i]=v;const r=document.getElementById('row'+i);r.classList.remove('present','absent');r.classList.add(v?'present':'absent');updCounts()}
function updCounts(){const a=window._att||[],p=a.filter(x=>x).length;document.getElementById('c_all').textContent=a.length;document.getElementById('c_p').textContent=p;document.getElementById('c_a').textContent=a.length-p}
function delStd(i){if(!confirm('মুছে ফেলবেন?'))return;const s=get('std_'+key());s.splice(i,1);set('std_'+key(),s);loadStdPage()}
function saveAtt(){const d=document.getElementById('attDate').value||today();const s=get('std_'+key());set('att_'+key()+'_'+d,s.map((x,i)=>({r:x.r,n:x.n,p:window._att[i]})));alert('✅ হাজিরা সংরক্ষণ হয়েছে!')}
function saveNotice(){const t=document.getElementById('noticeTxt').value.trim();if(!t)return;const k='notice_'+S().getItem('inst');const n=get(k);n.unshift(t);set(k,n);document.getElementById('noticeTxt').value='';loadNotices()}
function loadNotices(){const n=get('notice_'+S().getItem('inst'));document.getElementById('noticeList').innerHTML=n.map(x=>'<div class="lrow"><span>📢 '+x+'</span></div>').join('')}
function todayAtt(){return get('att_'+key()+'_'+today())}
function msgText(t){
  const inst=curInst(),cls=S().getItem('cls'),d=today(),rec=todayAtt(),p=rec.filter(x=>x.p).length;
  const head=(inst?inst.bn:'')+'\nশ্রেণী: '+cls+'\nতারিখ: '+d+'\n';
  if(t==='p')return head+'✅ উপস্থিত: '+p+' জন';
  if(t==='a')return head+'❌ অনুপস্থিত: '+(rec.length-p)+' জন';
  return head+'📢 নোটিশ: '+(get('notice_'+S().getItem('inst'))[0]||'কোনো নোটিশ নেই');
}
function sendSMS(t){location.href='sms:?body='+encodeURIComponent(msgText(t))}
function sendWA(t){window.open('https://wa.me/?text='+encodeURIComponent(msgText(t)),'_blank')}
function sendWAReport(){
  const inst=curInst(),cls=S().getItem('cls'),d=today(),rec=todayAtt(),p=rec.filter(x=>x.p).length;
  let t='📊 হাজিরা রিপোর্ট\n'+(inst?inst.bn:'')+'\nশ্রেণী: '+cls+'\nতারিখ: '+d+'\n\nউপস্থিত: '+p+'\nঅনুপস্থিত: '+(rec.length-p)+'\nমোট: '+rec.length+'\n\n'+rec.map(x=>(x.p?'✅':'❌')+' রোল '+x.r+' - '+x.n).join('\n');
  window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank');
}
function showMonthly(){
  const m=document.getElementById('mMonth').value||today().slice(0,7);
  document.getElementById('mMonth').value=m;
  const px='att_'+key()+'_'+m, days={};
  for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf(px)===0)days[k.slice(px.length+1)]=get(k)}
  const dl=Object.keys(days).sort(), studs=get('std_'+key());
  const rows=studs.map(s=>{let p=0;dl.forEach(d=>{const r=days[d].find(x=>String(x.r)===String(s.r));if(r&&r.p)p++});const pc=dl.length?Math.round(p/dl.length*100):0;return '<tr><td>'+s.r+'</td><td>'+s.n+'</td><td>'+p+'</td><td>'+dl.length+'</td><td>'+pc+'%</td></tr>'}).join('');
  document.getElementById('mOut').innerHTML='<table><tr><th>রোল</th><th>নাম</th><th>উপস্থিত</th><th>মোট দিন</th><th>%</th></tr>'+(rows||'<tr><td colspan="5">ডেটা নেই</td></tr>')+'</table>';
}
fillLoginInsts();renderPads();
document.getElementById('l_inst').addEventListener('change',renderPads);
if(S().getItem('login')==='1')enterDash();
</script>
</body>
</html>
