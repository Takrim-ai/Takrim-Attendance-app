<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Al-Hera Final Hide Show Small Gol</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#f0f4f8;padding:8px}
.pad{background:#fff;border:2px solid #0d47a1;border-radius:12px;padding:12px;text-align:center;margin-bottom:8px}
.acc{margin-bottom:8px;border-radius:25px;overflow:hidden;background:#fff;box-shadow:0 2px 6px #0001}
.acc-h{background:#0d47a1;padding:6px;display:flex;align-items:center;cursor:default;font-weight:bold;border-radius:22px 22px 0 0}
.acc-b{display:none;padding:8px;background:#fafafa}.acc-b.show{display:block}
.btn{padding:8px 10px;border:none;border-radius:25px;color:#fff;cursor:pointer;margin:3px;font-weight:bold;font-size:11px}
.header3{display:flex;gap:5px;flex-wrap:nowrap;width:100%}
.hbox{flex:1 1 0;min-width:0;padding:6px 2px;border-radius:25px;text-align:center;font-weight:bold;font-size:9px;cursor:pointer;border:2px solid transparent;box-shadow:0 1px 3px #0002;line-height:1.15;min-height:38px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.hbox.active{border-color:yellow;transform:scale(1.05);box-shadow:0 4px 10px #0003}
.boxPresent{background:#2e7d32;color:#fff}.boxAbsent{background:#c62828;color:#fff}.boxNotice{background:#ef6c00;color:#fff}
.cbox{border-radius:20px;overflow:hidden;background:#fff;border:2px solid #ddd;margin-bottom:8px;animation:slide 0.3s ease}
@keyframes slide{from{transform:translateY(-12px);opacity:0}to{transform:translateY(0);opacity:1}}
.cbox-head{color:#fff;padding:8px;text-align:center;font-weight:bold;font-size:13px;border-radius:20px 20px 0 0}.cbox-body{padding:10px;min-height:40px;font-size:13px;background:#fff;border-radius:0 0 20px 20px}
.acc-h-normal{background:#1976d2;color:#fff;padding:10px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-weight:bold;font-size:12px;border-radius:25px}
.acc-b-normal{display:none;padding:8px;background:#fafafa}.acc-b-normal.on{display:block}
</style></head><body>
<div class="pad"><h1 style="color:#0d47a1;font-size:18px">আল-হেরা আইডিয়াল মাদ্রাসা</h1></div>
<div id="acc"></div>
<script>
let students=JSON.parse(localStorage.getItem('students_v2')||'[{"name":"কালাম","roll":"202","mobile":"01700000001","present":true},{"name":"কমল","roll":"203","mobile":"01700000002","present":false},{"name":"সাকিব","roll":"204","mobile":"01700000003","present":true}]');
let activeTab='';
function buildAcc(){
 let html=`
 <div class="acc"><div class="acc-h-normal" onclick="togN(1)"><span>1️⃣ শিক্ষার্থী যোগ করুন</span><span id="ar1">▼</span></div><div class="acc-b-normal" id="ab1"><div style="background:#fff;padding:8px;border-radius:20px"><input id="sn" placeholder="নাম" style="padding:8px;border:1px solid #ccc;border-radius:20px;width:100%;margin:4px 0"><input id="sr" placeholder="রোল" style="padding:8px;border:1px solid #ccc;border-radius:20px;width:100%;margin:4px 0"><input id="sm" placeholder="মোবাইল" style="padding:8px;border:1px solid #ccc;border-radius:20px;width:100%;margin:4px 0"><button class="btn" style="background:#2e7d32;width:100%;padding:10px;border-radius:25px" onclick="addStu()">+ যোগ</button></div></div></div>
 <div class="acc"><div class="acc-h-normal" onclick="togN(2)"><span>2️⃣ শিক্ষার্থীর তালিকা</span><span id="ar2">▼</span></div><div class="acc-b-normal" id="ab2"><div id="sList"></div></div></div>
 <div class="acc" style="border:3px solid #0d47a1;border-radius:25px"><div class="acc-h" style="background:#0d47a1;border-radius:22px 22px 0 0"><div class="header3">
   <div id="hb_present" class="hbox boxPresent" onclick="setTab('present')">✅ উপস্থিত<br><span id="hc_present">0</span> জন</div>
   <div id="hb_absent" class="hbox boxAbsent" onclick="setTab('absent')">❌ অনুপস্থিত<br><span id="hc_absent">0</span> জন</div>
   <div id="hb_notice" class="hbox boxNotice" onclick="setTab('notice')">📢 নোটিশ</div>
 </div></div><div class="acc-b" id="ab3"><div id="tabContent"></div></div></div>
 <div class="acc"><div class="acc-h-normal" onclick="togN(4)"><span>4️⃣ মাসিক হাজিরা (১-৩১)</span><span id="ar4">▼</span></div><div class="acc-b-normal" id="ab4"><div style="background:#fff;padding:6px;border-radius:20px"><div style="display:flex;justify-content:space-between;flex-wrap:wrap"><div><input type="month" id="mp" value="${new Date().toISOString().slice(0,7)}" onchange="renderMonth()" style="width:130px;padding:6px;border-radius:20px;border:1px solid #ccc"><button class="btn" style="background:#ff9800" onclick="goToday()">📅 আজ</button></div><div><button class="btn" style="background:#1565c0" onclick="window.print()">🖨️</button><button class="btn" style="background:#c62828" onclick="delMonth()">🗑️</button></div></div><div id="monthTbl" style="margin-top:8px;overflow:auto"></div></div></div></div>
 <div class="acc"><div class="acc-h-normal" onclick="togN(5)"><span>5️⃣ ফলাফল - গোল ডিজাইন</span><span id="ar5">▼</span></div><div class="acc-b-normal" id="ab5"><div id="pdfArea">ফলাফল এখানে</div><button class="btn" style="background:#16a34a;flex:1" onclick="expExcel()">⬇️ Excel</button><button class="btn" style="background:#dc2626;flex:1" onclick="downPDF()">⬇️ PDF বাংলা</button></div></div></div>
 `;
 document.getElementById('acc').innerHTML=html;
}
buildAcc();
function togN(i){let b=document.getElementById('ab'+i);let ar=document.getElementById('ar'+i);if(!b)return;let o=b.classList.contains('on');if(o){b.classList.remove('on');if(ar)ar.innerText='▼';}else{b.classList.add('on');if(ar)ar.innerText='▲';if(i==2)showStu();if(i==4)renderMonth();}}
function setTab(t){
 if(activeTab===t){activeTab='';document.querySelectorAll('.hbox').forEach(x=>x.classList.remove('active'));document.getElementById('ab3').classList.remove('show');document.getElementById('tabContent').innerHTML='';return;}
 activeTab=t;document.querySelectorAll('.hbox').forEach(x=>x.classList.remove('active'));document.getElementById('hb_'+t).classList.add('active');document.getElementById('ab3').classList.add('show');renderTab();
}
function renderHeaderCounts(){let p=students.filter(s=>s.present).length;let a=students.filter(s=>!s.present).length;document.getElementById('hc_present').innerText=p;document.getElementById('hc_absent').innerText=a;}
function renderTab(){
 let notice=localStorage.getItem('notice')||'';let pList=students.filter(s=>s.present);let aList=students.filter(s=>!s.present);let el=document.getElementById('tabContent');
 if(activeTab==='present'){el.innerHTML=`<div class="cbox" style="border-color:#2e7d32"><div class="cbox-head" style="background:#2e7d32">✅ মোট উপস্থিত - ${pList.length} জন</div><div class="cbox-body">${pList.map(s=>`✅ ${s.name} (${s.roll}) - ${s.mobile}`).join('<br>')||'কেউ নেই'}</div></div><div style="display:flex;gap:6px"><button class="btn" style="background:#0284c7;flex:1;padding:12px;border-radius:25px" onclick="sendSMSPresent()">📱 SMS উপস্থিত</button><button class="btn" style="background:#16a34a;flex:1;padding:12px;border-radius:25px" onclick="sendWAPresent()">💬 WhatsApp উপস্থিত</button></div>`;}
 else if(activeTab==='absent'){el.innerHTML=`<div class="cbox" style="border-color:#c62828"><div class="cbox-head" style="background:#c62828">❌ মোট অনুপস্থিত - ${aList.length} জন</div><div class="cbox-body">${aList.map(s=>`❌ ${s.name} (${s.roll}) - ${s.mobile}`).join('<br>')||'সবাই উপস্থিত'}</div></div><div style="display:flex;gap:6px"><button class="btn" style="background:#0284c7;flex:1;padding:12px;border-radius:25px" onclick="sendSMSAbsent()">📱 SMS অনুপস্থিত</button><button class="btn" style="background:#16a34a;flex:1;padding:12px;border-radius:25px" onclick="sendWAAbsent()">💬 WhatsApp অনুপস্থিত</button></div>`;}
 else{el.innerHTML=`<div class="cbox" style="border-color:#ef6c00"><div class="cbox-head" style="background:#ef6c00">📢 নোটিশ</div><div class="cbox-body"><textarea id="notice" rows="4" style="width:100%;border-radius:20px;padding:8px;border:1px solid #ccc">${notice}</textarea><button class="btn" style="background:#ef6c00;width:100%;margin-top:6px;padding:10px;border-radius:20px" onclick="saveNotice()">💾 সেভ</button></div></div><div style="display:flex;gap:6px"><button class="btn" style="background:#0284c7;flex:1;padding:12px;border-radius:25px" onclick="sendSMSNotice()">📱 SMS নোটিশ</button><button class="btn" style="background:#16a34a;flex:1;padding:12px;border-radius:25px" onclick="sendWANotice()">💬 WhatsApp নোটিশ</button></div>`;}
}
function addStu(){let n=document.getElementById('sn').value.trim(),r=document.getElementById('sr').value.trim(),m=document.getElementById('sm').value.trim();if(!n||!r||!m)return alert('দিন');students.push({name:n,roll:r,mobile:m,present:true});localStorage.setItem('students_v2',JSON.stringify(students));location.reload();}
function showStu(){let h='';students.forEach((s,i)=>{h+=`<div style="display:flex;justify-content:space-between;background:#fff;padding:8px;border-radius:20px;margin:4px 0;border:1px solid #ddd;font-size:12px"><span>${i+1}. ${s.name} (${s.roll})</span><span><button onclick="tp(${i})">${s.present?'✅':'❌'}</button> <button onclick="ds(${i})">🗑️</button></span></div>`});document.getElementById('sList').innerHTML=h;}
function tp(i){students[i].present=!students[i].present;localStorage.setItem('students_v2',JSON.stringify(students));showStu();renderHeaderCounts();renderTab();}
function ds(i){if(confirm('ডিলিট?')){students.splice(i,1);localStorage.setItem('students_v2',JSON.stringify(students));location.reload();}}
function saveNotice(){localStorage.setItem('notice',document.getElementById('notice').value);alert('সেভ');}
function getPresentMsg(){let list=students.filter(s=>s.present);return `✅ মোট উপস্থিত: ${list.length} জন\n${list.map(s=>`✅ ${s.name} (${s.roll})`).join('\n')}`;}
function getAbsentMsg(){let list=students.filter(s=>!s.present);return `❌ মোট অনুপস্থিত: ${list.length} জন\n${list.map(s=>`❌ ${s.name} (${s.roll})`).join('\n')}`;}
function getNoticeMsg(){let n=document.getElementById('notice')?.value||'';return `📢 নোটিশ:\n${n}`;}
function sendSMSPresent(){window.open(`sms:?body=${encodeURIComponent(getPresentMsg())}`,'_blank');}
function sendWAPresent(){window.open(`https://wa.me/?text=${encodeURIComponent(getPresentMsg())}`,'_blank');}
function sendSMSAbsent(){window.open(`sms:?body=${encodeURIComponent(getAbsentMsg())}`,'_blank');}
function sendWAAbsent(){window.open(`https://wa.me/?text=${encodeURIComponent(getAbsentMsg())}`,'_blank');}
function sendSMSNotice(){window.open(`sms:?body=${encodeURIComponent(getNoticeMsg())}`,'_blank');}
function sendWANotice(){window.open(`https://wa.me/?text=${encodeURIComponent(getNoticeMsg())}`,'_blank');}
function renderMonth(){let month=document.getElementById('mp')?.value||new Date().toISOString().slice(0,7);let data=JSON.parse(localStorage.getItem('monthly31Data')||'{}');let html=`<table border=1 style="width:100%;border-collapse:collapse;text-align:center;font-size:10px;min-width:900px"><tr style="background:#1976d2;color:#fff"><th>ক্রম</th><th>নাম</th><th>রোল</th>`;for(let i=1;i<=31;i++){html+=`<th>${i}</th>`;}html+=`<th>মোট উপ</th><th>মোট অনু</th></tr>`;students.forEach((s,idx)=>{html+=`<tr><td>${idx+1}</td><td>${s.name}</td><td>${s.roll}</td>`;for(let d=1;d<=31;d++){let k=`${month}_${idx}_${d}`;let ch=data[k]===true?'checked':'';html+=`<td><input type="checkbox" id="d_${idx}_${d}" ${ch} onchange="save31(${idx},${d})"></td>`;}html+=`<td id="p_${idx}">0</td><td id="a_${idx}">0</td></tr>`;});html+=`</table>`;document.getElementById('monthTbl').innerHTML=html;}
function save31(idx,d){let month=document.getElementById('mp').value;let data=JSON.parse(localStorage.getItem('monthly31Data')||'{}');data[`${month}_${idx}_${d}`]=document.getElementById(`d_${idx}_${d}`).checked;localStorage.setItem('monthly31Data',JSON.stringify(data));}
function goToday(){document.getElementById('mp').value=new Date().toISOString().slice(0,7);renderMonth();}
function delMonth(){if(confirm('মুছবেন?')){let month=document.getElementById('mp').value;let data=JSON.parse(localStorage.getItem('monthly31Data')||'{}');students.forEach((_,idx)=>{for(let d=1;d<=31;d++)delete data[`${month}_${idx}_${d}`]});localStorage.setItem('monthly31Data',JSON.stringify(data));renderMonth();}}
function expExcel(){alert('Excel');}
function downPDF(){alert('PDF');}
showStu();renderHeaderCounts();
</script></body></html>
