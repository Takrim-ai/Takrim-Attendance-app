<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Al-Hera Final</title><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#f0f4f8;padding:8px}.pad{background:#fff;border:2px solid #0d47a1;border-radius:12px;padding:12px;text-align:center;margin-bottom:8px}.acc{margin-bottom:8px;border-radius:10px;overflow:hidden;background:#fff;box-shadow:0 2px 5px #0001}.acc-h{background:#1976d2;color:#fff;padding:12px;display:flex;justify-content:space-between;cursor:pointer;font-weight:bold;font-size:14px}.acc-b{display:none;padding:10px;background:#fafafa}.acc-b.on{display:block}input,textarea{padding:7px;border:1px solid #ccc;border-radius:6px;width:100%;margin:4px 0}.btn{padding:9px 12px;border:none;border-radius:8px;color:#fff;cursor:pointer;margin:3px;font-weight:bold;font-size:12px}.box3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}@media(max-width:700px){.box3{grid-template-columns:1fr}}.h-box{background:#fff;border:2px solid #ddd;border-radius:10px;padding:6px;min-height:120px;cursor:pointer;transition:.2s}.h-box.sel{transform:scale(1.03);box-shadow:0 0 0 3px #0002}.mark{width:44px;text-align:center;border:1.5px dashed #4caf50;padding:3px;border-radius:5px;font-weight:bold;font-size:11px}.sub{width:68px;padding:3px;border-radius:4px;border:1px solid #ccc;font-size:10px}.subf{width:44px;padding:3px;border-radius:4px;border:1px solid #ccc;font-size:10px}</style></head><body>
<div class="pad"><h1 style="color:#0d47a1;font-size:20px">আল-হেরা আইডিয়াল মাদ্রাসা</h1></div>
<div id="acc"></div>
<script>
let students=JSON.parse(localStorage.getItem('students_v2')||'[{"name":"কালাম","roll":"202","mobile":"01700000001","present":true},{"name":"কমল","roll":"203","mobile":"01700000002","present":false},{"name":"সাকিব","roll":"204","mobile":"01700000003","present":true}]');
let saved=JSON.parse(localStorage.getItem('fullResultSheet')||'null');let locked=localStorage.getItem('fullResultSheetLocked')=='true';let selBox='present';
const steps=[
{title:'1️⃣ শিক্ষার্থী যোগ করুন (নাম+রোল+মোবাইল)',html:`<div style="background:#fff;padding:8px;border-radius:8px"><input id="sn" placeholder="নাম"><input id="sr" placeholder="রোল"><input id="sm" placeholder="মোবাইল 017xxxxxxxx"><button class="btn" style="background:#2e7d32;width:100%" onclick="addStu()">+ যোগ (অটো সবখানে যাবে)</button></div>`},
{title:'2️⃣ শিক্ষার্থীর তালিকা',html:`<div id="sList"></div>`},
{title:'3️⃣ 📊 মোট উপস্থিত | মোট অনুপস্থিত | নোটিশ - ৩ কালার',html:`
<div style="background:#fff;padding:8px;border-radius:10px">
<div class="box3">
<div id="boxPresent" class="h-box sel" style="border-color:#2e7d32" onclick="pickBox('present')"><h4 style="background:#2e7d32;color:#fff;padding:5px;border-radius:6px;text-align:center">✅ মোট উপস্থিত</h4><div id="presentBox" style="font-size:12px;margin-top:4px"></div></div>
<div id="boxAbsent" class="h-box" style="border-color:#c62828" onclick="pickBox('absent')"><h4 style="background:#c62828;color:#fff;padding:5px;border-radius:6px;text-align:center">❌ মোট অনুপস্থিত</h4><div id="absentBox" style="font-size:12px;margin-top:4px"></div></div>
<div id="boxNotice" class="h-box" style="border-color:#ef6c00" onclick="pickBox('notice')"><h4 style="background:#ef6c00;color:#fff;padding:5px;border-radius:6px;text-align:center">📢 নোটিশ</h4><textarea id="notice" rows="5" placeholder="নোটিশ লিখুন..."></textarea><button class="btn" style="background:#ef6c00;width:100%" onclick="saveNotice()">💾 সেভ</button></div>
</div>
<div style="display:flex;gap:8px;margin-top:10px"><button class="btn" style="background:#0284c7;flex:1;padding:13px" onclick="sendSMS()">📱 SMS পাঠান</button><button class="btn" style="background:#16a34a;flex:1;padding:13px" onclick="sendWA()">💬 WhatsApp পাঠান</button></div>
<p style="font-size:10px;color:#666;margin-top:4px">👆 ৩ কালারের যে ঘরে চাপ দেবে, নিচে SMS/WA চাপলে ওই ঘরেরটাই যাবে</p>
</div>`},
{title:'4️⃣ মাসিক হাজিরা (১-৩১) ক্রম+নাম+রোল+মোট উপস্থিত+মোট অনুপস্থিত',html:`<div style="background:#fff;padding:6px;border-radius:8px"><div style="display:flex;justify-content:space-between"><input type="month" id="mp" value="${new Date().toISOString().slice(0,7)}" onchange="renderMonth()" style="width:150px"><div><button class="btn" style="background:#1565c0" onclick="window.print()">🖨️</button><button class="btn" style="background:#c62828" onclick="delMonth()">🗑️</button></div></div><div id="monthTbl" style="margin-top:8px;overflow:auto"></div></div>`},
{title:'5️⃣ ফলাফল 20 বিষয় অটো লক PDF',html:`
<div style="background:#fff;padding:8px;border-radius:10px;border:2px solid #7c4dff">
<div style="display:flex;gap:5px;align-items:center;flex-wrap:wrap"><b>বিষয়:</b><button onclick="chSub(-1)" style="width:28px;height:28px;border-radius:50%;border:none;background:#2e7d32;color:#fff">-</button><input id="sc" type="number" value="20" style="width:50px;text-align:center"><button onclick="chSub(1)" style="width:28px;height:28px;border-radius:50%;border:none;background:#2e7d32;color:#fff">+</button><button onclick="makeSheet()" style="background:#7c4dff;color:#fff;border:none;padding:5px 10px;border-radius:6px">সেট</button><span id="lockB" style="font-size:10px;padding:4px 8px;border-radius:12px"></span></div>
<div id="subEdit" style="display:flex;gap:4px;flex-wrap:wrap;margin:8px 0"></div>
<div style="overflow:auto;border:1px solid #ddd;border-radius:6px;max-height:55vh"><table id="rt" border="1" style="width:100%;border-collapse:collapse;font-size:10px;text-align:center"><thead id="rh" style="background:#1b5e20;color:#fff"></thead><tbody id="rb"></tbody></table></div>
<div style="margin-top:8px;display:flex;gap:4px;flex-wrap:wrap"><button style="background:#2e7d32;color:#fff;padding:8px 12px;border-radius:6px;border:none" onclick="saveRes()">💾 সেভ লক</button><button style="background:#ff9800;color:#fff;padding:8px 12px;border-radius:6px;border:none" onclick="unlockRes()">✏️ এডিট</button><button style="background:#1565c0;color:#fff;padding:8px 10px;border-radius:6px;border:none" onclick="calcRes()">🔄 হিসাব</button><button style="background:#c62828;color:#fff;padding:8px 10px;border-radius:6px;border:none" onclick="delRes()">🗑️</button></div>
<div style="margin-top:8px;display:flex;gap:6px"><button style="background:#16a34a;color:#fff;padding:10px;border:none;border-radius:8px;flex:1" onclick="expExcel()">⬇️ Excel</button><button style="background:#dc2626;color:#fff;padding:10px;border:none;border-radius:8px;flex:1" onclick="downPDF()">⬇️ PDF</button></div><p id="st" style="font-size:11px;color:green;font-weight:bold;margin-top:4px"></p>
</div>`}
];
document.getElementById('acc').innerHTML=steps.map((s,i)=>`<div class="acc"><div class="acc-h" onclick="tog(${i})"><span>${s.title}</span><span id="ar${i}">▼</span></div><div class="acc-b" id="ab${i}">${s.html}</div></div>`).join('');
function tog(i){let b=document.getElementById('ab'+i),o=b.classList.contains('on');document.querySelectorAll('.acc-b').forEach(x=>x.classList.remove('on'));document.querySelectorAll('[id^=ar]').forEach(x=>x.innerText='▼');if(!o){b.classList.add('on');document.getElementById('ar'+i).innerText='▲';if(i==1)showStu();if(i==2)renderHajira();if(i==3)renderMonth();if(i==4)makeSheet();}}
function addStu(){let n=document.getElementById('sn').value.trim(),r=document.getElementById('sr').value.trim(),m=document.getElementById('sm').value.trim();if(!n||!r||!m)return alert('নাম রোল মোবাইল দিন');students.push({name:n,roll:r,mobile:m,present:true});localStorage.setItem('students_v2',JSON.stringify(students));alert('যোগ হয়েছে');location.reload();}
function showStu(){let h='';students.forEach((s,i)=>{h+=`<div style="display:flex;justify-content:space-between;background:#fff;padding:6px;border-radius:6px;margin:4px 0;border:1px solid #ddd;font-size:12px"><span>${i+1}. ${s.name} (${s.roll}) ${s.mobile}</span><span><button onclick="tp(${i})">${s.present?'✅':'❌'}</button> <button onclick="ds(${i})">🗑️</button></span></div>`});document.getElementById('sList').innerHTML=h;}
function tp(i){students[i].present=!students[i].present;localStorage.setItem('students_v2',JSON.stringify(students));showStu();renderHajira();}
function ds(i){if(confirm('ডিলিট?')){students.splice(i,1);localStorage.setItem('students_v2',JSON.stringify(students));location.reload();}}
function pickBox(t){selBox=t;document.querySelectorAll('.h-box').forEach(x=>x.classList.remove('sel'));document.getElementById('box'+t.charAt(0).toUpperCase()+t.slice(1)).classList.add('sel');}
function renderHajira(){let notice=localStorage.getItem('notice')||'';if(document.getElementById('notice'))document.getElementById('notice').value=notice;let p=students.filter(s=>s.present).map(s=>`✅ ${s.name}`).join('<br>')||'কেউ নেই';let a=students.filter(s=>!s.present).map(s=>`❌ ${s.name}`).join('<br>')||'সবাই উপস্থিত';document.getElementById('presentBox').innerHTML=p;document.getElementById('absentBox').innerHTML=a;}
function saveNotice(){localStorage.setItem('notice',document.getElementById('notice').value);alert('নোটিশ সেভ');}
function getMsg(){let n=document.getElementById('notice')?.value||localStorage.getItem('notice')||'';if(selBox=='present'){let l=students.filter(s=>s.present).map(s=>s.name).join(', ');return `মোট উপস্থিত: ${l}\n\n${n}`;}if(selBox=='absent'){let l=students.filter(s=>!s.present).map(s=>s.name).join(', ');return `মোট অনুপস্থিত: ${l}\n\n${n}`;}return `📢 নোটিশ: ${n}\n\nমোট উপস্থিত: ${students.filter(s=>s.present).length} জন\nমোট অনুপস্থিত: ${students.filter(s=>!s.present).length} জন`;}
function sendSMS(){let msg=getMsg();window.open(`sms:?body=${encodeURIComponent(msg)}`,'_blank');}
function sendWA(){let msg=getMsg();window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`,'_blank');}
function renderMonth(){let month=document.getElementById('mp')?.value||new Date().toISOString().slice(0,7);let data=JSON.parse(localStorage.getItem('monthly31Data')||'{}');let html=`<table border=1 style="width:100%;border-collapse:collapse;text-align:center;font-size:10px;min-width:900px"><tr style="background:#1976d2;color:#fff"><th>ক্রম</th><th>নাম</th><th>রোল</th>`;for(let i=1;i<=31;i++)html+=`<th>${i}</th>`;html+=`<th>মোট উপস্থিত</th><th>মোট অনুপস্থিত</th></tr>`;students.forEach((s,idx)=>{html+=`<tr><td>${idx+1}</td><td style="text-align:left">${s.name}</td><td>${s.roll}</td>`;for(let d=1;d<=31;d++){let k=`${month}_${idx}_${d}`;let ch=data[k]!==false?'checked':'';html+=`<td><input type="checkbox" id="d_${idx}_${d}" ${ch} onchange="save31(${idx},${d})" style="width:14px;height:14px"></td>`;}html+=`<td id="p_${idx}" style="background:#e8f5e9">0</td><td id="a_${idx}" style="background:#ffebee">0</td></tr>`;});html+=`</table>`;document.getElementById('monthTbl').innerHTML=html;students.forEach((_,i)=>calc31(i));}
function save31(idx,d){let month=document.getElementById('mp').value;let data=JSON.parse(localStorage.getItem('monthly31Data')||'{}');data[`${month}_${idx}_${d}`]=document.getElementById(`d_${idx}_${d}`).checked;localStorage.setItem('monthly31Data',JSON.stringify(data));calc31(idx);}
function calc31(idx){let c=0;for(let d=1;d<=31;d++)if(document.getElementById(`d_${idx}_${d}`)?.checked)c++;document.getElementById(`p_${idx}`).innerText=c;document.getElementById(`a_${idx}`).innerText=31-c;}
function delMonth(){if(confirm('মাসের হাজিরা মুছবেন?')){let month=document.getElementById('mp').value;let data=JSON.parse(localStorage.getItem('monthly31Data')||'{}');students.forEach((_,idx)=>{for(let d=1;d<=31;d++)delete data[`${month}_${idx}_${d}`]});localStorage.setItem('monthly31Data',JSON.stringify(data));renderMonth();}}
function chSub(n){let c=parseInt(document.getElementById('sc').value)||20;c+=n;if(c<1)c=1;if(c>20)c=20;document.getElementById('sc').value=c;}
function makeSheet(){let cnt=parseInt(document.getElementById('sc').value)||saved?.count||20;document.getElementById('sc').value=cnt;let subs=saved?.subjects||[];let eh='';for(let i=0;i<cnt;i++){let s=subs[i]||{name:`বিষয় ${i+1}`,full:100};eh+=`<div style="background:#f3e5f5;padding:4px;border-radius:6px;display:flex;gap:2px"><input id="sn${i}" value="${s.name}" class="sub" ${locked?'disabled':''}><input id="sf${i}" type="number" value="${s.full}" class="subf" ${locked?'disabled':''}></div>`;}document.getElementById('subEdit').innerHTML=eh;let head='<tr><th>রোল</th><th>নাম</th>';for(let i=0;i<cnt;i++)head+=`<th>বি${i+1}</th>`;head+='<th>মোট</th><th>প্রাপ্ত</th><th>%</th><th>GPA</th></tr>';document.getElementById('rh').innerHTML=head;let body='';students.forEach((stu,idx)=>{body+=`<tr><td>${stu.roll}</td><td style="text-align:left">${stu.name}</td>`;for(let j=0;j<cnt;j++){let old=saved?.marks?.[idx]?.[j]||'';body+=`<td><input id="m_${idx}_${j}" type="number" value="${old}" class="mark" oninput="calcRes()" ${locked?'disabled':''}></td>`;}body+=`<td id="f_${idx}" style="background:#fef9c3">-</td><td id="o_${idx}" style="background:#ecfdf5">-</td><td id="pe_${idx}" style="background:#dbeafe">-</td><td id="g_${idx}" style="background:#dcfce7">-</td></tr>`;});document.getElementById('rb').innerHTML=body;updLock();calcRes();}
function updLock(){let b=document.getElementById('lockB');if(!b)return;if(locked){b.innerText='🔒 লক';b.style.background='#fecaca';}else{b.innerText='🔓 আনলক';b.style.background='#bbf7d0';}}
function calcRes(){let cnt=parseInt(document.getElementById('sc').value)||20;students.forEach((_,idx)=>{let f=0,o=0;for(let j=0;j<cnt;j++){f+=parseInt(document.getElementById(`sf${j}`)?.value)||0;o+=parseInt(document.getElementById(`m_${idx}_${j}`)?.value)||0;}let per=f?(o/f*100).toFixed(1):0;let gpa=Math.min(5,per/20).toFixed(2);document.getElementById(`f_${idx}`).innerText=f;document.getElementById(`o_${idx}`).innerText=o;document.getElementById(`pe_${idx}`).innerText=per+'%';document.getElementById(`g_${idx}`).innerText=gpa;});}
function saveRes(){let cnt=parseInt(document.getElementById('sc').value)||20;let subs=[];for(let i=0;i<cnt;i++)subs.push({name:document.getElementById(`sn${i}`).value,full:document.getElementById(`sf${i}`).value});let marks=[];students.forEach((_,idx)=>{let r=[];for(let j=0;j<cnt;j++)r.push(document.getElementById(`m_${idx}_${j}`).value);marks.push(r);});saved={subjects:subs,marks:marks,count:cnt};localStorage.setItem('fullResultSheet',JSON.stringify(saved));localStorage.setItem('fullResultSheetLocked','true');locked=true;document.getElementById('st').innerText='✅ সেভ ও লক হয়েছে';makeSheet();}
function unlockRes(){if(confirm('এডিট করবেন?')){locked=false;localStorage.setItem('fullResultSheetLocked','false');makeSheet();}}
function delRes(){if(confirm('ফলাফল মুছবেন?')){localStorage.removeItem('fullResultSheet');localStorage.removeItem('fullResultSheetLocked');saved=null;locked=false;makeSheet();}}
function expExcel(){let cnt=parseInt(document.getElementById('sc').value)||20;let header=["রোল","নাম"];for(let i=0;i<cnt;i++)header.push(document.getElementById(`sn${i}`)?.value||`বি${i+1}`);header.push("মোট","প্রাপ্ত","%","GPA");let data=students.map((s,idx)=>{let row={"রোল":s.roll,"নাম":s.name};let f=0,o=0;for(let j=0;j<cnt;j++){let nm=document.getElementById(`sn${j}`)?.value||`বি${j+1}`;let v=document.getElementById(`m_${idx}_${j}`)?.value||'';row[nm]=v;f+=parseInt(document.getElementById(`sf${j}`)?.value)||0;o+=parseInt(v)||0;}let per=f?(o/f*100).toFixed(1):0;let gpa=Math.min(5,per/20).toFixed(2);row["মোট"]=f;row["প্রাপ্ত"]=o;row["%"]=per;row["GPA"]=gpa;return row;});let ws=XLSX.utils.json_to_sheet(data,{header:header});let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Result");XLSX.writeFile(wb,`Result_${new Date().toISOString().slice(0,10)}.xlsx`);}
function downPDF(){let {jsPDF}=window.jspdf;let doc=new jsPDF('l','mm','a4');let cnt=parseInt(document.getElementById('sc').value)||20;doc.text('Al-Hera - Result 20 Subjects',14,10);let head=["রোল","নাম"];for(let i=0;i<cnt;i++)head.push(document.getElementById(`sn${i}`)?.value||`B${i+1}`);head.push("মোট","প্রাপ্ত","%","GPA");let body=[];students.forEach((s,idx)=>{let r=[s.roll,s.name];let f=0,o=0;for(let j=0;j<cnt;j++){let v=document.getElementById(`m_${idx}_${j}`)?.value||'';r.push(v);f+=parseInt(document.getElementById(`sf${j}`)?.value)||0;o+=parseInt(v)||0;}let per=f?(o/f*100).toFixed(1):0;let gpa=Math.min(5,per/20).toFixed(2);r.push(f,o,per+'%',gpa);body.push(r);});doc.autoTable({head:[head],body:body,startY:14,styles:{fontSize:6}});doc.save(`Result_${new Date().toISOString().slice(0,10)}.pdf`);}
showStu();
</script></body></html>
