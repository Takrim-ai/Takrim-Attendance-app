<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MALEK - 1 2 3 Page Hubuhu</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;font-family:'Hind Siliguri',sans-serif}
body{margin:0;background:#082a1e;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:10px}
.main-banner{width:380px;max-width:95%;border:4px solid #ffcc00;border-radius:22px;overflow:hidden;margin-top:10px;background:#000}
.main-banner img{width:100%;display:block;height:220px;object-fit:cover}
.page{display:none;width:100%;max-width:430px;flex-direction:column;align-items:center}.page.active{display:flex}
.card{background:#fff;margin-top:12px;border-radius:24px;padding:16px;width:100%;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.menu{width:100%;max-width:420px;background:#fff;border:none;border-radius:16px;padding:16px;font-size:18px;font-weight:700;color:#0d5bff;margin-top:12px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.hidden{display:none!important}
.btn{width:100%;padding:14px;border:none;border-radius:14px;font-size:18px;font-weight:700;cursor:pointer;margin-top:8px}
.yellow{background:#ffcc00;color:#000}.green{background:#0a7a42;color:#fff}.blue{background:#0d5bff;color:#fff}.red{background:#d61f1f;color:#fff}
input,select{width:100%;padding:12px;border-radius:12px;border:1.8px solid #d1d5db;margin:5px 0}
</style>
</head>
<body>

<!-- ========== 1 NO PAGE - HUBUHU TOMAR CODE ========== -->
<div id="page1" class="page active">
<div class="main-banner"><img src="IMG-20261005-WA0019(3).jpg" onerror="this.src='https://via.placeholder.com/400x220?text=MALEK+PRIMARY'"></div>

<button class="menu" onclick="document.getElementById('formBox').classList.toggle('hidden')">🏫 প্রাইমারি প্রতিষ্ঠান ফরম <span>▼</span></button>
<div id="formBox" class="card hidden"><div style="text-align:center"><img id="logoPreview" src="IMG-20261005-WA0019(3).jpg" style="width:84px;height:84px;border-radius:50%;border:3px solid #ffcc00;object-fit:cover" onerror="this.src='https://via.placeholder.com/80'"><br><button onclick="logoInput.click()" style="background:#ffcc00;border:none;padding:8px 14px;border-radius:10px;font-weight:700;margin:8px 0">🖼️ লোগো চেঞ্জ</button><input type="file" id="logoInput" accept="image/*" style="display:none"></div><input id="bnName" placeholder="প্রতিষ্ঠানের নাম"><input id="address" placeholder="ঠিকানা"><div style="display:flex;gap:6px"><input id="eiin" placeholder="EIIN"><input id="schoolCode" placeholder="Code"></div><div style="display:flex;gap:6px"><input id="mobile" placeholder="মোবাইল"><input id="email" placeholder="Email"></div><input id="pass1" type="password" placeholder="পাসওয়ার্ড"><button class="btn green" onclick="savePrimary()">সেভ করুন ✅</button></div>

<button class="menu" onclick="document.getElementById('loginBox').classList.toggle('hidden')">🔐 প্রতিষ্ঠান লগইন <span>▼</span></button>
<div id="loginBox" class="card hidden"><select id="loginInst"></select><div style="display:flex;gap:6px"><select id="shift"><option>🌅 প্রভাতি</option><option>দিবা</option></select><select id="cls"><option>প্রাক-প্রাথমিক</option><option>১ম শ্রেণি</option><option>২য় শ্রেণি</option><option>৩য় শ্রেণি</option><option>৪র্থ শ্রেণি</option><option>৫ম শ্রেণি</option><option>১০ম শ্রেণি</option></select><select id="section"><option>খ</option><option>ক</option></select></div><input id="loginPass" type="password" placeholder="পাসওয়ার্ড"><button class="btn blue" onclick="primaryLogin()">🔒 প্রবেশ করুন</button><p id="loginMsg" style="color:red;text-align:center"></p></div>

<button class="menu" onclick="document.getElementById('listBox').classList.toggle('hidden')">🔒 প্রতিষ্ঠানের তালিকা <span>▼</span></button>
<div id="listBox" class="card hidden"><button class="btn red" onclick="openListSecure()">🔓 তালিকা খুলুন</button><div id="instList" style="margin-top:10px"></div></div>
</div>

<!-- ========== 2 NO PAGE - HUBUHU TOMAR CODE ========== -->
<div id="page2" class="page">
<div style="width:100%;background:#0f3d2e;padding:12px;border-radius:22px" class="card"><div style="display:flex;gap:10px;align-items:center"><img id="logo2" src="IMG-20261005-WA0019(3).jpg" style="width:68px;height:68px;border-radius:50%;border:3px solid #ffcc00;object-fit:cover" onerror="this.src='https://via.placeholder.com/68'"><div><h2 id="collegeName" style="font-size:15px;color:#0a3d8a">কলেজ</h2><p style="font-size:12px">EIIN: <span id="eiin2">132332</span> Code: <span id="code2">50017</span></p><small onclick="document.getElementById('logoInput2').click()" style="color:#0d5bff;font-weight:700;cursor:pointer">লোগো চেঞ্জ</small><input type="file" id="logoInput2" accept="image/*" style="display:none"></div></div><div style="color:#fff;text-align:center;font-weight:700;margin-top:12px" id="classInfo">শ্রেণী: কম্পিউটার টেকনোলজি | সেশন 2025-26</div></div>
<div class="card"><button class="btn yellow" onclick="go3()">👥 শিক্ষার্থীর তালিকা দেখুন</button><button class="btn" style="background:#fff;border:2.5px dashed #0d5bff;color:#0d5bff" onclick="document.getElementById('monthlyBox').classList.toggle('hidden');renderMonthly()">📋 মাসিক হাজিরা দেখুন</button><div id="monthlyBox" class="hidden" style="margin-top:12px;overflow:auto"><table border="1" style="width:100%;border-collapse:collapse;font-size:11px" id="monthlyTable"></table></div><button class="btn" style="background:#333;color:#fff;margin-top:12px" onclick="showPage(1)">⬅️ প্রথম পাতা</button></div>
</div>

<!-- ========== 3 NO PAGE - HUBUHU TOMAR CODE + 2 TA FIX ========== -->
<div id="page3" class="page">
<div style="color:#ffeb3b;text-align:center;font-weight:700;padding:6px;font-size:18px">শ্রেণী: ১০ম শ্রেণি</div>
<button class="btn" style="background:#fff;width:auto;padding:6px 16px;border-radius:20px" onclick="showPage(2)">⬅️ ড্যাশবোর্ড</button>
<div class="card" style="border-radius:18px;max-width:1200px">
<div style="width:100%;border:2.5px dashed #16a34a;background:#f8fffa;border-radius:12px;padding:14px;text-align:center;font-weight:700;cursor:pointer" onclick="document.getElementById('modal').classList.remove('hidden');document.getElementById('modal').style.display='flex'">+ শিক্ষার্থী যোগ করুন</div>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:10px 0"><div style="background:#ffcc00;border-radius:12px;padding:10px;text-align:center;font-weight:700">📋 সবাই<br><span id="cAll">0</span></div><div style="background:#16a34a;color:#fff;border-radius:12px;padding:10px;text-align:center;font-weight:700">✅ উপস্থিত<br><span id="cPre">0</span></div><div style="background:#ef4444;color:#fff;border-radius:12px;padding:10px;text-align:center;font-weight:700">❌ অনুপস্থিত<br><span id="cAbs">0</span></div><div style="background:#7c3aed;color:#fff;grid-column:1/-1;border-radius:12px;padding:14px;text-align:center;font-weight:700;cursor:pointer" onclick="document.getElementById('rCard').classList.toggle('hidden')">🏆 ফলাফল দেখুন</div></div>
<div id="rCard" class="hidden" style="border:2.5px solid #8b5cf6;border-radius:16px;padding:8px;margin-top:10px"><div style="text-align:center;color:#7c3aed;font-weight:700;margin-bottom:8px">📋 ফলাফল সিট</div><div style="display:flex;gap:8px;align-items:center;margin-bottom:8px"><button style="background:#7c3aed;color:#fff;border:none;border-radius:12px;padding:10px;font-weight:700" onclick="editAllSub()">নাম<br>বদলান</button><span style="font-weight:700">বিষয় সংখ্যা:</span><input id="sc" type="number" value="4" onchange="changeC(this.value)" style="flex:1;border:1.8px solid #e5e7eb;border-radius:12px;padding:10px;text-align:center;font-weight:700"></div><div style="overflow-x:auto;border:2.5px solid #0f2f1f;border-radius:14px"><table id="tbl" style="border-collapse:collapse;width:max-content;min-width:100%"></table></div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px"><button style="background:#16a34a;color:#fff;border:none;padding:12px;border-radius:12px;font-weight:700" onclick="saveData()">💾 সেভ</button><button style="background:#334155;color:#fff;border:none;padding:12px;border-radius:12px;font-weight:700" onclick="downloadPDF()">📄 PDF</button><button style="background:#16a34a;color:#fff;border:none;padding:12px;border-radius:12px;font-weight:700" onclick="downloadExcel()">📊 Excel</button></div></div>
</div>
</div>

<div id="modal" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,.6);align-items:center;justify-content:center;z-index:9999"><div style="background:#fff;border-radius:16px;padding:14px;width:92%;max-width:380px"><h3 style="text-align:center">নতুন শিক্ষার্থী</h3><input id="n1" placeholder="নাম *"><input id="n2" placeholder="রোল *"><input id="n3" placeholder="মোবাইল"><div style="display:flex;gap:8px;margin-top:8px"><button style="flex:1;padding:12px;border-radius:10px;border:none;background:#6b7280;color:#fff" onclick="document.getElementById('modal').classList.add('hidden');document.getElementById('modal').style.display='none'">বাতিল</button><button style="flex:1;padding:12px;border-radius:10px;border:none;background:#16a34a;color:#fff" onclick="addS()">যোগ</button></div></div></div>

<script>
// COMMON NAV
function showPage(n){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById('page'+n).classList.add('active');if(n==3)render();if(n==2)renderMonthly();}
function go3(){showPage(3);render();}

// PAGE 1 LOGIC - HUBUHU
let insts=JSON.parse(localStorage.getItem('takrim_primary_insts')||'[]');let tempLogo=localStorage.getItem('takrim_temp_logo')||'';
function refreshInstSelect(){document.getElementById('loginInst').innerHTML='<option value="">প্রতিষ্ঠান নির্বাচন</option>'+insts.map((x,i)=>`<option value="${i}">${x.bnName}</option>`).join('')}
refreshInstSelect();
document.getElementById('logoInput')?.addEventListener('change',function(){if(this.files[0]){let r=new FileReader();r.onload=e=>{tempLogo=e.target.result;localStorage.setItem('takrim_temp_logo',tempLogo);document.getElementById('logoPreview').src=tempLogo;};r.readAsDataURL(this.files[0])}});
function savePrimary(){let obj={bnName:document.getElementById('bnName').value.trim(),addr:document.getElementById('address').value.trim(),eiin:document.getElementById('eiin').value.trim(),schoolCode:document.getElementById('schoolCode').value.trim(),mobile:document.getElementById('mobile').value.trim(),email:document.getElementById('email').value.trim(),pass:document.getElementById('pass1').value,logo:tempLogo||'IMG-20261005-WA0019(3).jpg'};if(!obj.bnName||!obj.pass)return alert('নাম ও পাস দিন');insts.push(obj);localStorage.setItem('takrim_primary_insts',JSON.stringify(insts));localStorage.removeItem('takrim_temp_logo');alert('✅ সেভ');location.reload();}
function primaryLogin(){let idx=document.getElementById('loginInst').value;if(idx==="")return document.getElementById('loginMsg').textContent='প্রতিষ্ঠান নির্বাচন';let ins=insts[idx];if(document.getElementById('loginPass').value!==ins.pass)return document.getElementById('loginMsg').textContent='❌ ভুল';localStorage.setItem('takrim_session',JSON.stringify({inst:ins,cls:document.getElementById('cls').value,shift:document.getElementById('shift').value,section:document.getElementById('section').value}));let session=JSON.parse(localStorage.getItem('takrim_session'));document.getElementById('collegeName').textContent=session.inst.bnName;document.getElementById('eiin2').textContent=session.inst.eiin;document.getElementById('code2').textContent=session.inst.schoolCode;document.getElementById('logo2').src=session.inst.logo;document.getElementById('classInfo').textContent=`শ্রেণী: ${session.cls} | শিফট: ${session.shift} | শাখা: ${session.section}`;showPage(2);}
function openListSecure(){let a=prompt('এডমিন নাম');let p=prompt('পাস');if(a!=='malek'||p!=='takrim2022')return alert('ভুল');document.getElementById('instList').innerHTML=insts.map((s,i)=>`<div style="display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #eee"><div><img src="${s.logo}" style="width:28px;height:28px;border-radius:50%"> <b>${s.bnName}</b></div><button onclick="insts.splice(${i},1);localStorage.setItem('takrim_primary_insts',JSON.stringify(insts));refreshInstSelect();openListSecure()" style="background:#fee2e2;border:none;padding:6px;border-radius:6px">🗑️</button></div>`).join('')}

// PAGE 2 & 3 - SHARED DATA
let subs=JSON.parse(localStorage.getItem('s_final2')||'["বাংলা","ইংরেজি","গণিত","বিজ্ঞান"]');
let full=JSON.parse(localStorage.getItem('f_final2')||'[100,100,100,100]');
let studs=JSON.parse(localStorage.getItem('st_final2')||'[{"name":"কালাম","roll":"202","marks":[80,78,85,75]}]');
function getGPA(p){if(p>=80)return"5.00";if(p>=70)return"4.00";if(p>=60)return"3.50";if(p>=50)return"3.00";if(p>=40)return"2.00";if(p>=33)return"1.00";return"0.00";}
function addS(){let a=document.getElementById('n1').value.trim(),b=document.getElementById('n2').value.trim();if(!a||!b)return alert("নাম রোল লাগবে");studs.push({name:a,roll:b,marks:subs.map(()=>0)});document.getElementById('n1').value="";document.getElementById('n2').value="";document.getElementById('modal').classList.add('hidden');document.getElementById('modal').style.display='none';saveData();render();}
function changeC(v){v=parseInt(v)||1;if(v>10)v=10;if(v>subs.length){while(subs.length<v){subs.push("বিষয় "+(subs.length+1));full.push(100)}}else{subs=subs.slice(0,v);full=full.slice(0,v)}studs.forEach(s=>{if(s.marks.length<v){while(s.marks.length<v)s.marks.push(0)}else s.marks=s.marks.slice(0,v)});saveData();render();}
function editAllSub(){let t=prompt("বিষয়ের নাম কমা দিয়ে:",subs.join(", "));if(!t)return;let a=t.split(",").map(x=>x.trim()).filter(Boolean);if(a.length){subs=a.slice(0,10);if(full.length<subs.length)while(full.length<subs.length)full.push(100);saveData();render();}}
function editOne(i){let n=prompt("নতুন নাম:",subs[i]);if(n){subs[i]=n.trim();saveData();render();}}
function saveData(){localStorage.setItem('s_final2',JSON.stringify(subs));localStorage.setItem('f_final2',JSON.stringify(full));localStorage.setItem('st_final2',JSON.stringify(studs));}
function downloadPDF(){const {jsPDF}=window.jspdf;const doc=new jsPDF('l','pt','a4');doc.text("Folafol",20,20);let y=40;studs.forEach((s,i)=>{let obt=s.marks.reduce((a,b)=>a+(+b||0),0);let tot=full.reduce((a,b)=>a+(+b||0),0);let per=tot?((obt/tot)*100).toFixed(1):0;doc.text(`${i+1} ${s.name} ${s.roll} ${s.marks.join(',')} ${tot} ${obt} ${per}% ${getGPA(per)}`,20,y);y+=12});doc.save("folafol.pdf");}
function downloadExcel(){let header=["ক্রম","নাম","রোল",...subs,"মোট","প্রাপ্ত","%","GPA"];let data=[header];studs.forEach((s,i)=>{let obt=s.marks.reduce((a,b)=>a+(+b||0),0);let tot=full.reduce((a,b)=>a+(+b||0),0);let per=tot?((obt/tot)*100).toFixed(1):0;data.push([i+1,s.name,s.roll,...s.marks,tot,obt,per+"%",getGPA(per)]);});let ws=XLSX.utils.aoa_to_sheet(data);let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Result");XLSX.writeFile(wb,"folafol.xlsx");}
function render(){document.getElementById('sc').value=subs.length;document.getElementById('cAll').textContent=studs.length;document.getElementById('cPre').textContent=studs.length;let totAll=full.reduce((a,b)=>a+(+b||0),0);let h=`<tr style="background:#0f2f1f;color:#fff"><th>ক্রম</th><th>নাম</th><th>রোল</th>`;subs.forEach((s,i)=>h+=`<th><div style="background:#fff;color:#000;border-radius:18px;padding:8px;min-width:70px;cursor:pointer" onclick="editOne(${i})">${s}</div></th>`);h+=`<th>মোট</th><th>প্রাপ্ত</th><th>%</th><th>GPA</th></tr>`;h+=`<tr><td></td><td>পূর্ণমান</td><td></td>`;subs.forEach((s,i)=>h+=`<td style="background:#fef9c3"><input style="width:70px;height:38px;border:2px dashed #a68b00;border-radius:20px;text-align:center;font-weight:700" type="number" value="${full[i]}" oninput="full[${i}]=this.value;saveData();render()"></td>`);h+=`<td style="background:#fef9c3;font-weight:700">${totAll}</td><td>-</td><td>-</td><td>-</td></tr>`;studs.forEach((st,si)=>{let obt=st.marks.reduce((a,b)=>a+(+b||0),0);let per=totAll?((obt/totAll)*100).toFixed(1):0;h+=`<tr><td>${si+1}</td><td>${st.name}</td><td>${st.roll}</td>`;st.marks.forEach((m,mi)=>h+=`<td><input style="width:70px;height:38px;border:2px solid #cbd5e1;border-radius:20px;text-align:center;font-weight:700" type="number" value="${m}" oninput="studs[${si}].marks[${mi}]=this.value;saveData();render()"></td>`);h+=`<td style="background:#dcfce7;font-weight:700">${totAll}</td><td style="background:#dbeafe;font-weight:700">${obt}</td><td style="background:#ffedd5;font-weight:700">${per}%</td><td style="background:#f3e8ff;font-weight:700">${getGPA(per)}</td></tr>`});document.getElementById('tbl').innerHTML=h;}
function renderMonthly(){let now=new Date();let days=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();let head='<tr><th>নাম</th>';for(let d=1;d<=days;d++)head+=`<th>${d}</th>`;head+='</tr>';let body='';let s=JSON.parse(localStorage.getItem('takrim_students')||'[]');if(s.length==0)body='<tr><td colspan="32">ছাত্র নেই</td></tr>';document.getElementById('monthlyTable').innerHTML=head+body;}
render();
</script>
</body>
</html>
