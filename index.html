<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>দ্বিতীয় পাতা - হাজিরা ব্যবস্থাপনা</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Noto Sans Bengali',sans-serif}
body{background:#f0f4f8;padding:10px}
.pad{background:white;border:2px solid #0d47a1;border-radius:12px;padding:15px;text-align:center;margin-bottom:10px}
.pad h1{color:#0d47a1;font-size:22px}
.pad p{color:#333;font-size:14px}
.login-info{background:#e3f2fd;border-radius:10px;padding:12px;margin-bottom:15px;font-size:14px;line-height:22px}
.accordion{margin-bottom:10px;border-radius:10px;overflow:hidden;background:white;box-shadow:0 2px 6px rgba(0,0,0,0.1)}
.acc-header{background:#1976d2;color:white;padding:14px 15px;font-size:16px;font-weight:bold;display:flex;justify-content:space-between;cursor:pointer}
.acc-header span:last-child{transition:0.3s}
.acc-body{display:none;padding:15px;background:#fafafa}
.acc-body.active{display:block}
input,textarea{width:100%;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:6px}
.btn{display:inline-block;padding:8px 14px;border:none;border-radius:6px;color:white;cursor:pointer;margin:5px 3px;font-size:14px}
.btn-green{background:#2e7d32} .btn-blue{background:#1565c0} .btn-orange{background:#ef6c00}
.student-item{display:flex;justify-content:space-between;background:white;padding:8px;border-radius:6px;margin:5px 0;border:1px solid #ddd}
</style>
</head>
<body>

<!-- 1. প্রথম পাতার প্যাড অটো আসবে -->
<div class="pad" id="institutePad">
  <h1 id="instName">প্রতিষ্ঠানের নাম লোড হচ্ছে...</h1>
  <p id="instAddress"></p>
  <p id="instEIIN"></p>
</div>

<!-- 2. লগইন তথ্য অটো আসবে -->
<div class="login-info" id="loginInfo">
  লগইন তথ্য লোড হচ্ছে...
</div>

<!-- 8 টা ধাপ এখন 7 টা সহজ ধাপ -->
<div id="accordionContainer"></div>

<script>
// প্রথম পাতা থেকে অটো ডাটা আনা
const instName = localStorage.getItem('instituteName') || localStorage.getItem('schoolName') || 'আল-হেরা আইডিয়াল মাদ্রাসা';
const instAddress = localStorage.getItem('instituteAddress') || 'ঠিকানা পাওয়া যায়নি';
const instEIIN = localStorage.getItem('instituteEIIN') || '';
const principal = localStorage.getItem('principalName') || 'প্রধান শিক্ষক';
const mobile = localStorage.getItem('instituteMobile') || localStorage.getItem('mobile') || '';

document.getElementById('instName').innerText = instName;
document.getElementById('instAddress').innerText = instAddress;
document.getElementById('instEIIN').innerText = instEIIN ? 'EIIN: '+instEIIN : '';
document.getElementById('loginInfo').innerHTML = `👤 <b>প্রধান:</b> ${principal} | 📞 <b>মোবাইল:</b> ${mobile} | 🏫 <b>লগইন:</b> সক্রিয় আছে - আলহামদুলিল্লাহ`;

const steps = [
  {title:'1️⃣ শিক্ষার্থী যোগ করুন', content:`
    <input id="sName" placeholder="শিক্ষার্থীর নাম">
    <input id="sRoll" placeholder="রোল নম্বর">
    <input id="sMobile" placeholder="অভিভাবকের মোবাইল (01...)">
    <button class="btn btn-green" onclick="addStudent()">+ যোগ করুন</button>
    <div id="addMsg"></div>
  `},
  {title:'2️⃣ 📋 শিক্ষার্থীর তালিকা দেখুন ( <span id="totalCount">0</span> )', content:`<div id="studentList"></div>`},
  {title:'3️⃣ ✅ উপস্থিত দেখুন', content:`
    <div id="presentList"></div>
    <hr style="margin:10px 0">
    <button class="btn btn-green" onclick="sendSMS('present')">📩 SMS এ পাঠান</button>
    <button class="btn btn-blue" onclick="sendWA('present')">📱 WhatsApp এ পাঠান</button>
  `},
  {title:'4️⃣ ❌ অনুপস্থিত দেখুন', content:`
    <div id="absentList"></div>
    <hr style="margin:10px 0">
    <button class="btn btn-green" onclick="sendSMS('absent')">📩 SMS এ পাঠান</button>
    <button class="btn btn-blue" onclick="sendWA('absent')">📱 WhatsApp এ পাঠান</button>
  `},
  {title:'5️⃣ 📢 নোটিশ বোর্ড', content:`
    <textarea id="noticeText" rows="3" placeholder="নোটিশ লিখুন..."></textarea>
    <button class="btn btn-orange" onclick="saveNotice()">নোটিশ সেভ করুন</button>
    <div style="margin-top:10px">
      <button class="btn btn-green" onclick="sendSMS('notice')">📩 SMS এ পাঠান</button>
      <button class="btn btn-blue" onclick="sendWA('notice')">📱 WhatsApp এ পাঠান</button>
    </div>
  `},
  {title:'6️⃣ 📅 মাসিক হাজিরা দেখুন', content:`<div id="monthlyReport">মাসিক রিপোর্ট এখানে দেখাবে...</div>`},
  {title:'7️⃣ 🔽 ফলাফল দেখুন', content:`<div>ফলাফল যোগ ও দেখার সিস্টেম</div>`}
];

const container = document.getElementById('accordionContainer');
steps.forEach((step,i)=>{
  container.innerHTML += `
    <div class="accordion">
      <div class="acc-header" onclick="toggleAcc(${i})"><span>${step.title}</span><span id="arrow${i}">▼</span></div>
      <div class="acc-body" id="accBody${i}">${step.content}</div>
    </div>
  `;
});

function toggleAcc(i){
  const body = document.getElementById('accBody'+i);
  const arrow = document.getElementById('arrow'+i);
  const isOpen = body.classList.contains('active');
  document.querySelectorAll('.acc-body').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('[id^=arrow]').forEach(a=>a.innerText='▼');
  if(!isOpen){ body.classList.add('active'); arrow.innerText='▲'; if(i==1) renderStudents(); if(i==2) renderPresent(); if(i==3) renderAbsent(); }
}

// ডেমো ডাটা - localStorage থেকে আসবে
let students = JSON.parse(localStorage.getItem('students')||'[{"name":"মালেক","roll":"1","mobile":"01700000001","present":true},{"name":"সাকিব","roll":"2","mobile":"01700000002","present":false}]');

function addStudent(){
  const name=document.getElementById('sName').value;
  const roll=document.getElementById('sRoll').value;
  const mobile=document.getElementById('sMobile').value;
  if(!name) return alert('নাম দিন');
  students.push({name,roll,mobile,present:true});
  localStorage.setItem('students',JSON.stringify(students));
  document.getElementById('addMsg').innerHTML='<p style="color:green">✅ যোগ হয়েছে আলহামদুলিল্লাহ</p>';
  renderStudents();
}
function renderStudents(){
  document.getElementById('totalCount').innerText=students.length;
  let html=''; students.forEach((s,idx)=>{ html+=`<div class="student-item"><span>${s.roll}. ${s.name} - ${s.mobile}</span><span><button onclick="togglePresent(${idx})">${s.present?'✅':'❌'}</button> <button onclick="delStu(${idx})">🗑️</button></span></div>`});
  const listEl=document.getElementById('studentList'); if(listEl) listEl.innerHTML=html||'কোনো শিক্ষার্থী নেই';
}
function renderPresent(){ let html=''; students.filter(s=>s.present).forEach(s=>{ html+=`<div class="student-item">✅ ${s.name} (${s.roll})</div>`}); document.getElementById('presentList').innerHTML=html||'কেউ উপস্থিত নেই';}
function renderAbsent(){ let html=''; students.filter(s=>!s.present).forEach(s=>{ html+=`<div class="student-item">❌ ${s.name} (${s.roll})</div>`}); document.getElementById('absentList').innerHTML=html||'সবাই উপস্থিত আলহামদুলিল্লাহ';}
function togglePresent(i){ students[i].present=!students[i].present; localStorage.setItem('students',JSON.stringify(students)); renderStudents();}
function delStu(i){ if(confirm('ডিলিট করবেন?')){ students.splice(i,1); localStorage.setItem('students',JSON.stringify(students)); renderStudents();}}
function saveNotice(){ localStorage.setItem('notice',document.getElementById('noticeText').value); alert('নোটিশ সেভ হয়েছে');}

function sendSMS(type){
  let msg=''; if(type=='present') msg=`${instName} - উপস্থিত: ${students.filter(s=>s.present).map(s=>s.name).join(', ')}`;
  if(type=='absent') msg=`${instName} - অনুপস্থিত: ${students.filter(s=>!s.present).map(s=>s.name).join(', ')}`;
  if(type=='notice') msg=`${instName} - নোটিশ: ${localStorage.getItem('notice')||''}`;
  window.location.href=`sms:?body=${encodeURIComponent(msg)}`;
}
function sendWA(type){
  let msg=''; if(type=='present') msg=`*${instName}*%0A✅ উপস্থিত:%0A${students.filter(s=>s.present).map(s=>s.name).join('%0A')}`;
  if(type=='absent') msg=`*${instName}*%0A❌ অনুপস্থিত:%0A${students.filter(s=>!s.present).map(s=>s.name).join('%0A')}`;
  if(type=='notice') msg=`*${instName}*%0A📢 নোটিশ:%0A${localStorage.getItem('notice')||''}`;
  window.open(`https://wa.me/?text=${msg}`,'_blank');
}
renderStudents();
</script>
</body>
</html>
