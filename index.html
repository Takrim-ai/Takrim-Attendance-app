<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Takrim - Fixed Total</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Kalpurush,Arial}
body{background:#0a2e1f;padding:8px}
.main{max-width:520px;margin:auto;background:#fff;border-radius:18px;padding:12px}
.add{width:100%;padding:14px;background:#2563eb;color:#fff;border:none;border-radius:12px;font-weight:bold;font-size:18px;cursor:pointer;margin-bottom:12px}
.listBtn{width:100%;padding:14px;background:#ffcc00;color:#000;border:none;border-radius:12px;font-weight:bold;font-size:18px;cursor:pointer;margin-bottom:8px}
#list{display:none;margin-bottom:10px}#list.show{display:block}
.stu{background:#f3f4f6;display:flex;justify-content:space-between;align-items:center;padding:10px;border-radius:10px;margin-bottom:6px}
.stats{display:flex;gap:8px;margin-bottom:10px}.s{flex:1;padding:12px;border-radius:12px;text-align:center;font-weight:bold;cursor:pointer}.s1{background:#ffcc00}.s2{background:#16a34a;color:#fff}.s3{background:#ef4444;color:#fff}
.toggle{width:100%;padding:13px;background:#7c3aed;color:#fff;border:none;border-radius:12px;font-weight:bold;font-size:16px;cursor:pointer;margin-bottom:10px}
.box{border:2px solid #a78bfa;border-radius:14px;padding:10px;display:none}.box.show{display:block}
.sheetHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sheetHead h3{color:#7c3aed}
.btnSmall{padding:7px 12px;border:none;border-radius:20px;font-weight:bold;cursor:pointer;color:#fff}
.btnSub{background:#16a34a}.btnName{background:#7c3aed}
.wrap{overflow-x:auto;border:1px solid #ddd;border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:650px;font-size:14px}
th{background:#0a2e1f;color:#fff;padding:10px;text-align:center}
td{padding:6px;border:1px solid #ddd;text-align:center;background:#fff}
td input{width:72px;padding:8px;border:2px dashed #16a34a;border-radius:10px;text-align:center;font-weight:bold;background:#f8fafc}
.mot{background:#e0f2fe;font-weight:bold}
.row{display:flex;gap:8px;margin-top:10px}.row button{flex:1;padding:12px;border:none;border-radius:10px;font-weight:bold;color:#fff;cursor:pointer}
.save{background:#16a34a}.edit{background:#6b7280}.pdf{background:#111827}.excel{background:#047857}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:none;justify-content:center;align-items:center;z-index:999}.modal.active{display:flex}.modalBox{background:#fff;width:90%;max-width:380px;border-radius:18px;padding:18px}.modalBox input{width:100%;padding:12px;margin-bottom:10px;border:2px solid #16a34a;border-radius:10px;font-size:16px}.modalBtns{display:flex;gap:10px}.modalBtns button{flex:1;padding:12px;border:none;border-radius:10px;font-weight:bold;cursor:pointer}.btnCancel{background:#e5e7eb}.btnOk{background:#2563eb;color:#fff}
</style>
</head>
<body>
<div class="main">
<button class="add" onclick="openModal()">+ শিক্ষার্থী যোগ করুন</button>
<button class="listBtn" id="listBtn" onclick="setFilter('all')">📋 শিক্ষার্থীর তালিকা দেখুন (2)</button>
<div id="list"></div>
<div class="stats"><div class="s s1" onclick="setFilter('all')">📋 সবাই<br><span id="t1">2</span></div><div class="s s2" onclick="setFilter('present')">✅ উপস্থিত<br><span id="t2">2</span></div><div class="s s3" onclick="setFilter('absent')">❌ অনুপস্থিত<br><span id="t3">0</span></div></div>
<button class="toggle" id="togBtn" onclick="togBox()">🏆 ফলাফল দেখুন</button>
<div class="box" id="resultBox">
<div class="sheetHead"><h3>📋 ফলাফল সিট</h3><div><button class="btnSmall btnSub" onclick="openSubModal()">+ বিষয়</button> <button class="btnSmall btnName">নাম বদলান</button></div></div>
<div class="wrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
<div class="row"><button class="save" onclick="saveNow()">💾 সেভ</button><button class="edit" onclick="editNow()">✏️ এডিট</button></div>
<div class="row"><button class="pdf" onclick="toPDF_A4()">📄 PDF A4</button><button class="excel" onclick="toExcel()">📊 Excel</button></div>
</div>
</div>
<div class="modal" id="modal"><div class="modalBox"><h3 style="text-align:center;margin-bottom:10px">নতুন শিক্ষার্থী</h3><input id="mName" placeholder="নাম *"><input id="mRoll" placeholder="রোল *"><div class="modalBtns"><button class="btnCancel" onclick="closeModal()">Cancel</button><button class="btnOk" onclick="confirmAdd()">OK</button></div></div></div>
<div class="modal" id="subModal"><div class="modalBox"><h3 style="text-align:center">নতুন বিষয় যোগ</h3><input id="sName" placeholder="বিষয়ের নাম: ইংরেজি"><input id="sFull" type="number" value="100" placeholder="পূর্ণমান"><div class="modalBtns"><button class="btnCancel" onclick="closeSubModal()">Cancel</button><button class="btnOk" style="background:#16a34a" onclick="confirmSub()">যোগ করুন</button></div></div></div>
<script>
const SAVE_KEY='takrim_v109';const UI_KEY='takrim_ui_v109';
let subjects=[{name:"বাংলা",full:100},{name:"গণিত",full:100}];
let students=[{name:"কালাম",roll:"202",present:true,marks:[78,80]},{name:"কমল",roll:"203",present:true,marks:[75,90]}];
let edit=true;let resultVisible=true;let listVisible=false;let filter='all';
try{let d=localStorage.getItem(SAVE_KEY);if(d){let o=JSON.parse(d);if(o.subjects)subjects=o.subjects;if(o.students)students=o.students;}let u=localStorage.getItem(UI_KEY);if(u){let ui=JSON.parse(u);resultVisible=ui.resultVisible;listVisible=ui.listVisible;filter=ui.filter||'all';}}catch(e){}
function autoSave(){localStorage.setItem(SAVE_KEY,JSON.stringify({subjects,students}));localStorage.setItem(UI_KEY,JSON.stringify({resultVisible,listVisible,filter}));}
function setFilter(f){if(filter===f&&listVisible){listVisible=false;}else{filter=f;listVisible=true;}autoSave();render();}
function openModal(){document.getElementById('modal').classList.add('active');}function closeModal(){document.getElementById('modal').classList.remove('active');}
function confirmAdd(){let n=document.getElementById('mName').value.trim();let r=document.getElementById('mRoll').value.trim();if(!n){alert('নাম লিখুন');return;}if(!r){r=200+students.length+1;}students.push({name:n,roll:r,present:true,marks:subjects.map(()=>0)});closeModal();autoSave();render();}
function openSubModal(){document.getElementById('subModal').classList.add('active');}function closeSubModal(){document.getElementById('subModal').classList.remove('active');}
function confirmSub(){let name=document.getElementById('sName').value.trim();let f=Number(document.getElementById('sFull').value)||100;if(!name){alert('নাম লিখুন');return;}subjects.push({name,full:f});students.forEach(s=>s.marks.push(0));closeSubModal();autoSave();render();}
function togBox(){resultVisible=!resultVisible;autoSave();render();}
function render(){
 let totalFull=0;subjects.forEach(s=>totalFull+=Number(s.full)||0);
 document.getElementById('t1').innerText=students.length;document.getElementById('t2').innerText=students.filter(x=>x.present).length;document.getElementById('t3').innerText=students.filter(x=>!x.present).length;
 document.getElementById('listBtn').innerText=`📋 শিক্ষার্থীর তালিকা দেখুন (${students.length})`;
 let listDiv=document.getElementById('list');listDiv.innerHTML='';
 let filtered=students.map((s,i)=>({...s,idx:i})).filter(s=>{if(filter==='present')return s.present;if(filter==='absent')return!s.present;return true;});
 filtered.forEach(s=>{let i=s.idx;listDiv.innerHTML+=`<div class="stu"><span>${i+1}. ${s.name} (${s.roll}) ${s.present?'✅':'❌'}</span><span><input type="checkbox" ${s.present?'checked':''} onchange="students[${i}].present=this.checked;autoSave();render()"> <button onclick="if(confirm('ডিলিট?')){students.splice(${i},1);autoSave();render();}">❌</button></span></div>`;});
 listDiv.classList.toggle('show',listVisible);
 document.getElementById('resultBox').classList.toggle('show',resultVisible);
 document.getElementById('togBtn').innerHTML=resultVisible?'🔼 ফলাফল বন্ধ করুন':'🏆 ফলাফল দেখুন';

 let thead=document.getElementById('thead');let tbody=document.getElementById('tbody');
 let hr=`<tr>`;subjects.forEach((sub,j)=>{hr+=`<th>${sub.name}<br>${sub.full} <span onclick="if(confirm('ডিলিট?')){subjects.splice(${j},1);students.forEach(s=>s.marks.splice(${j},1));autoSave();render();}" style="color:#ffcc00;cursor:pointer">×</span></th>`;});hr+=`<th>মোট<br>${totalFull}</th></tr>`;
 thead.innerHTML=hr;

 let trFull=`<tr>`;subjects.forEach((sub,j)=>{trFull+=`<td><input type="number" value="${sub.full}" ${edit?'':'disabled'} oninput="subjects[${j}].full=Number(this.value)||0;autoSave();render()"></td>`;});trFull+=`<td class="mot">${totalFull}</td></tr>`;
 tbody.innerHTML=trFull;
 students.forEach((s,i)=>{
  let prapto=0;s.marks.forEach(m=>prapto+=Number(m)||0);
  let tr=`<tr>`;subjects.forEach((sub,j)=>{tr+=`<td><input type="number" value="${s.marks[j]||0}" ${edit?'':'disabled'} oninput="students[${i}].marks[${j}]=Number(this.value)||0;autoSave();render()"></td>`;});tr+=`<td class="mot">${prapto}</td></tr>`;tbody.innerHTML+=tr;
 });
}
function editNow(){edit=true;render();}function saveNow(){edit=false;autoSave();render();}
function toPDF_A4(){let totalFull=0;subjects.forEach(s=>totalFull+=Number(s.full)||0);let rows='';students.forEach((s,i)=>{let prapto=0;s.marks.forEach(m=>prapto+=Number(m)||0);let tds=s.marks.map(m=>`<td>${m}</td>`).join('');rows+=`<tr><td>${i+1}</td><td>${s.name}</td><td>${s.roll}</td>${tds}<td>${prapto}</td><td>${totalFull}</td></tr>`;});let heads=subjects.map(s=>`<th>${s.name} ${s.full}</th>`).join('');let html=`<html><head><meta charset="UTF-8"><style>@page{size:A4 landscape;margin:10mm}table{width:100%;border-collapse:collapse}th,td{border:1px solid #000;padding:6px;text-align:center}th{background:#0a2e1f;color:#fff}</style></head><body><h2 style="text-align:center">ফলাফল শীট - A4</h2><table><tr><th>ক্রম</th><th>নাম</th><th>রোল</th>${heads}<th>প্রাপ্ত</th><th>মোট</th></tr>${rows}</table><script>window.onload=()=>setTimeout(()=>window.print(),800)<\/script></body></html>`;let w=window.open('','_blank');w.document.write(html);w.document.close();}
function toExcel(){let totalFull=0;subjects.forEach(s=>totalFull+=Number(s.full)||0);let head=['ক্রম','নাম','রোল',...subjects.map(s=>s.name),'প্রাপ্ত','মোট'];let data=[head];students.forEach((s,i)=>{let prapto=0;s.marks.forEach(m=>prapto+=Number(m)||0);data.push([i+1,s.name,s.roll,...s.marks,prapto,totalFull]);});let ws=XLSX.utils.aoa_to_sheet(data);let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Result');XLSX.writeFile(wb,'Result.xlsx');}
render();
</script>
</body>
</html>
