<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Takrim Box</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Kalpurush,Arial}
body{background:#0a2540;padding:10px}
.main{max-width:500px;margin:auto;background:#fff;border-radius:20px;padding:12px}
.header{background:#0a3d2e;color:#fff;text-align:center;padding:14px;border-radius:14px;font-weight:bold;margin-bottom:12px;line-height:1.6}
.card{border-radius:14px;margin-bottom:10px;overflow:hidden;transition:0.3s}
.card-head{padding:14px;text-align:center;font-weight:bold;font-size:18px;cursor:pointer;color:#fff;display:flex;justify-content:center;align-items:center;gap:8px}
.card-body{max-height:0;overflow:hidden;transition:max-height 0.4s ease;background:#fff;padding:0 10px}
.card.active .card-body{max-height:500px;padding:10px}

/* তোমার চাওয়া কালার */
.blue{background:#2563eb}
.red{background:#dc2626}
.green{background:#16a34a}
.yellow{background:#ffcc00;color:#000 !important}
.card-head.yellow{color:#000}

.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.btn-row button{flex:1;padding:12px;border:none;border-radius:12px;font-weight:bold;color:#fff;cursor:pointer}
.b-green{background:#16a34a}.b-red{background:#ef4444}.b-yellow{background:#ffcc00;color:#000}
textarea{width:100%;padding:12px;border:2px dashed #a78bfa;border-radius:12px;min-height:80px}
</style>
</head>
<body>
<div class="main">
<div class="header">শ্রেণী: কম্পিউটার টেকনোলজি | সেশন 2025-26 | সেমিস্টার ০২</div>

<!-- 1. মাসিক হাজিরা - নীল -->
<div class="card blue" id="card1">
<div class="card-head" onclick="toggleCard('card1')">📋 মাসিক হাজিরা দেখুন</div>
<div class="card-body">
<p style="text-align:center;padding:10px">এখানে মাসিক হাজিরার টেবিল আসবে</p>
</div>
</div>

<!-- 2. নোটিশ - লাল -->
<div class="card red" id="card2">
<div class="card-head" onclick="toggleCard('card2')">📢 নোটিশ বোর্ড</div>
<div class="card-body">
<textarea placeholder="নোটিশ লিখুন..."></textarea>
<div class="btn-row" style="margin-top:8px">
<button class="b-yellow">📢 নোটিশ পাঠান</button>
</div>
</div>
</div>

<!-- 3. SMS - সবুজ -->
<div class="card green" id="card3">
<div class="card-head" onclick="toggleCard('card3')">💬 SMS পাঠান</div>
<div class="card-body">
<div class="btn-row">
<button class="b-green" onclick="alert('উপস্থিত SMS')">✅ উপস্থিত</button>
<button class="b-red" onclick="alert('অনুপস্থিত SMS')">❌ অনুপস্থিত</button>
<button class="b-yellow" onclick="alert('নোটিশ SMS')">📢 নোটিশ</button>
</div>
</div>
</div>

<!-- 4. WhatsApp - নীল -->
<div class="card blue" id="card4">
<div class="card-head" onclick="toggleCard('card4')">📱 WhatsApp-এ পাঠান</div>
<div class="card-body">
<div class="btn-row">
<button class="b-green">✅ উপস্থিত</button>
<button class="b-red">❌ অনুপস্থিত</button>
<button class="b-yellow">📢 নোটিশ</button>
</div>
<button style="width:100%;padding:12px;background:#22c55e;color:#fff;border:none;border-radius:12px;font-weight:bold;margin-top:8px">📊 হাজিরা রিপোর্ট WhatsApp গ্রুপে দিন</button>
</div>
</div>

</div>
<script>
function toggleCard(id){
 document.querySelectorAll('.card').forEach(c=>{
   if(c.id===id) c.classList.toggle('active');
   else c.classList.remove('active');
 });
}
</script>
</body>
</html>
