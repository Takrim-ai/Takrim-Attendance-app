<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>দ্বিতীয় পাতা - Takrim Box + Result</title><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Hind Siliguri',sans-serif}
body{background:#0a2540;padding:10px}
.main{max-width:520px;margin:auto;background:#fff;border-radius:20px;padding:12px}
.header{background:#0a3d2e;color:#fff;text-align:center;padding:14px;border-radius:14px;font-weight:bold;margin-bottom:12px;border:3px solid #ffcc00}
.card{border-radius:14px;margin-bottom:10px;overflow:hidden}
.card-head{padding:14px;text-align:center;font-weight:bold;font-size:18px;cursor:pointer;color:#fff;display:flex;justify-content:center;gap:8px}
.card-body{max-height:0;overflow:hidden;transition:0.4s;background:#fff;padding:0 10px}
.card.active.card-body{max-height:2000px;padding:10px}
.blue{background:#2563eb}.red{background:#dc2626}.green{background:#16a34a}.yellow{background:#ffcc00;color:#000!important}
.add{width:100%;padding:14px;background:#2563eb;color:#fff;border:none;border-radius:12px;font-weight:bold;font-size:18px;cursor:pointer;margin-bottom:10px}
.listBtn{width:100%;padding:14px;background:#ffcc00;border:none;border-radius:12px;font-weight:bold;margin-bottom:8px}
.s{flex:1;padding:14px;border-radius:12px;text-align:center;font-weight:bold;cursor:pointer}
.wrap{overflow-x:auto;border:1px solid #ddd;border-radius:10px}table{width:100%;border-collapse:collapse;min-width:750px;font-size:13px}th{background:#0a2e1f;color:#fff;padding:8px}td{padding:6px;border:1px solid #ddd;text-align:center}
</style></head><body>
<div class="main">
<div class="header" id="headerInfo">লোড হচ্ছে...</div>

<!-- ২য় কোড থেকে -->
<div class="card blue" id="card1"><div class="card-head" onclick="toggleCard('card1')">📋 মাসিক হাজিরা দেখুন</div><div class="card-body"><p style="text-align:center">এখানে মাসিক হাজিরার টেবিল আসবে</p></div></div>
<div class="card red" id="card2"><div class="card-head" onclick="toggleCard('card2')">📢 নোটিশ বোর্ড</div><div class="card-body"><textarea id="noticeText" style="width:100%;padding:12px;border:2px dashed #a78bfa;border-radius:12px" placeholder="নোটিশ লিখুন..."></textarea><button style="width:100%;padding:12px;background:#ffcc00;border:none;border-radius:12px;font-weight:bold;margin-top:8px" onclick="alert('নোটিশ: '+noticeText.value)">📢 নোটিশ পাঠান</button></div></div>
<div class="card green" id="card3"><div class="card-head" onclick="toggleCard('card3')">💬 SMS পাঠান</div><div class="card-body"><div style="display:flex;gap:8px"><button style="flex:1;padding:12px;background:#16a34a;color:#fff;border:none;border-radius:12px">✅ উপস্থিত</button><button style="flex:1;padding:12px;background:#ef4444;color:#fff;border:none;border-radius:12px">❌ অনুপস্থিত</button><button style="flex:1;padding:12px;background:#ffcc00;border:none;border-radius:12px">📢 নোটিশ</button></div></div></div>
<div class="card blue" id="card4"><div class="card-head" onclick="toggleCard('card4')">📱 WhatsApp-এ পাঠান</div><div class="card-body"><button style="width:100%;padding:12px;background:#22c55e;color:#fff;border:none;border-radius:12px;font-weight:bold" onclick="sendWA()">📊 হাজিরা রিপোর্ট WhatsApp গ্রুপে দিন</button></div></div>

<hr style="margin:12px 0;border:2px dashed #a78bfa">

<!-- ৩য় কোড থেকে -->
<button class="add" onclick="let n=prompt('নাম:'),r=prompt('রোল:');if(n){students.push({name:n,roll:r||students.length+201,present:true,marks:full.map(()=>0)});save();render();}">+ শিক্ষার্থী যোগ করুন</button>
<button class="listBtn" id="listBtn" onclick="setFilter('all')">📋 তালিকা দেখুন</button>
<div id="list"></div>
<div style="display:flex;gap:8px;margin-bottom:10px"><div class="s" style="background:#16a34a;color:#fff" onclick="setFilter('present')">✅ উপস্থিত<br><span id="t2">0</span></div><div class="s" style="background:#ef4444;color:#fff" onclick="setFilter('absent')">❌ অনুপস্থিত<br><span id="t3">0</span></div></div>
<div class="wrap"><table id="mainTable"><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
<div style="display:flex;gap:8px;margin-top:8px"><button style="flex:1;padding:11px;background:#16a34a;color:#fff;border:none;border-radius:10px" onclick="save()">💾 সেভ</button><button style="flex:1;padding:11px;background:#111;color:#fff;border:none;border-radius:10px" onclick="toPDF()">📄 PDF</button><button style="flex:1;padding:11px;background:#047857;color:#fff;border:none;border-radius:10px" onclick="toExcel()">📊 Excel</button></div>
<button onclick="location.href='index.html'" style="width:100%;padding:12px;background:#000;color:#fff;border:none;border-radius:12px;margin-top:10px">🚪 লগআউট</button>
</div>
<script>
function toggleCard(id){document.querySelectorAll('.card').forEach(c=>{if(c.id===id)c.classList.toggle('active');else c.classList.remove('active');});}
let sess=JSON.parse(localStorage.getItem('takrim_session')||'null');if(sess)document.getElementById('headerInfo').innerHTML=`🏫 ${sess.inst.bnName}<br>${sess.cls} | ${sess.shift} | ${sess.section}`;else document.getElementById('headerInfo').innerHTML='🏫 ডেমো মোড - কম্পিউটার টেকনোলজি';
let subNames=["বাংলা","গণিত","ইংরেজি","বিজ্ঞান"];let full=[100,100,100,100];let students=JSON.parse(localStorage.getItem('takrim_final')||'[]');let filter='all';
function save(){localStorage.setItem('takrim_final',JSON.stringify(students));}
function setFilter(f){filter=f;render();}
function render(){document.getElementById('t2').innerText=students.filter(x=>x.present).length;document.getElementById('t3').innerText=students.filter(x=>!x.present).length;document.getElementById('listBtn').innerHTML=`📋 তালিকা (${students.length})`;let list=document.getElementById('list');list.innerHTML='';let filtered=students.map((s,i)=>({...s,idx:i})).filter(s=>filter=='present'?s.present:filter=='absent'?!s.present:true);filtered.forEach(s=>{list.innerHTML+=`<div style="display:flex;justify-content:space-between;background:#f3f4f6;padding:8px;border-radius:8px;margin-bottom:4px"><span>${s.idx+1}. ${s.name} (${s.roll})</span><span><input type="checkbox" ${s.present?'checked':''} onchange="students[${s.idx}].present=this.checked;save();render()"> <button onclick="students.splice(${s.idx},1);save();render()">❌</button></span></div>`});let thead=document.getElementById('thead');thead.innerHTML=`<tr><th>ক্রম</th><th>নাম</th><th>রোল</th>${subNames.map(n=>`<th>${n}</th>`).join('')}<th>মোট</th></tr>`;let tbody=document.getElementById('tbody');tbody.innerHTML='';students.forEach((s,i)=>{let tot=s.marks.reduce((a,b)=>a+Number(b||0),0);let tr=`<tr><td>${i+1}</td><td>${s.name}</td><td>${s.roll}</td>`;for(let j=0;j<full.length;j++)tr+=`<td><input style="width:60px" type="number" value="${s.marks[j]}" oninput="students[${i}].marks[${j}]=this.value;save()"></td>`;tr+=`<td>${tot}</td></tr>`;tbody.innerHTML+=tr;});}
function toPDF(){window.print();}function toExcel(){let data=[['ক্রম','নাম','রোল',...subNames]];students.forEach((s,i)=>data.push([i+1,s.name,s.roll,...s.marks]));let ws=XLSX.utils.aoa_to_sheet(data);let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Result');XLSX.writeFile(wb,'Result.xlsx');}
function sendWA(){let txt=`হাজিরা: মোট ${students.length}, উপস্থিত ${students.filter(s=>s.present).length}`;window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');}
render();
</script></body></html>
