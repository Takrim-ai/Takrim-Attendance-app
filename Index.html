<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>প্রথম পাতা - MALEK FINAL</title><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;font-family:'Hind Siliguri',sans-serif}body{margin:0;background:#082a1e;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:10px}.main-banner{width:380px;max-width:95%;border:4px solid #ffcc00;border-radius:22px;overflow:hidden;margin-top:10px;background:#000;line-height:0}.main-banner img{width:100%;display:block}.green-box{width:380px;max-width:95%;background:#16a34a;border-radius:16px;padding:12px;margin-top:25px;text-align:center}.green-box span{background:#000;color:#fff;display:inline-block;padding:8px 22px;border-radius:30px;font-weight:700;font-size:18px}.card{background:#fff;margin-top:12px;border-radius:24px;padding:16px;width:100%;max-width:430px}.menu{width:100%;max-width:430px;background:#fff;border:none;border-radius:16px;padding:16px;font-size:17px;font-weight:700;color:#0d5bff;margin-top:12px;display:flex;justify-content:space-between;cursor:pointer}.hidden{display:none!important}.btn{width:100%;padding:14px;border:none;border-radius:14px;font-size:17px;font-weight:700;cursor:pointer;margin-top:8px}.green{background:#0a7a42;color:#fff}.blue{background:#0d5bff;color:#fff}.red{background:#d61f1f;color:#fff}input,select{width:100%;padding:12px;border-radius:12px;border:1.8px solid #d1d5db;margin:5px 0}</style></head><body>
<div class="main-banner"><img id="mainBannerImg" src="https://via.placeholder.com/400x220/000000/FFCC00?text=MALEK+ATTENDANCE"></div>
<div class="green-box"><span>প্রাথমিক বিদ্যালয় হাজিরা</span></div>
<button class="menu" onclick="document.getElementById('formBox').classList.toggle('hidden')">🏫 প্রতিষ্ঠান ফরম <span>▼</span></button>
<div id="formBox" class="card hidden"><div style="text-align:center"><img id="logoPreview" src="https://via.placeholder.com/80" style="width:84px;height:84px;border-radius:50%;border:3px solid #ffcc00"><br><button onclick="logoInput.click()" style="background:#ffcc00;border:none;padding:8px 14px;border-radius:10px;font-weight:700;margin:8px 0">🖼️ লোগো চেঞ্জ</button><input type="file" id="logoInput" accept="image/*" style="display:none"></div><input id="bnName" placeholder="প্রতিষ্ঠানের নাম *"><input id="address" placeholder="ঠিকানা"><div style="display:flex;gap:6px"><input id="eiin" placeholder="EIIN"><input id="schoolCode" placeholder="Code"></div><div style="display:flex;gap:6px"><input id="mobile" placeholder="মোবাইল"><input id="email" placeholder="Email"></div><input id="pass1" type="password" placeholder="পাসওয়ার্ড *"><button class="btn green" onclick="savePrimary()">সেভ করুন ✅</button><p id="formMsg" style="text-align:center;font-weight:700"></p></div>
<button class="menu" onclick="document.getElementById('loginBox').classList.toggle('hidden')">🔐 লগইন <span>▼</span></button>
<div id="loginBox" class="card hidden"><select id="loginInst"></select><div style="display:flex;gap:6px"><select id="shift"><option>🌅 প্রভাতি</option><option>দিবা</option></select><select id="cls"><option>১ম শ্রেণি</option><option>২য় শ্রেণি</option><option>৩য় শ্রেণি</option><option>৪র্থ শ্রেণি</option><option>৫ম শ্রেণি</option></select><select id="section"><option>ক</option><option>খ</option></select></div><input id="loginPass" type="password" placeholder="পাসওয়ার্ড"><button class="btn blue" onclick="primaryLogin()">🔒 প্রবেশ করুন</button><p id="loginMsg" style="color:red;text-align:center"></p></div>
<script>
let insts=JSON.parse(localStorage.getItem('takrim_primary_insts')||'[]');let tempLogo='';
function refreshInstSelect(){document.getElementById('loginInst').innerHTML='<option value="">প্রতিষ্ঠান নির্বাচন</option>'+insts.map((x,i)=>`<option value="${i}">${x.bnName}</option>`).join('')}refreshInstSelect();
document.getElementById('logoInput').addEventListener('change',function(){if(this.files[0]){let r=new FileReader();r.onload=e=>{tempLogo=e.target.result;logoPreview.src=tempLogo;mainBannerImg.src=tempLogo;};r.readAsDataURL(this.files[0])}});
function savePrimary(){let bn=bnName.value.trim(),p=pass1.value.trim();if(!bn||!p)return alert('নাম ও পাস দিন');insts.push({bnName:bn,addr:address.value,eiin:eiin.value,schoolCode:schoolCode.value,mobile:mobile.value,email:email.value,pass:p,logo:tempLogo||'https://via.placeholder.com/80'});localStorage.setItem('takrim_primary_insts',JSON.stringify(insts));alert('✅ সেভ');refreshInstSelect();location.reload();}
function primaryLogin(){let idx=loginInst.value;if(idx==="")return loginMsg.textContent='প্রতিষ্ঠান নির্বাচন';let ins=insts[idx];if(loginPass.value!==ins.pass)return loginMsg.textContent='❌ ভুল';localStorage.setItem('takrim_session',JSON.stringify({inst:ins,cls:cls.value,shift:shift.value,section:section.value}));location.href='second-page.html';}
</script></body></html>
